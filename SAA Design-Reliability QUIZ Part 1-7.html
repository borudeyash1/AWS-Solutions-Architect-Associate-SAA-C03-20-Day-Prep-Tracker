<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Solutions Architect Associate (SAA-C03) - Reliability Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-sub-bg: #f1f5f9;
            --card-hover-bg: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #cbd5e1;
            --accent-orange: #ff9900;
            --accent-orange-hover: #e68a00;
            --accent-orange-light: rgba(255, 153, 0, 0.12);
            --accent-orange-glow: rgba(255, 153, 0, 0.25);
            
            --correct-bg: #d1fae5;
            --correct-text: #065f46;
            --correct-border: #34d399;
            
            --incorrect-bg: #ffe4e6;
            --incorrect-text: #9f1239;
            --incorrect-border: #fb7185;
            
            --sticky-bg: rgba(255, 255, 255, 0.92);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            /* Dark Theme - Pure Black & Black Components & White Text & Orange Accents */
            --bg-color: #000000;
            --card-bg: #09090b;
            --card-sub-bg: #121215;
            --card-hover-bg: #1c1c21;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
            --accent-orange: #ff9900;
            --accent-orange-hover: #ffaa22;
            --accent-orange-light: rgba(255, 153, 0, 0.18);
            --accent-orange-glow: rgba(255, 153, 0, 0.4);
            
            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-text: #34d399;
            --correct-border: rgba(52, 211, 153, 0.4);
            
            --incorrect-bg: rgba(244, 63, 94, 0.15);
            --incorrect-text: #fb7185;
            --incorrect-border: rgba(251, 113, 133, 0.4);
            
            --sticky-bg: rgba(0, 0, 0, 0.92);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sticky Top Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--sticky-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }

        .header-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .badge-orange {
            background: var(--accent-orange);
            color: #000;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill strong {
            color: var(--accent-orange);
        }

        .btn-theme {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--card-sub-bg);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9900 0%, #ff5500 100%);
            transition: width 0.3s ease;
        }

        /* Toolbar & Controls */
        .toolbar-container {
            max-width: 960px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1 1 240px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px 10px 36px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 2px var(--accent-orange-light);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-orange);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-orange-light);
            border-color: var(--accent-orange);
            color: var(--accent-orange);
            font-weight: 600;
        }

        /* Main Container */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .quiz-intro {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .quiz-intro h2 {
            margin: 0 0 8px;
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .quiz-intro p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Question Cards */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .question-card:hover {
            border-color: rgba(255, 153, 0, 0.4);
        }

        .question-card.hidden {
            display: none !important;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.55;
            flex: 1;
            margin-bottom: 15px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            display: none;
            white-space: nowrap;
        }

        .question-card[data-status="correct"] .status-badge.correct {
            display: inline-block;
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .question-card[data-status="incorrect"] .status-badge.incorrect {
            display: inline-block;
            background: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }

        /* Options */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            margin: 0;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.45;
            user-select: none;
        }

        .option-label:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-orange);
        }

        .option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            min-width: 18px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin-top: 2px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-label input[type="radio"]:checked {
            border-color: var(--accent-orange);
            background-color: var(--accent-orange);
            box-shadow: 0 0 0 3px var(--accent-orange-light);
        }

        .option-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #000;
        }

        /* Highlight classes */
        .option-label.selected-opt {
            border-color: var(--accent-orange);
            background: var(--accent-orange-light);
        }

        .option-label.opt-correct {
            border-color: var(--correct-border) !important;
            background: var(--correct-bg) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-label.opt-incorrect {
            border-color: var(--incorrect-border) !important;
            background: var(--incorrect-bg) !important;
            color: var(--incorrect-text) !important;
        }

        /* Buttons */
        .btn, .submit-btn {
            background: linear-gradient(135deg, #ff9900 0%, #e67e00 100%);
            color: #000000;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .btn, .submit-btn { width: auto; }
        }

        .btn:hover, .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--accent-orange-glow);
            filter: brightness(1.08);
        }

        .btn:active, .submit-btn:active {
            transform: translateY(0);
        }

        /* Explanations & Feedback Box */
        .explanation, .feedback-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.92rem;
            line-height: 1.55;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct, .correct-ans {
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .incorrect, .incorrect-ans {
            background: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }
    </style>
</head>
<body>

<!-- Sticky Header -->
<header class="sticky-header">
    <div class="header-content">
        <div class="brand-title">
            <h1>AWS SAA-C03 Reliability Quiz</h1>
            <span class="badge-orange">100 Questions</span>
        </div>
        <div class="header-actions">
            <div class="stat-pill">
                <span>Score:</span> <strong id="score-val">0</strong> / 100
            </div>
            <button class="btn-theme" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
            </button>
        </div>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="quiz-progress-bar"></div>
    </div>
</header>

<!-- Filter & Navigation Toolbar -->
<div class="toolbar-container">
    <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Search question text or enter # (e.g. #24)..." oninput="filterQuestions()">
    </div>
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="setFilter('all', this)">All (100)</button>
        <button class="filter-btn" onclick="setFilter('unanswered', this)">Unanswered</button>
        <button class="filter-btn" onclick="setFilter('correct', this)">Correct</button>
        <button class="filter-btn" onclick="setFilter('incorrect', this)">Incorrect</button>
    </div>
</div>

<div class="container">
    <div class="quiz-intro">
        <h2>AWS Solutions Architect Associate (SAA-C03) - Reliability Domain</h2>
        <p>Complete 100 Practice Questions extracted from Course Modules (Parts 1–7). Select your answer and click <strong>Submit Answer</strong> for detailed explanations.</p>
    </div>

    <div id="quiz-container"></div>
</div>

<script>
        const quizData = [
    {
        "id": 1,
        "question": "How does Amazon Keyspaces (for Apache Cassandra) utilize distributed storage to manage large-scale, globally distributed databases?",
        "options": [
            "A) Keyspaces relies on a centralized storage model with the option to manually distribute data across different Availability Zones.",
            "B) The service employs a peer-to-peer distributed storage architecture, mirroring Apache Cassandra's design, to evenly distribute data across the cluster.",
            "C) It uses a distributed, multi-AZ storage system that automatically partitions data across numerous nodes to enhance scalability and availability.",
            "D) Amazon Keyspaces implements a master-slave storage architecture to distribute data across multiple nodes and regions."
        ],
        "correct": "C",
        "explanation": "Amazon Keyspaces (for Apache Cassandra) uses a distributed, multi-AZ storage system that automatically partitions data across many nodes within an AWS Region. This design allows for seamless scalability and high availability, as data is distributed and replicated across multiple physical locations within the region.",
        "type": "single"
    },
    {
        "id": 2,
        "question": "What redundancy features are inherent in Amazon Keyspaces to ensure data is protected against loss?",
        "options": [
            "A) Amazon Keyspaces automatically replicates data across three geographically distant AWS Regions.",
            "B) Redundancy in Amazon Keyspaces is achieved by maintaining a single, durable copy of data with regular, user-initiated backups.",
            "C) The service ensures data redundancy by replicating data across multiple Availability Zones within a single AWS Region.",
            "D) It provides redundancy by creating and managing multiple copies of data within the same Availability Zone."
        ],
        "correct": "C",
        "explanation": "Amazon Keyspaces (for Apache Cassandra) ensures data redundancy by replicating data automatically across multiple Availability Zones within the same AWS Region. This replication strategy is designed to provide high durability and availability for your data, protecting it against the loss of an Availability Zone.",
        "type": "single"
    },
    {
        "id": 3,
        "question": "In what ways does Amazon Keyspaces maintain a reliable database service for users?",
        "options": [
            "A) Keyspaces achieves reliability by allowing users to manually switch between database instances in the event of a failure.",
            "B) It maintains reliability through a shared responsibility model where AWS manages the infrastructure and the user is responsible for data replication strategies.",
            "C) The service ensures reliability by automatically managing the provisioning, patching, and replication of data across multiple Availability Zones.",
            "D) Reliability in Amazon Keyspaces is supported by providing dedicated hardware for each user to prevent noisy neighbor issues."
        ],
        "correct": "C",
        "explanation": "Amazon Keyspaces (for Apache Cassandra) maintains a reliable database service by automatically handling the provisioning, patching, and replication of data. It abstracts the management of the underlying infrastructure, including data replication across multiple Availability Zones, which is crucial for achieving high availability and fault tolerance.",
        "type": "single"
    },
    {
        "id": 4,
        "question": "How does Amazon Keyspaces ensure system resiliency, particularly in the face of infrastructure disruptions or failures?",
        "options": [
            "A) Amazon Keyspaces uses a fully managed infrastructure with built-in redundancy and failover capabilities across multiple Availability Zones.",
            "B) The service ensures resiliency by leveraging AWS global infrastructure, offering cross-region replication and automated failover.",
            "C) Keyspaces relies on user-configured database clustering and manual failover processes to maintain system resiliency.",
            "D) It provides resiliency through automated backups and restoration capabilities that users can trigger in the event of system disruptions."
        ],
        "correct": "A",
        "explanation": "Amazon Keyspaces is designed to ensure system resiliency by leveraging AWS's highly available infrastructure. It provides built-in redundancy and automated failover capabilities across multiple Availability Zones within an AWS Region. This means that in the event of a failure or disruption in one Availability Zone, the service can continue to operate seamlessly.",
        "type": "single"
    },
    {
        "id": 5,
        "question": "A company is deploying a new application using Amazon Keyspaces (for Apache Cassandra). The data must remain available if an Availability Zone goes down. How can this be achieved?",
        "options": [
            "A) By automatically replicating data to replica nodes",
            "B) By provisioning nodes in multiple subnets",
            "C) By using S3 for data durability",
            "D) By enabling cross-region replication"
        ],
        "correct": "A",
        "explanation": "Amazon Keyspaces provides high availability across AZs by automatically replicating data to multiple replica nodes placed in different AZs. If one AZ becomes unavailable, reads and writes can be served from replicas in other AZs.",
        "type": "single"
    },
    {
        "id": 6,
        "question": "A company is deploying a new graph database using Amazon Neptune. The database needs to remain available in the event of an Availability Zone outage. How does Neptune provide high availability?",
        "options": [
            "A) By caching query results in Amazon ElastiCache",
            "B) By backing up data to Amazon S3",
            "C) By replicating data synchronously across Availability Zones",
            "D) By provisioning read replicas in a second region"
        ],
        "correct": "C",
        "explanation": "Amazon Neptune provides high availability by synchronously replicating data across three Availability Zones. If one AZ becomes unavailable, Neptune can redirect reads and writes to the remaining AZs.",
        "type": "single"
    },
    {
        "id": 7,
        "question": "A company is running a mission-critical graph database on Amazon Neptune. The database needs to remain available if an individual Neptune node fails. How can this be achieved?",
        "options": [
            "A) By restoring data for the node from a backup",
            "B) By replicating data synchronously across nodes",
            "C) By migrating the node to new hardware automatically",
            "D) By redirecting requests to the nearest available node"
        ],
        "correct": "B",
        "explanation": "Neptune synchronously replicates data across nodes in multiple Availability Zones. If a single node fails, Neptune will continue serving requests from the remaining replicas and automatically re-replicate data when the failed node recovers.",
        "type": "single"
    },
    {
        "id": 8,
        "question": "A company needs to ensure the data in its Amazon QLDB ledger remains available if an Availability Zone outage occurs. How does QLDB provide resiliency against AZ outages?",

            "A) By replicating data synchronously across three AZs",
            "B) By enabling Multi-AZ deployments in the QLDB settings",

        "correct": "A",
        "explanation": "Amazon QLDB synchronously replicates data across three Availability Zones to remain available during an AZ outage. The ledger will operate uninterrupted if one AZ becomes unavailable.",
        "type": "single"
    },
    {
        "id": 9,
        "question": "A company is building a new application that streams data into Amazon QLDB. The data must be durably stored before further processing. How can the architecture ensure no data loss if a failure occurs when streaming data into QLDB?",

            "A) Stream data to an Amazon S3 bucket first before QLDB",
            "B) Enable data replication from QLDB to Amazon DynamoDB",
            "C) Use Amazon Kinesis Data Streams for retries on transient errors",
            "D) Process the data synchronously instead of using streams"

        "correct": "C",
        "explanation": "Streaming data into QLDB via Amazon Kinesis Data Streams allows configuring retries for transient errors, ensuring the data is eventually persisted durably in QLDB without loss.",
        "type": "single"
    },
    {
        "id": 10,
        "question": "Which QLDB CloudWatch metric can help monitor availability and durability?",
        "options": [
            "A) JournalDiskUtilization",
            "B) WriteIOs",
            "C) ReadIOs",
            "D) JournalS3DataSize"
        ],
        "correct": "B",
        "explanation": "WriteIOs measures writes to the QLDB ledger, which can help monitor availability.",
        "type": "single"
    },
    {
        "id": 11,
        "question": "A company is storing time series data in Amazon Timestream. The data must remain durable and available. How does Timestream provide reliability?",

            "A) By enabling Multi-AZ deployment during setup",
            "B) By replicating data across Availability Zones",
            "C) By caching hot data in Amazon ElastiCache",
            "D) By uploading backups to Amazon S3 frequently"
        ],
        "correct": "B",
        "explanation": "Amazon Timestream replicates data across Availability Zones to provide durable data storage and automatic failover in case of AZ outages.",
        "type": "single"
    },
    {
        "id": 12,
        "question": "A company needs to analyze trends in data stored in Amazon Timestream. The analytics queries must be resilient to temporary Timestream errors. How can the company achieve this?",
        "options": [
            "A) Use Timestream's continuous backup to S3",
            "B) Execute queries with retry logic in the application",

        "correct": "B",
        "explanation": "Implementing retries in the application logic allows queries to Timestream to be resilient to transient errors and temporary service disruptions.",
        "type": "single"
    },
    {
        "id": 13,
        "question": "A company is migrating an existing application to use Amazon Timestream. The architecture must prevent cascading failures. How can the system be designed to minimize coupling?",
        "options": [
            "A) Store time series data in Amazon S3 before ingesting into Timestream",
            "B) Cache Timestream data in Amazon ElastiCache",
            "C) Implement Amazon SNS and SQS for asynchronous integration",
            "D) Enable Multi-AZ deployment for Timestream"
        ],
        "correct": "C",
        "explanation": "Using Amazon SNS and SQS allows loosely coupled asynchronous integration between the application and Timestream. This prevents cascading failures across services.",
        "type": "single"

// Theme Management: Default to dark theme as requested
    let currentTheme = localStorage.getItem('quiz-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateThemeUI(currentTheme);

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('quiz-theme', currentTheme);
        updateThemeUI(currentTheme);
    }

    function updateThemeUI(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (icon && text) {
            if (theme === 'dark') {
                icon.textContent = '🌙';
                text.textContent = 'Dark Mode';
            } else {
                icon.textContent = '☀️';
                text.textContent = 'Light Mode';
            }
        }
    }

    let currentFilter = 'all';

    function setFilter(filterType, btn) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        filterQuestions();
    }

    function filterQuestions() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const cards = document.querySelectorAll('.question-card');

        cards.forEach(card => {
            const qTitle = card.querySelector('.question-title')?.textContent || '';
            const status = card.getAttribute('data-status') || 'unanswered';

            let matchesFilter = false;
            if (currentFilter === 'all') matchesFilter = true;
            else if (currentFilter === 'unanswered' && status === 'unanswered') matchesFilter = true;
            else if (currentFilter === 'correct' && status === 'correct') matchesFilter = true;
            else if (currentFilter === 'incorrect' && status === 'incorrect') matchesFilter = true;

            let matchesSearch = true;
            if (query) {
                if (query.startsWith('#')) {
                    const num = query.substring(1).trim();
                    matchesSearch = qTitle.startsWith(num + '.') || qTitle.includes(' ' + num + '.');
                } else {
                    matchesSearch = qTitle.toLowerCase().includes(query) || card.textContent.toLowerCase().includes(query);
                }
            }

            if (matchesFilter && matchesSearch) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function updateStats() {
        const total = quizData.length;
        const correctCount = document.querySelectorAll('.question-card[data-status="correct"]').length;
        const answeredCount = document.querySelectorAll('.question-card[data-status="correct"], .question-card[data-status="incorrect"]').length;

        const scoreEl = document.getElementById('score-val');
        if (scoreEl) scoreEl.textContent = correctCount;

        const progressBar = document.getElementById('quiz-progress-bar');
        if (progressBar) {
            const pct = Math.round((answeredCount / total) * 100);
            progressBar.style.width = pct + '%';
        }
    }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';

        quizData.forEach((q, index) => {
            const isMulti = q.type === 'multi' || (Array.isArray(q.correct) ? q.correct.length > 1 : (typeof q.correct === 'string' && q.correct.includes(',')));
            const reqCount = Array.isArray(q.correct) ? q.correct.length : (typeof q.correct === 'string' && q.correct.includes(',') ? q.correct.split(',').length : (isMulti ? 2 : 1));
            const inputType = isMulti ? 'checkbox' : 'radio';

            html += `
                <div class="question-card" id="card-${q.id}" data-id="${q.id}" data-type="${isMulti ? 'multi' : 'single'}" data-req="${reqCount}" data-status="unanswered">
                    <div class="question-header">
                        <div class="question-title">
                            ${index + 1}. ${q.question}
                            ${isMulti ? `<span style="color: var(--accent-orange); font-weight: 700; margin-left: 8px;">(Select ${reqCount} options)</span>` : ''}
                        </div>
                        <span class="status-badge correct">✓ Correct</span>
                        <span class="status-badge incorrect">✕ Incorrect</span>
                    </div>
                    <ul class="options-list">
            `;

            q.options.forEach((opt) => {
                const optLetter = opt.charAt(0);
                html += `
                    <li class="option-item">
                        <label class="option-label" onclick="selectOption(this)">
                            <input type="${inputType}" name="question-${q.id}" value="${optLetter}">
                            <span>${opt}</span>
                        </label>
                    </li>
                `;
            });

            const correctArg = JSON.stringify(q.correct).replace(/"/g, '&quot;');
            html += `
                    </ul>
                    <button class="submit-btn" onclick="checkAnswer(${q.id}, ${correctArg}, \`${q.explanation.replace(/`/g, '\`')}\`)">Submit Answer</button>
                    <div id="feedback-${q.id}" class="explanation"></div>
                </div>
            `;
        });

        container.innerHTML = html;
        updateStats();
    }

    function selectOption(labelElement) {
        const card = labelElement.closest('.question-card');
        if (!card) return;
        const isMulti = card.getAttribute('data-type') === 'multi';
        const reqCount = parseInt(card.getAttribute('data-req') || '1');

        if (!isMulti) {
            card.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected-opt'));
            labelElement.classList.add('selected-opt');
        } else {
            const chk = labelElement.querySelector('input[type="checkbox"]');
            const checkedCount = card.querySelectorAll('input[type="checkbox"]:checked').length;
            if (checkedCount > reqCount) {
                if (chk) chk.checked = false;
                labelElement.classList.remove('selected-opt');
                alert(`You can only select ${reqCount} options for this question.`);
                return;
            }
            if (chk && chk.checked) {
                labelElement.classList.add('selected-opt');
            } else {
                labelElement.classList.remove('selected-opt');
            }
        }
    }

    function checkAnswer(questionId, correctAnswer, explanationText) {
        const card = document.getElementById(`card-${questionId}`);
        const inputs = card.querySelectorAll(`input[name="question-${questionId}"]:checked`);
        const feedbackBox = document.getElementById(`feedback-${questionId}`);
        const labels = card.querySelectorAll('.option-label');

        const isMulti = card.getAttribute('data-type') === 'multi';
        const reqCount = parseInt(card.getAttribute('data-req') || '1');

        if (inputs.length === 0) {
            alert('Please select an option before submitting!');
            return;
        }

        if (isMulti && inputs.length !== reqCount) {
            alert(`Please select exactly ${reqCount} options before submitting!`);
            return;
        }

        const selectedVals = Array.from(inputs).map(i => i.value);
        let correctArray = Array.isArray(correctAnswer) ? correctAnswer : (typeof correctAnswer === 'string' && correctAnswer.includes(',') ? correctAnswer.split(',').map(s => s.trim()) : [String(correctAnswer)]);

        let isCorrect = false;
        if (!isMulti) {
            isCorrect = (selectedVals[0] === correctArray[0]);
        } else {
            isCorrect = (selectedVals.length === correctArray.length) && selectedVals.every(val => correctArray.includes(val));
        }

        feedbackBox.style.display = 'block';

        labels.forEach(label => {
            label.classList.remove('opt-correct', 'opt-incorrect');
            const input = label.querySelector('input');
            const val = input ? input.value : '';

            if (correctArray.includes(val)) {
                label.classList.add('opt-correct');
            }
            if (selectedVals.includes(val) && !correctArray.includes(val)) {
                label.classList.add('opt-incorrect');
            }
        });

        if (isCorrect) {
            feedbackBox.className = 'explanation correct-ans';
            feedbackBox.innerHTML = `<strong>Correct!</strong> ${explanationText}`;
            card.setAttribute('data-status', 'correct');
        } else {
            feedbackBox.className = 'explanation incorrect-ans';
            const correctStr = correctArray.join(', ');
            feedbackBox.innerHTML = `<strong>Incorrect.</strong> The correct answer is <strong>${correctStr}</strong>. ${explanationText}`;
            card.setAttribute('data-status', 'incorrect');
        }

        updateStats();
    }

    // Initialize quiz rendering on load
    window.onload = renderQuiz;
</script>
