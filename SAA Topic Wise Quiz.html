mated cPanel hosting", "D) Running serverless GraphQL APIs with offline synchronization"], "answer": "A", "exp": "AWS Batch is the premier exam solution for automatically managing the provisioning, scheduling, and execution of batch computing workloads at scale[cite: 8]."}, {"id": 11, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT an accurate statement regarding Amazon Elastic Compute Cloud (Amazon EC2)?", "options": ["A) Provides resizable virtual compute capacity in the cloud[cite: 8]", "B) Supports both Linux and Windows operating system platforms[cite: 8]", "C) A completely serverless database service that stores unindexed JSON documents", "D) Allows launching virtual servers on demand with pay-as-you-go pricing[cite: 8]"], "answer": "C", "exp": "Amazon EC2 is an Infrastructure as a Service (IaaS) virtual server platform, not a serverless JSON database[cite: 8]."}, {"id": 12, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Instance Types - Classification", "type": "multi", "q": "Which TWO instance type categories are correctly mapped to their optimal use cases? (Select 2)", "options": ["A) Compute Optimized (C-family): High-performance web servers, scientific modeling, and batch processing[cite: 8]", "B) Memory Optimized (R-family): In-memory caches, high-performance databases, and real-time big data processing[cite: 8]", "C) Storage Optimized (I-family): Designed exclusively for running serverless Lambda code", "D) Accelerated Computing (P/G-family): Low-cost burstable general web hosting"], "answer": ["A", "B"], "exp": "The C-family is compute-optimized, and the R-family is memory-optimized for high-memory databases and in-memory caches[cite: 8]."}, {"id": 13, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Pricing Models - On-Demand vs Spot", "type": "single", "q": "Which EC2 pricing model provides discounts of up to 90% off On-Demand rates by utilizing spare AWS compute capacity, with the caveat that instances can be reclaimed with a 2-minute warning?", "options": ["A) Spot Instances[cite: 8]", "B) Reserved Instances[cite: 8]", "C) Dedicated Hosts[cite: 8]", "D) Standard On-Demand[cite: 8]"], "answer": "A", "exp": "Spot Instances offer up to 90% savings over On-Demand rates for stateless, fault-tolerant workloads, but AWS can terminate them with a 2-minute notice[cite: 8]."}, {"id": 14, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Pricing Models - Commitments", "type": "multi", "q": "Which TWO pricing models provide significant cost discounts in exchange for a 1-year or 3-year term commitment? (Select 2)", "options": ["A) EC2 Reserved Instances (Standard and Convertible)[cite: 8]", "B) Compute Savings Plans[cite: 8]", "C) Ephemeral Hourly Bidding", "D) Unmanaged Spot Fleets"], "answer": ["A", "B"], "exp": "Reserved Instances and Savings Plans both require a 1- or 3-year commitment in exchange for substantial discounts on baseline workloads[cite: 8]."}, {"id": 15, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Tenancy - Dedicated Hosts vs Dedicated Instances", "type": "single", "q": "What is the primary operational advantage of EC2 Dedicated Hosts over Dedicated Instances?", "options": ["A) Dedicated Hosts give full visibility and control over physical server sockets and cores, allowing you to use existing per-socket or per-core software licenses (BYOL)[cite: 8]", "B) Dedicated Hosts run inside serverless environments with zero provisioning time", "C) Dedicated Hosts cost significantly less than Spot Instances", "D) Dedicated Hosts share physical hardware with other AWS customers automatically"], "answer": "A", "exp": "Dedicated Hosts provide a physical server dedicated entirely for customer use, allowing compliance with strict server-bound and core-bound licensing models[cite: 8]."}, {"id": 16, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Storage Options - EBS vs Instance Store", "type": "single", "q": "Which of the following is a true statement regarding Amazon EC2 Instance Store storage?", "options": ["A) It provides persistent block storage that survives instance stoppage and reboot cycles", "B) It is ephemeral physical storage attached to the host, meaning data is lost if the instance is stopped or terminated[cite: 6, 8]", "C) It automatically syncs all files directly to an S3 Glacier vault[cite: 6]", "D) It supports snapshot creation directly through the AWS Backup console without extra tools"], "answer": "B", "exp": "Instance Store volumes are physically attached, non-persistent, ephemeral block devices whose data is purged when instances stop or terminate[cite: 6, 8]."}, {"id": 17, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Placement Groups - Types", "type": "multi", "q": "Which TWO placement group strategies are available in Amazon EC2? (Select 2)", "options": ["A) Cluster Placement Group (packs instances close together inside an AZ for low latency and high throughput)[cite: 5, 8]", "B) Spread Placement Group (places each instance on distinct physical hardware racks to maximize fault tolerance)[cite: 5, 8]", "C) Global Multi-Region Edge Placement Group", "D) Serverless Microservice Placement Group"], "answer": ["A", "B"], "exp": "The three EC2 placement group types are Cluster (low latency), Spread (hardware fault isolation), and Partition (distributed systems)[cite: 5, 8]."}, {"id": 18, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Launch Templates vs Launch Configurations", "type": "single", "q": "Why does AWS strongly recommend using EC2 Launch Templates over legacy Launch Configurations?", "options": ["A) Launch Templates support versioning, parameter overrides, T2/T3 unlimited bursting, and Spot Fleets, whereas Launch Configurations do not[cite: 8]", "B) Launch Configurations are billed at $100 per template created", "C) Launch Templates do not require an AMI ID or subnet mapping", "D) Launch Configurations can only launch Windows Server 2003 instances"], "answer": "A", "exp": "Launch Templates provide full feature support, including versioning, Spot Fleet integration, Graviton instance launching, and mixed instance policies[cite: 8]."}, {"id": 19, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Bootstrapping with User Data", "type": "single", "q": "When does an Amazon EC2 User Data shell script execute by default?", "options": ["A) Only once during the very first instance boot cycle[cite: 8]", "B) Every time an administrator logs in via SSH", "C) Periodically every 10 minutes during the instance lifetime", "D) Only when the instance is being terminated"], "answer": "A", "exp": "EC2 User Data scripts run automatically with root/administrator privileges during the initial boot cycle to perform bootstrapping tasks[cite: 8]."}, {"id": 20, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Security - Firewalls & IAM", "type": "multi", "q": "Which TWO security best practices should be applied to Amazon EC2 instances? (Select 2)", "options": ["A) Attach IAM Roles to instances via instance profiles to provide temporary API credentials instead of hardcoding static access keys[cite: 8]", "B) Use Security Groups as stateful firewalls to restrict inbound and outbound traffic at the network interface level[cite: 8]", "C) Open port 22/3389 globally to 0.0.0.0/0 to allow remote troubleshooting from anywhere", "D) Disable encryption on all root EBS volumes to improve boot times"], "answer": ["A", "B"], "exp": "Assigning IAM roles removes static keys from code, and restrictive stateful Security Groups ensure least-privilege network access[cite: 8]."}, {"id": 21, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Management - Systems Manager", "type": "single", "q": "Which AWS Systems Manager feature allows administrators to manage and establish interactive shell access to EC2 instances without opening inbound SSH ports or maintaining bastion hosts?", "options": ["A) Session Manager[cite: 8]", "B) Patch Manager[cite: 8]", "C) State Manager[cite: 8]", "D) OpsCenter[cite: 8]"], "answer": "A", "exp": "Systems Manager Session Manager provides secure, one-click browser-based shell access governed by IAM without needing open inbound ports or public IPs[cite: 8]."}, {"id": 22, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Capacity Reservations", "type": "single", "q": "What is the primary purpose of an EC2 On-Demand Capacity Reservation?", "options": ["A) To guarantee compute capacity in a specific Availability Zone for any duration without requiring a 1-year or 3-year financial commitment[cite: 8]", "B) To secure 90% price discounts on Spot instances", "C) To automate snapshot creation across multiple AWS Regions", "D) To convert uncompressed text into Parquet format"], "answer": "A", "exp": "Capacity Reservations reserve compute capacity in a chosen AZ to mitigate against capacity stockouts, regardless of billing discounts[cite: 8]."}, {"id": 23, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "High Availability & Multi-AZ", "type": "multi", "q": "Which TWO architectural patterns provide high availability and fault tolerance for applications hosted on EC2? (Select 2)", "options": ["A) Distributing instances across multiple Availability Zones behind an Elastic Load Balancer (ELB)[cite: 8]", "B) Configuring an Auto Scaling Group across multiple AZs with instance replacement enabled[cite: 8]", "C) Deploying all instances into a single subnet located in one Availability Zone", "D) Using a single Standalone instance with non-replicated instance store storage"], "answer": ["A", "B"], "exp": "High availability requires spreading instances across multiple Availability Zones paired with load balancers and auto-scaling health checks[cite: 8]."}, {"id": 24, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Exam Tips", "type": "single", "q": "Which EC2 purchasing option should be selected for a critical batch processing job that can be interrupted and resumed at any time without business penalty?", "options": ["A) Spot Instances[cite: 8]", "B) Dedicated Hosts[cite: 8]", "C) 3-Year Standard Reserved Instances[cite: 8]", "D) On-Demand Instances[cite: 8]"], "answer": "A", "exp": "Spot Instances are the standard exam answer for workloads that are cost-sensitive, stateless, and interruptible[cite: 8]."}, {"id": 25, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding EC2 Auto Scaling?", "options": ["A) Helps maintain application availability by automatically adding or removing EC2 instances based on demand[cite: 8]", "B) Replaces unhealthy instances automatically through scheduled and dynamic health checks[cite: 8]", "C) Requires customers to pay an upfront flat licensing fee for the Auto Scaling engine[cite: 8]", "D) Can scale instances horizontally across multiple Availability Zones within a region[cite: 8]"], "answer": "C", "exp": "There is no additional charge for EC2 Auto Scaling; you pay only for the underlying AWS resources (EC2, CloudWatch, ELB) launched[cite: 8]."}, {"id": 26, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Auto Scaling Groups (ASG)", "type": "multi", "q": "Which TWO parameters define the capacity boundaries of an Amazon EC2 Auto Scaling Group? (Select 2)", "options": ["A) Minimum Capacity (minimum number of running instances allowed)[cite: 8]", "B) Maximum Capacity (upper limit on running instances allowed)[cite: 8]", "C) Permanent Capacity (instances that cannot be stopped under any circumstances)", "D) Hardware Socket Capacity (physical CPU sockets to lock down)"], "answer": ["A", "B"], "exp": "An Auto Scaling Group uses Minimum, Maximum, and Desired capacity settings to govern scaling boundaries[cite: 8]."}, {"id": 27, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Dynamic Scaling Policies", "type": "single", "q": "Which scaling policy type allows an ASG to automatically adjust capacity to maintain an aggregate metric (like average CPU utilization) at a specified threshold?", "options": ["A) Target Tracking Scaling Policy[cite: 5, 8]", "B) Simple Manual Scaling", "C) Fixed Schedule Scaling[cite: 8]", "D) Static Hardware Partitioning"], "answer": "A", "exp": "Target Tracking works like a thermostat, increasing or decreasing capacity to keep a target metric (e.g., 40% CPU) steady[cite: 5, 8]."}, {"id": 28, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Predictive Scaling", "type": "single", "q": "How does Predictive Scaling assist in handling recurring, forecasted traffic surges in EC2 Auto Scaling?", "options": ["A) Uses machine learning to analyze historical traffic patterns and schedule capacity additions before anticipated demand spikes occur[cite: 5, 8]", "B) Waits until servers crash and then boots emergency instances", "C) Forces all incoming connections to wait in an SQS queue for 10 minutes", "D) Automatically converts EC2 instances into AWS Lambda functions"], "answer": "A", "exp": "Predictive Scaling applies machine learning to historical CloudWatch metrics to forecast future load and provision instances ahead of time[cite: 5, 8]."}, {"id": 29, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Lifecycle Hooks", "type": "multi", "q": "Which TWO tasks are typically performed using EC2 Auto Scaling Lifecycle Hooks? (Select 2)", "options": ["A) Pausing instance termination to collect logs and extract state files before the instance shuts down[cite: 8]", "B) Pausing instance launch to execute custom configuration scripts and verify service health[cite: 8]", "C) Permanently disabling CloudWatch metrics collection", "D) Allowing unrestricted internet access across private subnets"], "answer": ["A", "B"], "exp": "Lifecycle hooks pause instances in a wait state during launch or termination to perform bootstrapping, backup, or diagnostic activities[cite: 8]."}, {"id": 30, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Health Checks & Instance Replacement", "type": "single", "q": "When an ASG is attached to an Application Load Balancer, which health check configuration ensures that instances failing web requests are automatically terminated and replaced?", "options": ["A) Configure the ASG to use ELB Health Checks instead of standard EC2 status checks[cite: 8]", "B) Rely solely on EC2 hardware hypervisor reachability checks", "C) Route traffic through an AWS Storage Gateway appliance", "D) Disconnect the load balancer listener"], "answer": "A", "exp": "Enabling ELB health checks on the ASG ensures that if an instance fails the load balancer's HTTP/HTTPS health test, it is terminated and replaced[cite: 8]."}, {"id": 31, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Instance Refresh", "type": "single", "q": "What is the purpose of the Instance Refresh feature in EC2 Auto Scaling?", "options": ["A) Gradually replaces running instances in an ASG with new ones to roll out updated AMIs or launch templates with minimal downtime[cite: 8]", "B) Automatically flushes the local RAM cache of running EC2 instances every hour", "C) Deletes all VPC route tables to force path recalculations", "D) Downgrades instance types during high utilization periods"], "answer": "A", "exp": "Instance Refresh automates the rolling replacement of instances in an ASG to deploy new AMI versions or configuration updates[cite: 8]."}, {"id": 32, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Warm Pools", "type": "multi", "q": "Which TWO statements regarding EC2 Auto Scaling Warm Pools are accurate? (Select 2)", "options": ["A) They maintain a pool of pre-initialized EC2 instances in a stopped state to reduce scale-out latency[cite: 8]", "B) They are especially beneficial for applications with long initialization, bootstrap, or boot times[cite: 8]", "C) Instances in warm pools are kept at 100% CPU utilization constantly", "D) Warm pool instances cannot be brought into the running state"], "answer": ["A", "B"], "exp": "Warm pools keep pre-initialized instances stopped or running in the background, accelerating scale-out times for heavy bootstrap apps[cite: 8]."}, {"id": 33, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Exam Tips", "type": "single", "q": "What is a key architectural limitation of an Amazon EC2 Auto Scaling Group tested on the exam?", "options": ["A) An ASG can span multiple Availability Zones within an AWS Region, but cannot span multiple AWS Regions[cite: 8]", "B) An ASG cannot launch more than two EC2 instances total", "C) An ASG cannot attach to an Application Load Balancer", "D) An ASG is incompatible with Launch Templates"], "answer": "A", "exp": "ASGs operate at the regional level and can span multiple AZs in that region, but they cannot directly span across multiple AWS Regions[cite: 8]."}, {"id": 34, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Elastic Beanstalk?", "options": ["A) An orchestration service that automates deployment, scaling, load balancing, and health monitoring of web apps[cite: 8]", "B) Supports languages like Java, .NET, PHP, Node.js, Python, Ruby, Go, and Docker[cite: 8]", "C) Deprives administrators of root access to the underlying EC2 instances and OS configuration[cite: 8]", "D) Customers pay only for the underlying AWS resources provisioned[cite: 8]"], "answer": "C", "exp": "Elastic Beanstalk manages infrastructure provisioning, but customers retain full control and administrator access to all underlying resources[cite: 8]."}, {"id": 35, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Environment Tiers", "type": "multi", "q": "Which TWO environment tiers can be deployed in AWS Elastic Beanstalk? (Select 2)", "options": ["A) Web Server Tier (handles standard HTTP/HTTPS requests behind an ELB)[cite: 8]", "B) Worker Tier (processes background tasks pulled asynchronously from an Amazon SQS queue)[cite: 8]", "C) Bare-Metal Hypervisor Tier", "D) Fiber Optic Routing Tier"], "answer": ["A", "B"], "exp": "Elastic Beanstalk provides Web Server Tiers (for web traffic) and Worker Tiers (for background processing with SQS)[cite: 8]."}, {"id": 36, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Deployment Policies - Comparison", "type": "single", "q": "Which Elastic Beanstalk deployment policy provisions a completely new set of instances to deploy code, switches traffic to the new instances only after health checks pass, and preserves full capacity throughout the process?", "options": ["A) Immutable[cite: 8]", "B) All at once[cite: 8]", "C) Rolling[cite: 8]", "D) In-Place Overwrite"], "answer": "A", "exp": "Immutable deployments launch an entirely separate Auto Scaling group with the new version, ensuring zero downtime and easy rollback on failure[cite: 8]."}, {"id": 37, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Deployment Policies - Blue/Green", "type": "single", "q": "How does an architect execute a Blue/Green deployment in AWS Elastic Beanstalk to achieve zero-downtime updates?", "options": ["A) Deploy the new version to a separate clone environment and perform a CNAME Swap in the Elastic Beanstalk console[cite: 8]", "B) Terminate all blue instances simultaneously and reboot the VPC router", "C) Manually delete the load balancer DNS records in Route 53", "D) Reinstall the underlying Linux kernel via SSH"], "answer": "A", "exp": "Blue/Green deployments in Elastic Beanstalk are performed by launching a second environment and swapping the environment URLs (CNAME swap)[cite: 8]."}, {"id": 38, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": ".ebextensions Customization", "type": "multi", "q": "Which TWO statements regarding .ebextensions configuration files in Elastic Beanstalk are correct? (Select 2)", "options": ["A) They are YAML or JSON formatted configuration files stored in the .ebextensions folder at the application root[cite: 8]", "B) They allow installing software packages, configuring system daemons, setting environment variables, and defining custom AWS resources[cite: 8]", "C) They can only be executed by opening a ticket with AWS Support", "D) They are deleted automatically whenever a build passes"], "answer": ["A", "B"], "exp": ".ebextensions configuration files allow declarative customization of EC2 instances, packages, environment variables, and CloudFormation resources[cite: 8]."}, {"id": 39, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Monitoring & Health Reporting", "type": "single", "q": "Which Elastic Beanstalk feature collects detailed application health metrics, web server status codes, and latency distributions beyond standard CloudWatch metrics?", "options": ["A) Enhanced Health Reporting[cite: 8]", "B) Simple Network Ping Checks", "C) GuardDuty Malware Scans", "D) Trusted Advisor Quota Alarms"], "answer": "A", "exp": "Enhanced Health Reporting provides deeper operational visibility by evaluating server metrics, error rates, and daemon logs in real time[cite: 8]."}, {"id": 40, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Security & VPC Deployment", "type": "multi", "q": "Which TWO security capabilities are available when running Elastic Beanstalk applications? (Select 2)", "options": ["A) Deploying instances inside private VPC subnets with an internet-facing Application Load Balancer[cite: 8]", "B) Enabling HTTPS termination at the Elastic Load Balancer using certificates managed by ACM[cite: 8]", "C) Disabling all IAM security roles on environment instances", "D) Storing unencrypted production database passwords in public GitHub repositories"], "answer": ["A", "B"], "exp": "Elastic Beanstalk environments can reside in private VPC subnets fronted by an ALB, with SSL/TLS termination managed via ACM[cite: 8]."}, {"id": 41, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Exam Tips", "type": "single", "q": "When is AWS Elastic Beanstalk the correct exam answer for application hosting?", "options": ["A) When developers want to quickly deploy web applications without managing underlying infrastructure, while retaining full control over resources[cite: 8]", "B) When deploying a custom Kubernetes cluster on bare-metal hardware", "C) When migrating a mainframe using continuous block replication", "D) When configuring multi-region ActiveMQ brokers"], "answer": "A", "exp": "Elastic Beanstalk is the ideal answer for fast, managed application deployments where the platform handles provisioning while preserving EC2 control[cite: 8]."}, {"id": 42, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Outposts?", "options": ["A) Fully managed hybrid cloud service that brings AWS infrastructure, APIs, and tools to on-premises sites[cite: 8]", "B) Functions essentially as an extension of an AWS Availability Zone into customer data centers[cite: 8]", "C) Runs completely disconnected from AWS regions forever without requiring network links", "D) Delivers consistent operational tooling between cloud regions and on-premises environments[cite: 8]"], "answer": "C", "exp": "AWS Outposts requires a persistent, encrypted Service Link connection back to its parent AWS Region to operate and maintain manageability[cite: 8]."}, {"id": 43, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "Form Factors", "type": "multi", "q": "Which TWO form factors are available for AWS Outposts? (Select 2)", "options": ["A) Outposts Racks (42U full-depth industry-standard racks with compute, storage, and networking)[cite: 8]", "B) Outposts Servers (1U or 2U rack-mountable servers for sites with limited space)[cite: 8]", "C) Outposts Virtual Disks (local VMDK images for VMware Workstation)", "D) Outposts Mobile USB Flash Drives"], "answer": ["A", "B"], "exp": "AWS Outposts is delivered in two form factors: Outposts Racks (42U) and Outposts Servers (1U/2U)[cite: 8]."}, {"id": 44, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "Networking - Local Gateway (LGW)", "type": "single", "q": "What is the primary role of the Local Gateway (LGW) in an AWS Outposts rack deployment?", "options": ["A) To route traffic between Outpost subnets and local on-premises data center networks[cite: 8]", "B) To compress video files for mobile streaming", "C) To decrypt SSL certificates at the local edge", "D) To manage customer IAM root credentials"], "answer": "A", "exp": "The Local Gateway (LGW) enables low-latency, two-way network communication between Outposts subnets and existing on-premises LAN infrastructure[cite: 8]."}, {"id": 45, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "Supported Services Locally", "type": "multi", "q": "Which TWO AWS services can be run locally directly on AWS Outposts hardware? (Select 2)", "options": ["A) Amazon EC2 instances[cite: 8]", "B) Amazon EBS volumes[cite: 8]", "C) Global AWS Route 53 Root Nameservers", "D) AWS Direct Connect Core Backbone Switches"], "answer": ["A", "B"], "exp": "AWS Outposts supports running local EC2 instances, local EBS volumes, local ECS/EKS clusters, and local RDS instances[cite: 8]."}, {"id": 46, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "Use Cases", "type": "single", "q": "Which scenario is the primary use case for deploying AWS Outposts?", "options": ["A) Workloads with ultra-low latency requirements to local systems or strict local data residency regulations[cite: 8]", "B) Storing public marketing videos to serve users across the globe", "C) Hosting serverless static web pages on a zero-cost budget", "D) Replacing all cloud databases with local tape backups"], "answer": "A", "exp": "Outposts is designed for workloads requiring single-digit millisecond latency to on-premises systems or local data sovereignty compliance[cite: 8]."}, {"id": 47, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "Exam Tips", "type": "single", "q": "What is the key concept to remember about AWS Outposts networking on the SAA exam?", "options": ["A) Outpost subnets function just like standard AZ subnets within your VPC, extending the VPC directly into your data center[cite: 8]", "B) Outposts cannot connect to an Amazon VPC", "C) Outposts subnets cannot communicate with cloud resources in the parent region", "D) Outposts must use unencrypted public IP addresses for management"], "answer": "A", "exp": "An Outpost subnet is simply an extension of an AWS Region's VPC into your physical site, governed by standard VPC routing rules[cite: 8]."}, {"id": 48, "section": "4. COMPUTE", "topic": "AWS Serverless Application Repository (SAR)", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding the AWS Serverless Application Repository (SAR)?", "options": ["A) Managed repository for finding, deploying, and publishing serverless applications[cite: 8]", "B) Applications are packaged and defined using AWS Serverless Application Model (SAM) templates[cite: 8]", "C) A continuous block-level data replication tool for on-premises hard drives", "D) Supports both public sharing and private sharing within organizations[cite: 8]"], "answer": "C", "exp": "AWS SAR is a code and template repository for serverless architectures, not a block-level data replication tool[cite: 8]."}, {"id": 49, "section": "4. COMPUTE", "topic": "AWS Serverless Application Repository (SAR)", "subtopic": "Publishing & Sharing", "type": "multi", "q": "Which TWO sharing and publishing capabilities are supported by AWS SAR? (Select 2)", "options": ["A) Public sharing to allow any AWS customer to discover and deploy the application[cite: 8]", "B) Private sharing restricted to specific AWS accounts or Organizational Units (OUs)[cite: 8]", "C) Mandatory publishing of all customer proprietary intellectual property to the public", "D) Direct burning of serverless code onto hardware flash ROMs"], "answer": ["A", "B"], "exp": "SAR allows publishers to share serverless apps publicly or restrict them privately to specific accounts or AWS Organizations[cite: 8]."}, {"id": 50, "section": "4. COMPUTE", "topic": "AWS Serverless Application Repository (SAR)", "subtopic": "Deployment Mechanism", "type": "single", "q": "Which underlying AWS service executes the provisioning and deployment of resources when a user deploys an application from SAR?", "options": ["A) AWS CloudFormation[cite: 8]", "B) AWS Elastic Beanstalk[cite: 8]", "C) AWS Storage Gateway[cite: 8]", "D) AWS DataSync[cite: 8]"], "answer": "A", "exp": "SAR uses the application's AWS SAM template and deploys resources natively using AWS CloudFormation stacks[cite: 8]."}, {"id": 51, "section": "4. COMPUTE", "topic": "AWS Serverless Application Repository (SAR)", "subtopic": "Security and Permissions", "type": "multi", "q": "Which TWO security measures are enforced by the AWS Serverless Application Repository? (Select 2)", "options": ["A) Automated scanning for common security vulnerabilities in published application packages[cite: 8]", "B) IAM policies control who can view, publish, and deploy applications from the repository[cite: 8]", "C) Disabling all IAM resource roles during deployment", "D) Enforcing cleartext storage of API keys inside SAM templates"], "answer": ["A", "B"], "exp": "AWS SAR scans published applications for known issues and governs access permissions using AWS IAM policies[cite: 8]."}, {"id": 52, "section": "4. COMPUTE", "topic": "AWS Serverless Application Repository (SAR)", "subtopic": "Exam Tips", "type": "single", "q": "When should an enterprise use AWS Serverless Application Repository according to the exam syllabus?", "options": ["A) To reuse, standardize, and share pre-vetted serverless patterns and microservices internally across teams[cite: 8]", "B) To manage physical tape archives in an on-premises data center", "C) To scale monolithic MySQL database clusters across regions", "D) To route UDP gaming traffic to the closest AWS edge location"], "answer": "A", "exp": "SAR is ideal for sharing and reusing production-ready serverless architectures and microservices across organizations[cite: 8]."}, {"id": 53, "section": "4. COMPUTE", "topic": "AWS Wavelength", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Wavelength?", "options": ["A) Extends AWS compute and storage services directly inside telecommunications 5G networks[cite: 8]", "B) Delivers ultra-low latency (single-digit milliseconds) to mobile devices and end users[cite: 8]", "C) Requires developers to rewrite their applications with specialized, proprietary carrier APIs[cite: 8]", "D) Uses familiar AWS services like EC2, EBS, ECS, and VPC[cite: 8]"], "answer": "C", "exp": "AWS Wavelength allows developers to build applications using the exact same standard AWS APIs, tools, and hardware[cite: 8]."}, {"id": 54, "section": "4. COMPUTE", "topic": "AWS Wavelength", "subtopic": "Wavelength Zones & Subnets", "type": "multi", "q": "Which TWO statements describe Wavelength Zones and their networking model? (Select 2)", "options": ["A) Wavelength Zones are carrier-operated data centers that appear as subnets in your VPC[cite: 8]", "B) Wavelength subnets connect to the parent AWS Region over a high-bandwidth, secure AWS backbone[cite: 8]", "C) Wavelength Zones operate completely isolated without any connection to parent regions", "D) All S3 buckets are hosted physically inside the Wavelength Zone by default"], "answer": ["A", "B"], "exp": "Wavelength Zones are VPC subnet extensions tied to telecommunication 5G data centers, linked to the parent AWS Region[cite: 8]."}, {"id": 55, "section": "4. COMPUTE", "topic": "AWS Wavelength", "subtopic": "Carrier Gateways", "type": "single", "q": "Which networking gateway allows EC2 instances in a Wavelength Zone to communicate directly with 5G mobile devices and the telecommunication network without routing over the public internet?", "options": ["A) Carrier Gateway[cite: 8]", "B) Internet Gateway[cite: 8]", "C) Virtual Private Gateway[cite: 8]", "D) Transit Gateway[cite: 8]"], "answer": "A", "exp": "A Carrier Gateway serves two purposes: allowing inbound traffic from carrier 5G networks and translating IP addresses for outbound internet traffic[cite: 8]."}, {"id": 56, "section": "4. COMPUTE", "topic": "AWS Wavelength", "subtopic": "Supported Services & Storage", "type": "multi", "q": "Which TWO services and features are supported directly inside a Wavelength Zone? (Select 2)", "options": ["A) Amazon EC2 instances and attached EBS block storage volumes[cite: 8]", "B) Network Load Balancers (NLB) for distributing low-latency traffic[cite: 8]", "C) AWS Snowmobile direct loading bays", "D) Native S3 bucket storage endpoints inside the carrier site"], "answer": ["A", "B"], "exp": "Wavelength supports select EC2 instances, EBS volumes, and NLBs locally; S3 storage resides in the parent AWS Region[cite: 8]."}, {"id": 57, "section": "4. COMPUTE", "topic": "AWS Wavelength", "subtopic": "Use Cases", "type": "single", "q": "Which application scenario is best suited for deployment into an AWS Wavelength Zone?", "options": ["A) Real-time multiplayer game streaming, autonomous vehicle telemetry (V2X), and AR/VR mobile applications[cite: 8]", "B) Monthly batch payroll calculation jobs running overnight", "C) Cold compliance data archiving for 10-year retention", "D) Internal employee wiki and document management"], "answer": "A", "exp": "Wavelength delivers ultra-low latency over 5G networks, making it ideal for AR/VR, smart cities, V2X, and real-time gaming[cite: 8]."}, {"id": 58, "section": "4. COMPUTE", "topic": "AWS Wavelength", "subtopic": "Exam Tips", "type": "single", "q": "What is the key differentiator for AWS Wavelength on the AWS certification exam?", "options": ["A) Extends AWS compute to the edge of 5G telecommunication networks using Carrier Gateways[cite: 8]", "B) Delivers physical appliances in shipping containers for exabyte migrations", "C) Manages Kubernetes master nodes on on-premises vSphere servers", "D) Provides free SSL certificates for CloudFront distributions"], "answer": "A", "exp": "Wavelength is specifically tied to 5G telecommunication networks, Carrier Gateways, and single-digit millisecond latency for mobile users[cite: 8]."}, {"id": 59, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Elastic IP Addresses (EIP)", "type": "single", "q": "What is an Elastic IP address in Amazon EC2?", "options": ["A) A static, public IPv4 address designed for dynamic cloud computing that can be rapidly remapped to another instance during failure[cite: 8]", "B) A private IPv6 address assigned automatically to all subnets", "C) A temporary IP address that changes every time an instance reboots", "D) An encrypted VPN tunnel endpoint"], "answer": "A", "exp": "An Elastic IP address is a static public IPv4 address allocated to an account that can be quickly remapped between instances to mask failures[cite: 8]."}, {"id": 60, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Elastic Fabric Adapter (EFA)", "type": "single", "q": "What is the primary architectural purpose of attaching an Elastic Fabric Adapter (EFA) to an EC2 instance?", "options": ["A) Accelerates High-Performance Computing (HPC) and machine learning workloads by providing OS-bypass networking capabilities[cite: 7]", "B) Connects the EC2 instance directly to legacy on-premises tape libraries", "C) Automatically compresses all outbound HTTP responses", "D) Replaces the need for VPC Security Groups"], "answer": "A", "exp": "EFA is a network device that provides OS-bypass capabilities, enabling HPC and ML applications to bypass the OS kernel for ultra-low latency[cite: 7]."}, {"id": 61, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Elastic Network Adapter (ENA)", "type": "single", "q": "What benefit does an Elastic Network Adapter (ENA) deliver to EC2 instances?", "options": ["A) Provides high-throughput, high-packets-per-second, and low-latency enhanced networking up to 100 Gbps[cite: 7]", "B) Enables automatic software licensing compliance auditing", "C) Stores ephemeral instance cache files", "D) Eliminates all charges for data transfer between regions"], "answer": "A", "exp": "ENA provides enhanced networking on supported instance types, delivering high bandwidth and low inter-instance latency[cite: 7]."}, {"id": 62, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "EC2 Hibernate", "type": "multi", "q": "Which TWO statements regarding Amazon EC2 Hibernation are accurate? (Select 2)", "options": ["A) Saves the contents from instance memory (RAM) directly to the root EBS volume before stopping[cite: 8]", "B) Retains instance storage state so applications can resume quickly without reloading their memory footprint[cite: 8]", "C) Can be enabled on any running instance without stopping it", "D) Supported on instances backed exclusively by instance store storage"], "answer": ["A", "B"], "exp": "Hibernation saves the RAM state to the encrypted root EBS volume, allowing faster boot and memory state restoration upon start[cite: 8]."}, {"id": 63, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Step Scaling vs Simple Scaling", "type": "single", "q": "Why is Step Scaling preferred over legacy Simple Scaling for dynamic scaling policies?", "options": ["A) It allows defining multiple scaling adjustments based on the size of the alarm breach without waiting for cooldown periods between steps[cite: 8]", "B) It shuts down all instances immediately upon a breach", "C) It only scales down and never scales up", "D) It requires no CloudWatch alarms to function"], "answer": "A", "exp": "Step Scaling applies graduated capacity adjustments based on the magnitude of the metric breach, responding faster than Simple Scaling[cite: 8]."}, {"id": 64, "section": "4. COMPUTE", "topic": "Amazon EC2 Auto Scaling", "subtopic": "Termination Policies", "type": "single", "q": "By default, how does an Auto Scaling Group determine which EC2 instance to terminate during a scale-in event?", "options": ["A) Identifies the AZ with the most instances, then terminates the instance launched with the oldest launch template/configuration[cite: 8]", "B) Randomly terminates the instance with the lowest CPU utilization", "C) Prompts the system administrator via an SNS push notification", "D) Terminates all instances in the group simultaneously"], "answer": "A", "exp": "Default termination policy balances instances across AZs, targeting the AZ with the most instances and selecting the oldest configuration[cite: 8]."}, {"id": 65, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Managed Platform Updates", "type": "single", "q": "How do Managed Platform Updates in Elastic Beanstalk maintain environment security?", "options": ["A) Automatically applies OS, platform, and minor component patches during a user-configured weekly maintenance window without downtime[cite: 8]", "B) Permanently reboots the entire production VPC every night", "C) Forces applications to downgrade to earlier language runtimes", "D) Replaces all application source code with sample AWS templates"], "answer": "A", "exp": "Managed platform updates apply patch and minor updates automatically during a defined maintenance window using immutable updates[cite: 8]."}, {"id": 66, "section": "4. COMPUTE", "topic": "AWS Elastic Beanstalk", "subtopic": "Database Decoupling", "type": "single", "q": "What is an important architectural best practice regarding Amazon RDS databases created within an Elastic Beanstalk environment?", "options": ["A) Avoid creating the RDS database inside the Beanstalk environment for production, as deleting the environment will terminate the database[cite: 8]", "B) Always couple the database tightly inside the environment for ease of deletion", "C) Store database credentials in public S3 buckets", "D) Run relational databases directly inside worker containers"], "answer": "A", "exp": "Creating RDS outside Beanstalk decouples database lifecycle from application lifecycle, preventing accidental data deletion[cite: 8]."}, {"id": 67, "section": "4. COMPUTE", "topic": "Amazon EC2", "subtopic": "Metadata Service (IMDSv2)", "type": "single", "q": "How does Instance Metadata Service Version 2 (IMDSv2) improve security on Amazon EC2 instances?", "options": ["A) Requires session-oriented requests using a secret token obtained via an HTTP PUT request, mitigating SSRF vulnerabilities[cite: 8]", "B) Transmits credentials in cleartext over unencrypted external UDP channels", "C) Disables IAM role assumption permanently on the instance", "D) Locks the local root file system into read-only mode"], "answer": "A", "exp": "IMDSv2 protects against open-web vulnerabilities (like SSRF) by requiring a session token header generated via PUT requests[cite: 8]."}, {"id": 68, "section": "4. COMPUTE", "topic": "AWS Outposts", "subtopic": "CoIP (Customer-Owned IP) Pool", "type": "single", "q": "In an AWS Outposts rack deployment, what is a Customer-Owned IP (CoIP) pool used for?", "options": ["A) Assigning on-premises routable IP addresses to local Outpost EC2 instances so they can communicate with existing local networks[cite: 8]", "B) Encrypting data at rest using customer-owned KMS keys", "C) Bypassing the Local Gateway completely", "D) Routing public internet traffic directly through AWS regions"], "answer": "A", "exp": "CoIP pools allow customer-owned, on-premises routable IP addresses to be assigned to Outpost instances for local communication[cite: 8]."}, {"id": 69, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Job Retries & Timeouts", "type": "single", "q": "How can an engineer prevent a misconfigured AWS Batch job from running indefinitely and running up compute bills?", "options": ["A) Configure a Job Timeout duration in the Job Definition so failed or stalled tasks are automatically canceled[cite: 8]", "B) Manually terminate the EC2 instances from the AWS Management Console", "C) Delete the AWS Batch compute environment", "D) Disconnect the VPC route table"], "answer": "A", "exp": "Job timeouts can be configured in Job Definitions or at submission, automatically aborting tasks that exceed a specific runtime limit[cite: 8]."}], "quiz5": [{"id": 1, "section": "5. CONTAINERS", "topic": "Amazon ECS Anywhere", "subtopic": "What It Is & Hybrid Management", "type": "single", "q": "Which of the following is NOT true regarding Amazon ECS Anywhere?", "options": ["A) Allows running ECS container tasks on customer-managed hardware on-premises or at edge locations[cite: 8]", "B) Uses the same AWS ECS control plane, management tooling, and APIs available in the cloud[cite: 8]", "C) AWS assumes full physical operational responsibility for maintaining the customer's on-premises hardware[cite: 8]", "D) Suitable for workloads in regulated environments where data residency mandates on-premises execution[cite: 8]"], "answer": "C", "exp": "Under ECS Anywhere, the customer manages the underlying on-premises infrastructure, while AWS manages the ECS container control plane[cite: 8]."}, {"id": 2, "section": "5. CONTAINERS", "topic": "Amazon ECS Anywhere", "subtopic": "Benefits & Use Cases", "type": "multi", "q": "Which TWO use cases or benefits are characteristic of Amazon ECS Anywhere? (Select 2)", "options": ["A) Single, consistent control plane to manage container workloads across AWS and on-premises environments[cite: 8]", "B) Low-latency edge computing and compliance where data must remain local[cite: 8]", "C) Automatic conversion of all on-premises containers into physical tape archives", "D) Eliminating the need for internet connectivity back to the AWS cloud"], "answer": ["A", "B"], "exp": "ECS Anywhere provides a unified control plane for hybrid container deployments and addresses local data residency and low-latency needs[cite: 8]."}, {"id": 3, "section": "5. CONTAINERS", "topic": "Amazon EKS Anywhere", "subtopic": "What It Is & Infrastructure Support", "type": "single", "q": "Which underlying infrastructure environments are supported by Amazon EKS Anywhere to create and operate Kubernetes clusters on-premises?", "options": ["A) VMware vSphere and bare-metal servers[cite: 8]", "B) Proprietary mainframe hardware only", "C) Dedicated AWS Snowmobile trucks exclusively", "D) S3 Glacier Deep Archive storage endpoints"], "answer": "A", "exp": "Amazon EKS Anywhere allows running Kubernetes clusters locally on VMware vSphere and bare-metal hardware using consistent EKS tooling[cite: 8]."}, {"id": 4, "section": "5. CONTAINERS", "topic": "Amazon EKS Anywhere", "subtopic": "Operations & GitOps", "type": "multi", "q": "Which TWO operational capabilities are provided by Amazon EKS Anywhere? (Select 2)", "options": ["A) Consistent Kubernetes tooling, APIs, and versioning aligned with Amazon EKS in the AWS cloud[cite: 8]", "B) Built-in support for GitOps-based workflows to maintain declarative deployments[cite: 8]", "C) Automated physical server fan and cooling management", "D) Forcing all container pods to route traffic through public unencrypted proxies"], "answer": ["A", "B"], "exp": "EKS Anywhere brings operational consistency with cloud EKS and supports GitOps workflows for managing cluster configurations[cite: 8]."}, {"id": 5, "section": "5. CONTAINERS", "topic": "Amazon EKS Distro (EKS-D)", "subtopic": "What It Is & Open Source", "type": "single", "q": "What is Amazon EKS Distro (EKS-D)?", "options": ["A) An open-source Kubernetes distribution containing the exact tested and security-hardened components used by AWS to power Amazon EKS[cite: 8]", "B) A proprietary Linux kernel module available only on EC2 Mac instances", "C) A commercial hardware appliance sold directly by AWS to replace on-premises routers", "D) An automated billing reconciliation tool for multi-account organizations"], "answer": "A", "exp": "EKS Distro is the open-source distribution of Kubernetes tested, secured, and maintained by AWS for use anywhere (on-prem, cloud, or edge)[cite: 8]."}, {"id": 6, "section": "5. CONTAINERS", "topic": "Amazon EKS Distro (EKS-D)", "subtopic": "Use Cases & Compatibility", "type": "multi", "q": "Which TWO scenarios are primary use cases for deploying Amazon EKS Distro (EKS-D)? (Select 2)", "options": ["A) Operating self-managed Kubernetes clusters in air-gapped or disconnected environments with AWS-validated reliability[cite: 8]", "B) Ensuring version and patch consistency between custom Kubernetes clusters and AWS-managed Amazon EKS[cite: 8]", "C) Generating automated compliance reports for HIPAA without running containers", "D) Direct conversion of legacy relational tables into NoSQL documents"], "answer": ["A", "B"], "exp": "EKS-D is used for air-gapped/custom Kubernetes environments needing verified security patches and full compatibility with Amazon EKS[cite: 8]."}, {"id": 7, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "What It Is & Orchestration", "type": "single", "q": "Which of the following is NOT true regarding Amazon Elastic Container Service (Amazon ECS)?", "options": ["A) Fully managed container orchestration service supporting Docker containers[cite: 8]", "B) Eliminates the need to install, operate, or scale custom container orchestration software[cite: 8]", "C) Runs natively only on unmanaged local developer laptops", "D) Deeply integrated with AWS IAM, CloudWatch, VPC, and Elastic Load Balancing[cite: 8]"], "answer": "C", "exp": "Amazon ECS is an AWS-hosted cloud container orchestration service running on EC2 or AWS Fargate[cite: 8]."}, {"id": 8, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Launch Types - EC2 vs Fargate", "type": "multi", "q": "Which TWO statements accurately contrast the EC2 Launch Type and Fargate Launch Type in Amazon ECS? (Select 2)", "options": ["A) Fargate is serverless; users define CPU and memory at the task level without provisioning or managing EC2 instances[cite: 8]", "B) EC2 Launch Type gives full control over underlying server instance types, AMIs, and OS patching[cite: 8]", "C) Fargate allows direct SSH access to the underlying virtual machine hypervisor", "D) EC2 Launch Type does not support deployment across multiple Availability Zones"], "answer": ["A", "B"], "exp": "Fargate provides serverless task execution without server management, while the EC2 launch type provides full infrastructure control[cite: 8]."}, {"id": 9, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Task Definitions vs Tasks", "type": "single", "q": "In Amazon ECS, what is the relationship between a Task Definition and a Task?", "options": ["A) A Task Definition is the JSON blueprint defining container images, resources, and ports; a Task is the running instantiation of that definition[cite: 5, 8]", "B) A Task Definition is a running container; a Task is an unconfigured AMI image", "C) A Task Definition represents an Auto Scaling group; a Task represents an S3 bucket", "D) There is no difference; the terms are completely interchangeable in ECS"], "answer": "A", "exp": "A Task Definition is a blueprint specifying container configurations, while a Task is the running container instance on a cluster[cite: 5, 8]."}, {"id": 10, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "ECS Services", "type": "multi", "q": "Which TWO management capabilities are handled by Amazon ECS Services? (Select 2)", "options": ["A) Maintaining the desired count of running tasks and replacing failed tasks automatically[cite: 8]", "B) Registering and deregistering tasks with an Elastic Load Balancer (ALB/NLB) target group[cite: 8]", "C) Managing physical hardware cooling units in AWS data centers", "D) Bypassing IAM task roles to give containers unrestricted root AWS access"], "answer": ["A", "B"], "exp": "ECS Services maintain desired task counts, coordinate rolling/blue-green deployments, and register tasks with load balancer target groups[cite: 8]."}, {"id": 11, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Task Placement Strategies", "type": "single", "q": "Which ECS task placement strategy places tasks on container instances with the least available amount of CPU or memory to minimize instance sprawl and lower costs?", "options": ["A) Binpack[cite: 5]", "B) Spread[cite: 5]", "C) Random[cite: 5]", "D) AZ Balanced[cite: 5]"], "answer": "A", "exp": "The binpack strategy places tasks on instances with the least available resources to pack containers densely and optimize server utilization[cite: 5]."}, {"id": 12, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Capacity Providers", "type": "multi", "q": "Which TWO functions are managed using Amazon ECS Capacity Providers? (Select 2)", "options": ["A) Managing the automated scaling of EC2 Auto Scaling groups associated with the ECS cluster[cite: 5, 8]", "B) Defining capacity weighting and strategies between Fargate and Fargate Spot[cite: 5, 8]", "C) Compiling Java applications into Docker images on client laptops", "D) Encrypting client-side browser cookies with AES-256"], "answer": ["A", "B"], "exp": "Capacity Providers control how tasks map to compute infrastructure, handling ASG managed scaling and Fargate/Spot ratios[cite: 5, 8]."}, {"id": 13, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Networking - awsvpc Mode", "type": "single", "q": "What is the primary architectural feature of the 'awsvpc' network mode in Amazon ECS?", "options": ["A) Each task is allocated its own dedicated Elastic Network Interface (ENI) and private IPv4 address within the VPC[cite: 8]", "B) All containers share the host's IP address and require dynamic port mappings only", "C) Tasks communicate exclusively over public unencrypted internet gateways", "D) Disables all Security Group and Network ACL filtering"], "answer": "A", "exp": "The awsvpc mode assigns each task an ENI with a private IP, giving tasks full native VPC networking and Security Group isolation[cite: 8]."}, {"id": 14, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "IAM Roles - Task Role vs Execution Role", "type": "single", "q": "In Amazon ECS, what is the distinct purpose of the Task Execution Role compared to the Task Role?", "options": ["A) The Task Execution Role grants permissions to the ECS container agent to pull images from ECR and publish logs to CloudWatch, while the Task Role grants permissions to the application containers themselves[cite: 8]", "B) The Task Execution Role is for web browsers; the Task Role is for databases", "C) The Task Execution Role provides root Linux credentials to administrators", "D) There is no distinction between these roles in ECS"], "answer": "A", "exp": "The Task Execution Role is used by the ECS agent (pull images, decrypt SSM/Secrets Manager secrets, send logs), while the Task Role is assumed by application code[cite: 8]."}, {"id": 15, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Persistent Storage - EFS Integration", "type": "single", "q": "Which AWS storage service integrates natively with Amazon ECS to provide persistent, shared file storage accessible concurrently across tasks running in multiple AZs?", "options": ["A) Amazon Elastic File System (Amazon EFS)[cite: 8]", "B) Amazon EBS Instance Store", "C) AWS Snowball Edge local disks", "D) S3 Glacier Flexible Retrieval"], "answer": "A", "exp": "Amazon EFS integrates directly with ECS task definitions to provide managed, persistent POSIX shared file systems across AZs[cite: 8]."}, {"id": 16, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Exam Tips", "type": "single", "q": "When should an architect select AWS Fargate for an ECS deployment on the exam?", "options": ["A) When the customer wants a serverless container environment with zero EC2 instance management, OS patching, or cluster capacity planning[cite: 8]", "B) When the workload requires specialized custom GPU drivers unavailable in AWS", "C) When strict compliance requires physical dedicated bare-metal server access", "D) When containers need to be deployed without an Amazon VPC"], "answer": "A", "exp": "AWS Fargate is the exam-standard answer for running containers serverlessly without managing virtual machines or operating systems[cite: 8]."}, {"id": 17, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding Amazon Elastic Container Registry (Amazon ECR)?", "options": ["A) Fully managed, highly available Docker and OCI container image registry[cite: 8]", "B) Integrates with ECS, EKS, AWS Lambda, and standard Docker CLI tools[cite: 8]", "C) Requires deploying self-managed database servers on EC2 to store image manifests", "D) Supports both private and public container image repositories[cite: 8]"], "answer": "C", "exp": "Amazon ECR is fully managed and highly available; AWS manages the underlying registry infrastructure without user EC2 servers[cite: 8]."}, {"id": 18, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Image Scanning & Vulnerabilities", "type": "multi", "q": "Which TWO statements regarding Amazon ECR Image Scanning are accurate? (Select 2)", "options": ["A) Automatically scans container images for Common Vulnerabilities and Exposures (CVEs)[cite: 8]", "B) Can be configured to scan automatically on image push or executed on demand[cite: 8]", "C) Scans are only supported on uncompressed audio files", "D) Deletes all images immediately if any vulnerability is found"], "answer": ["A", "B"], "exp": "ECR supports vulnerability scanning on push or on demand, evaluating images against CVE databases and aggregating findings in Security Hub[cite: 8]."}, {"id": 19, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Lifecycle Policies", "type": "single", "q": "What is the primary benefit of configuring ECR Lifecycle Policies on container repositories?", "options": ["A) Automates the cleanup and expiration of old, unused, or untagged container images to reduce storage costs[cite: 8]", "B) Converts Docker images directly into virtual tape archives", "C) Automatically updates container code in GitHub repositories", "D) Restricts internet access to the AWS Management Console"], "answer": "A", "exp": "ECR lifecycle policies define rules based on age, tag status, or image count to expire obsolete images and optimize storage costs[cite: 8]."}, {"id": 20, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Cross-Region & Cross-Account Replication", "type": "multi", "q": "Which TWO benefits are achieved by configuring Amazon ECR Cross-Region Replication? (Select 2)", "options": ["A) Automatically replicates images to destination regions to support low-latency deployments and disaster recovery[cite: 5, 8]", "B) Simplifies multi-region deployment pipelines by pushing to a single source registry[cite: 5, 8]", "C) Eliminates all storage charges across every replicated region", "D) Converts OCI images into relational database schemas"], "answer": ["A", "B"], "exp": "Cross-region replication in ECR copies images across regions automatically, reducing pull latencies and aiding disaster recovery[cite: 5, 8]."}, {"id": 21, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Tag Immutability", "type": "single", "q": "Why would an organization enable Image Tag Immutability on an Amazon ECR repository?", "options": ["A) To prevent existing image tags from being overwritten by subsequent pushes, ensuring build consistency and integrity[cite: 8]", "B) To prevent developers from downloading container images", "C) To mandate that all images must be encrypted using cleartext keys", "D) To convert Docker containers into Windows executables"], "answer": "A", "exp": "Tag immutability ensures that once an image tag is published (e.g., v1.0.0), it cannot be overwritten, preventing unintended changes in deployment[cite: 8]."}, {"id": 22, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Public Repositories", "type": "single", "q": "What distinguishes Amazon ECR Public repositories from private repositories?", "options": ["A) Anyone worldwide can pull public images without requiring an AWS account or authentication token[cite: 8]", "B) Public repositories store images unencrypted on public FTP servers", "C) Public repositories cannot be scanned for vulnerabilities", "D) Public repositories are restricted to single-AZ access"], "answer": "A", "exp": "Amazon ECR Public allows open sharing of container images globally, allowing anonymous pulls without AWS authentication[cite: 8]."}, {"id": 23, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Exam Tips", "type": "single", "q": "Which mechanism is used to authorize local Docker CLI clients to push and pull images to private Amazon ECR repositories?", "options": ["A) Obtaining a temporary authentication authorization token via the AWS CLI or Amazon ECR Credential Helper[cite: 8]", "B) Hardcoding AWS root account passwords in local Docker daemon configs", "C) Disabling IAM authentication on the target repository", "D) Setting up a public VPN gateway to port 80"], "answer": "A", "exp": "ECR requires generating a temporary authorization token via `aws ecr get-login-password` or using the ECR Credential Helper[cite: 8]."}, {"id": 24, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "What It Is & Control Plane", "type": "single", "q": "Which of the following is NOT true regarding Amazon Elastic Kubernetes Service (Amazon EKS)?", "options": ["A) Fully managed service to run Kubernetes on AWS without maintaining your own Kubernetes control plane[cite: 8]", "B) Runs upstream, open-source certified Kubernetes for complete tool compatibility[cite: 8]", "C) Automatically provisions and manages the Kubernetes API server and etcd across multiple Availability Zones[cite: 8]", "D) Forces users to manually back up etcd clusters on external on-premises hard drives"], "answer": "D", "exp": "Amazon EKS manages the Kubernetes control plane (API servers, etcd) across multiple AZs with automatic patching, backups, and scaling[cite: 8]."}, {"id": 25, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Worker Node Options", "type": "multi", "q": "Which TWO compute options are supported for running worker nodes in an Amazon EKS cluster? (Select 2)", "options": ["A) Managed Node Groups (automated provisioning and lifecycle management of EC2 instances)[cite: 5, 8]", "B) AWS Fargate (serverless pods running without managing EC2 instances)[cite: 5, 8]", "C) Ephemeral S3 Bucket Pods", "D) AWS Direct Connect Router Chassis"], "answer": ["A", "B"], "exp": "EKS worker nodes can run on self-managed EC2 instances, Managed Node Groups, or serverlessly via AWS Fargate[cite: 5, 8]."}, {"id": 26, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "VPC CNI Plugin", "type": "single", "q": "What is the primary function of the Amazon VPC CNI plugin in an Amazon EKS cluster?", "options": ["A) Allocates native VPC private IPv4/IPv6 addresses directly to each Kubernetes pod using Elastic Network Interfaces (ENIs)[cite: 8]", "B) Compresses outbound network packets over port 443", "C) Manages DNS name registration in external domain registrars", "D) Replaces the Kubernetes API server entirely"], "answer": "A", "exp": "The Amazon VPC CNI plugin provides pod-native VPC networking, giving each pod an IP from the VPC subnet and full Security Group support[cite: 8]."}, {"id": 27, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "IAM Roles for Service Accounts (IRSA)", "type": "single", "q": "How does IAM Roles for Service Accounts (IRSA) enhance security in an Amazon EKS cluster?", "options": ["A) Associates IAM roles directly with specific Kubernetes service accounts, granting fine-grained AWS API permissions to individual pods[cite: 8]", "B) Gives all pods on a worker node unrestricted administrative access to the entire AWS account", "C) Disables Kubernetes RBAC authentication", "D) Stores AWS access keys in cleartext ConfigMaps"], "answer": "A", "exp": "IRSA leverages OIDC federation to bind IAM roles to Kubernetes service accounts, enforcing least-privilege access at the pod level[cite: 5, 8]."}, {"id": 28, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Storage Integration - EFS & EBS", "type": "multi", "q": "Which TWO AWS storage integration options are provided via CSI drivers for persistent storage in Amazon EKS? (Select 2)", "options": ["A) Amazon EBS CSI driver for block-level persistent volumes tied to a specific AZ[cite: 8]", "B) Amazon EFS CSI driver for multi-AZ, read-write-many (RWX) shared file storage across pods[cite: 5, 8]", "C) AWS Snowmobile offline data mounts", "D) S3 Glacier Deep Archive direct block devices"], "answer": ["A", "B"], "exp": "EKS integrates with Amazon EBS for single-AZ block storage and Amazon EFS for shared multi-AZ file systems via native CSI drivers[cite: 5, 8]."}, {"id": 29, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Ingress & Load Balancing", "type": "single", "q": "Which AWS controller dynamically provisions Application Load Balancers (ALBs) or Network Load Balancers (NLBs) when Kubernetes Ingress or Service resources are created in EKS?", "options": ["A) AWS Load Balancer Controller[cite: 8]", "B) AWS Systems Manager Distributor[cite: 8]", "C) Amazon Route 53 Resolver[cite: 8]", "D) AWS Storage Gateway Controller[cite: 8]"], "answer": "A", "exp": "The AWS Load Balancer Controller watches Kubernetes Ingress and Service objects and automatically creates and configures ALBs and NLBs[cite: 5, 8]."}, {"id": 30, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Pod Autoscaling vs Cluster Autoscaler", "type": "multi", "q": "Which TWO statements regarding scaling in Amazon EKS are accurate? (Select 2)", "options": ["A) Horizontal Pod Autoscaler (HPA) adjusts the number of pod replicas based on CPU/memory utilization[cite: 5]", "B) Cluster Autoscaler adds or removes EC2 worker nodes based on pending unschedulable pods[cite: 5]", "C) Cluster Autoscaler modifies container image source code", "D) HPA can only scale down and never scales up"], "answer": ["A", "B"], "exp": "HPA scales pod replicas based on metrics, while Cluster Autoscaler adjusts the underlying EC2 worker node pool when pods cannot schedule[cite: 5]."}, {"id": 31, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Monitoring - Container Insights", "type": "single", "q": "Which CloudWatch feature collects, aggregates, and summarizes metrics and logs from containerized applications and microservices running on EKS?", "options": ["A) CloudWatch Container Insights[cite: 5, 8]", "B) AWS Artifact", "C) Route 53 Traffic Flow", "D) AWS Shield Advanced"], "answer": "A", "exp": "CloudWatch Container Insights monitors, troubleshoots, and alarms on containerized applications and microservices on EKS and ECS[cite: 5, 8]."}, {"id": 32, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Exam Tips", "type": "single", "q": "When is Amazon EKS the definitive choice over Amazon ECS on the SAA-C03 exam?", "options": ["A) When an organization already uses Kubernetes, wants open-source portability, and requires existing Helm charts and kubectl tooling[cite: 8]", "B) When the team wants the simplest AWS-native container tool with zero learning curve", "C) When deploying a single monolithic PHP script", "D) When physical tape drives must be virtualized"], "answer": "A", "exp": "EKS is chosen when standard Kubernetes APIs, kubectl, Helm, open-source compatibility, or multi-cloud portability are mandated[cite: 8]."}, {"id": 33, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Task Placement Constraints", "type": "single", "q": "What is the primary difference between an ECS Task Placement Strategy and a Task Placement Constraint?", "options": ["A) A strategy is an algorithm for selecting instances (e.g., binpack, spread); a constraint is a hard rule filtering which instances can host the task[cite: 8]", "B) A strategy is enforced by IAM; a constraint is enforced by Route 53", "C) A strategy is only used on Fargate; constraints are only used on S3", "D) There is no functional difference"], "answer": "A", "exp": "Task placement strategies define optimization algorithms (binpack, spread, random), while constraints enforce strict placement criteria (e.g., specific attributes)[cite: 5, 8]."}, {"id": 34, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Fargate Platform Versions", "type": "single", "q": "What is a Fargate Platform Version in Amazon ECS?", "options": ["A) A specific runtime environment build composed of kernel versions and container runtime dependencies managed by AWS[cite: 5]", "B) An external hardware version of physical servers", "C) A pricing tier for Spot instances", "D) A custom AMI managed by the customer"], "answer": "A", "exp": "AWS Fargate platform versions represent the underlying runtime environment (kernel and container runtime) managed and updated by AWS[cite: 5]."}, {"id": 35, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Service Discovery with Cloud Map", "type": "single", "q": "How does Amazon ECS manage internal communication between microservice tasks without relying on external public load balancers?", "options": ["A) Integrated Service Discovery powered by AWS Cloud Map using private Route 53 DNS namespaces[cite: 8]", "B) Hardcoding private IPs in container images", "C) Routing all traffic through an unencrypted internet gateway", "D) Polling DynamoDB tables continuously"], "answer": "A", "exp": "ECS integrates with AWS Cloud Map to automatically register running tasks into private Route 53 DNS namespaces for service discovery[cite: 8]."}, {"id": 36, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "KMS Encryption at Rest", "type": "single", "q": "How can an organization enforce compliance by using customer-managed encryption keys for images stored in Amazon ECR?", "options": ["A) Enable KMS encryption for the repository and specify a customer-managed AWS KMS key (CMK)[cite: 8]", "B) Encrypt each image manually with a password before pushing", "C) Use S3 Glacier Vault Lock on ECR", "D) Disable TLS in transit"], "answer": "A", "exp": "Amazon ECR allows encrypting container images at rest using customer-managed KMS keys (SSE-KMS) instead of default AWS-managed keys[cite: 8]."}, {"id": 37, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Fargate Profiles", "type": "single", "q": "In Amazon EKS, how does an administrator specify which Kubernetes pods should run serverlessly on AWS Fargate?", "options": ["A) Configure an EKS Fargate Profile that matches specific Kubernetes namespaces and labels[cite: 5]", "B) Tag the physical EC2 instances in the AWS console", "C) Run the `kubectl fargate on` command on client laptops", "D) Deploy an AWS Transit Gateway attachment"], "answer": "A", "exp": "EKS Fargate Profiles define selectors (namespaces and optional labels) that dictate which pods are launched onto AWS Fargate[cite: 5]."}, {"id": 38, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Fargate Ephemeral Storage", "type": "single", "q": "What is the maximum default ephemeral storage provided to an Amazon ECS task running on AWS Fargate without extra configuration?", "options": ["A) 20 GiB (expandable up to 200 GiB)[cite: 8]", "B) 1 GiB", "C) 500 GiB", "D) Unlimited free storage"], "answer": "A", "exp": "Fargate tasks receive 20 GiB of default ephemeral storage, which can be configured up to 200 GiB in the task definition[cite: 8]."}, {"id": 39, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Control Plane Logging", "type": "multi", "q": "Which TWO log types can be enabled on Amazon EKS to stream control plane activity to Amazon CloudWatch Logs? (Select 2)", "options": ["A) API server audit logs[cite: 5]", "B) Controller manager and scheduler logs[cite: 5]", "C) Physical data center visitor logs", "D) Client browser search histories"], "answer": ["A", "B"], "exp": "EKS control plane logging exports API audit, authenticator, controller manager, and scheduler logs to CloudWatch Logs[cite: 5]."}, {"id": 40, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Container Health Checks", "type": "single", "q": "How can an ECS task definition verify that a container is responding properly within the task before routing traffic to it?", "options": ["A) Define a Container Health Check command within the task definition[cite: 5]", "B) Use CloudWatch billing alerts", "C) Rely solely on pinging the public IP address", "D) Reboot the container every 60 seconds"], "answer": "A", "exp": "Task definitions support container health checks (e.g., curl commands) to monitor application health and trigger auto-healing[cite: 5]."}, {"id": 41, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Upgrades & Versioning", "type": "single", "q": "How does AWS manage Kubernetes version upgrades for Amazon EKS clusters?", "options": ["A) Upgrades for the managed control plane are initiated on demand with zero downtime, while worker nodes are upgraded separately[cite: 8]", "B) AWS forces an immediate reboot of all worker nodes simultaneously", "C) EKS clusters cannot be upgraded once deployed", "D) Control plane upgrades require deleting the cluster"], "answer": "A", "exp": "EKS supports non-disruptive, in-place control plane upgrades, allowing worker nodes to be updated independently[cite: 8]."}, {"id": 42, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Task Networking - host vs bridge", "type": "single", "q": "Which legacy Docker network mode on EC2 instances maps container ports directly to host ports, potentially causing port conflict collisions?", "options": ["A) host mode", "B) awsvpc mode[cite: 8]", "C) none mode", "D) private-overlay mode"], "answer": "A", "exp": "In host network mode, the container shares the network namespace of the host, preventing multiple containers from binding to the same port on a single instance."}, {"id": 43, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Pull Through Cache", "type": "single", "q": "What is the primary benefit of the Amazon ECR Pull Through Cache feature?", "options": ["A) Automatically caches public upstream repositories (such as Docker Hub or Quay) inside your private ECR registry for faster, reliable pulls[cite: 5]", "B) Converts images into virtual machine snapshots", "C) Stores image layers in local browser caches", "D) Prevents all container pulls from VPC subnets"], "answer": "A", "exp": "Pull Through Cache caches upstream public repositories in private ECR, improving build speeds and insulating against rate limits or external outages[cite: 5]."}, {"id": 44, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Cluster Access Management", "type": "single", "q": "How is authentication to an Amazon EKS cluster control plane handled when running `kubectl` commands?", "options": ["A) IAM entities assume roles verified via AWS IAM Authenticator for Kubernetes or EKS Access Entries, mapped to Kubernetes RBAC[cite: 5, 8]", "B) Hardcoding cluster administrator passwords into public DNS records", "C) Using unencrypted local root credentials", "D) Accessing via physical serial cables"], "answer": "A", "exp": "Authentication to EKS uses IAM tokens validated by the EKS control plane and mapped to internal Kubernetes RBAC roles and permissions[cite: 5, 8]."}, {"id": 45, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "Container Dependencies", "type": "single", "q": "In a multi-container ECS task definition, how can you ensure a logging sidecar container starts before the main application container?", "options": ["A) Configure the `dependsOn` parameter in the container definition with a `START` condition[cite: 8]", "B) Launch them in different AWS Regions", "C) Use an external cron job to boot them", "D) Attach an Elastic IP to the sidecar"], "answer": "A", "exp": "The `dependsOn` container definition parameter defines container startup and shutdown orders (e.g., START, COMPLETE, SUCCESS, HEALTHY)[cite: 8]."}, {"id": 46, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "CoreDNS", "type": "single", "q": "Which component provides service discovery and internal domain name resolution within an Amazon EKS Kubernetes cluster?", "options": ["A) CoreDNS", "B) AWS CloudFront", "C) AWS Storage Gateway", "D) Amazon Kinesis"], "answer": "A", "exp": "CoreDNS is the standard cluster DNS service deployed by default in EKS to resolve internal service names and endpoints."}, {"id": 47, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "App Mesh Integration", "type": "single", "q": "Why would an architecture integrate AWS App Mesh with Amazon ECS services?", "options": ["A) To provide end-to-end traffic management, observability, and mutual TLS (mTLS) across microservices without modifying application code[cite: 8]", "B) To compress EBS block storage volumes", "C) To convert Docker containers into virtual tapes", "D) To manage billing consolidated accounts"], "answer": "A", "exp": "AWS App Mesh is a service mesh that provides service-level networking, mTLS security, and traffic routing across microservices on ECS and EKS[cite: 8]."}, {"id": 48, "section": "5. CONTAINERS", "topic": "Amazon ECR", "subtopic": "Repository Policies", "type": "single", "q": "Which policy type is used to grant another AWS account permission to pull container images from a private Amazon ECR repository?", "options": ["A) ECR Repository Resource-Based Policy[cite: 8]", "B) Route 53 Routing Policy[cite: 8]", "C) S3 Lifecycle Policy[cite: 8]", "D) VPC Security Group Egress Rule[cite: 8]"], "answer": "A", "exp": "ECR supports resource-based repository policies to grant cross-account pull or push permissions to specific IAM principals or organizations[cite: 8]."}, {"id": 49, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "Managed Node Groups - AMI Types", "type": "single", "q": "Which operating system optimized for container workloads is natively supported by Amazon EKS Managed Node Groups?", "options": ["A) Bottlerocket and Amazon Linux 2[cite: 5]", "B) MS-DOS 6.22", "C) Windows 95", "D) Solaris 10"], "answer": "A", "exp": "EKS Managed Node Groups natively provide optimized AMIs for Amazon Linux 2 and Bottlerocket (a security-hardened open-source container OS)[cite: 5]."}, {"id": 50, "section": "5. CONTAINERS", "topic": "Amazon ECS", "subtopic": "ECS Exec", "type": "single", "q": "What capability does the ECS Exec feature provide to developers?", "options": ["A) Directly execute commands in or obtain an interactive shell to a running container on EC2 or Fargate using AWS Systems Manager Session Manager[cite: 8]", "B) Automatically purchase Spot instances during demand spikes", "C) Decrypt SSL certificates on client laptops", "D) Format unattached physical hard drives"], "answer": "A", "exp": "ECS Exec uses Systems Manager Session Manager infrastructure to securely run commands or open a shell inside containers without open SSH ports[cite: 8]."}, {"id": 51, "section": "5. CONTAINERS", "topic": "Amazon EKS", "subtopic": "EKS Add-ons", "type": "single", "q": "What is the primary benefit of managing cluster operational software (like VPC CNI, CoreDNS, and kube-proxy) as Amazon EKS Add-ons?", "options": ["A) AWS provides one-click installations, automated updates, and security compatibility checks directly via the EKS API and console[cite: 8]", "B) It eliminates all compute billing for worker nodes", "C) It allows running Kubernetes without a VPC", "D) It converts containers into relational tables"], "answer": "A", "exp": "EKS Add-ons allow operational software components to be installed, versioned, and patched consistently via managed AWS workflows[cite: 8]."}], "quiz6": [{"id": 1, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "What It Is & Engine Compatibility", "type": "single", "q": "Which of the following is NOT true regarding Amazon Aurora as described in the handbook?", "options": ["A) Fully managed relational database engine built specifically for the cloud[cite: 8]", "B) Compatible with MySQL and PostgreSQL database engines[cite: 8]", "C) Up to 5x faster than standard MySQL and 3x faster than standard PostgreSQL[cite: 8]", "D) Requires manual sharding across hard drives to scale storage beyond 10 GB[cite: 8]"], "answer": "D", "exp": "Amazon Aurora storage scales automatically in 10 GB increments up to 128 TB without manual intervention or downtime[cite: 8]."}, {"id": 2, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Key Features & Architecture", "type": "multi", "q": "Which TWO architectural and durability features are characteristic of Amazon Aurora? (Select 2)", "options": ["A) Fault-tolerant, self-healing storage system with six-way replication across three Availability Zones[cite: 8]", "B) Continuous automated backups to Amazon S3 with point-in-time recovery[cite: 8]", "C) Requires deploying single-node instances without replica support", "D) Uses physical tape drives for weekly database snapshot archiving"], "answer": ["A", "B"], "exp": "Aurora replicates data six ways across three
