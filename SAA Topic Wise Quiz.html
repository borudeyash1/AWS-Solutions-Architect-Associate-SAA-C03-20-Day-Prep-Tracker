 AZs and continuously streams backup logs to S3 without impacting performance[cite: 4, 8]."}, {"id": 3, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Aurora Replicas & Read Scaling", "type": "single", "q": "What is the maximum number of Aurora Replicas that can be deployed in a single Amazon Aurora DB cluster for read scaling?", "options": ["A) Up to 15 Aurora Replicas[cite: 8]", "B) Up to 5 replicas only[cite: 8]", "C) Maximum of 1 replica per region", "D) Unlimited replicas with zero replication lag"], "answer": "A", "exp": "Amazon Aurora DB clusters support up to 15 Aurora Replicas sharing the same underlying distributed cluster volume[cite: 4, 8]."}, {"id": 4, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Aurora Global Databases", "type": "multi", "q": "Which TWO statements regarding Amazon Aurora Global Databases are accurate? (Select 2)", "options": ["A) Dedicated to globally distributed applications with cross-region replication lag typically under 1 second[cite: 8]", "B) Provides fast disaster recovery by allowing a secondary region to be promoted to full read/write capabilities[cite: 4, 8]", "C) Enforces synchronous replication across oceans resulting in high write latencies", "D) Limits secondary regions to hosting zero read replicas"], "answer": ["A", "B"], "exp": "Aurora Global Databases replicate asynchronously across regions in under a second and allow fast regional failover for disaster recovery[cite: 4, 8]."}, {"id": 5, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Aurora Serverless v1 vs v2", "type": "single", "q": "What is the primary advantage of Aurora Serverless v2 over Aurora Serverless v1?", "options": ["A) Scales instantly and granularly in fractions of a second without dropping active client connections, supporting both MySQL and PostgreSQL[cite: 8]", "B) Disables all auto-scaling to maintain fixed compute capacity[cite: 4, 8]", "C) Completely eliminates the need for data encryption at rest", "D) Operates exclusively in a single Availability Zone without failover"], "answer": "A", "exp": "Aurora Serverless v2 scales instantaneously in fine-grained increments (ACUs) and supports both MySQL and PostgreSQL for production workloads[cite: 8]."}, {"id": 6, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Database Cloning", "type": "single", "q": "How does Amazon Aurora Database Cloning create fast, cost-effective copies of databases for testing and development?", "options": ["A) Uses copy-on-write protocol to allocate new storage only when cloned data is modified, referencing the original storage volume initially[cite: 8]", "B) Performs a complete physical block-by-block duplicate of all 128 TB of data to S3 Glacier", "C) Takes 24 hours to generate full cluster snapshots before cloning", "D) Converts relational tables into static flat files"], "answer": "A", "exp": "Aurora Database Cloning is fast and cost-effective because it uses a copy-on-write mechanism that allocates storage only when data is modified[cite: 8]."}, {"id": 7, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Database Activity Streams", "type": "single", "q": "Which feature provides a real-time, near-instantaneous stream of database activity to an Amazon Kinesis data stream for compliance auditing and threat monitoring?", "options": ["A) Amazon Aurora Database Activity Streams[cite: 4]", "B) Enhanced Monitoring[cite: 4]", "C) Aurora Backtrack[cite: 4]", "D) Performance Insights[cite: 4]"], "answer": "A", "exp": "Aurora Database Activity Streams stream relational database audit and activity logs directly to Amazon Kinesis for real-time security analysis[cite: 4]."}, {"id": 8, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Security & Authentication", "type": "multi", "q": "Which TWO security and access control mechanisms are supported by Amazon Aurora? (Select 2)", "options": ["A) IAM Database Authentication to authenticate users without storing database passwords[cite: 8]", "B) Encryption at rest using AWS KMS keys and encryption in transit using SSL/TLS[cite: 8]", "C) Mandatory public unencrypted IP accessibility", "D) Storing administrator passwords in plain text in parameter groups"], "answer": ["A", "B"], "exp": "Aurora supports IAM Database Authentication, KMS encryption at rest, SSL/TLS in transit, and Secrets Manager integration[cite: 8]."}, {"id": 9, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Backtrack", "type": "single", "q": "What capability does Amazon Aurora Backtrack provide?", "options": ["A) Allows rewinding the database cluster to a specific point in time in seconds without restoring from a backup or snapshot[cite: 4]", "B) Exports database logs to AWS Snowmobile trucks", "C) Automatically compiles SQL statements into C++ code", "D) Replaces Multi-AZ deployments with single-host replication"], "answer": "A", "exp": "Aurora Backtrack lets you quickly rewind a database to a previous point in time to undo destructive mistakes (like an accidental DROP TABLE) without restoring from backups[cite: 4]."}, {"id": 10, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the AWS exam to select Amazon Aurora over standard Amazon RDS engines?", "options": ["A) Requirement for cloud-native performance (up to 5x MySQL / 3x PostgreSQL), 6-way multi-AZ replication, and fast failover under 30 seconds[cite: 4, 8]", "B) Need to run Microsoft SQL Server on Linux bare-metal hosts", "C) Running simple temporary SQLite databases for local testing", "D) Requirement to manage underlying physical SAN storage arrays directly"], "answer": "A", "exp": "Aurora is tested as the high-performance, cloud-native managed relational engine offering automated 6-way replication and sub-30-second failovers[cite: 4, 8]."}, {"id": 11, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "What It Is & MongoDB Compatibility", "type": "single", "q": "Which of the following is NOT true regarding Amazon DocumentDB?", "options": ["A) Fully managed document database service designed for JSON-like semi-structured data[cite: 8]", "B) Compatible with MongoDB client drivers and APIs[cite: 8]", "C) A drop-in replacement that supports 100% of all MongoDB proprietary features natively[cite: 8]", "D) Automatically scales storage up to 64 TB without downtime[cite: 8]"], "answer": "C", "exp": "DocumentDB emulates MongoDB APIs (versions 3.6, 4.0, 5.0) but is built on a purpose-built AWS storage engine and does not support every MongoDB feature natively[cite: 8]."}, {"id": 12, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Architecture & Storage", "type": "multi", "q": "Which TWO architectural properties are characteristic of Amazon DocumentDB? (Select 2)", "options": ["A) Replicates six copies of data across three Availability Zones for high durability[cite: 4, 8]", "B) Separates compute and storage layers, allowing independent scaling[cite: 8]", "C) Stores all data exclusively on single-AZ ephemeral instance store disks", "D) Bypasses VPC network isolation to enforce public accessibility"], "answer": ["A", "B"], "exp": "DocumentDB separates compute from storage and uses a distributed, fault-tolerant storage system that replicates data 6 ways across 3 AZs[cite: 4, 8]."}, {"id": 13, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Read Replicas & Scaling", "type": "single", "q": "How many read replicas can an Amazon DocumentDB cluster support for horizontal read scaling?", "options": ["A) Up to 15 read replicas[cite: 4, 8]", "B) Up to 5 read replicas[cite: 8]", "C) Exactly 1 standby replica only", "D) Unlimited replicas across all accounts"], "answer": "A", "exp": "DocumentDB clusters support up to 15 read replicas sharing the underlying distributed storage volume[cite: 4, 8]."}, {"id": 14, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Backups and Restore", "type": "multi", "q": "Which TWO backup and recovery capabilities are supported by Amazon DocumentDB? (Select 2)", "options": ["A) Continuous automated backups to Amazon S3 with Point-in-Time Recovery (PITR) up to 35 days[cite: 4, 8]", "B) User-initiated manual snapshots that can be shared across AWS accounts[cite: 8]", "C) Backups must be manually downloaded to local flash drives weekly", "D) Point-in-time recovery is restricted to exactly 1 hour after creation"], "answer": ["A", "B"], "exp": "DocumentDB provides continuous S3 backups with PITR up to 35 days and allows sharing manual snapshots across accounts[cite: 4, 8]."}, {"id": 15, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Global Clusters", "type": "single", "q": "What is the primary operational advantage of Amazon DocumentDB Global Clusters?", "options": ["A) Provides fast asynchronous cross-region replication for disaster recovery and low-latency global reads[cite: 4]", "B) Eliminates all storage costs across secondary regions", "C) Automatically migrates document data into Redshift clusters", "D) Allows synchronous write commits across different continents"], "answer": "A", "exp": "Global Clusters replicate data asynchronously across regions, enabling fast DR promotion and low-latency local reads[cite: 4]."}, {"id": 16, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Security", "type": "multi", "q": "Which TWO security features are native to Amazon DocumentDB? (Select 2)", "options": ["A) Encryption at rest using AWS KMS keys and encryption in transit via TLS[cite: 8]", "B) Mandatory deployment within an Amazon VPC for network isolation[cite: 8]", "C) Disabling all IAM access policies", "D) Transmitting database queries over unencrypted HTTP"], "answer": ["A", "B"], "exp": "DocumentDB clusters must be deployed inside an Amazon VPC and support KMS encryption at rest and TLS in transit[cite: 8]."}, {"id": 17, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Migration - AWS DMS", "type": "single", "q": "Which AWS service is recommended to migrate workloads from on-premises MongoDB to Amazon DocumentDB with minimal downtime?", "options": ["A) AWS Database Migration Service (AWS DMS)[cite: 8]", "B) AWS Snowmobile", "C) Amazon Kinesis Video Streams", "D) AWS Data Pipeline Task Runner"], "answer": "A", "exp": "AWS DMS supports MongoDB as a source and DocumentDB as a target for both full load and continuous replication (CDC)[cite: 8]."}, {"id": 18, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Use Cases & Exam Tips", "type": "single", "q": "When is Amazon DocumentDB the correct exam answer?", "options": ["A) When an application requires a managed JSON document store compatible with MongoDB APIs, needing flexible schemas and multi-AZ durability[cite: 8]", "B) When complex multi-table joins and SQL foreign key constraints are mandatory", "C) When building real-time microsecond in-memory caching layers", "D) When running big data MapReduce jobs"], "answer": "A", "exp": "DocumentDB is tested as the managed AWS solution for MongoDB-compatible document and semi-structured JSON workloads[cite: 8]."}, {"id": 19, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "What It Is & Core Concepts", "type": "single", "q": "Which of the following is NOT true regarding Amazon DynamoDB?", "options": ["A) Fully managed, serverless NoSQL key-value and document database[cite: 8]", "B) Delivers single-digit millisecond latency at any scale[cite: 8]", "C) Automatically replicates data synchronously across three Availability Zones[cite: 4, 8]", "D) Requires provisioning and patching Linux operating systems on database nodes[cite: 8]"], "answer": "D", "exp": "Amazon DynamoDB is a fully managed, serverless database where AWS handles all underlying hardware, OS, and software management[cite: 8]."}, {"id": 20, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Primary Keys", "type": "multi", "q": "Which TWO types of primary key structures are supported by Amazon DynamoDB? (Select 2)", "options": ["A) Partition Key (Simple primary key composed of one attribute)[cite: 8]", "B) Composite Primary Key (composed of a Partition Key and a Sort Key)[cite: 8]", "C) Floating Point Primary Key", "D) Foreign Key Reference Array"], "answer": ["A", "B"], "exp": "DynamoDB supports simple primary keys (Partition Key only) and composite primary keys (Partition Key + Sort Key)[cite: 8]."}, {"id": 21, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Secondary Indexes - GSI vs LSI", "type": "single", "q": "What is a critical operational difference between a Global Secondary Index (GSI) and a Local Secondary Index (LSI) in DynamoDB?", "options": ["A) An LSI must be created at table creation time and shares the partition key; a GSI can be created anytime and can have a different partition key[cite: 4, 8]", "B) A GSI can only be created at table creation time; an LSI can be added anytime", "C) LSIs replicate data across multiple AWS Regions automatically", "D) GSIs do not support read capacity units"], "answer": "A", "exp": "LSIs must be defined when the table is created and share the table's partition key; GSIs can be added or deleted at any time with different partition/sort keys[cite: 4, 8]."}, {"id": 22, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Capacity Modes - On-Demand vs Provisioned", "type": "multi", "q": "Which TWO statements accurately describe DynamoDB capacity modes? (Select 2)", "options": ["A) On-Demand mode automatically scales to accommodate unpredictable workloads with pay-per-request pricing[cite: 4, 8]", "B) Provisioned mode allows specifying Read Capacity Units (RCUs) and Write Capacity Units (WCUs) with optional Auto Scaling[cite: 4, 8]", "C) On-Demand mode requires manual capacity adjustments every 4 hours", "D) Provisioned mode completely disables billing for read operations"], "answer": ["A", "B"], "exp": "On-Demand mode accommodates spiky/unpredictable traffic automatically; Provisioned mode lets you specify fixed RCUs/WCUs for cost predictability[cite: 4, 8]."}, {"id": 23, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "DynamoDB Accelerator (DAX)", "type": "single", "q": "What performance benefit does DynamoDB Accelerator (DAX) deliver to read-heavy applications?", "options": ["A) In-memory caching that reduces read latency from single-digit milliseconds to microseconds[cite: 4, 8]", "B) Automatic translation of SQL queries into MongoDB commands", "C) Compression of EBS snapshot archives", "D) Bypassing IAM authentication policies"], "answer": "A", "exp": "DAX is a fully managed, clustered in-memory cache for DynamoDB that delivers microsecond response times for read-heavy workloads[cite: 4, 8]."}, {"id": 24, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Data Consistency Models", "type": "single", "q": "Which DynamoDB read consistency option returns the most up-to-date data reflecting all successful write operations, at the cost of consuming double the read capacity?", "options": ["A) Strongly Consistent Read[cite: 8]", "B) Eventually Consistent Read[cite: 8]", "C) Ephemeral Snapshot Read", "D) Speculative Read"], "answer": "A", "exp": "Strongly Consistent Reads guarantee returning the latest write state but consume 1 RCU per 4 KB (compared to 0.5 RCU for Eventually Consistent)[cite: 8]."}, {"id": 25, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "DynamoDB Streams", "type": "multi", "q": "Which TWO statements regarding DynamoDB Streams are accurate? (Select 2)", "options": ["A) Captures a time-ordered sequence of item-level modifications (insert, update, delete)[cite: 4, 8]", "B) Can trigger AWS Lambda functions to build decoupled, event-driven architectures[cite: 4, 8]", "C) Stores stream records indefinitely for 10 years by default", "D) Replaces the need for primary table partitioning"], "answer": ["A", "B"], "exp": "DynamoDB Streams capture item-level modifications in order (retained for 24 hours) and can trigger Lambda functions for event-driven workflows[cite: 4, 8]."}, {"id": 26, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Global Tables", "type": "single", "q": "How do DynamoDB Global Tables provide multi-region resiliency and low-latency global performance?", "options": ["A) Fully managed multi-region, multi-active replication across chosen AWS regions with automatic conflict resolution[cite: 4, 8]", "B) Synchronous locking of tables across regions before write confirmation", "C) Exporting manual CSV tables to S3 buckets once per week", "D) Direct routing of all global writes to a single master database in us-east-1"], "answer": "A", "exp": "Global Tables provide multi-region, multi-master replication, enabling fast local reads and writes worldwide with automatic conflict management[cite: 4, 8]."}, {"id": 27, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "ACID Transactions", "type": "single", "q": "What capability does DynamoDB Transactions provide to enterprise applications?", "options": ["A) All-or-nothing (ACID) coordinated operations across multiple items within or across tables[cite: 8]", "B) Continuous unencrypted data streaming to external webhooks", "C) Automatic conversion of DynamoDB tables into relational PostgreSQL schemas", "D) Bypassing table read/write capacity limits completely"], "answer": "A", "exp": "DynamoDB Transactions support atomic, consistent, isolated, and durable (ACID) read and write operations across multiple tables[cite: 8]."}, {"id": 28, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Point-in-Time Recovery (PITR)", "type": "single", "q": "How far back can a DynamoDB table be restored to any single second when Point-in-Time Recovery (PITR) is enabled?", "options": ["A) Up to the last 35 days[cite: 4, 8]", "B) Up to 24 hours only", "C) Up to 7 days", "D) Up to 10 years"], "answer": "A", "exp": "DynamoDB PITR provides continuous automated backups allowing restoration to any second within the previous 35 days[cite: 4, 8]."}, {"id": 29, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Time to Live (TTL)", "type": "single", "q": "What is the primary function of the Time to Live (TTL) feature in Amazon DynamoDB?", "options": ["A) Automatically deletes expired items from tables based on an epoch timestamp attribute at no extra cost[cite: 8]", "B) Measures the round-trip network ping between the client and AWS data center", "C) Terminates idle EC2 instances connected to DynamoDB", "D) Forces tables to switch to On-Demand capacity every midnight"], "answer": "A", "exp": "TTL defines an expiration timestamp attribute on items; DynamoDB automatically purges expired records without consuming provisioned throughput."}, {"id": 30, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario is the classic indicator to select Amazon DynamoDB on the SAA-C03 exam?", "options": ["A) Serverless key-value or document storage needing predictable single-digit millisecond latency at massive scale with zero server management[cite: 8]", "B) Complex analytical SQL joins across terabytes of historical financial records", "C) Hosting legacy relational applications requiring foreign keys and stored procedures", "D) Creating shared NFS file mounts for Linux EC2 fleets"], "answer": "A", "exp": "DynamoDB is the definitive exam choice for scalable, managed serverless NoSQL key-value/document applications requiring single-digit ms response times[cite: 8]."}, {"id": 31, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding Amazon ElastiCache?", "options": ["A) Fully managed in-memory data store and caching service[cite: 8]", "B) Delivers microsecond latency for real-time applications[cite: 8]", "C) Supports Redis and Memcached engines[cite: 8]", "D) A persistent block storage volume designed to attach directly to EC2 hypervisors[cite: 8]"], "answer": "D", "exp": "Amazon ElastiCache is an in-memory caching engine, not an EBS block storage volume[cite: 8]."}, {"id": 32, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Redis vs Memcached - Features", "type": "multi", "q": "Which TWO features are supported by ElastiCache for Redis but NOT supported by ElastiCache for Memcached? (Select 2)", "options": ["A) Data persistence and automated snapshot backups[cite: 4, 8]", "B) Multi-AZ deployments with automatic failover[cite: 4, 8]", "C) Multi-threaded memory architecture", "D) Ephemeral volatile caching without replication"], "answer": ["A", "B"], "exp": "Redis supports persistence, snapshot backups, Pub/Sub, and Multi-AZ automatic failover; Memcached is pure volatile in-memory caching[cite: 4, 8]."}, {"id": 33, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Memcached Architecture & Scaling", "type": "single", "q": "How does Amazon ElastiCache for Memcached scale out horizontally to handle larger datasets?", "options": ["A) By sharding data across multiple nodes in a cluster using client-side hashing algorithms[cite: 4, 8]", "B) By replicating data synchronously to 15 read replicas", "C) By streaming changes into AWS Snowcone devices", "D) By attaching EBS Provisioned IOPS volumes"], "answer": "A", "exp": "Memcached clusters scale horizontally by sharding data across independent nodes using client-side consistent hashing[cite: 4, 8]."}, {"id": 34, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Redis Replication & Multi-AZ", "type": "multi", "q": "Which TWO statements regarding Amazon ElastiCache for Redis Multi-AZ are accurate? (Select 2)", "options": ["A) Uses replication groups containing a primary node and multiple read replicas[cite: 8]", "B) Automatically promotes a read replica to primary in the event of primary node failure[cite: 4, 8]", "C) Shuts down all caching if an Availability Zone fails", "D) Requires manual DNS updates by administrators during failover"], "answer": ["A", "B"], "exp": "ElastiCache for Redis Multi-AZ automatically detects primary failures and promotes a read replica with minimal downtime[cite: 4, 8]."}, {"id": 35, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Security & Redis AUTH", "type": "single", "q": "Which security feature allows setting a token/password on an ElastiCache for Redis cluster to authenticate connecting clients?", "options": ["A) Redis AUTH[cite: 8]", "B) IAM Instance Profile", "C) Route 53 DNSSEC", "D) AWS Shield Advanced"], "answer": "A", "exp": "Redis AUTH allows requiring a password token when clients connect to an in-transit encrypted Redis cluster[cite: 8]."}, {"id": 36, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Slow Log", "type": "single", "q": "What is the primary function of the Redis Slow Log feature in Amazon ElastiCache?", "options": ["A) Records commands that exceed a specified execution time to help identify performance and latency bottlenecks[cite: 4]", "B) Automatically terminates slow EC2 client instances", "C) Logs user login passwords to public S3 buckets", "D) Measures network packet loss across Direct Connect"], "answer": "A", "exp": "The Slow Log records commands that took longer than a specified time threshold to run, enabling query optimization[cite: 4]."}, {"id": 37, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario is the standard indicator to choose Amazon ElastiCache on the exam?", "options": ["A) Offloading read traffic and reducing database query load by caching frequently accessed data in memory with sub-millisecond response times[cite: 8]", "B) Archiving compliance data for 10-year retention", "C) Running complex batch MapReduce jobs on unstructured text", "D) Hosting static web frontends"], "answer": "A", "exp": "ElastiCache is tested as the managed in-memory cache to place in front of RDS/DynamoDB to alleviate read pressure and speed up responses[cite: 8]."}, {"id": 38, "section": "6. DATABASE", "topic": "Amazon Keyspaces", "subtopic": "What It Is & Cassandra Compatibility", "type": "single", "q": "Which of the following is NOT true regarding Amazon Keyspaces (for Apache Cassandra)?", "options": ["A) Fully managed, serverless Apache Cassandra\u2013compatible database service[cite: 8]", "B) Compatible with existing Cassandra Query Language (CQL) and drivers[cite: 8]", "C) Automatically replicates data across multiple Availability Zones for high availability[cite: 1, 8]", "D) Requires users to manually SSH into cluster nodes to execute nodetool repair operations[cite: 8]"], "answer": "D", "exp": "Amazon Keyspaces is completely serverless; there are no nodes, clusters, or operating systems to repair, patch, or manage[cite: 1, 8]."}, {"id": 39, "section": "6. DATABASE", "topic": "Amazon Keyspaces", "subtopic": "Capacity Modes", "type": "multi", "q": "Which TWO capacity modes are supported by Amazon Keyspaces? (Select 2)", "options": ["A) On-Demand capacity mode (automatically scales with application traffic)[cite: 8]", "B) Provisioned capacity mode (manually define read and write throughput)[cite: 8]", "C) Ephemeral Spot Auction mode", "D) Dedicated Hardware Blade mode"], "answer": ["A", "B"], "exp": "Keyspaces provides On-Demand capacity for unpredictable workloads and Provisioned capacity for predictable throughput and cost control[cite: 8]."}, {"id": 40, "section": "6. DATABASE", "topic": "Amazon Keyspaces", "subtopic": "High Availability & Durability", "type": "single", "q": "How does Amazon Keyspaces ensure data durability against the failure of an entire Availability Zone?", "options": ["A) Automatically and synchronously replicates all written data across three Availability Zones within the region[cite: 1, 8]", "B) Takes nightly snapshots to physical tape libraries", "C) Backs up data to local EC2 instance store disks", "D) Prompts the user to manually copy keys across zones"], "answer": "A", "exp": "Amazon Keyspaces writes data durably across three Availability Zones before acknowledging writes[cite: 1, 8]."}, {"id": 41, "section": "6. DATABASE", "topic": "Amazon Keyspaces", "subtopic": "Security & Connectivity", "type": "multi", "q": "Which TWO security features apply to Amazon Keyspaces? (Select 2)", "options": ["A) Encryption at rest using AWS KMS keys and TLS encryption in transit[cite: 8]", "B) Private network access via Interface VPC Endpoints (AWS PrivateLink)[cite: 1, 8]", "C) Mandatory public internet exposure for all CQL traffic", "D) Cleartext password authentication without TLS"], "answer": ["A", "B"], "exp": "Keyspaces enforces KMS encryption at rest, TLS in transit, and allows secure private connectivity via AWS PrivateLink VPC endpoints[cite: 1, 8]."}, {"id": 42, "section": "6. DATABASE", "topic": "Amazon Keyspaces", "subtopic": "Point-in-Time Recovery (PITR)", "type": "single", "q": "What data protection feature in Amazon Keyspaces allows continuous backup and restoration of table data to any second within the past 35 days?", "options": ["A) Point-in-Time Recovery (PITR)[cite: 8]", "B) S3 Versioning", "C) CloudEndure Continuous Replication", "D) Glacier Vault Lock"], "answer": "A", "exp": "Amazon Keyspaces supports PITR, protecting tables against accidental deletion or corruption by restoring data to any second in the last 35 days[cite: 8]."}, {"id": 43, "section": "6. DATABASE", "topic": "Amazon Keyspaces", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary exam scenario pointing to Amazon Keyspaces?", "options": ["A) Migrating or running Apache Cassandra workloads on AWS using CQL without managing server infrastructure[cite: 8]", "B) Managing relational PostgreSQL schemas with foreign keys", "C) Storing unformatted raw video footage for mobile streaming", "D) Running Spark big data jobs on EC2 clusters"], "answer": "A", "exp": "Amazon Keyspaces is tested as the serverless, managed AWS database for Apache Cassandra CQL workloads[cite: 8]."}, {"id": 44, "section": "6. DATABASE", "topic": "Amazon Neptune", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding Amazon Neptune?", "options": ["A) Purpose-built, fully managed graph database engine[cite: 8]", "B) Optimized for complex, highly interconnected datasets[cite: 8]", "C) Ideal for relational OLAP data warehousing across petabytes of tabular records[cite: 8]", "D) Supports ACID transactions for data integrity[cite: 8]"], "answer": "C", "exp": "Amazon Neptune is a graph database service, not an OLAP data warehouse (which describes Redshift)[cite: 8]."}, {"id": 45, "section": "6. DATABASE", "topic": "Amazon Neptune", "subtopic": "Supported Graph Models & Query Languages", "type": "multi", "q": "Which TWO graph models and query languages are natively supported by Amazon Neptune? (Select 2)", "options": ["A) Property Graph model using Apache TinkerPop Gremlin[cite: 8]", "B) W3C Resource Description Framework (RDF) model using SPARQL[cite: 8]", "C) ANSI SQL-92 tabular joins exclusively", "D) LDAP Directory Schema queries"], "answer": ["A", "B"], "exp": "Neptune supports both the Property Graph model (queried via Gremlin or openCypher) and RDF model (queried via SPARQL)[cite: 8]."}, {"id": 46, "section": "6. DATABASE", "topic": "Amazon Neptune", "subtopic": "Architecture & Durability", "type": "single", "q": "How does Amazon Neptune ensure high availability and data durability at the storage tier?", "options": ["A) Replicates six copies of data across three Availability Zones with automated failover[cite: 1, 8]", "B) Stores data in a single Availability Zone on ephemeral instance store volumes", "C) Backs up data to local on-premises tape libraries once a day", "D) Synchronizes data over public unencrypted internet connections"], "answer": "A", "exp": "Neptune uses a shared distributed storage layer that replicates data six ways across three AZs, supporting up to 15 read replicas[cite: 1, 8]."}, {"id": 47, "section": "6. DATABASE", "topic": "Amazon Neptune", "subtopic": "Use Cases", "type": "multi", "q": "Which TWO applications represent ideal use cases for Amazon Neptune? (Select 2)", "options": ["A) Social networking graphs and recommendation engines[cite: 8]", "B) Fraud detection networks and knowledge graphs[cite: 8]", "C) Simple static HTML website file hosting", "D) Running nightly payroll batch jobs on flat CSV files"], "answer": ["A", "B"], "exp": "Neptune is designed for highly interconnected relationship queries, such as social graphs, fraud detection, and knowledge graphs[cite: 8]."}, {"id": 48, "section": "6. DATABASE", "topic": "Amazon Neptune", "subtopic": "Data Loading", "type": "single", "q": "Which feature is recommended to fast-load massive graph datasets (CSV or RDF) into Amazon Neptune from Amazon S3?", "options": ["A) Neptune Bulk Loader[cite: 1, 8]", "B) SQL INSERT statements sequentially", "C) AWS Storage Gateway Volume Mode", "D) AWS DataSync over VPN"], "answer": "A", "exp": "The Neptune Bulk Loader loads large datasets directly from S3 into Neptune with high parallelism and performance[cite: 1, 8]."}, {"id": 49, "section": "6. DATABASE", "topic": "Amazon Neptune", "subtopic": "Exam Tips", "type": "single", "q": "What is the key takeaway for Amazon Neptune on the SAA exam?", "options": ["A) Choose Neptune when relationships between data elements are first-class citizens (social graphs, fraud rings, linked data)[cite: 8]", "B) Choose Neptune for relational online shopping carts requiring complex foreign keys", "C) Choose Neptune for simple key-value lookups with microsecond latency", "D) Choose Neptune for storing petabyte-scale data warehouse star schemas"], "answer": "A", "exp": "Neptune is tested whenever an architecture must navigate complex graph relationships, knowledge bases, or fraud networks[cite: 8]."}, {"id": 50, "section": "6. DATABASE", "topic": "Amazon QLDB", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT an accurate statement regarding Amazon Quantum Ledger Database (QLDB)?", "options": ["A) Fully managed ledger database providing a transparent, immutable, and cryptographically verifiable transaction log[cite: 8]", "B) Maintains an append-only journal where records cannot be modified or deleted[cite: 1, 8]", "C) A decentralized peer-to-peer blockchain network requiring Byzantine fault tolerance consensus nodes[cite: 8]", "D) Serverless architecture with automatic scaling and high availability across multiple AZs[cite: 1, 8]"], "answer": "C", "exp": "Amazon QLDB is a centralized ledger database; it is NOT a blockchain and does not require distributed consensus nodes or peer networks[cite: 8]."}, {"id": 51, "section": "6. DATABASE", "topic": "Amazon QLDB", "subtopic": "Ledger Structure & Journal", "type": "multi", "q": "Which TWO components make up the internal data structure of Amazon QLDB? (Select 2)", "options": ["A) An append-only Journal that sequences and cryptographically hashes every change[cite: 1, 8]", "B) Tables that store the current indexed state and revision history of documents[cite: 1, 8]", "C) Ephemeral instance storage caches that reset daily", "D) On-premises tape drive interfaces"], "answer": ["A", "B"], "exp": "QLDB consists of an immutable, append-only Journal and indexed document tables representing current state and history[cite: 1, 8]."}, {"id": 52, "section": "6. DATABASE", "topic": "Amazon QLDB", "subtopic": "Cryptographic Verification", "type": "single", "q": "How does Amazon QLDB prove data integrity and verify that records have not been altered or tampered with?", "options": ["A) Using cryptographic hash chaining (SHA-256) and verifiable cryptographic digests[cite: 1, 8]", "B) Storing data in public unencrypted S3 buckets", "C) Requesting manual paper notarization from AWS Support", "D) Disabling ACID transactions"], "answer": "A", "exp": "QLDB uses SHA-256 hash chaining to produce an immutable journal; clients can generate and compare digests to prove data integrity[cite: 1, 8]."}, {"id": 53, "section": "6. DATABASE", "topic": "Amazon QLDB", "subtopic": "PartiQL Query Language", "type": "single", "q": "Which SQL-compatible query language is supported by Amazon QLDB to query both current and historical document revisions?", "options": ["A) PartiQL[cite: 1, 8]", "B) GraphQL[cite: 8]", "C) Gremlin[cite: 8]", "D) PromQL[cite: 8]"], "answer": "A", "exp": "Amazon QLDB supports PartiQL, an open-standard SQL-compatible query language that supports querying nested document structures[cite: 1, 8]."}, {"id": 54, "section": "6. DATABASE", "topic": "Amazon QLDB", "subtopic": "Advantages over Blockchain", "type": "multi", "q": "Which TWO advantages does Amazon QLDB offer over self-managed blockchain networks? (Select 2)", "options": ["A) Centralized management with no need for multi-party consensus algorithms or mining[cite: 8]", "B) Higher transaction performance and scalability compared to distributed blockchains[cite: 8]", "C) Completely eliminates the need for data backups", "D) Allows users to selectively rewrite past ledger history"], "answer": ["A", "B"], "exp": "QLDB provides cryptographic immutability without the complexity, overhead, and latency of distributed consensus mechanisms[cite: 8]."}, {"id": 55, "section": "6. DATABASE", "topic": "Amazon QLDB", "subtopic": "Exam Tips", "type": "single", "q": "When is Amazon QLDB the definitive choice on the AWS exam?", "options": ["A) When an authoritative central authority requires an immutable, cryptographically verifiable audit log of all historical data changes[cite: 8]", "B) When multiple distrusting organizations require a decentralized consensus protocol", "C) When building high-performance in-memory caching clusters", "D) When hosting static images for mobile applications"], "answer": "A", "exp": "QLDB is the exam answer when an application needs an immutable system of record with cryptographic verification under a single owner[cite: 1, 8]."}, {"id": 56, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "What It Is & Managed Responsibilities", "type": "single", "q": "Which administrative responsibility is handled automatically by AWS when using Amazon RDS?", "options": ["A) Operating system installation, security patching, hardware provisioning, and automated backups[cite: 8]", "B) Writing application SQL queries and schema indexing", "C) Managing user passwords inside client application code", "D) Purchasing physical server chassis"], "answer": "A", "exp": "Amazon RDS automates infrastructure tasks such as OS installation, engine patching, hardware maintenance, and backups[cite: 8]."}, {"id": 57, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Supported Database Engines", "type": "multi", "q": "Which TWO database engines are supported natively on Amazon RDS? (Select 2)", "options": ["A) PostgreSQL[cite: 8]", "B) Microsoft SQL Server[cite: 8]", "C) Apache Cassandra", "D) Apache CouchDB"], "answer": ["A", "B"], "exp": "Amazon RDS supports Aurora, PostgreSQL, MySQL, MariaDB, Oracle, and Microsoft SQL Server[cite: 8]."}, {"id": 58, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Multi-AZ Deployments", "type": "single", "q": "How does Amazon RDS Multi-AZ provide high availability and automatic disaster failover?", "options": ["A) Provisions a synchronous standby replica in a different Availability Zone that takes over automatically if the primary fails[cite: 4, 8]", "B) Replicates data asynchronously to an on-premises datacenter over public internet", "C) Directs all read traffic to the standby instance to increase throughput", "D) Shuts down the primary instance every 2 hours to take backups"], "answer": "A", "exp": "RDS Multi-AZ maintains a synchronous standby in another AZ, executing automated failover without manual intervention during disruptions[cite: 4, 8]."}, {"id": 59, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Read Replicas - Function & Scaling", "type": "multi", "q": "Which TWO statements regarding Amazon RDS Read Replicas are true? (Select 2)", "options": ["A) Offload read-heavy traffic from the primary DB instance using asynchronous replication[cite: 4, 8]", "B) Can be promoted to become a standalone read/write database instance[cite: 4, 8]", "C) Provide synchronous replication for zero data loss writes", "D) Can only be deployed in the exact same Availability Zone as the primary"], "answer": ["A", "B"], "exp": "Read Replicas use asynchronous replication to scale read throughput and can be promoted to standalone instances during disaster recovery[cite: 4, 8]."}, {"id": 60, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Storage Types - GP3 vs io2", "type": "single", "q": "Which Amazon RDS storage volume type is recommended for critical, I/O-intensive transactional database workloads requiring consistent, low latency and high IOPS?", "options": ["A) Provisioned IOPS SSD (io1/io2)[cite: 8]", "B) General Purpose SSD (gp3)[cite: 8]", "C) Magnetic (Standard)[cite: 8]", "D) Cold HDD (sc1)[cite: 8]"], "answer": "A", "exp": "Provisioned IOPS SSD storage provides dedicated, consistent I/O performance for mission-critical transactional database systems[cite: 8]."}, {"id": 61, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Backups - Automated vs Snapshots", "type": "multi", "q": "Which TWO statements describe the backup mechanisms of Amazon RDS? (Select 2)", "options": ["A) Automated Backups are enabled by default and retain transaction logs for Point-in-Time Recovery up to 35 days[cite: 8]", "B) Manual DB Snapshots are user-initiated and remain stored in S3 until explicitly deleted[cite: 8]", "C) Automated backups are deleted immediately when a query fails", "D) Manual DB snapshots cannot be copied across AWS Regions"], "answer": ["A", "B"], "exp": "Automated backups support PITR up to 35 days; manual snapshots are retained indefinitely until deleted and can be copied across regions[cite: 8]."}, {"id": 62, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "RDS Enhanced Monitoring vs CloudWatch", "type": "single", "q": "What unique visibility does RDS Enhanced Monitoring provide compared to standard Amazon CloudWatch metrics?", "options": ["A) Real-time operating system metrics (CPU, memory, process list) captured directly on the hypervisor with granularity down to 1 second[cite: 4, 8]", "B) High-level database connection count only", "C) S3 bucket storage usage forecasts", "D) Billing currency conversion rates"], "answer": "A", "exp": "Enhanced Monitoring captures OS-level processes and metrics down to 1-second intervals via an agent on the VM[cite: 4, 8]."}, {"id": 63, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Performance Insights", "type": "single", "q": "What is the primary role of Amazon RDS Performance Insights?", "options": ["A) Visualizes database load broken down by SQL waits, queries, hosts, and users to detect slow queries[cite: 4, 8]", "B) Automatically updates database table schemas", "C) Rotates IAM passwords across member accounts", "D) Provisions physical switches in private subnets"], "answer": "A", "exp": "Performance Insights provides a dashboard that charts database load against Average Active Sessions (AAS) to pinpoint slow SQL queries[cite: 4, 8]."}, {"id": 64, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "RDS Proxy", "type": "multi", "q": "Which TWO operational benefits are provided by Amazon RDS Proxy? (Select 2)", "options": ["A) Pools and shares database connections to prevent connection exhaustion from serverless applications like AWS Lambda[cite: 4]", "B) Reduces failover times for Multi-AZ databases by up to 66% while preserving client connections[cite: 4]", "C) Automatically rewrites unoptimized SQL queries", "D) Provides offline tape backup archiving"], "answer": ["A", "B"], "exp": "RDS Proxy manages connection pooling for spiky/serverless traffic and speeds up Multi-AZ failover by preserving active connections[cite: 4]."}, {"id": 65, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Security & Encryption", "type": "single", "q": "How can an administrator encrypt an existing unencrypted Amazon RDS DB instance?", "options": ["A) Create a snapshot of the unencrypted instance, copy the snapshot with KMS encryption enabled, and restore a new instance from the encrypted snapshot[cite: 8]", "B) Toggle the 'Encrypt' checkbox in the RDS console while the instance is running live", "C) Enable CloudWatch Logs on the instance", "D) Attach an unencrypted Elastic IP"], "answer": "A", "exp": "You cannot directly encrypt an unencrypted RDS instance in place; you must snapshot it, copy the snapshot with encryption, and restore[cite: 8]."}, {"id": 66, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Exam Tips", "type": "single", "q": "On the exam, what is the core difference between RDS Multi-AZ and RDS Read Replicas?", "options": ["A) Multi-AZ provides synchronous replication and automated failover for high availability; Read Replicas provide asynchronous replication for read scalability[cite: 4, 8]", "B) Multi-AZ is for read scaling; Read Replicas are for write failover", "C) Multi-AZ cannot span Availability Zones; Read Replicas can only be in one AZ", "D) Read Replicas cannot be promoted to standalone instances"], "answer": "A", "exp": "Multi-AZ is for HA and disaster recovery (synchronous, standby); Read Replicas are for performance and read scaling (asynchronous)[cite: 4, 8]."}, {"id": 67, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "What It Is & Architecture", "type": "single", "q": "Which of the following is NOT true regarding Amazon Redshift?", "options": ["A) Petabyte-scale, fully managed cloud data warehouse service[cite: 8]", "B) Utilizes columnar storage and Massively Parallel Processing (MPP)[cite: 8]", "C) Uses a leader node to distribute queries to parallel compute nodes[cite: 8]", "D) Designed specifically as an in-memory key-value cache replacing Redis[cite: 8]"], "answer": "D", "exp": "Amazon Redshift is an analytical data warehouse, not an in-memory key-value cache[cite: 8]."}, {"id": 68, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Redshift Serverless", "type": "single", "q": "How does Amazon Redshift Serverless measure and bill for data warehouse processing capacity?", "options": ["A) Redshift Processing Units (RPUs) consumed per second[cite: 4, 8]", "B) Number of physical CPU sockets leased monthly", "C) Total number of tables defined in the schema", "D) Hourly rate per connected client device"], "answer": "A", "exp": "Redshift Serverless scales capacity automatically and bills in RPU-hours with per-second billing based on actual query execution[cite: 4, 8]."}, {"id": 69, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Redshift Spectrum", "type": "multi", "q": "Which TWO statements regarding Amazon Redshift Spectrum are accurate? (Select 2)", "options": ["A) Enables querying exabytes of data directly in Amazon S3 using standard Redshift SQL[cite: 8]", "B) Uses the AWS Glue Data Catalog for external table schema definitions[cite: 8]", "C) Requires loading all external S3 data into Redshift local storage before running queries", "D) Only supports uncompressed text files"], "answer": ["A", "B"], "exp": "Redshift Spectrum queries open-format data in S3 using the Glue Data Catalog without loading files into cluster storage[cite: 8]."}, {"id": 70, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Data Distribution Styles", "type": "single", "q": "Which Redshift distribution style copies the entire table to every compute node, which is recommended for small, infrequently updated dimension tables?", "options": ["A) ALL[cite: 8]", "B) EVEN[cite: 8]", "C) KEY[cite: 8]", "D) AUTO[cite: 8]"], "answer": "A", "exp": "DISTSTYLE ALL replicates the full table across all compute nodes, eliminating network broadcast costs for joins on dimension tables[cite: 8]."}, {"id": 71, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Sort Keys", "type": "single", "q": "What is the primary role of a Sort Key on an Amazon Redshift table?", "options": ["A) Orders data on disk to allow the query engine to skip entire 1MB blocks based on min/max zone maps[cite: 8]", "B) Enforces unique primary key constraints across columns", "C) Encrypts table data with AES-256 keys", "D) Automatically creates secondary indexes"], "answer": "A", "exp": "Sort keys store data in sorted order, enabling Redshift to skip large disk blocks based on zone maps during range-restricted queries[cite: 8]."}, {"id": 72, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Concurrency Scaling", "type": "single", "q": "How does Amazon Redshift Concurrency Scaling handle sudden spikes in concurrent analytical reporting queries?", "options": ["A) Automatically provisions transient background cluster capacity to process concurrent read queries without contention[cite: 8]", "B) Drops queries that exceed a 5-minute queue wait threshold", "C) Restricts report access to a single user", "D) Shuts down compute nodes to conserve power"], "answer": "A", "exp": "Concurrency Scaling adds transient cluster capacity transparently in seconds to support virtually unlimited concurrent users[cite: 8]."}, {"id": 73, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "RA3 Managed Storage", "type": "multi", "q": "Which TWO benefits are provided by Amazon Redshift RA3 nodes? (Select 2)", "options": ["A) Independent scaling of compute resources and Redshift Managed Storage (RMS)[cite: 8]", "B) Local high-speed SSD caching paired with durable S3 storage[cite: 8]", "C) Disallowing automated snapshots to Amazon S3", "D) Mandatory deployment of single-node clusters"], "answer": ["A", "B"], "exp": "RA3 instances separate compute from storage, using local SSDs for hot data caching and S3-backed managed storage for massive scale[cite: 8]."}, {"id": 74, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Security & Network Isolation", "type": "single", "q": "Which network feature ensures that COPY and UNLOAD traffic between Amazon Redshift and Amazon S3 never traverses the public internet?", "options": ["A) Amazon Redshift Enhanced VPC Routing[cite: 4]", "B) Internet Gateway routing", "C) Public IP addressing on compute nodes", "D) AWS Direct Connect CloudHub"], "answer": "A", "exp": "Enhanced VPC Routing forces all COPY and UNLOAD traffic between Redshift and other AWS services to route through your VPC[cite: 4]."}, {"id": 75, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Exam Tips", "type": "single", "q": "What is the fastest and most efficient way to load large volumes of data into an Amazon Redshift cluster on the exam?", "options": ["A) Splitting data into multiple compressed files and running a parallel COPY command from Amazon S3[cite: 8]", "B) Running a single massive SQL INSERT statement with 1,000,000 values", "C) Manually copying files into the leader node over SFTP", "D) Uploading files via the AWS Management Console"], "answer": "A", "exp": "The COPY command is the exam-standard best practice for loading data into Redshift in parallel across cluster slices[cite: 8]."}, {"id": 76, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Auto-Scaling Replicas", "type": "single", "q": "How can an Amazon Aurora cluster automatically adjust to fluctuating read traffic throughout the day?", "options": ["A) Configure Aurora Auto Scaling to dynamically add and remove Aurora Replicas based on CPU or connection metrics[cite: 8]", "B) Manually reboot the primary database instance every morning", "C) Use CloudFront to cache write transactions", "D) Migrate tables to an RDS SQL Server instance"], "answer": "A", "exp": "Aurora Auto Scaling dynamically adjusts the number of Aurora Replicas in response to CloudWatch metrics like average CPU utilization or connection count[cite: 8]."}, {"id": 77, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Multi-Master Clusters", "type": "single", "q": "What is the primary architectural purpose of an Amazon Aurora Multi-Master cluster?", "options": ["A) Allows write operations to occur across multiple database instances in different Availability Zones for continuous write availability[cite: 4]", "B) Enables multi-region master writing across three continents", "C) Increases read throughput only", "D) Disables ACID transaction guarantees"], "answer": "A", "exp": "Aurora Multi-Master provides continuous write availability across multiple AZs within a single region[cite: 4]."}, {"id": 78, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Adaptive Capacity", "type": "single", "q": "What problem does DynamoDB Adaptive Capacity automatically solve?", "options": ["A) Smooths out uneven access patterns across partitions by dynamically reallocating throughput to hot partitions[cite: 8]", "B) Converts document tables into columnar star schemas", "C) Generates IAM access policies automatically", "D) Compresses old database backups"], "answer": "A", "exp": "Adaptive Capacity accommodates imbalanced workloads by automatically increasing throughput for heavily accessed partitions[cite: 8]."}, {"id": 79, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "IAM Database Authentication", "type": "single", "q": "How does IAM Database Authentication work on supported Amazon RDS engines (MySQL/PostgreSQL)?", "options": ["A) Uses temporary authentication tokens generated by AWS STS instead of static database passwords[cite: 8]", "B) Disables network firewalls to simplify logins", "C) Requires root credentials to be hardcoded in client applications", "D) Stores user passwords in public DNS records"], "answer": "A", "exp": "IAM DB Authentication uses short-lived tokens generated via STS, eliminating the need to manage static passwords in database tables[cite: 8]."}, {"id": 80, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Storage Auto Scaling", "type": "single", "q": "What is the benefit of RDS Storage Auto Scaling?", "options": ["A) Automatically increases allocated storage capacity when free space drops below threshold, with zero downtime[cite: 8]", "B) Shrinks database volumes to zero every weekend", "C) Converts EBS volumes into S3 Glacier archives automatically", "D) Downgrades instance types during high I/O spikes"], "answer": "A", "exp": "Storage Auto Scaling prevents storage-full outages by automatically scaling up storage without downtime or application disruption[cite: 8]."}, {"id": 81, "section": "6. DATABASE", "topic": "Amazon ElastiCache", "subtopic": "Cluster Mode Enabled (Redis)", "type": "single", "q": "What architectural capability is unlocked when enabling Cluster Mode in Amazon ElastiCache for Redis?", "options": ["A) Horizontal partitioning (sharding) of data across multiple shards, allowing memory and write throughput to scale beyond a single node[cite: 8]", "B) Replacing Redis with Apache Cassandra", "C) Disabling all replication groups", "D) Restricting cluster access to single-AZ subnets"], "answer": "A", "exp": "Redis Cluster Mode Enabled allows sharding across up to 500 nodes/shards, scaling memory capacity and write throughput horizontally[cite: 8]."}, {"id": 82, "section": "6. DATABASE", "topic": "Amazon DocumentDB", "subtopic": "Audit Logging", "type": "single", "q": "Where are Amazon DocumentDB database audit logs (such as authentication events and DDL statements) published for security monitoring?", "options": ["A) Amazon CloudWatch Logs[cite: 8]", "B) Amazon Route 53 Resolver", "C) AWS Artifact", "D) AWS Systems Manager Parameter Store"], "answer": "A", "exp": "DocumentDB publishes audit logs directly to CloudWatch Logs for long-term storage, alerting, and analysis[cite: 8]."}, {"id": 83, "section": "6. DATABASE", "topic": "Amazon MemoryDB for Redis", "subtopic": "What It Is & Durability", "type": "single", "q": "How does Amazon MemoryDB for Redis differ from Amazon ElastiCache for Redis in terms of primary storage?", "options": ["A) MemoryDB uses a distributed Multi-AZ transactional log to make in-memory Redis durable as a primary database[cite: 4]", "B) MemoryDB is strictly a volatile cache that loses all data upon node reboot", "C) MemoryDB cannot execute Redis commands", "D) MemoryDB is an on-premises physical appliance"], "answer": "A", "exp": "MemoryDB is a Redis-compatible, durable primary database that persists writes to a Multi-AZ transaction log before confirming them[cite: 4]."}, {"id": 84, "section": "6. DATABASE", "topic": "Amazon Redshift", "subtopic": "Cross-Region Snapshots", "type": "single", "q": "What disaster recovery capability does Amazon Redshift Cross-Region Snapshot Copy provide?", "options": ["A) Automatically replicates cluster snapshots to a secondary AWS Region so data can be restored if the primary region experiences an outage[cite: 4]", "B) Allows real-time synchronous multi-master database replication", "C) Automatically purchases physical backup servers in another continent", "D) Disables CloudWatch alarms across regions"], "answer": "A", "exp": "Cross-region snapshot copy automatically copies automated or manual snapshots to another region for disaster recovery[cite: 4]."}, {"id": 85, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Fine-Grained Access Control", "type": "single", "q": "Which IAM policy condition key allows an application to restrict a user's DynamoDB access strictly to items whose partition key matches their own User ID?", "options": ["A) dynamodb:LeadingKeys[cite: 8]", "B) s3:ExistingObjectTag", "C) ec2:PlacementGroup", "D) aws:MultiFactorAuthPresent"], "answer": "A", "exp": "The `dynamodb:LeadingKeys` condition key enables row-level security by restricting access to items matching the user's partition key[cite: 8]."}, {"id": 86, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Cross-Region Read Replicas", "type": "multi", "q": "Which TWO benefits are achieved by configuring cross-region read replicas for Amazon RDS? (Select 2)", "options": ["A) Improves read performance by serving users in different regions closer to their geographic location[cite: 4]", "B) Forms part of a robust disaster recovery plan by allowing promotion to primary in case of a regional outage[cite: 4]", "C) Eliminates all inter-region data transfer costs", "D) Provides synchronous write guarantees across regions"], "answer": ["A", "B"], "exp": "Cross-region read replicas reduce latency for global readers and serve as a failover target for regional disaster recovery[cite: 4]."}, {"id": 87, "section": "6. DATABASE", "topic": "Amazon Aurora", "subtopic": "Custom Endpoints", "type": "single", "q": "What is the purpose of an Amazon Aurora Custom Endpoint?", "options": ["A) Allows routing specific client workloads (e.g., reporting vs. analytics) to a designated subset of Aurora Replicas in the cluster[cite: 8]", "B) Disables all security group rules on database ports", "C) Connects the database to on-premises mainframes over unencrypted HTTP", "D) Bypasses the cluster storage volume"], "answer": "A", "exp": "Custom endpoints group specific DB instances together, allowing different workloads (e.g., intensive reporting) to be isolated from standard reader traffic[cite: 8]."}, {"id": 88, "section": "6. DATABASE", "topic": "Amazon RDS", "subtopic": "Option Groups vs Parameter Groups", "type": "single", "q": "What is the distinction between RDS Parameter Groups and RDS Option Groups?", "options": ["A) Parameter groups manage database engine configuration parameters; Option groups enable optional engine features (e.g., Oracle OEM, SQL Server Native Backup)[cite: 8]", "B) Parameter groups manage networking; Option groups manage billing", "C) Parameter groups are only for Aurora; Option groups are only for DynamoDB", "D) There is no distinction between them"], "answer": "A", "exp": "Parameter groups control engine configuration settings (e.g., memory limits, timeouts); Option groups enable additional database features and extensions[cite: 8]."}, {"id": 89, "section": "6. DATABASE", "topic": "Amazon DynamoDB", "subtopic": "Global Secondary Index Throttling", "type": "single", "q": "What happens to write operations on a DynamoDB base table if an attached Global Secondary Index (GSI) has insufficient provisioned write capacity?", "options": ["A) The write operations on the base table will be throttled to prevent the GSI from falling behind[cite: 8]", "B) The base table drops the GSI automatically", "C) The writes succeed on the table and are discarded silently on the GSI", "D) The base table converts to an RDS instance"], "answer": "A", "exp": "In DynamoDB, writes on the main table are throttled if an associated GSI lacks sufficient write capacity, highlighting the importance of matching GSI throughput[cite: 8]."}], "quiz7": [{"id": 1, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT an accurate statement regarding AWS X-Ray?", "options": ["A) A distributed tracing service that helps developers analyse and debug production microservices applications[cite: 8]", "B) Collects data about requests as they travel across distributed application components[cite: 8]", "C) A continuous hardware replacement service for physical data center switches[cite: 8]", "D) Provides insights into application performance and identifies latency bottlenecks[cite: 8]"], "answer": "C", "exp": "AWS X-Ray is an application performance tracing and debugging service, not a physical hardware replacement service[cite: 8]."}, {"id": 2, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Key Features & Service Maps", "type": "multi", "q": "Which TWO capabilities are core features of AWS X-Ray? (Select 2)", "options": ["A) Generates visual service maps showing connections, error rates, and latencies between components[cite: 8]", "B) Provides end-to-end request tracing across microservices and serverless functions[cite: 8]", "C) Provisions physical SAN storage arrays automatically", "D) Manages DNS root zone registrations globally"], "answer": ["A", "B"], "exp": "AWS X-Ray generates visual service maps to display component interactions and performs end-to-end request tracing across microservices[cite: 8]."}, {"id": 3, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Core Concepts - Segments vs Subsegments", "type": "single", "q": "In AWS X-Ray, what is the architectural difference between a Segment and a Subsegment?", "options": ["A) A segment tracks compute resources processing a request; subsegments provide granular breakdowns of downstream calls, database queries, or custom annotations[cite: 8]", "B) A segment is an EBS volume; a subsegment is an S3 bucket", "C) Segments are only used for Windows instances; subsegments are only used for Linux instances", "D) A segment is an IAM user role; a subsegment is an SCP"], "answer": "A", "exp": "A segment contains data recorded by the compute resource hosting the service, while subsegments provide granular timing for downstream calls, SQL executions, or HTTP requests[cite: 8]."}, {"id": 4, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Core Concepts - Traces & Paths", "type": "single", "q": "What does a Trace represent in AWS X-Ray?", "options": ["A) The complete end-to-end path of a single client request traveling through all microservices and components[cite: 8]", "B) An audit log of user password resets stored in IAM", "C) A network ping route across public transit providers", "D) An automated weekly billing summary file"], "answer": "A", "exp": "A trace tracks the complete journey of an individual request through an application, aggregating segments and subsegments into an end-to-end timeline[cite: 8]."}, {"id": 5, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Sampling Rules", "type": "multi", "q": "Which TWO statements regarding AWS X-Ray Sampling are accurate? (Select 2)", "options": ["A) Reduces overhead and tracing costs by recording only a configurable percentage of requests[cite: 8]", "B) Uses a default sampling rule of 1 request per second plus 5% of additional requests[cite: 8]", "C) Drops all failed or timed-out traces permanently", "D) Prevents developers from defining custom sampling targets per endpoint"], "answer": ["A", "B"], "exp": "Sampling controls costs and system overhead by capturing a subset of requests, defaulting to 1 request/second and 5% thereafter[cite: 8]."}, {"id": 6, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Annotations vs Metadata", "type": "single", "q": "What is the critical functional difference between Annotations and Metadata in AWS X-Ray?", "options": ["A) Annotations are indexed key-value pairs used for searching and filtering traces; Metadata is non-indexed data stored for detailed inspection[cite: 8]", "B) Annotations can only store binary files; Metadata stores cleartext numbers", "C) Annotations cost $10 per trace; Metadata is completely free", "D) Annotations are managed by Route 53; Metadata is managed by S3"], "answer": "A", "exp": "Annotations are indexed and queryable via filter expressions in the X-Ray console, whereas metadata values are not indexed and cannot be searched[cite: 8]."}, {"id": 7, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Integrations - AWS Services", "type": "multi", "q": "Which TWO AWS services feature native integrations to pass or generate X-Ray trace headers without manual SDK overhead? (Select 2)", "options": ["A) AWS Lambda[cite: 8]", "B) Amazon API Gateway[cite: 8]", "C) Amazon Glacier Vault Lock", "D) AWS Snowcone"], "answer": ["A", "B"], "exp": "AWS Lambda supports active tracing with a toggle, and API Gateway automatically generates and propagates X-Ray trace headers to downstreams[cite: 8]."}, {"id": 8, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Storage & Retention", "type": "single", "q": "How long does AWS X-Ray automatically retain recorded trace data for analysis before expiring it?", "options": ["A) 30 days[cite: 8]", "B) 24 hours", "C) 7 days", "D) 10 years"], "answer": "A", "exp": "Trace data is stored and retained by AWS X-Ray for 30 days at no extra storage management cost[cite: 8]."}, {"id": 9, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "X-Ray Insights", "type": "single", "q": "What capability does AWS X-Ray Insights provide to site reliability engineering teams?", "options": ["A) Uses statistical modeling to automatically detect anomalies, identify faulting services, and isolate root causes in distributed applications[cite: 8]", "B) Recompiles client-side JavaScript for performance", "C) Backs up RDS databases to external USB drives", "D) Converts SQL queries into DynamoDB API formats"], "answer": "A", "exp": "X-Ray Insights analyzes trace metrics and error rates to proactively identify anomalies and highlight root-cause bottlenecks across microservices[cite: 8]."}, {"id": 10, "section": "7. DEVELOPER TOOLS", "topic": "AWS X-Ray", "subtopic": "Exam Tips", "type": "single", "q": "What is the key indicator on the SAA-C03 exam to choose AWS X-Ray?", "options": ["A) Troubleshooting performance bottlenecks, viewing microservice dependency maps, and tracing request latencies end-to-end[cite: 8]", "B) Analyzing SQL queries inside Redshift data warehouses", "C) Protecting EC2 instances from distributed denial of service (DDoS) attacks", "D) Storing unstructured document files in S3"], "answer": "A", "exp": "AWS X-Ray is the exam-standard answer for distributed tracing, end-to-end request latency profiling, and service map visualization[cite: 8]."}], "quiz8": [{"id": 1, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "What It Is & Framework Support", "type": "single", "q": "Which of the following is NOT true regarding AWS Amplify as described in the handbook?", "options": ["A) Full-stack development platform for building secure, scalable mobile and web applications[cite: 8]", "B) Supports frameworks including React, Angular, Vue, Next.js, iOS, Android, and Flutter[cite: 8]", "C) A bare-metal physical hypervisor provisioning service for on-premises server racks", "D) Provides libraries, a CLI toolchain, pre-built UI components, and managed hosting[cite: 8]"], "answer": "C", "exp": "AWS Amplify is a developer platform for web and mobile applications, not a bare-metal physical hypervisor service[cite: 8]."}, {"id": 2, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "Amplify CLI", "type": "multi", "q": "Which TWO capabilities are provided by the AWS Amplify CLI? (Select 2)", "options": ["A) Configures and provisions backend cloud resources such as auth, storage, and APIs[cite: 8]", "B) Generates underlying infrastructure templates using AWS CloudFormation[cite: 8]", "C) Compiles C++ code directly into custom FPGA microchips", "D) Manages physical telecom fiber optic installations"], "answer": ["A", "B"], "exp": "The Amplify CLI configures backend categories (auth, storage, functions) and uses CloudFormation under the hood for provisioning[cite: 8]."}, {"id": 3, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "Amplify Hosting", "type": "single", "q": "Which of the following is NOT a feature of AWS Amplify Hosting?", "options": ["A) Fully managed CI/CD and hosting service for static web apps and server-side rendered apps[cite: 8]", "B) Automatic builds and deployments triggered from Git repositories (GitHub, GitLab, Bitbucket)[cite: 8]", "C) Custom domain management and free managed SSL/TLS certificates[cite: 8]", "D) Requirement to manually configure Apache virtual host configurations via SSH"], "answer": "D", "exp": "Amplify Hosting is fully managed and serverless; developers do not configure or access underlying web server hosts via SSH[cite: 8]."}, {"id": 4, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "Authentication and Authorization", "type": "multi", "q": "Which TWO capabilities are provided by Amplify's authentication category? (Select 2)", "options": ["A) Powered by Amazon Cognito for user registration, sign-in, and access control[cite: 8]", "B) Pre-built UI components supporting MFA and social identity federation (Google, Facebook, Apple)[cite: 8]", "C) Unencrypted transmission of user credentials over raw TCP ports", "D) Hardcoded plaintext administrator credentials stored in frontend HTML"], "answer": ["A", "B"], "exp": "Amplify Auth integrates with Amazon Cognito User Pools and Identity Pools, offering pre-built login UIs, MFA, and social sign-in[cite: 8]."}, {"id": 5, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "DataStore", "type": "single", "q": "What is the primary capability of Amplify DataStore in mobile and web applications?", "options": ["A) Provides a programming model for real-time and offline data access with automated cloud synchronization and conflict resolution[cite: 8]", "B) Replaces Amazon S3 for storing petabyte-scale video files", "C) Compresses operating system kernel logs", "D) Mounts on-premises NFS volumes directly to mobile devices"], "answer": "A", "exp": "Amplify DataStore offers a persistent on-device storage repository that syncs automatically with the cloud and resolves conflicts upon reconnecting[cite: 8]."}, {"id": 6, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "API Category - GraphQL & REST", "type": "multi", "q": "Which TWO AWS backend services are provisioned by Amplify to power its API category? (Select 2)", "options": ["A) AWS AppSync for GraphQL APIs[cite: 8]", "B) Amazon API Gateway and AWS Lambda for REST APIs[cite: 8]", "C) AWS Snowball Edge local storage", "D) Amazon Route 53 Resolver private endpoints"], "answer": ["A", "B"], "exp": "Amplify provisions AWS AppSync for GraphQL APIs and Amazon API Gateway with AWS Lambda for RESTful APIs[cite: 8]."}, {"id": 7, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "Predictions (AI/ML Integration)", "type": "single", "q": "How does the Amplify Predictions category simplify adding AI/ML capabilities to mobile applications?", "options": ["A) Integrates with pre-trained AI services like Amazon Rekognition, Polly, Translate, and Comprehend with minimal configuration[cite: 8]", "B) Requires writing custom Python TensorFlow neural network architectures from scratch", "C) Provisions physical GPU servers on-premises", "D) Exports all application data into unencrypted S3 buckets"], "answer": "A", "exp": "Amplify Predictions provides a simple client interface to AWS AI services (Rekognition, Polly, Translate, Comprehend) without complex ML code[cite: 8]."}, {"id": 8, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "Exam Tips", "type": "single", "q": "What is the key takeaway for AWS Amplify on the SAA-C03 exam?", "options": ["A) Choose Amplify when a scenario requires rapid full-stack web or mobile development with authentication, serverless APIs, storage, and CI/CD hosting[cite: 8]", "B) Choose Amplify for hosting legacy stateful Windows desktop applications", "C) Choose Amplify for high-performance computing (HPC) parallel MPI workloads", "D) Choose Amplify for managing physical SAN storage arrays"], "answer": "A", "exp": "Amplify is the exam answer for accelerated full-stack web/mobile apps utilizing Cognito, AppSync/API Gateway, S3, and Git-based hosting[cite: 8]."}, {"id": 9, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "What It Is & Supported API Types", "type": "single", "q": "Which of the following is NOT one of the primary API types supported by Amazon API Gateway?", "options": ["A) REST APIs[cite: 8]", "B) HTTP APIs[cite: 8]", "C) WebSocket APIs[cite: 8]", "D) Raw UDP Socket Broadcast APIs"], "answer": "D", "exp": "Amazon API Gateway natively supports REST APIs, HTTP APIs, and WebSocket APIs, but does not provide raw UDP broadcast endpoints[cite: 8]."}, {"id": 10, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "HTTP APIs vs REST APIs", "type": "single", "q": "What is the primary benefit of choosing HTTP APIs over REST APIs in Amazon API Gateway?", "options": ["A) Designed to be a simpler, faster, and up to 71% lower-cost option for workloads requiring basic proxying to Lambda or HTTP endpoints[cite: 8]", "B) Provides advanced SOAP to JSON XML transformations", "C) Enables built-in hardware accelerated caching by default", "D) Supports legacy WS-Security headers natively"], "answer": "A", "exp": "HTTP APIs offer a lightweight, cost-effective, low-latency alternative for core REST features and serverless proxy integrations[cite: 8]."}, {"id": 11, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "WebSocket APIs", "type": "single", "q": "What is the primary architectural purpose of WebSocket APIs in Amazon API Gateway?", "options": ["A) Enables bidirectional, full-duplex, persistent communication between client and server for real-time applications[cite: 8]", "B) Unidirectional batch file transfer to S3 Glacier", "C) Managing DNS queries across private subnets", "D) Backing up EBS volumes to external datacenters"], "answer": "A", "exp": "WebSocket APIs maintain persistent stateful connections, allowing clients and backend services to send messages to each other at any time[cite: 1, 8]."}, {"id": 12, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Integration Types", "type": "multi", "q": "Which TWO integration targets are supported by Amazon API Gateway? (Select 2)", "options": ["A) AWS Lambda functions (serverless backends)[cite: 8]", "B) Publicly accessible HTTP/HTTPS endpoints or internal services via VPC Links[cite: 8]", "C) Direct physical tape robot loaders", "D) Optical carrier telecom switches"], "answer": ["A", "B"], "exp": "API Gateway integrates with Lambda, direct AWS services, public HTTP/HTTPS endpoints, and private VPC resources via VPC Links[cite: 8]."}, {"id": 13, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Authorization and Authentication", "type": "multi", "q": "Which TWO authorization mechanisms are supported natively by Amazon API Gateway? (Select 2)", "options": ["A) Amazon Cognito User Pools authorizers (validating JWT tokens)[cite: 8]", "B) Lambda Authorizers (custom authorization logic using bearer tokens or request parameters)[cite: 8]", "C) Unencrypted cleartext passwords in query parameters", "D) Bypassing authentication entirely for all administrative endpoints"], "answer": ["A", "B"], "exp": "API Gateway supports Cognito User Pools, Lambda custom authorizers, IAM credentials (SigV4), and mutual TLS (mTLS)[cite: 8]."}, {"id": 14, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "API Keys and Usage Plans", "type": "single", "q": "What is the primary function of Usage Plans in Amazon API Gateway?", "options": ["A) Enforces throttling rate limits (requests per second) and monthly quotas on API keys to control client consumption[cite: 8]", "B) Tracks employee timesheets and project schedules", "C) Balances network traffic across multiple AWS accounts", "D) Manages software license compliance for EC2 instances"], "answer": "A", "exp": "Usage plans allow API owners to define throttling limits (rate/burst) and consumption quotas for specific API keys[cite: 1, 8]."}, {"id": 15, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Caching", "type": "single", "q": "How does API Gateway Stage Caching enhance backend availability and performance?", "options": ["A) Caches responses from backend endpoints for a defined TTL, reducing the number of calls made to backend systems[cite: 8]", "B) Automatically rewrites SQL queries into NoSQL formats", "C) Compresses images using AWS Elemental MediaConvert", "D) Permanently stores client requests in DynamoDB tables"], "answer": "A", "exp": "Enabling caching at the stage level allows API Gateway to serve responses directly from an in-memory cache, improving latency and protecting backends[cite: 8]."}, {"id": 16, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Deployments, Stages & Canaries", "type": "multi", "q": "Which TWO capabilities are supported for managing API deployments in Amazon API Gateway? (Select 2)", "options": ["A) Multiple deployment stages (e.g., dev, test, prod) with stage variables[cite: 8]", "B) Canary deployments to route a percentage of live traffic to a new API version[cite: 1, 8]", "C) Mandatory deployment downtime of 30 minutes per update", "D) Requiring instances to be rebooted to publish new endpoints"], "answer": ["A", "B"], "exp": "API Gateway supports distinct stages with stage variables and canary deployments to gradually test and shift traffic to new releases[cite: 1, 8]."}, {"id": 17, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Private APIs & VPC Links", "type": "single", "q": "How can an enterprise restrict an API Gateway REST API so that it is accessible ONLY from within private VPC subnets?", "options": ["A) Deploy a Private API accessible exclusively through an Interface VPC Endpoint (AWS PrivateLink)[cite: 8]", "B) Attach an Internet Gateway to the private subnet", "C) Assign an Elastic IP to each API route", "D) Route all calls through Amazon CloudFront edge locations"], "answer": "A", "exp": "Private APIs in API Gateway can only be invoked from within a VPC via an interface VPC endpoint, keeping traffic off the public internet[cite: 8]."}, {"id": 18, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Security - AWS WAF Integration", "type": "single", "q": "Which AWS security service can be associated directly with an API Gateway REST API stage to protect against common web exploits like SQL injection and cross-site scripting (XSS)?", "options": ["A) AWS WAF[cite: 8]", "B) AWS Network Firewall[cite: 8]", "C) AWS Security Hub[cite: 8]", "D) AWS Shield Advanced (without WAF)"], "answer": "A", "exp": "AWS WAF integrates directly with API Gateway stages to inspect HTTP/HTTPS requests and enforce web ACL security rules[cite: 8]."}, {"id": 19, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Monitoring and Logging", "type": "multi", "q": "Which TWO monitoring services integrate natively with Amazon API Gateway? (Select 2)", "options": ["A) Amazon CloudWatch for execution metrics, latency, and detailed request/response logs[cite: 8]", "B) AWS X-Ray for tracing API calls across downstream distributed microservices[cite: 8]", "C) AWS Trusted Advisor for modifying SQL queries", "D) AWS Glue DataBrew for profiling HTTP headers"], "answer": ["A", "B"], "exp": "CloudWatch captures metrics and execution logs, while AWS X-Ray provides end-to-end tracing across downstream integrations[cite: 8]."}, {"id": 20, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Exam Tips", "type": "single", "q": "What is the key architecture rule for API Gateway throttling limits tested on the exam?", "options": ["A) API Gateway applies token bucket rate and burst limits; exceeding them returns HTTP 429 'Too Many Requests' responses[cite: 1, 8]", "B) Exceeding limits permanently deletes the API endpoint", "C) Throttling errors return H
