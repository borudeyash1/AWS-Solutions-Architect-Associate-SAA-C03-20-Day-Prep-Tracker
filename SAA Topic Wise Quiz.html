and cold data[cite: 6]"], "answer": ["A", "B"], "exp": "EFS IA reduces costs for infrequently accessed data without compromising performance, and Lifecycle Management automates transitions seamlessly within the same file system[cite: 6, 8]."}, {"id": 9, "section": "16. STORAGE", "topic": "Amazon FSx", "subtopic": "FSx File System Families", "type": "multi", "q": "Which TWO managed file system engines are supported within the Amazon FSx family? (Select 2)", "options": ["A) Amazon FSx for Windows File Server (native SMB protocol integrated with Active Directory)[cite: 6, 8]", "B) Amazon FSx for Lustre (high-performance file system for HPC and S3 data lake integration)[cite: 6, 8]", "C) Amazon FSx for SQLite Local Desktop", "D) Amazon FSx for Raw Disk Partitions"], "answer": ["A", "B"], "exp": "Amazon FSx includes managed file engines for Windows File Server, Lustre, OpenZFS, and NetApp ONTAP[cite: 6, 8]."}, {"id": 10, "section": "16. STORAGE", "topic": "Amazon FSx", "subtopic": "FSx for Windows File Server", "type": "single", "q": "How does Amazon FSx for Windows File Server integrate with user identity and access control in enterprise environments?", "options": ["A) Integrates with AWS Managed Microsoft AD or self-managed Active Directory to enforce ACLs and Kerberos session encryption[cite: 6, 8]", "B) Uses Linux POSIX file permissions exclusively", "C) Bypasses all active directory domains for public access", "D) Stores user passwords in unencrypted plain text files"], "answer": "A", "exp": "FSx for Windows File Server provides native Windows file sharing via SMB, integrating seamlessly with Microsoft Active Directory domains[cite: 6, 8]."}, {"id": 11, "section": "16. STORAGE", "topic": "Amazon FSx", "subtopic": "FSx for Lustre & S3 Integration", "type": "single", "q": "What is the primary purpose of linking an Amazon FSx for Lustre file system to an Amazon S3 bucket?", "options": ["A) Enables high-performance computing (HPC) and machine learning workloads to process S3 datasets at high speeds with automatic data synchronization back to S3[cite: 6, 8]", "B) Converts Lustre file blocks into encrypted magnetic tape cassettes", "C) Replaces S3 versioning with POSIX symlinks", "D) Prevents S3 buckets from accepting inbound internet traffic"], "answer": "A", "exp": "FSx for Lustre links with S3 to provide fast scratch storage for HPC simulations, importing datasets and lazily writing modified data back to S3[cite: 6, 8]."}, {"id": 12, "section": "16. STORAGE", "topic": "Amazon FSx", "subtopic": "FSx for NetApp ONTAP", "type": "single", "q": "Which data efficiency features are natively supported by Amazon FSx for NetApp ONTAP?", "options": ["A) Inline data deduplication, compression, and thin provisioning[cite: 6, 8]", "B) Real-time conversational chatbot natural language understanding", "C) Container image vulnerability scanning", "D) Automated DNS route redirection"], "answer": "A", "exp": "FSx for NetApp ONTAP offers enterprise NetApp storage efficiencies, including data deduplication, compaction, compression, and multi-protocol access (NFS, SMB, iSCSI)[cite: 6, 8]."}, {"id": 13, "section": "16. STORAGE", "topic": "Amazon S3", "subtopic": "What It Is & Durability", "type": "single", "q": "What is the certified durability rating for objects stored in the Amazon S3 Standard storage class?", "options": ["A) 99.999999999% (11 nines) of durability across multiple Availability Zones[cite: 6, 8]", "B) 99.9% availability SLA with single-host redundancy", "C) 50% durability over a 30-day window", "D) Exact 100% guarantee against user accidental deletions"], "answer": "A", "exp": "Amazon S3 Standard is designed for 99.999999999% (11 nines) of data durability by automatically replicating objects across a minimum of three Availability Zones[cite: 6, 8]."}, {"id": 14, "section": "16. STORAGE", "topic": "Amazon S3", "subtopic": "Storage Classes", "type": "multi", "q": "Which TWO Amazon S3 storage classes are optimized for long-term cold archival data retention? (Select 2)", "options": ["A) S3 Glacier Flexible Retrieval[cite: 6, 8]", "B) S3 Glacier Deep Archive[cite: 6, 8]", "C) S3 Standard-Infrequent Access (Standard-IA)", "D) S3 Express One Zone"], "answer": ["A", "B"], "exp": "S3 Glacier Flexible Retrieval and S3 Glacier Deep Archive are purpose-built for low-cost, long-term archival storage with retrieval times ranging from minutes to hours[cite: 6, 8]."}, {"id": 15, "section": "16. STORAGE", "topic": "Amazon S3", "subtopic": "S3 Intelligent-Tiering", "type": "single", "q": "How does Amazon S3 Intelligent-Tiering optimize storage costs without operational overhead?", "options": ["A) Automatically moves objects between frequent, infrequent, and archive access tiers based on changing access patterns with no retrieval fees[cite: 6, 8]", "B) Permanently deletes files that haven't been opened in 2 days", "C) Converts all object files into compressed tar archives", "D) Replicates data across foreign cloud providers"], "answer": "A", "exp": "S3 Intelligent-Tiering monitors access patterns and automatically moves objects between tiers to lower storage costs when access stops, without operational overhead or retrieval charges[cite: 6, 8]."}, {"id": 16, "section": "16. STORAGE", "topic": "Amazon S3", "subtopic": "Versioning & Object Lock", "type": "multi", "q": "Which TWO statements regarding S3 Versioning and S3 Object Lock are true? (Select 2)", "options": ["A) S3 Versioning keeps multiple variants of an object in the same bucket, protecting against accidental overwrites or deletes[cite: 6, 8]", "B) S3 Object Lock enforces WORM (Write Once, Read Many) storage protection in Compliance or Governance modes[cite: 6, 8]", "C) S3 Versioning prevents users from ever deleting any historical object version", "D) S3 Object Lock requires attaching physical padlocks to AWS data center server racks"], "answer": ["A", "B"], "exp": "S3 Versioning preserves past object versions, while Object Lock enforces WORM retention periods in Compliance or Governance modes[cite: 6, 8]."}, {"id": 17, "section": "16. STORAGE", "topic": "Amazon S3", "subtopic": "Cross-Region Replication (CRR)", "type": "single", "q": "What is the primary requirement to enable S3 Cross-Region Replication (CRR) between two buckets?", "options": ["A) S3 Versioning must be enabled on both the source and destination buckets[cite: 6, 8]", "B) Both buckets must be located in the exact same Availability Zone", "C) The buckets must be unencrypted", "D) S3 Object Lock must be disabled permanently"], "answer": "A", "exp": "S3 Replication (both CRR and SRR) requires S3 Versioning to be enabled on both source and destination buckets to track and replicate object versions[cite: 6, 8]."}, {"id": 18, "section": "16. STORAGE", "topic": "Amazon S3", "subtopic": "Permissions Evaluation Logic", "type": "single", "q": "When Amazon S3 evaluates an incoming request, what is the precise order of permission checks?", "options": ["A) Public Access Block (Block Public Access) -> IAM Policies -> Bucket Policies -> Object Access Control Lists (ACLs)[cite: 6, 8]", "B) ACLs -> Bucket Policies -> IAM Policies -> Public Access Block", "C) IAM Policies -> ACLs -> Public Access Block -> Bucket Policies", "D) S3 evaluates permissions in random order"], "answer": "A", "exp": "S3 evaluates permissions starting with Account/Bucket Public Access Block settings, followed by IAM policies, bucket policies, and finally object ACLs (any explicit Deny halts evaluation)[cite: 6, 8]."}, {"id": 19, "section": "16. STORAGE", "topic": "AWS Storage Gateway", "subtopic": "Gateway Types (S3 File, FSx File, Volume, Tape)", "type": "multi", "q": "Which TWO storage gateway modes are supported by AWS Storage Gateway? (Select 2)", "options": ["A) S3 File Gateway (mounting S3 buckets as local NFS/SMB file shares)[cite: 6, 8]", "B) Tape Gateway (providing a virtual tape library interface for backup applications into S3/Glacier)[cite: 6, 8]", "C) EC2 Local Hypervisor Gateway for native bare-metal compiling", "D) Route 53 DNS Resolver Gateway"], "answer": ["A", "B"], "exp": "Storage Gateway offers S3 File Gateway, FSx File Gateway, Volume Gateway (Stored/Cached), and Tape Gateway (VTL)[cite: 6, 8]."}, {"id": 20, "section": "16. STORAGE", "topic": "AWS Storage Gateway", "subtopic": "Volume Gateway - Stored vs Cached Modes", "type": "single", "q": "What is the operational difference between Stored Volumes and Cached Volumes in AWS Storage Gateway Volume Gateway?", "options": ["A) Stored volumes keep the entire dataset locally on-premises and asynchronously back up snapshots to S3; Cached volumes store primary data in S3 and keep only frequently accessed data locally[cite: 6, 8]", "B) Stored volumes require no local storage hardware; Cached volumes store all 100 PB locally", "C) Stored volumes use NFS; Cached volumes use SMB exclusively", "D) Stored volumes cannot create EBS snapshots"], "answer": "A", "exp": "Stored volumes keep all data on-prem with backups to S3, whereas Cached volumes keep primary data in S3 and cache hot data locally to conserve on-prem disk space[cite: 6, 8]."}, {"id": 21, "section": "16. STORAGE", "topic": "AWS Storage Gateway", "subtopic": "Exam Tips", "type": "single", "q": "What is the key indicator on the SAA exam to select AWS Storage Gateway instead of AWS DataSync?", "options": ["A) When an on-premises application needs low-latency hybrid file/volume/tape mount points connected back to AWS storage services[cite: 6, 8]", "B) When performing a one-time bulk migration of 500 TB over Direct Connect", "C) When migrating Oracle databases to Amazon Aurora", "D) When generating SSL certificates for CloudFront"], "answer": "A", "exp": "Storage Gateway is deployed as a hybrid appliance (VM or hardware) providing ongoing local mount points (NFS, SMB, iSCSI, VTL) to cloud storage[cite: 6, 8]."}]};
    const EMBEDDED_META = [{"id": "quiz1", "title": "Quiz 1: Analytics", "desc": "Athena, Glue, Kinesis, Redshift, EMR, Data Pipeline"}, {"id": "quiz2", "title": "Quiz 2: Application Integration", "desc": "SQS, SNS, EventBridge, AppFlow, AppSync, Step Functions"}, {"id": "quiz3", "title": "Quiz 3: Cloud Financial Management", "desc": "Cost Explorer, Pricing Calculator, Billing, Budgets"}, {"id": "quiz4", "title": "Quiz 4: Compute", "desc": "EC2, Auto Scaling, Batch, Beanstalk, Outposts"}, {"id": "quiz5", "title": "Quiz 5: Containers", "desc": "ECS, EKS, Fargate, EKS Anywhere, EKS-D"}, {"id": "quiz6", "title": "Quiz 6: Databases", "desc": "Aurora, DynamoDB, RDS, ElastiCache, Keyspaces, Redshift"}, {"id": "quiz7", "title": "Quiz 7: Developer Tools", "desc": "AWS X-Ray"}, {"id": "quiz8", "title": "Quiz 8: Front-End Web & Mobile", "desc": "API Gateway, Amplify, Pinpoint, Device Farm"}, {"id": "quiz9", "title": "Quiz 9: Machine Learning", "desc": "SageMaker, Rekognition, Polly, Translate, Lex, Comprehend"}, {"id": "quiz10", "title": "Quiz 10: Management & Governance", "desc": "CloudWatch, CloudTrail, CloudFormation, Systems Manager, Config"}, {"id": "quiz11", "title": "Quiz 11: Migration & Transfer", "desc": "DMS, MGN, Application Discovery, Snow Family, Transfer Family"}, {"id": "quiz12", "title": "Quiz 12: Media Services", "desc": "Elastic Transcoder"}, {"id": "quiz13", "title": "Quiz 13: Networking & Content Delivery", "desc": "VPC, CloudFront, Route 53, ELB, Direct Connect, Transit Gateway"}, {"id": "quiz14", "title": "Quiz 14: Security, Identity & Compliance", "desc": "IAM, KMS, WAF, Secrets Manager, Shield, GuardDuty, Security Hub"}, {"id": "quiz15", "title": "Quiz 15: Serverless", "desc": "AWS Lambda, AWS Fargate"}, {"id": "quiz16", "title": "Quiz 16: Storage", "desc": "S3, EBS, EFS, FSx, AWS Backup, Storage Gateway"}];

    let activeQuizData = [];
    let currentQuizKey = 'quiz1';

    // Theme Management
    let currentTheme = localStorage.getItem('quiz-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateThemeUI(currentTheme);

    function toggleTheme() {
        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        localStorage.setItem('quiz-theme', currentTheme);
        updateThemeUI(currentTheme);
    }

    function updateThemeUI(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (icon && text) {
            if (theme === 'dark') {
                icon.textContent = '🌙';
                text.textContent = 'Dark Mode';
            } else {
                icon.textContent = '☀️';
                text.textContent = 'Light Mode';
            }
        }
    }

    // Populate Quiz Selector Dropdown
    function initQuizSelector() {
        const select = document.getElementById('quiz-select');
        select.innerHTML = '';
        
        EMBEDDED_META.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.id;
            opt.textContent = `${item.title} (${EMBEDDED_QUIZZES[item.id] ? EMBEDDED_QUIZZES[item.id].length : 0} Qs)`;
            select.appendChild(opt);
        });

        // Add custom file option placeholder
        const customOpt = document.createElement('option');
        customOpt.value = 'custom';
        customOpt.textContent = '📁 Custom Uploaded JSON';
        customOpt.style.display = 'none';
        customOpt.id = 'custom-opt-header';
        select.appendChild(customOpt);
    }

    function changeQuiz(quizKey) {
        if (quizKey === 'custom') return;
        currentQuizKey = quizKey;
        if (EMBEDDED_QUIZZES[quizKey]) {
            loadQuizData(EMBEDDED_QUIZZES[quizKey], getQuizTitle(quizKey), getQuizDesc(quizKey));
        }
    }

    function getQuizTitle(quizKey) {
        const meta = EMBEDDED_META.find(m => m.id === quizKey);
        return meta ? meta.title : 'AWS Quiz';
    }

    function getQuizDesc(quizKey) {
        const meta = EMBEDDED_META.find(m => m.id === quizKey);
        return meta ? meta.desc : 'AWS Solutions Architect Associate Practice Questions';
    }

    function loadQuizData(dataArray, title, desc) {
        activeQuizData = dataArray;
        document.getElementById('quiz-intro-title').textContent = title || 'AWS Quiz';
        document.getElementById('quiz-intro-desc').textContent = desc || 'Select your answer and click Submit Answer for detailed explanations.';
        document.getElementById('quiz-intro-count').textContent = `${dataArray.length} Questions`;
        document.getElementById('total-val').textContent = dataArray.length;
        
        renderQuizGroupedBySection(dataArray);
        updateStats();
    }

    // Render questions grouped by Topic Sections
    function renderQuizGroupedBySection(questions) {
        const container = document.getElementById('quiz-content');
        container.innerHTML = '';

        // Group by topic
        const sections = {};
        questions.forEach(q => {
            const topic = q.topic || 'General Topics';
            if (!sections[topic]) sections[topic] = [];
            sections[topic].push(q);
        });

        Object.keys(sections).forEach(topicName => {
            const topicQuestions = sections[topicName];

            const sectionEl = document.createElement('section');
            sectionEl.className = 'topic-section';

            const headerEl = document.createElement('div');
            headerEl.className = 'section-header';
            headerEl.innerHTML = `
                <h3><span>📦</span> ${escapeHTML(topicName)}</h3>
                <span class="section-count-badge">${topicQuestions.length} Questions</span>
            `;
            sectionEl.appendChild(headerEl);

            const questionsWrap = document.createElement('div');
            questionsWrap.className = 'section-questions';

            topicQuestions.forEach(q => {
                const card = createQuestionCard(q);
                questionsWrap.appendChild(card);
            });

            sectionEl.appendChild(questionsWrap);
            container.appendChild(sectionEl);
        });
    }

    function createQuestionCard(q) {
        const isMulti = q.type === 'multi';
        
        // Multi-select helper count calculation
        let reqCount = 2;
        if (Array.isArray(q.answer)) {
            reqCount = q.answer.length;
        } else if (q.q && q.q.toLowerCase().includes('select 3')) {
            reqCount = 3;
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${q.id}`;
        card.setAttribute('data-id', q.id);
        card.setAttribute('data-type', q.type || 'single');
        card.setAttribute('data-status', 'unanswered');

        // Render card options
        let optionsHTML = '';
        if (q.options && Array.isArray(q.options)) {
            q.options.forEach(opt => {
                const letter = extractOptionLetter(opt);
                const inputType = isMulti ? 'checkbox' : 'radio';
                optionsHTML += `
                    <label class="option-label" onclick="handleOptionClick(this)">
                        <input type="${inputType}" name="q_${q.id}" value="${letter}">
                        <span class="opt-text">${escapeHTML(opt)}</span>
                    </label>
                `;
            });
        }

        card.innerHTML = `
            <div class="card-top-bar">
                <div class="badge-group">
                    <span class="badge badge-index">#${q.id}</span>
                    <span class="badge badge-topic">${escapeHTML(q.topic || 'AWS')}</span>
                    <span class="badge badge-subtopic">${escapeHTML(q.subtopic || 'General')}</span>
                    <span class="badge badge-type ${q.type || 'single'}">${isMulti ? 'Multi-Select' : 'Single Choice'}</span>
                </div>
                <div>
                    <span class="status-badge correct">✓ Correct</span>
                    <span class="status-badge incorrect">✕ Incorrect</span>
                </div>
            </div>

            <div class="question-text">
                ${escapeHTML(q.q)}
                ${isMulti ? `<span class="helper-text">(Select ${reqCount} options)</span>` : ''}
            </div>

            <div class="options-group">
                ${optionsHTML}
            </div>

            <div class="card-footer">
                <button class="btn-submit" onclick="submitAnswer(${q.id})">
                    Submit Answer
                </button>
            </div>

            <div id="explanation-${q.id}" class="explanation-box"></div>
        `;

        return card;
    }

    function extractOptionLetter(optStr) {
        if (!optStr) return '';
        const match = optStr.trim().match(/^([A-Z])[\.\)\:\s]/i);
        return match ? match[1].toUpperCase() : optStr.trim().charAt(0).toUpperCase();
    }

    function handleOptionClick(labelEl) {
        const card = labelEl.closest('.question-card');
        if (!card) return;
        const isMulti = card.getAttribute('data-type') === 'multi';

        if (!isMulti) {
            card.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected-opt'));
            labelEl.classList.add('selected-opt');
        } else {
            const chk = labelEl.querySelector('input[type="checkbox"]');
            if (chk && chk.checked) {
                labelEl.classList.add('selected-opt');
            } else {
                labelEl.classList.remove('selected-opt');
            }
        }
    }

    function submitAnswer(qId) {
        const card = document.getElementById(`card-${qId}`);
        if (!card) return;

        const qObj = activeQuizData.find(item => item.id == qId);
        if (!qObj) return;

        const isMulti = qObj.type === 'multi';
        const inputs = card.querySelectorAll(`input[name="q_${qId}"]:checked`);

        if (inputs.length === 0) {
            alert('Please select an option before submitting!');
            return;
        }

        const selectedVals = Array.from(inputs).map(i => i.value);
        let isCorrect = false;

        if (!isMulti) {
            const userVal = selectedVals[0];
            const correctVal = typeof qObj.answer === 'string' ? qObj.answer : qObj.answer[0];
            isCorrect = (userVal === correctVal);
        } else {
            const correctArray = Array.isArray(qObj.answer) ? qObj.answer : [qObj.answer];
            isCorrect = (selectedVals.length === correctArray.length) && selectedVals.every(val => correctArray.includes(val));
        }

        // Highlight options
        const labels = card.querySelectorAll('.option-label');
        labels.forEach(label => {
            label.classList.remove('opt-correct', 'opt-incorrect');
            const input = label.querySelector('input');
            const val = input ? input.value : '';

            const correctArray = Array.isArray(qObj.answer) ? qObj.answer : [qObj.answer];

            if (correctArray.includes(val)) {
                label.classList.add('opt-correct');
            }
            if (selectedVals.includes(val) && !correctArray.includes(val)) {
                label.classList.add('opt-incorrect');
            }
        });

        // Display explanation & update card status
        const expBox = document.getElementById(`explanation-${qId}`);
        expBox.style.display = 'block';

        if (isCorrect) {
            expBox.className = 'explanation-box correct-ans';
            expBox.innerHTML = `<strong>Correct!</strong> ${escapeHTML(qObj.exp || 'Great job!')}`;
            card.setAttribute('data-status', 'correct');
        } else {
            expBox.className = 'explanation-box incorrect-ans';
            const correctStr = Array.isArray(qObj.answer) ? qObj.answer.join(', ') : qObj.answer;
            expBox.innerHTML = `<strong>Incorrect.</strong> Correct answer is <strong>${escapeHTML(correctStr)}</strong>. ${escapeHTML(qObj.exp || '')}`;
            card.setAttribute('data-status', 'incorrect');
        }

        updateStats();
    }

    let currentFilter = 'all';

    function setFilter(filterType, btn) {
        currentFilter = filterType;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        filterQuestions();
    }

    function filterQuestions() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const cards = document.querySelectorAll('.question-card');

        cards.forEach(card => {
            const qText = card.querySelector('.question-text')?.textContent || '';
            const status = card.getAttribute('data-status') || 'unanswered';
            const type = card.getAttribute('data-type') || 'single';
            const cardId = card.getAttribute('data-id') || '';

            let matchesFilter = false;
            if (currentFilter === 'all') matchesFilter = true;
            else if (currentFilter === 'unanswered' && status === 'unanswered') matchesFilter = true;
            else if (currentFilter === 'correct' && status === 'correct') matchesFilter = true;
            else if (currentFilter === 'incorrect' && status === 'incorrect') matchesFilter = true;
            else if (currentFilter === 'single' && type === 'single') matchesFilter = true;
            else if (currentFilter === 'multi' && type === 'multi') matchesFilter = true;

            let matchesSearch = true;
            if (query) {
                if (query.startsWith('#')) {
                    const num = query.substring(1).trim();
                    matchesSearch = cardId === num || qText.includes(`#${num}`);
                } else {
                    matchesSearch = qText.toLowerCase().includes(query) || card.textContent.toLowerCase().includes(query);
                }
            }

            if (matchesFilter && matchesSearch) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });

        // Hide empty sections
        document.querySelectorAll('.topic-section').forEach(section => {
            const visibleCards = section.querySelectorAll('.question-card:not(.hidden)');
            if (visibleCards.length === 0) {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
            }
        });
    }

    function updateStats() {
        const total = activeQuizData.length;
        const correctCount = document.querySelectorAll('.question-card[data-status="correct"]').length;
        const answeredCount = document.querySelectorAll('.question-card[data-status="correct"], .question-card[data-status="incorrect"]').length;

        const scoreEl = document.getElementById('score-val');
        if (scoreEl) scoreEl.textContent = correctCount;

        const progressBar = document.getElementById('quiz-progress-bar');
        if (progressBar) {
            const pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;
            progressBar.style.width = pct + '%';
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (Array.isArray(parsed)) {
                    const headerOpt = document.getElementById('custom-opt-header');
                    headerOpt.style.display = 'block';
                    headerOpt.textContent = `📁 ${file.name} (${parsed.length} Qs)`;
                    document.getElementById('quiz-select').value = 'custom';
                    loadQuizData(parsed, `Custom Quiz: ${file.name}`, 'Loaded directly from local JSON file.');
                } else {
                    alert('Invalid JSON file. Expected an array of question objects.');
                }
            } catch (err) {
                alert('Error parsing JSON file: ' + err.message);
            }
        };
        reader.readAsText(file);
    }

    function escapeHTML(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // Check for auto-load attempt from quiz_data.json or quiz1_data.json
    async function checkLocalJSONFiles() {
        const candidates = ['quiz_data.json', 'quiz1_data.json', '../quiz_data.json'];
        for (const candidate of candidates) {
            try {
                const res = await fetch(candidate);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        console.log(`Successfully fetched ${candidate}!`);
                        EMBEDDED_QUIZZES['external'] = data;
                        // Add to selector if fetched
                        const select = document.getElementById('quiz-select');
                        const opt = document.createElement('option');
                        opt.value = 'external';
                        opt.textContent = `🌐 External: ${candidate} (${data.length} Qs)`;
                        select.insertBefore(opt, select.firstChild);
                        select.value = 'external';
                        loadQuizData(data, `Local File: ${candidate}`, 'Loaded directly from workspace JSON file.');
                        return;
                    }
                }
            } catch (err) {
                // Fallback to embedded
            }
        }
    }

    // Init App
    document.addEventListener('DOMContentLoaded', () => {
        initQuizSelector();
        // Default to Quiz 1 embedded
        changeQuiz('quiz1');
        // Check if local fetch works
        checkLocalJSONFiles();
    });
</script>
