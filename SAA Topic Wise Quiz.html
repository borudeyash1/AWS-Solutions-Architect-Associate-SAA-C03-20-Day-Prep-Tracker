<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Solutions Architect Associate (SAA-C03) Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* AWS Navy Dark Theme Defaults */
            --bg-color: #0b0f17;
            --header-bg: rgba(15, 27, 42, 0.92);
            --card-bg: #111827;
            --card-sub-bg: #1f2937;
            --card-hover-bg: #374151;
            --border-color: #1f2937;
            --border-highlight: #374151;
            
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            
            --aws-orange: #ff9900;
            --aws-orange-hover: #ffaa22;
            --aws-orange-light: rgba(255, 153, 0, 0.15);
            --aws-orange-glow: rgba(255, 153, 0, 0.35);
            --aws-navy: #0f1b2a;
            
            --badge-index-bg: #1e293b;
            --badge-index-text: #f8fafc;
            
            --badge-topic-bg: rgba(59, 130, 246, 0.15);
            --badge-topic-text: #60a5fa;
            --badge-topic-border: rgba(96, 165, 250, 0.3);
            
            --badge-subtopic-bg: rgba(168, 85, 247, 0.15);
            --badge-subtopic-text: #c084fc;
            --badge-subtopic-border: rgba(192, 132, 252, 0.3);
            
            --badge-single-bg: rgba(245, 158, 11, 0.15);
            --badge-single-text: #fbbf24;
            --badge-single-border: rgba(251, 191, 36, 0.3);
            
            --badge-multi-bg: rgba(236, 72, 153, 0.15);
            --badge-multi-text: #f472b6;
            --badge-multi-border: rgba(244, 114, 182, 0.3);
            
            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-text: #34d399;
            --correct-border: rgba(52, 211, 153, 0.4);
            
            --incorrect-bg: rgba(244, 63, 94, 0.15);
            --incorrect-text: #fb7185;
            --incorrect-border: rgba(251, 113, 133, 0.4);
            
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        [data-theme="light"] {
            /* Light Theme Palette */
            --bg-color: #f8fafc;
            --header-bg: rgba(255, 255, 255, 0.95);
            --card-bg: #ffffff;
            --card-sub-bg: #f1f5f9;
            --card-hover-bg: #e2e8f0;
            --border-color: #e2e8f0;
            --border-highlight: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --aws-orange: #ff9900;
            --aws-orange-hover: #e68a00;
            --aws-orange-light: rgba(255, 153, 0, 0.12);
            --aws-orange-glow: rgba(255, 153, 0, 0.25);
            --aws-navy: #0f1b2a;
            
            --badge-index-bg: #e2e8f0;
            --badge-index-text: #0f172a;
            
            --badge-topic-bg: #dbeafe;
            --badge-topic-text: #1d4ed8;
            --badge-topic-border: #93c5fd;
            
            --badge-subtopic-bg: #f3e8ff;
            --badge-subtopic-text: #7e22ce;
            --badge-subtopic-border: #d8b4fe;
            
            --badge-single-bg: #fef3c7;
            --badge-single-text: #b45309;
            --badge-single-border: #fde68a;
            
            --badge-multi-bg: #fce7f3;
            --badge-multi-text: #be185d;
            --badge-multi-border: #fbcfe8;
            
            --correct-bg: #d1fae5;
            --correct-text: #065f46;
            --correct-border: #34d399;
            
            --incorrect-bg: #ffe4e6;
            --incorrect-text: #9f1239;
            --incorrect-border: #fb7185;
            
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sticky Top Navigation Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }

        .header-content {
            max-width: 1040px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .aws-logo-badge {
            background: linear-gradient(135deg, #ff9900 0%, #ec7211 100%);
            color: #000;
            font-size: 0.8rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quiz-select {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
            max-width: 260px;
        }

        .quiz-select:focus {
            border-color: var(--aws-orange);
        }

        .stat-pill {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill strong {
            color: var(--aws-orange);
        }

        .btn-theme {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            border-color: var(--aws-orange);
            color: var(--aws-orange);
        }

        .btn-upload {
            background: var(--card-sub-bg);
            border: 1px dashed var(--aws-orange);
            color: var(--aws-orange);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-upload:hover {
            background: var(--aws-orange-light);
        }

        /* Top Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--card-sub-bg);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9900 0%, #ec7211 100%);
            transition: width 0.3s ease;
        }

        /* Toolbar & Controls */
        .toolbar-container {
            max-width: 1040px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1 1 240px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px 10px 36px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--aws-orange);
            box-shadow: 0 0 0 2px var(--aws-orange-light);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--aws-orange);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--aws-orange-light);
            border-color: var(--aws-orange);
            color: var(--aws-orange);
            font-weight: 600;
        }

        /* Main Container */
        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .quiz-intro {
            margin-bottom: 24px;
            padding: 24px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-card);
        }

        .quiz-intro-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .quiz-intro h2 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .quiz-intro p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Section Headers */
        .topic-section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-sub-bg);
            border: 1px solid var(--border-highlight);
            border-left: 4px solid var(--aws-orange);
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .section-header h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-count-badge {
            background: var(--aws-orange-light);
            color: var(--aws-orange);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            border: 1px solid var(--aws-orange-glow);
        }

        /* Question Cards */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .question-card:hover {
            border-color: var(--border-highlight);
        }

        .question-card.hidden {
            display: none !important;
        }

        .card-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .badge-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-index {
            background: var(--badge-index-bg);
            color: var(--badge-index-text);
            font-weight: 700;
        }

        .badge-topic {
            background: var(--badge-topic-bg);
            color: var(--badge-topic-text);
            border: 1px solid var(--badge-topic-border);
        }

        .badge-subtopic {
            background: var(--badge-subtopic-bg);
            color: var(--badge-subtopic-text);
            border: 1px solid var(--badge-subtopic-border);
        }

        .badge-type.single {
            background: var(--badge-single-bg);
            color: var(--badge-single-text);
            border: 1px solid var(--badge-single-border);
        }

        .badge-type.multi {
            background: var(--badge-multi-bg);
            color: var(--badge-multi-text);
            border: 1px solid var(--badge-multi-border);
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            display: none;
            white-space: nowrap;
        }

        .question-card[data-status="correct"] .status-badge.correct {
            display: inline-block;
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .question-card[data-status="incorrect"] .status-badge.incorrect {
            display: inline-block;
            background: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.55;
            margin-bottom: 16px;
        }

        .helper-text {
            display: inline-block;
            margin-left: 6px;
            color: var(--aws-orange);
            font-weight: 700;
            font-size: 0.88rem;
        }

        /* Options */
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.45;
            user-select: none;
        }

        .option-label:hover {
            background: var(--card-hover-bg);
            border-color: var(--aws-orange);
        }

        /* Radio & Checkbox Styling */
        .option-label input[type="radio"],
        .option-label input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            min-width: 18px;
            border: 2px solid var(--text-muted);
            margin-top: 2px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-label input[type="radio"] {
            border-radius: 50%;
        }

        .option-label input[type="checkbox"] {
            border-radius: 4px;
        }

        .option-label input[type="radio"]:checked,
        .option-label input[type="checkbox"]:checked {
            border-color: var(--aws-orange);
            background-color: var(--aws-orange);
            box-shadow: 0 0 0 3px var(--aws-orange-light);
        }

        .option-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #000;
        }

        .option-label input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: -2px;
            left: 3px;
            font-size: 13px;
            font-weight: 900;
            color: #000;
        }

        /* Option Feedback Highlights */
        .option-label.selected-opt {
            border-color: var(--aws-orange);
            background: var(--aws-orange-light);
        }

        .option-label.opt-correct {
            border-color: var(--correct-border) !important;
            background: var(--correct-bg) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-label.opt-incorrect {
            border-color: var(--incorrect-border) !important;
            background: var(--incorrect-bg) !important;
            color: var(--incorrect-text) !important;
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, #ff9900 0%, #ec7211 100%);
            color: #000000;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .btn-submit { width: auto; }
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--aws-orange-glow);
            filter: brightness(1.08);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Explanations */
        .explanation-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.92rem;
            line-height: 1.55;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct-ans {
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .incorrect-ans {
            background: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }

        /* Hidden File Input */
        #custom-json-input {
            display: none;
        }
    </style>
</head>
<body>

<!-- Sticky Navigation Header -->
<header class="sticky-header">
    <div class="header-content">
        <div class="brand-title">
            <span class="aws-logo-badge">AWS SAA-C03</span>
            <h1>Quiz Master</h1>
        </div>
        <div class="header-controls">
            <select id="quiz-select" class="quiz-select" onchange="changeQuiz(this.value)">
                <!-- Populated dynamically -->
            </select>
            <div class="stat-pill">
                <span>Score:</span> <strong id="score-val">0</strong> / <span id="total-val">0</span>
            </div>
            <button class="btn-theme" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <span id="theme-icon">🌙</span> <span id="theme-text">Dark Mode</span>
            </button>
            <label for="custom-json-input" class="btn-upload" title="Upload custom quiz JSON">
                📁 <span>Load JSON</span>
            </label>
            <input type="file" id="custom-json-input" accept=".json" onchange="handleFileUpload(event)">
        </div>
    </div>
    <div class="progress-container">
        <div class="progress-bar" id="quiz-progress-bar"></div>
    </div>
</header>

<!-- Filter & Search Toolbar -->
<div class="toolbar-container">
    <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-input" placeholder="Search question text, topic, or #num (e.g. #24)..." oninput="filterQuestions()">
    </div>
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('unanswered', this)">Unanswered</button>
        <button class="filter-btn" onclick="setFilter('correct', this)">Correct</button>
        <button class="filter-btn" onclick="setFilter('incorrect', this)">Incorrect</button>
        <button class="filter-btn" onclick="setFilter('single', this)">Single Choice</button>
        <button class="filter-btn" onclick="setFilter('multi', this)">Multi-Select</button>
    </div>
</div>

<!-- Main Quiz Container -->
<div class="container">
    <div class="quiz-intro" id="quiz-intro-box">
        <div class="quiz-intro-header">
            <h2 id="quiz-intro-title">AWS Solutions Architect Associate Quiz</h2>
            <span class="badge badge-topic" id="quiz-intro-count">0 Questions</span>
        </div>
        <p id="quiz-intro-desc">Select an answer and click <strong>Submit Answer</strong> for instant evaluation and detailed explanations.</p>
    </div>

    <div id="quiz-content"></div>
</div>

<script>
    // Embedded Quizzes Collection
    const EMBEDDED_QUIZZES = {"quiz1": [{"id": 1, "topic": "Amazon Athena", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate description of Amazon Athena?", "options": ["A) Interactive query service that analyses data in S3 using standard SQL", "B) Serverless service with no infrastructure to manage", "C) Requires provisioning dedicated EC2 worker instances before executing queries", "D) Users pay only for the queries they run"], "answer": "C", "exp": "Amazon Athena is serverless; there is no infrastructure or cluster to provision or manage[cite: 8]."}, {"id": 2, "topic": "Amazon Athena", "subtopic": "Key Features", "type": "multi", "q": "Which TWO of the following are key features of Amazon Athena? (Select 2)", "options": ["A) Integrated with AWS Glue Data Catalog for schema management", "B) Billed via fixed monthly instance reservation fees", "C) Supports SQL-based queries using standard ANSI SQL", "D) Requires manual OS patching of query nodes"], "answer": ["A", "C"], "exp": "Athena uses ANSI SQL, integrates with AWS Glue Data Catalog, and charges per TB scanned rather than instance fees[cite: 8]."}, {"id": 3, "topic": "Amazon Athena", "subtopic": "How It Works", "type": "single", "q": "Which of the following is NOT a step in how Amazon Athena works?", "options": ["A) Point Athena at data stored in S3", "B) Define table schema using Data Catalog or DDL in Athena", "C) Automatically replicate S3 datasets into Amazon RDS before execution", "D) Save query results to a specified location in S3"], "answer": "C", "exp": "Athena queries data in place in Amazon S3 without copying or replicating it into relational databases[cite: 8]."}, {"id": 4, "topic": "Amazon Athena", "subtopic": "Supported Data Formats", "type": "multi", "q": "Which TWO data formats are natively supported by Amazon Athena? (Select 2)", "options": ["A) Apache Parquet", "B) Compiled Java Class Binaries (.class)", "C) Apache ORC", "D) Windows Registry Files (.reg)"], "answer": ["A", "C"], "exp": "Athena natively supports columnar formats like ORC and Parquet, alongside CSV, TSV, JSON, Avro, and text files[cite: 8]."}, {"id": 5, "topic": "Amazon Athena", "subtopic": "Performance Optimization", "type": "single", "q": "Which of the following is NOT a recommended performance optimization technique for Athena?", "options": ["A) Partitioning data to break it into subsets for faster queries", "B) Storing all data in uncompressed, single-line text files to eliminate decompression overhead", "C) Using columnar formats like Parquet and ORC to reduce scanned bytes", "D) Using bucketing to organize data for efficient joins"], "answer": "B", "exp": "Storing data uncompressed in raw text increases scanned data volume and query costs; columnar and compressed formats are recommended[cite: 8]."}, {"id": 6, "topic": "Amazon Athena", "subtopic": "AWS Glue Integration", "type": "multi", "q": "Which TWO statements describe Athena's integration with AWS Glue? (Select 2)", "options": ["A) Uses AWS Glue Data Catalog as a persistent metadata store", "B) Crawlers can crawl S3 data to infer schema automatically", "C) Disables schema versioning across all databases", "D) Catalog cannot be shared with EMR or Redshift Spectrum"], "answer": ["A", "B"], "exp": "Athena uses Glue Data Catalog for metadata, supports schema crawling, and shares the catalog with EMR and Redshift Spectrum[cite: 8]."}, {"id": 7, "topic": "Amazon Athena", "subtopic": "Security", "type": "single", "q": "Which of the following is NOT a security mechanism supported by Amazon Athena?", "options": ["A) Encryption at rest using S3 server-side encryption (SSE-S3, SSE-KMS)", "B) Encryption in transit using HTTPS", "C) Fine-grained access control via AWS Lake Formation", "D) Hardcoded plaintext database passwords in query strings"], "answer": "D", "exp": "Athena enforces security through IAM, Lake Formation, HTTPS transit encryption, and S3 server-side encryption[cite: 8]."}, {"id": 8, "topic": "Amazon Athena", "subtopic": "Monitoring and Logging", "type": "multi", "q": "Which TWO services provide monitoring and operational auditing for Athena? (Select 2)", "options": ["A) Amazon CloudWatch for query metrics", "B) AWS CloudTrail for API auditing", "C) Amazon QuickSight for database engine patching", "D) AWS Storage Gateway for log archiving"], "answer": ["A", "B"], "exp": "CloudWatch tracks query performance metrics and CloudTrail audits Athena API calls[cite: 8]."}, {"id": 9, "topic": "Amazon Athena", "subtopic": "Use Cases", "type": "single", "q": "Which of the following is NOT a recommended use case for Amazon Athena?", "options": ["A) Ad hoc querying of log files in Amazon S3", "B) Analysing CloudTrail, ELB, and VPC Flow Logs", "C) Sub-millisecond stateful transaction processing for e-commerce checkouts", "D) Interactive data exploration and BI reporting"], "answer": "C", "exp": "Athena is an interactive analytical SQL service, not a low-latency OLTP transactional database engine[cite: 8]."}, {"id": 10, "topic": "Amazon Athena", "subtopic": "Pricing", "type": "single", "q": "Which of the following is NOT true regarding Amazon Athena pricing?", "options": ["A) Charged per TB of data scanned", "B) Partitioning and columnar compression reduce query costs", "C) Requires an hourly fee for maintaining idle query execution capacity", "D) Separate standard S3 charges apply for storing data and query results"], "answer": "C", "exp": "Athena has zero infrastructure provisioning charges or idle capacity fees; you are billed strictly per TB scanned[cite: 8]."}, {"id": 11, "topic": "Amazon Athena", "subtopic": "Integration with Other AWS Services", "type": "multi", "q": "Which TWO AWS services are directly integrated with Athena for visualization and governance? (Select 2)", "options": ["A) Amazon QuickSight", "B) AWS Snowcone", "C) AWS Lake Formation", "D) AWS Outposts Rack"], "answer": ["A", "C"], "exp": "Athena connects natively with Amazon QuickSight for dashboards and AWS Lake Formation for governance and access control[cite: 8]."}, {"id": 12, "topic": "Amazon Athena", "subtopic": "Best Practices & Exam Tips", "type": "single", "q": "Which statement represents a core best practice and exam tip for Athena?", "options": ["A) Always run queries on uncompressed raw text files", "B) Convert datasets to columnar formats (Parquet/ORC) and partition to reduce scan volume", "C) Invalidate S3 bucket versioning prior to running queries", "D) Route all queries through an EC2 bastion host"], "answer": "B", "exp": "Athena exam tips emphasize reducing data scanned by partitioning, compressing, and converting files to columnar formats[cite: 8]."}, {"id": 13, "topic": "AWS Data Exchange", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate characteristic of AWS Data Exchange?", "options": ["A) Fully managed service to find, subscribe to, and use third-party data in the cloud", "B) Helps consume datasets from published data providers without complex licensing", "C) A hardware appliance deployed on-premises to intercept WAN traffic", "D) Supports automated billing and entitlement workflows"], "answer": "C", "exp": "AWS Data Exchange is a cloud-native managed data service, not an on-premises network hardware appliance[cite: 8]."}, {"id": 14, "topic": "AWS Data Exchange", "subtopic": "Key Features", "type": "multi", "q": "Which TWO capabilities are key features of AWS Data Exchange? (Select 2)", "options": ["A) Direct delivery of data sets to Amazon S3", "B) Event notifications via Amazon EventBridge when new data is published", "C) Replacement of on-premises SAN arrays with iSCSI volumes", "D) Direct compilation of C++ code into FPGA hardware"], "answer": ["A", "B"], "exp": "Data Exchange delivers datasets directly to S3 and integrates with EventBridge to trigger downstream pipelines upon data publication[cite: 8]."}, {"id": 15, "topic": "AWS Data Exchange", "subtopic": "Data Sets and Revisions", "type": "single", "q": "In AWS Data Exchange, how is updated data structured and provided to consumers?", "options": ["A) As revisions within a dataset, containing assets like CSV, Parquet, or JSON", "B) As physical DVD media mailed through the postal service", "C) Exclusively as transient UDP stream packets", "D) Through mandatory schema rewrites into DynamoDB items"], "answer": "A", "exp": "Each data product contains datasets with one or more revisions (versions) containing data files in common formats[cite: 8]."}, {"id": 16, "topic": "AWS Data Exchange", "subtopic": "Subscriptions", "type": "multi", "q": "Which TWO statements regarding AWS Data Exchange subscriptions are true? (Select 2)", "options": ["A) Subscriptions can be free or paid with integrated AWS billing", "B) Entitlement grants access to export dataset revisions to S3", "C) Subscriptions require signing paper contracts with external couriers", "D) Subscribers must manually host licensing servers on EC2"], "answer": ["A", "B"], "exp": "AWS Data Exchange automates subscription billing via AWS Marketplace and grants entitlement to export revisions directly to S3[cite: 8]."}, {"id": 17, "topic": "AWS Data Exchange", "subtopic": "Data Delivery", "type": "single", "q": "Which of the following is NOT true regarding data delivery in AWS Data Exchange?", "options": ["A) Datasets are delivered directly to subscribers' S3 buckets", "B) Supports incremental updates as new revisions are released", "C) Delivered data can be queried using Athena, EMR, and Redshift Spectrum", "D) Requires configuring third-party FTP daemons on EC2 to receive files"], "answer": "D", "exp": "Data delivery is direct to S3 via managed AWS workflows, requiring no manual FTP or EC2 servers[cite: 8]."}, {"id": 18, "topic": "AWS Data Exchange", "subtopic": "Private Data Products", "type": "single", "q": "What is the primary purpose of Private Data Products in AWS Data Exchange?", "options": ["A) To share proprietary datasets with specific AWS accounts under custom pricing and terms", "B) To broadcast unencrypted financial data to all public AWS users", "C) To bypass AWS KMS encryption standards completely", "D) To convert relational tables into raw HTML web pages"], "answer": "A", "exp": "Private data products allow providers to share confidential or customized datasets directly with specific AWS accounts[cite: 8]."}, {"id": 19, "topic": "AWS Data Exchange", "subtopic": "Integration with Other AWS Services", "type": "multi", "q": "Which TWO services are commonly combined with AWS Data Exchange to process new data? (Select 2)", "options": ["A) Amazon EventBridge to trigger automated ETL workflows", "B) Amazon Athena to query delivered datasets in S3", "C) AWS Snowmobile to transport daily files", "D) AWS Direct Connect to lease physical dark fiber"], "answer": ["A", "B"], "exp": "Delivered S3 data is readily queried via Athena, and EventBridge automates ETL workflows when new revisions land[cite: 8]."}, {"id": 20, "topic": "AWS Data Exchange", "subtopic": "Security & Pricing", "type": "single", "q": "Which of the following is NOT a security or pricing aspect of AWS Data Exchange?", "options": ["A) IAM policies control subscription and export permissions", "B) S3 bucket policies secure the delivered data at rest", "C) Subscribers pay provider fees plus standard AWS data delivery charges", "D) Customers must pay a mandatory upfront license fee to browse public listings"], "answer": "D", "exp": "There are no upfront fees to browse the catalog or subscribe to free data products in AWS Data Exchange[cite: 8]."}, {"id": 21, "topic": "AWS Data Exchange", "subtopic": "Use Cases & Best Practices", "type": "multi", "q": "Which TWO use cases or best practices apply to AWS Data Exchange? (Select 2)", "options": ["A) Ingesting external demographic, market, or geospatial data into analytics pipelines", "B) Enabling S3 bucket versioning to track delivered revisions over time", "C) Running monolithic legacy mainframe batch jobs on bare metal", "D) Disabling CloudTrail logging to increase delivery speeds"], "answer": ["A", "B"], "exp": "Using third-party market/geospatial data and enabling S3 versioning on destination buckets are primary recommendations[cite: 8]."}, {"id": 22, "topic": "AWS Data Exchange", "subtopic": "Exam Tips", "type": "single", "q": "What is the key takeaway for AWS Data Exchange in the SAA-C03 exam?", "options": ["A) It is designed for streaming real-time IoT sensor telemetry with microsecond latency", "B) It automates finding, subscribing to, and loading third-party datasets directly into Amazon S3", "C) It manages internal MySQL master-slave replication topologies", "D) It converts monolithic applications into containerized microservices"], "answer": "B", "exp": "Exam scenarios test Data Exchange as the managed solution for subscribing to external third-party data delivered to S3[cite: 8]."}, {"id": 23, "topic": "AWS Data Pipeline", "subtopic": "What It Is & Key Features", "type": "single", "q": "Which of the following is NOT a key feature of AWS Data Pipeline?", "options": ["A) Orchestration service for data movement and transformation", "B) Allows scheduling of recurring data processing activities", "C) Built-in fault tolerance with retries and failure notifications", "D) Real-time, ultra-low-latency in-memory cache for relational queries"], "answer": "D", "exp": "AWS Data Pipeline is an orchestration workflow service for batch data processing and movement, not an in-memory cache[cite: 8]."}, {"id": 24, "topic": "AWS Data Pipeline", "subtopic": "Components", "type": "multi", "q": "Which TWO components are fundamental to defining an AWS Data Pipeline? (Select 2)", "options": ["A) Data Nodes to define data sources and destinations", "B) Activities to define units of work like copying or running EMR jobs", "C) NAT Gateways to terminate TCP traffic", "D) Origin Access Controls to restrict S3 public buckets"], "answer": ["A", "B"], "exp": "Core components of Data Pipeline include Pipelines, Activities, Data Nodes, Preconditions, Schedules, Resources, and Parameters[cite: 8]."}, {"id": 25, "topic": "AWS Data Pipeline", "subtopic": "Common Use Cases", "type": "single", "q": "Which of the following is NOT a typical use case for AWS Data Pipeline?", "options": ["A) Moving data from Amazon S3 to Amazon Redshift for analytics", "B) Running periodic ETL jobs on EMR clusters", "C) Archiving data from DynamoDB to S3 on a recurring schedule", "D) Serving web application DNS requests with latency-based failover"], "answer": "D", "exp": "DNS resolution and failover are handled by Amazon Route 53, not AWS Data Pipeline[cite: 8]."}, {"id": 26, "topic": "AWS Data Pipeline", "subtopic": "Supported Services & Task Runner", "type": "multi", "q": "Which TWO environments can execute tasks orchestrated by AWS Data Pipeline? (Select 2)", "options": ["A) AWS-managed compute resources provisioned automatically (e.g., EC2, EMR)", "B) On-premises data hosts running the Data Pipeline Task Runner package", "C) Edge CDN servers running CloudFront Functions", "D) Isolated IoT sensors without network connectivity"], "answer": ["A", "B"], "exp": "Data Pipeline can execute on AWS-managed resources or on-premises systems via the Task Runner application[cite: 8]."}, {"id": 27, "topic": "AWS Data Pipeline", "subtopic": "Scheduling & Retries", "type": "single", "q": "How does AWS Data Pipeline handle task scheduling and execution errors?", "options": ["A) Supports cron-like scheduling expressions, automatic retries, and SNS failure alerts", "B) Terminates the entire AWS account if an activity fails once", "C) Requires developers to write custom polling daemons on worker nodes", "D) Disallows dependent chaining between upstream and downstream activities"], "answer": "A", "exp": "Data Pipeline supports cron schedules, activity chaining/dependencies, automatic retry policies, and SNS alerts[cite: 8]."}, {"id": 28, "topic": "AWS Data Pipeline", "subtopic": "Security, Monitoring & Pricing", "type": "multi", "q": "Which TWO operational details apply to AWS Data Pipeline? (Select 2)", "options": ["A) Integrates with Amazon CloudWatch and S3 for activity logging", "B) Charges are based on pipeline run frequency and resource usage", "C) Disables IAM role delegation across all pipeline resources", "D) Automatically converts relational data into unencrypted public text"], "answer": ["A", "B"], "exp": "Data Pipeline logs activity in CloudWatch/S3, enforces IAM access control, and bills based on pipeline frequency and used resources[cite: 8]."}, {"id": 29, "topic": "AWS Data Pipeline", "subtopic": "Best Practices & Exam Tips", "type": "single", "q": "What is an architectural best practice when designing AWS Data Pipelines?", "options": ["A) Hardcode database credentials directly inside the pipeline activity definitions", "B) Use parameters to make pipeline definitions modular, configurable, and reusable", "C) Avoid setting preconditions so activities execute even if data is missing", "D) Disable retry policies to ensure immediate job termination upon minor network blips"], "answer": "B", "exp": "Parameters allow pipeline templates to be reused across environments, while preconditions ensure data exists before jobs start[cite: 8]."}, {"id": 30, "topic": "Amazon EMR", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding Amazon EMR?", "options": ["A) Fully managed big data platform running open-source frameworks like Hadoop and Spark", "B) Processes vast amounts of data quickly and cost-effectively", "C) A proprietary relational database engine replacing PostgreSQL", "D) Decouples storage and compute using EMRFS"], "answer": "C", "exp": "Amazon EMR is a managed big data clustering platform, not a relational database engine[cite: 8]."}, {"id": 31, "topic": "Amazon EMR", "subtopic": "Key Features", "type": "multi", "q": "Which TWO features are characteristic of Amazon EMR? (Select 2)", "options": ["A) EMR Managed Scaling to automatically adjust cluster nodes based on workload", "B) Support for Spot Instances for significant cost reductions", "C) Inability to integrate with AWS Lake Formation", "D) Strictly fixed-size compute clusters with no resizing capabilities"], "answer": ["A", "B"], "exp": "EMR features Managed Scaling, Spot instance integration, resizable clusters, and deep integration with Lake Formation[cite: 8]."}, {"id": 32, "topic": "Amazon EMR", "subtopic": "Core Components", "type": "single", "q": "In an Amazon EMR cluster, which node type processes tasks and runs Hadoop jobs but does NOT store data in HDFS?", "options": ["A) Master Node", "B) Core Node", "C) Task Node", "D) Storage Gateway Node"], "answer": "C", "exp": "Task Nodes only process data and do not host HDFS partitions, making them safe to run on Spot instances without risk of HDFS data loss[cite: 8]."}, {"id": 33, "topic": "Amazon EMR", "subtopic": "Deployment and Management", "type": "multi", "q": "Which TWO deployment and customization capabilities are supported by Amazon EMR? (Select 2)", "options": ["A) Bootstrap actions to install software and customize nodes at launch", "B) Cluster Auto Termination to automatically shut down idle clusters", "C) Mandatory deployment within single-AZ subnets only", "D) Manual hardware replacement required upon server failure"], "answer": ["A", "B"], "exp": "EMR supports bootstrap actions for customizing instances at launch and auto-termination to prevent paying for idle clusters[cite: 8]."}, {"id": 34, "topic": "Amazon EMR", "subtopic": "Data Storage", "type": "single", "q": "Which storage system provides ephemeral storage located directly on the local disks of EMR cluster instances?", "options": ["A) HDFS (Hadoop Distributed File System)", "B) EMRFS backed by Amazon S3", "C) AWS Snowball Edge", "D) Amazon S3 Glacier Deep Archive"], "answer": "A", "exp": "HDFS runs across the master and core nodes of an EMR cluster to provide ephemeral cluster storage[cite: 8]."}, {"id": 35, "topic": "Amazon EMR", "subtopic": "Processing Frameworks", "type": "multi", "q": "Which TWO open-source distributed frameworks are supported natively on Amazon EMR? (Select 2)", "options": ["A) Apache Spark for in-memory processing", "B) Apache Presto for low-latency SQL queries", "C) Microsoft Internet Information Services (IIS)", "D) Apple Final Cut Pro"], "answer": ["A", "B"], "exp": "EMR supports open-source big data tools including Spark, Presto, Hive, HBase, Hadoop MapReduce, and Flink[cite: 8]."}, {"id": 36, "topic": "Amazon EMR", "subtopic": "Security", "type": "single", "q": "Which of the following is NOT an EMR security feature supported on AWS?", "options": ["A) Kerberos authentication for user and job access", "B) Encryption at rest using AWS KMS and in transit using TLS", "C) Disabling all IAM instance profiles on cluster EC2 nodes", "D) Integration with AWS Lake Formation for centralized table permissions"], "answer": "C", "exp": "EMR clusters require IAM service and instance roles to securely interact with AWS APIs and storage[cite: 8]."}, {"id": 37, "topic": "Amazon EMR", "subtopic": "Monitoring and Logging", "type": "multi", "q": "Which TWO tools provide performance metrics and application visibility for Amazon EMR? (Select 2)", "options": ["A) Amazon CloudWatch metrics and alarms", "B) Ganglia and Spark web UIs", "C) Amazon Polly speech synthesis console", "D) AWS WAF rule group inspector"], "answer": ["A", "B"], "exp": "EMR clusters export metrics to CloudWatch and support open-source interfaces like Ganglia and the Spark UI[cite: 8]."}, {"id": 38, "topic": "Amazon EMR", "subtopic": "Scaling and Flexibility", "type": "single", "q": "How does EMR Managed Scaling optimize cluster performance?", "options": ["A) Automatically resizes the cluster by evaluating workload metrics and adding or removing instances", "B) Converts all batch queries into static HTML pages", "C) Scales instance storage by automatically purchasing additional physical SAN disks", "D) Enforces single-node deployment during peak processing times"], "answer": "A", "exp": "EMR Managed Scaling continuously evaluates cluster metrics to automatically adjust compute capacity[cite: 8]."}, {"id": 39, "topic": "Amazon EMR", "subtopic": "Cost Optimization", "type": "multi", "q": "Which TWO strategies help reduce Amazon EMR operating costs? (Select 2)", "options": ["A) Utilizing EC2 Spot Instances for task nodes", "B) Enabling Cluster Auto Termination for transient workloads", "C) Running multi-master clusters for non-critical development jobs", "D) Writing all raw intermediate data to S3 Standard storage with no compression"], "answer": ["A", "B"], "exp": "Using Spot instances on task nodes and auto-terminating idle clusters drastically reduces big data operational costs[cite: 8]."}, {"id": 40, "topic": "Amazon EMR", "subtopic": "Integrations", "type": "single", "q": "Which AWS service is commonly integrated with EMR to automate end-to-end workflow orchestration?", "options": ["A) AWS Step Functions", "B) AWS Network Firewall", "C) Amazon Polly", "D) Amazon Cognito User Pools"], "answer": "A", "exp": "AWS Step Functions provides native tasks to orchestrate EMR cluster creation, job step execution, and cluster termination[cite: 8]."}, {"id": 41, "topic": "Amazon EMR", "subtopic": "Use Cases & Best Practices", "type": "multi", "q": "Which TWO use cases or best practices are recommended for Amazon EMR? (Select 2)", "options": ["A) Large-scale batch processing, ETL, and machine learning using Spark MLlib", "B) Decoupling storage and compute by keeping permanent data in Amazon S3 via EMRFS", "C) Low-latency transactional ACID shopping carts with millions of updates per second", "D) Running static front-end single page JavaScript applications"], "answer": ["A", "B"], "exp": "EMR is designed for distributed ETL, big data analytics, and machine learning, best paired with S3 decoupled storage[cite: 8]."}, {"id": 42, "topic": "Amazon EMR", "subtopic": "Exam Tips", "type": "single", "q": "What is a critical architectural distinction tested on the exam regarding Amazon EMR?", "options": ["A) Core nodes can be terminated abruptly on Spot instances without risk to HDFS data integrity", "B) Task nodes do not store HDFS data, making them ideal for Spot Instances to reduce costs without data loss risk", "C) EMR clusters cannot communicate with the AWS Glue Data Catalog", "D) EMRFS is limited to storing small configuration files under 10 MB"], "answer": "B", "exp": "Task nodes perform compute only and hold no HDFS data, making them resilient to Spot instance interruptions[cite: 8]."}, {"id": 43, "topic": "AWS Glue", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding AWS Glue?", "options": ["A) Fully managed, serverless data integration and ETL service", "B) Automatically discovers, prepares, and integrates data for analytics", "C) Built-in persistent metadata storage via the AWS Glue Data Catalog", "D) Requires provisioning and configuring EC2 cluster operating systems manually"], "answer": "D", "exp": "AWS Glue is serverless; users do not manage or configure underlying EC2 instances or operating systems[cite: 8]."}, {"id": 44, "topic": "AWS Glue", "subtopic": "Key Features", "type": "multi", "q": "Which TWO capabilities are key features of AWS Glue? (Select 2)", "options": ["A) Automated ETL processing powered by Apache Spark under the hood", "B) Schema discovery and evolution management using Crawlers", "C) Hardware level SAN storage array virtualization", "D) Edge DNS routing failover policies"], "answer": ["A", "B"], "exp": "AWS Glue runs serverless Spark ETL jobs and automatically infers schema changes using Crawlers[cite: 8]."}, {"id": 45, "topic": "AWS Glue", "subtopic": "AWS Glue Data Catalog", "type": "single", "q": "What is the AWS Glue Data Catalog?", "options": ["A) A centralized, persistent metadata repository for table definitions, schemas, and metrics across data sources", "B) A local cache file stored on client desktop machines", "C) An in-memory cache service replacing Redis", "D) An encrypted physical vault located in AWS data centers"], "answer": "A", "exp": "The AWS Glue Data Catalog is a persistent metadata store shared across Athena, EMR, and Redshift Spectrum[cite: 8]."}, {"id": 46, "topic": "AWS Glue", "subtopic": "AWS Glue Crawlers", "type": "multi", "q": "Which TWO statements regarding AWS Glue Crawlers are accurate? (Select 2)", "options": ["A) They connect to data stores (S3, JDBC, DynamoDB) to classify data and infer schemas", "B) They can be scheduled or triggered on demand to handle schema evolution", "C) They compile Java applications directly into EC2 AMIs", "D) They replace the need for IAM security policies"], "answer": ["A", "B"], "exp": "Crawlers automatically connect to data stores, determine formats and schemas, and write tables to the catalog[cite: 8]."}, {"id": 47, "topic": "AWS Glue", "subtopic": "ETL Jobs & Job Bookmarks", "type": "single", "q": "What is the primary function of Job Bookmarks in AWS Glue ETL jobs?", "options": ["A) To maintain state and track previously processed data, preventing duplicate processing during scheduled runs", "B) To bookmark favorite AWS console pages in the web browser", "C) To store database passwords in cleartext for fast API retrieval", "D) To automatically scale EC2 instance types"], "answer": "A", "exp": "Job bookmarks track processed data between ETL job runs to prevent reprocessing old or duplicate records[cite: 8]."}, {"id": 48, "topic": "AWS Glue", "subtopic": "AWS Glue DataBrew", "type": "multi", "q": "Which TWO features describe AWS Glue DataBrew? (Select 2)", "options": ["A) A visual, no-code data preparation tool for cleaning and normalizing data", "B) Over 250 pre-built transformations for deduplication and formatting", "C) An automated hardware network router for hybrid clouds", "D) A tool for compiling bare-metal Linux kernels"], "answer": ["A", "B"], "exp": "DataBrew provides a visual, no-code interface with over 250 pre-built transformations to clean and normalize datasets[cite: 8]."}, {"id": 49, "topic": "AWS Glue", "subtopic": "AWS Glue Studio", "type": "single", "q": "What capability does AWS Glue Studio provide to developers?", "options": ["A) A visual, drag-and-drop interface for authoring, running, and monitoring ETL jobs", "B) A tool to configure VPC peering and transit gateways visually", "C) A portal for downloading compliance audit certificates", "D) A hardware diagnostic console for inspecting physical server racks"], "answer": "A", "exp": "AWS Glue Studio provides a visual drag-and-drop interface to create, run, and monitor serverless ETL workflows[cite: 8]."}, {"id": 50, "topic": "AWS Glue", "subtopic": "Triggers and Workflows", "type": "multi", "q": "Which TWO triggers can initiate an AWS Glue ETL workflow? (Select 2)", "options": ["A) Time-based recurring schedules (cron expressions)", "B) Event-based triggers, such as job completion or data arrival notifications", "C) Manual physical power button cycling on server racks", "D) Changes in Route 53 DNS domain ownership"], "answer": ["A", "B"], "exp": "Glue workflows and jobs can be triggered on a time schedule, on demand, or via event-driven conditions[cite: 8]."}, {"id": 51, "topic": "AWS Glue", "subtopic": "Security & Pricing", "type": "single", "q": "Which metric is the primary billing dimension for AWS Glue ETL jobs?", "options": ["A) Data Processing Units (DPUs) consumed per job run hour", "B) Number of physical CPU sockets allocated on dedicated hosts", "C) Flat monthly license fee per table in the Data Catalog", "D) Total number of VPC peering links configured"], "answer": "A", "exp": "AWS Glue charges based on the number of Data Processing Units (DPUs) used per hour, billed per second[cite: 8]."}, {"id": 52, "topic": "AWS Glue", "subtopic": "Best Practices & Exam Tips", "type": "multi", "q": "Which TWO best practices should be implemented for AWS Glue? (Select 2)", "options": ["A) Use Job Bookmarks to prevent reprocessing duplicate data in ETL pipelines", "B) Integrate with AWS Lake Formation for centralized, fine-grained access governance", "C) Store unencrypted credentials directly in Python ETL scripts", "D) Discontinue the use of Crawlers when schemas evolve"], "answer": ["A", "B"], "exp": "Best practices include enabling Job Bookmarks for incremental ETL and integrating with Lake Formation for governance[cite: 8]."}, {"id": 53, "topic": "Amazon Kinesis", "subtopic": "What It Is", "type": "single", "q": "What is the primary architectural purpose of the Amazon Kinesis suite?", "options": ["A) Real-time ingestion, processing, and analysis of streaming data at massive scale", "B) Long-term archiving of cold regulatory data with multi-hour retrieval times", "C) Hosting static web applications using serverless buckets", "D) Managing Microsoft Windows Active Directory domain trusts"], "answer": "A", "exp": "Amazon Kinesis is designed specifically for real-time ingestion, streaming analysis, and data movement at scale[cite: 8]."}, {"id": 54, "topic": "Amazon Kinesis", "subtopic": "Kinesis Data Streams (KDS) Architecture", "type": "single", "q": "What is the base throughput capacity of a single provisioned shard in Amazon Kinesis Data Streams?", "options": ["A) 1 MB/sec write (or 1,000 records/sec) and 2 MB/sec read", "B) 10 MB/sec write and 50 MB/sec read", "C) 500 KB/sec write and 500 KB/sec read", "D) Unlimited throughput per shard with no ceilings"], "answer": "A", "exp": "Each shard in Kinesis Data Streams provides up to 1 MB/sec write capacity and 2 MB/sec read capacity[cite: 8]."}, {"id": 55, "topic": "Amazon Kinesis", "subtopic": "KDS Consumers & Enhanced Fan-Out", "type": "multi", "q": "Which TWO statements regarding consumers and Enhanced Fan-Out in Kinesis Data Streams are correct? (Select 2)", "options": ["A) Enhanced Fan-Out provides dedicated throughput of 2 MB/sec per shard per registered consumer", "B) AWS Lambda can act as a native consumer of Kinesis Data Streams", "C) Enhanced Fan-Out forces all consumers to share a single pooled HTTP connection", "D) Consumers must poll using on-premises tape drivers"], "answer": ["A", "B"], "exp": "Enhanced Fan-Out gives each consumer a dedicated 2 MB/sec throughput pipe per shard using HTTP/2 push, and Lambda integrates natively[cite: 8]."}, {"id": 56, "topic": "Amazon Kinesis", "subtopic": "Kinesis Data Firehose", "type": "single", "q": "Which of the following is NOT a characteristic of Amazon Kinesis Data Firehose?", "options": ["A) Fully managed, auto-scaling streaming delivery service", "B) Requires manual sharding, partition key design, and capacity resizing", "C) Delivers directly to S3, Redshift, OpenSearch, Splunk, and HTTP endpoints", "D) Supports inline data transformation using AWS Lambda"], "answer": "B", "exp": "Kinesis Data Firehose is serverless with zero shards to manage; scaling is handled completely automatically by AWS[cite: 8]."}, {"id": 57, "topic": "Amazon Kinesis", "subtopic": "Kinesis Data Analytics", "type": "multi", "q": "Which TWO statements regarding Amazon Kinesis Data Analytics are true? (Select 2)", "options": ["A) Enables running continuous ANSI SQL queries on real-time streaming data", "B) Can output transformed results directly to Kinesis Data Streams, Firehose, or Lambda", "C) Requires pre-loading streaming data into an RDS PostgreSQL database", "D) Only supports batch processing of files delivered once per week"], "answer": ["A", "B"], "exp": "Kinesis Data Analytics executes SQL queries on live streams and emits filtered/aggregated data to downstream sinks[cite: 8]."}, {"id": 58, "topic": "Amazon Kinesis", "subtopic": "Kinesis Video Streams", "type": "single", "q": "Which service integration allows Amazon Kinesis Video Streams to perform real-time facial recognition and object detection?", "options": ["A) Amazon Rekognition Video", "B) AWS Storage Gateway", "C) AWS CloudFormation", "D) Amazon RDS Performance Insights"], "answer": "A", "exp": "Kinesis Video Streams integrates natively with Amazon Rekognition Video for machine learning-based video analytics[cite: 8]."}, {"id": 59, "topic": "Amazon Kinesis", "subtopic": "Data Retention and Replay", "type": "single", "q": "What is the default and maximum data retention period for Amazon Kinesis Data Streams?", "options": ["A) Default 24 hours, configurable up to 365 days (or 7 days as detailed in basic tiers)", "B) Default 10 minutes, configurable up to 1 hour", "C) Default 30 days, configurable up to 10 years", "D) Zero retention; data is deleted immediately upon ingestion"], "answer": "A", "exp": "Kinesis Data Streams retains data for 24 hours by default, allowing historical data replay, and can be extended up to 365 days[cite: 3, 8]."}, {"id": 60, "topic": "Amazon Kinesis", "subtopic": "Security and Scaling Modes", "type": "multi", "q": "Which TWO capacity and security options are supported in Kinesis Data Streams? (Select 2)", "options": ["A) Server-Side Encryption (SSE) using AWS KMS", "B) On-Demand capacity mode for automatic shard management", "C) Mandatory unencrypted plaintext transmission across VPCs", "D) Hardcoded access keys embedded in producer firmware"], "answer": ["A", "B"], "exp": "Kinesis Data Streams supports KMS encryption at rest and provides an On-Demand mode that scales capacity automatically[cite: 3, 8]."}, {"id": 61, "topic": "Amazon Kinesis", "subtopic": "Kinesis Service Comparison", "type": "single", "q": "When comparing Kinesis Data Streams and Kinesis Data Firehose, what is a fundamental difference?", "options": ["A) KDS provides custom processing and replayable sharded streams; Firehose is a managed delivery pipe without persistent storage", "B) Firehose requires manual shard management; KDS requires no shards", "C) KDS can only deliver to S3; Firehose cannot deliver to S3", "D) KDS does not support integration with AWS Lambda"], "answer": "A", "exp": "Kinesis Data Streams stores records in shards for custom processing and replay; Firehose directly loads data into targets without storage[cite: 8]."}, {"id": 62, "topic": "Amazon Kinesis", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario best points to choosing Amazon Kinesis Data Firehose on the exam?", "options": ["A) Loading streaming data into S3, Redshift, or OpenSearch with near-real-time latency (~60s) and zero infrastructure management", "B) Complex sub-second ordered message exchanges between on-premises mainframes", "C) Hosting static marketing websites", "D) Managing Kubernetes cluster ingress controllers"], "answer": "A", "exp": "Firehose is the simplest, fully managed mechanism to stream data into S3, Redshift, OpenSearch, and Splunk with automated scaling[cite: 8]."}, {"id": 63, "topic": "AWS Lake Formation", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate statement regarding AWS Lake Formation?", "options": ["A) Fully managed service that simplifies setting up, securing, and managing data lakes", "B) Catalogs and secures data stored in Amazon S3 for analytics and machine learning", "C) A hardware firewall appliance deployed in customer branch offices", "D) Integrates tightly with AWS Glue, Athena, and Amazon Redshift Spectrum"], "answer": "C", "exp": "Lake Formation is a managed governance and security orchestration service for data lakes, not a hardware appliance[cite: 8]."}, {"id": 64, "topic": "AWS Lake Formation", "subtopic": "Key Features & Access Control", "type": "multi", "q": "Which TWO access control capabilities are provided by AWS Lake Formation? (Select 2)", "options": ["A) Fine-grained permissions at the table, column, and row level", "B) Centralized permissions managed within Lake Formation independent of S3 bucket policies", "C) Disabling all IAM security roles across the organization", "D) Public unauthenticated read access enabled by default on all data lakes"], "answer": ["A", "B"], "exp": "Lake Formation provides fine-grained row/column level filtering and central security management without modifying IAM policies[cite: 8]."}, {"id": 65, "topic": "AWS Lake Formation", "subtopic": "Blueprints & Workflows", "type": "single", "q": "What do pre-built Blueprints in AWS Lake Formation allow users to do?", "options": ["A) Automate data ingestion and workflow creation from sources like Amazon RDS or DynamoDB", "B) Generate CloudFormation templates for physical router installations", "C) Build 3D CAD architectural models of AWS data centers", "D) Deploy standalone EC2 web servers without security groups"], "answer": "A", "exp": "Lake Formation blueprints automate the discovery, extraction, and loading of data from relational and NoSQL databases into the data lake[cite: 8]."}, {"id": 66, "topic": "AWS Lake Formation", "subtopic": "Governed Tables & Transactions", "type": "multi", "q": "Which TWO capabilities are supported on Governed Tables in AWS Lake Formation? (Select 2)", "options": ["A) ACID transaction support across data lake operations", "B) Automatic row-level conflict resolution and consistency", "C) Converting data directly into uncompressed legacy tape formats", "D) Mandatory single-AZ storage placement"], "answer": ["A", "B"], "exp": "Governed tables in Lake Formation support ACID transactions, ensuring multi-table consistency and automated data isolation[cite: 8]."}, {"id": 67, "topic": "AWS Lake Formation", "subtopic": "Data Filtering & Performance", "type": "single", "q": "How does AWS Lake Formation implement row- and column-level security for different consumers?", "options": ["A) By filtering data dynamically during query execution without duplicating underlying S3 files", "B) By creating duplicate S3 buckets for every single IAM user", "C) By redacting text files manually through AWS Support tickets", "D) By requiring consumers to run local proxy servers on their laptops"], "answer": "A", "exp": "Lake Formation enforces row and column level permissions on the fly, eliminating the need to duplicate data partitions[cite: 8]."}, {"id": 68, "topic": "AWS Lake Formation", "subtopic": "Auditing and Compliance", "type": "multi", "q": "Which TWO AWS governance tools integrate with Lake Formation to track data access and security? (Select 2)", "options": ["A) AWS CloudTrail for logging data access and administrative API calls", "B) AWS Key Management Service (KMS) for data encryption key management", "C) Amazon Elastic Transcoder for video conversion", "D) AWS Snowball Edge for offline file syncing"], "answer": ["A", "B"], "exp": "Lake Formation audits data access through CloudTrail and relies on AWS KMS for encrypting underlying data lake assets[cite: 8]."}, {"id": 69, "topic": "AWS Lake Formation", "subtopic": "Exam Tips", "type": "single", "q": "What is the core exam takeaway regarding AWS Lake Formation permissions?", "options": ["A) Permissions are defined centrally in Lake Formation and enforce column/row level security across Athena and EMR", "B) Permissions can only be managed by modifying underlying S3 bucket ACLs", "C) Lake Formation does not support integration with the AWS Glue Data Catalog", "D) Lake Formation requires migrating all S3 data into an RDS MySQL instance"], "answer": "A", "exp": "On the SAA-C03 exam, Lake Formation is the primary answer for centralized, fine-grained (row/column) data lake security[cite: 8]."}, {"id": 70, "topic": "Amazon MSK", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate description of Amazon MSK?", "options": ["A) Fully managed Apache Kafka service on AWS", "B) Removes the operational overhead of setting up, scaling, and managing Kafka brokers", "C) Replaces Kafka APIs with incompatible proprietary AWS messaging formats", "D) Maintains high availability with replication across multiple Availability Zones"], "answer": "C", "exp": "Amazon MSK supports 100% open-source Apache Kafka APIs, ensuring complete compatibility with existing Kafka tools and code[cite: 8]."}, {"id": 71, "topic": "Amazon MSK", "subtopic": "Key Features", "type": "multi", "q": "Which TWO management capabilities are automated by Amazon MSK? (Select 2)", "options": ["A) Broker failure detection and automated node recovery", "B) Software patching and ZooKeeper cluster management", "C) Automatic generation of application frontend HTML code", "D) Deploying physical network cables between AWS data centers"], "answer": ["A", "B"], "exp": "MSK automates broker provisioning, failure recovery, software patching, and underlying ZooKeeper coordination[cite: 3, 8]."}, {"id": 72, "topic": "Amazon MSK", "subtopic": "MSK Cluster Components", "type": "single", "q": "Which component in an Amazon MSK cluster coordinates the brokers and maintains cluster metadata?", "options": ["A) Apache ZooKeeper nodes", "B) AWS Transit Gateway", "C) NAT Gateway", "D) Application Load Balancer"], "answer": "A", "exp": "Apache ZooKeeper nodes manage cluster state, elect leaders, and coordinate Kafka brokers within an MSK cluster[cite: 3, 8]."}, {"id": 73, "topic": "Amazon MSK", "subtopic": "MSK Serverless", "type": "multi", "q": "Which TWO statements regarding Amazon MSK Serverless are true? (Select 2)", "options": ["A) Automatically scales compute and storage capacity based on throughput demands", "B) Eliminates the need to size, provision, or manage broker instances", "C) Charges a mandatory flat fee of $1,000 per month regardless of usage", "D) Disallows integration with standard Kafka client libraries"], "answer": ["A", "B"], "exp": "MSK Serverless automatically scales up and down, eliminates broker management, and retains compatibility with Kafka clients[cite: 8]."}, {"id": 74, "topic": "Amazon MSK", "subtopic": "Integration with AWS Services", "type": "single", "q": "Which service integration enables enforcing data schemas on records flowing through Amazon MSK?", "options": ["A) AWS Glue Schema Registry", "B) Amazon Cognito Identity Pools", "C) AWS Artifact", "D) Amazon Route 53 Traffic Flow"], "answer": "A", "exp": "AWS Glue Schema Registry integrates with MSK to centrally discover, control, and evolve streaming data schemas[cite: 8]."}, {"id": 75, "topic": "Amazon MSK", "subtopic": "Security", "type": "multi", "q": "Which TWO security mechanisms are natively supported by Amazon MSK? (Select 2)", "options": ["A) Encryption at rest using AWS KMS keys", "B) In-transit encryption using TLS between clients and brokers", "C) Mandatory public internet exposure for all Kafka topic endpoints", "D) Storing administrator passwords in plain text in VPC route tables"], "answer": ["A", "B"], "exp": "Amazon MSK enforces security through KMS encryption at rest, TLS in transit, VPC isolation, and IAM authentication[cite: 8]."}, {"id": 76, "topic": "Amazon MSK", "subtopic": "Monitoring and Logging", "type": "single", "q": "Where can broker logs from Amazon MSK clusters be streamed for centralized analysis?", "options": ["A) Amazon CloudWatch Logs, Amazon S3, or Amazon Kinesis Data Firehose", "B) Amazon Route 53 Resolver logs exclusively", "C) AWS Systems Manager Parameter Store", "D) AWS Secrets Manager"], "answer": "A", "exp": "MSK broker logs can be delivered to CloudWatch Logs, S3 buckets, or streamed through Kinesis Data Firehose[cite: 8]."}, {"id": 77, "topic": "Amazon MSK", "subtopic": "Performance and Scaling", "type": "multi", "q": "How can an administrator scale a provisioned Amazon MSK cluster? (Select 2)", "options": ["A) Adjusting EBS storage volume sizes attached to brokers", "B) Scaling out horizontally by adding more brokers to the cluster", "C) Disabling multi-AZ replication to increase raw clock speed", "D) Downgrading the Apache Kafka version dynamically during high load"], "answer": ["A", "B"], "exp": "Provisioned MSK clusters scale horizontally by adding brokers and vertically by expanding EBS broker storage[cite: 8]."}, {"id": 78, "topic": "Amazon MSK", "subtopic": "Pricing & Best Practices", "type": "single", "q": "Which of the following is a recommended best practice for Amazon MSK?", "options": ["A) Deploy brokers across multiple Availability Zones to ensure high availability and data durability", "B) Run production workloads exclusively on single-broker clusters", "C) Store broker credentials in unversioned public S3 buckets", "D) Disable TLS encryption in transit to maximize network bandwidth"], "answer": "A", "exp": "Multi-AZ broker deployment is a foundational reliability best practice for production Kafka clusters[cite: 3, 8]."}, {"id": 79, "topic": "Amazon MSK", "subtopic": "Exam Tips", "type": "single", "q": "When is Amazon MSK preferred over Amazon Kinesis Data Streams in an exam scenario?", "options": ["A) When the architecture requires migration of existing Apache Kafka applications without rewriting producer/consumer code", "B) When building simple serverless pipelines that require no operational tuning whatsoever", "C) When streaming video camera feeds to Amazon Rekognition", "D) When hosting static assets for mobile web applications"], "answer": "A", "exp": "MSK is the ideal choice when compatibility with existing open-source Apache Kafka applications and tooling is required[cite: 8]."}, {"id": 80, "topic": "Amazon OpenSearch Service", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate statement regarding Amazon OpenSearch Service?", "options": ["A) Fully managed service to deploy, operate, and scale OpenSearch and Elasticsearch clusters", "B) Used for application search, log analytics, and real-time monitoring", "C) Fully integrated with OpenSearch Dashboards and Kibana", "D) A batch ETL tool used exclusively to compile Java code into Docker containers"], "answer": "D", "exp": "Amazon OpenSearch Service is an operational search and log analytics engine, not a container compiler[cite: 8]."}, {"id": 81, "topic": "Amazon OpenSearch Service", "subtopic": "Key Features", "type": "multi", "q": "Which TWO features are characteristic of Amazon OpenSearch Service? (Select 2)", "options": ["A) In-place version upgrades for supported OpenSearch and Elasticsearch versions", "B) Auto-Tune for automated cluster performance optimization", "C) Mandatory local desktop software licensing for all query users", "D) Inability to integrate with Amazon VPC private subnets"], "answer": ["A", "B"], "exp": "OpenSearch supports in-place engine upgrades, Auto-Tune optimization, multi-AZ clustering, and VPC deployments[cite: 8]."}, {"id": 82, "topic": "Amazon OpenSearch Service", "subtopic": "Core Concepts", "type": "single", "q": "In Amazon OpenSearch Service, what is an Index?", "options": ["A) A collection of JSON documents with similar characteristics", "B) A physical server chassis located in a local telecommunication facility", "C) A DNS record managed by Amazon Route 53", "D) An IAM permission policy granting root administrative rights"], "answer": "A", "exp": "An index is a logical collection of documents sharing similar characteristics, divided into shards and replicas[cite: 8]."}, {"id": 83, "topic": "Amazon OpenSearch Service", "subtopic": "Deployment and Scaling", "type": "multi", "q": "Which TWO node configurations improve resiliency in an Amazon OpenSearch Service domain? (Select 2)", "options": ["A) Dedicated master nodes to manage cluster state and prevent split-brain conditions", "B) Multi-AZ deployments with replica shards distributed across Availability Zones", "C) Running single-node instances without replica shards", "D) Disabling automated snapshot backups to Amazon S3"], "answer": ["A", "B"], "exp": "Dedicated master nodes and multi-AZ deployments with replica shards are essential for high availability and fault tolerance[cite: 4, 8]."}, {"id": 84, "topic": "Amazon OpenSearch Service", "subtopic": "UltraWarm and Cold Storage", "type": "single", "q": "What is the primary benefit of the UltraWarm storage tier in Amazon OpenSearch Service?", "options": ["A) Provides cost-effective read-only storage backed by S3 while keeping data interactive and queryable", "B) Increases write throughput for real-time transactional indexing", "C) Replaces all data nodes with ephemeral instance store volumes", "D) Enables sub-millisecond in-memory cache clustering"], "answer": "A", "exp": "UltraWarm lowers the cost of storing large volumes of historical log data in S3 while remaining queryable via OpenSearch Dashboards[cite: 8]."}, {"id": 85, "topic": "Amazon OpenSearch Service", "subtopic": "Security", "type": "multi", "q": "Which TWO security capabilities are supported by Amazon OpenSearch Service? (Select 2)", "options": ["A) Node-to-node encryption and encryption at rest using AWS KMS", "B) Amazon Cognito integration for authenticating users to OpenSearch Dashboards", "C) Disabling all HTTPS encryption to improve query latencies", "D) Storing credentials in unencrypted text files on root volumes"], "answer": ["A", "B"], "exp": "OpenSearch supports KMS encryption at rest, node-to-node TLS encryption, fine-grained access control, and Cognito authentication[cite: 8]."}, {"id": 86, "topic": "Amazon OpenSearch Service", "subtopic": "Monitoring and Logging", "type": "single", "q": "Which feature helps identify search and indexing bottlenecks in Amazon OpenSearch Service?", "options": ["A) Slow logs published to Amazon CloudWatch Logs", "B) Amazon Polly audio reports", "C) AWS Cost Explorer billing alerts", "D) Route 53 health check alarms"], "answer": "A", "exp": "Slow logs provide deep visibility into slow-running search and indexing operations, published to CloudWatch Logs[cite: 8]."}, {"id": 87, "topic": "Amazon OpenSearch Service", "subtopic": "Data Ingestion", "type": "multi", "q": "Which TWO mechanisms are commonly used to ingest streaming data into Amazon OpenSearch Service? (Select 2)", "options": ["A) Amazon Kinesis Data Firehose direct delivery", "B) Logstash or open-source log forwarders like Fluentd and Beats", "C) Direct physical courier shipment via Snowmobile", "D) Mounting S3 Glacier vaults as local ext4 hard drives"], "answer": ["A", "B"], "exp": "Kinesis Data Firehose, Logstash, Fluentd, and Beats are standard ingestion methods for Amazon OpenSearch Service[cite: 8]."}, {"id": 88, "topic": "Amazon OpenSearch Service", "subtopic": "Querying and Analytics", "type": "single", "q": "Which visualization tool is natively integrated with Amazon OpenSearch Service for viewing logs and metrics?", "options": ["A) OpenSearch Dashboards (or Kibana)", "B) AWS Systems Manager Session Manager", "C) Amazon QuickSight Mobile Editor only", "D) AWS Secrets Manager console"], "answer": "A", "exp": "OpenSearch Dashboards (and Kibana for legacy Elasticsearch) are integrated natively into the service for visualization[cite: 8]."}, {"id": 89, "topic": "Amazon OpenSearch Service", "subtopic": "Pricing & Best Practices", "type": "multi", "q": "Which TWO practices optimize costs and stability in Amazon OpenSearch Service? (Select 2)", "options": ["A) Migrating older, infrequently queried indices from hot storage to UltraWarm and Cold storage", "B) Sizing dedicated master nodes appropriately to prevent cluster management instability", "C) Provisioning all nodes in a single Availability Zone without replicas", "D) Disabling automated daily S3 snapshots"], "answer": ["A", "B"], "exp": "Tiering data into UltraWarm/Cold storage and provisioning dedicated master nodes ensure cost efficiency and stability[cite: 8]."}, {"id": 90, "topic": "Amazon OpenSearch Service", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary architectural scenario that indicates using Amazon OpenSearch Service on the exam?", "options": ["A) Storing petabyte-scale structured transactional records with strict ACID semantics", "B) Log analytics, operational dashboards, full-text application search, and real-time SIEM event ingestion", "C) Provisioning high-performance Windows network shares via SMB protocol", "D) Running serverless Python microservices triggered by HTTP endpoints"], "answer": "B", "exp": "OpenSearch is the exam-standard service for log analytics, operational monitoring, and full-text search[cite: 8]."}, {"id": 91, "topic": "Amazon QuickSight", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate statement regarding Amazon QuickSight?", "options": ["A) Fully managed, serverless business intelligence (BI) service", "B) Enables creating and publishing interactive dashboards and visualizations", "C) Requires customers to patch Windows servers hosting the BI reporting engine", "D) Features a pay-per-session pricing model for dashboard readers"], "answer": "C", "exp": "QuickSight is fully managed and serverless; there are no underlying servers or software installations to manage[cite: 8]."}, {"id": 92, "topic": "Amazon QuickSight", "subtopic": "Key Features", "type": "multi", "q": "Which TWO features are characteristic of Amazon QuickSight? (Select 2)", "options": ["A) SPICE in-memory calculation engine for high-speed performance", "B) Machine Learning Insights for automated anomaly detection and forecasting", "C) Direct physical attachment of SAN storage cables to client workstations", "D) Mandatory fixed licensing fees of $10,000 per user"], "answer": ["A", "B"], "exp": "QuickSight features the SPICE in-memory calculation engine and ML Insights for forecasting and anomaly detection[cite: 8]."}, {"id": 93, "topic": "Amazon QuickSight", "subtopic": "Data Sources", "type": "single", "q": "Which of the following is NOT a supported data source for Amazon QuickSight?", "options": ["A) Amazon S3 and Amazon Athena", "B) Amazon Redshift, RDS, and Aurora", "C) SaaS connectors such as Salesforce and ServiceNow", "D) Raw magnetic audio cassette tapes directly streamed over analog telephone lines"], "answer": "D", "exp": "QuickSight connects to AWS databases, S3, Athena, on-premises relational databases, and SaaS tools l
