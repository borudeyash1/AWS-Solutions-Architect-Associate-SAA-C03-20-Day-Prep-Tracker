ike Salesforce[cite: 8]."}, {"id": 94, "topic": "Amazon QuickSight", "subtopic": "SPICE Engine", "type": "single", "q": "What does the acronym SPICE stand for in Amazon QuickSight?", "options": ["A) Super-fast, Parallel, In-memory Calculation Engine", "B) Scalable Protocol for Ingesting Cloud Events", "C) Serverless Partitioning and Indexing Compute Engine", "D) Secure Private Interface for Corporate Enterprise"], "answer": "A", "exp": "SPICE stands for Super-fast, Parallel, In-memory Calculation Engine, delivering fast interactive responses on large datasets[cite: 8]."}, {"id": 95, "topic": "Amazon QuickSight", "subtopic": "Dashboard and Visualization", "type": "multi", "q": "Which TWO capabilities are supported within Amazon QuickSight dashboards? (Select 2)", "options": ["A) Embedding interactive visualizations directly into external applications and portals", "B) Filtering, drill-downs, and parameterized controls for data exploration", "C) Manual assembly of physical circuit boards inside edge devices", "D) Disabling all role-based security permissions across executive dashboards"], "answer": ["A", "B"], "exp": "QuickSight dashboards support rich filters, drill-downs, and can be embedded seamlessly into web portals and apps[cite: 8]."}, {"id": 96, "topic": "Amazon QuickSight", "subtopic": "ML Insights", "type": "single", "q": "Which capability is provided by ML Insights in Amazon QuickSight without requiring machine learning expertise?", "options": ["A) Automated anomaly detection, forecasting, and natural language narrative summaries", "B) Compiling custom deep neural networks into low-level microcode", "C) Restricting VPC endpoint traffic using iptables", "D) Predicting hardware cooling requirements in on-premises server rooms"], "answer": "A", "exp": "QuickSight ML Insights automatically performs anomaly detection, forecasts trends, and provides narrative summaries[cite: 8]."}, {"id": 97, "topic": "Amazon QuickSight", "subtopic": "User Management and Access Control", "type": "multi", "q": "Which TWO access control mechanisms are supported by Amazon QuickSight? (Select 2)", "options": ["A) Row-Level Security (RLS) to restrict data access based on user identity", "B) Integration with AWS IAM Identity Center (AWS SSO) and Active Directory", "C) Hardcoded database root passwords shared across all viewers", "D) Unrestricted public read access enforced across all datasets"], "answer": ["A", "B"], "exp": "QuickSight supports Row-Level Security (RLS) and enterprise identity federation via IAM Identity Center / Active Directory[cite: 8]."}, {"id": 98, "topic": "Amazon QuickSight", "subtopic": "Deployment Options & Security", "type": "single", "q": "Which QuickSight edition provides advanced enterprise capabilities such as Active Directory integration and encryption with customer-managed keys?", "options": ["A) QuickSight Enterprise Edition", "B) QuickSight Standard Edition", "C) QuickSight Basic Free Tier", "D) QuickSight Developer Express"], "answer": "A", "exp": "Enterprise Edition provides advanced security, Row-Level Security, private VPC connectivity, and Active Directory integration[cite: 8]."}, {"id": 99, "topic": "Amazon QuickSight", "subtopic": "Pricing", "type": "multi", "q": "Which TWO statements regarding Amazon QuickSight pricing are accurate? (Select 2)", "options": ["A) Dashboard readers can be billed on a pay-per-session model", "B) Author users pay a fixed monthly subscription fee", "C) Billed strictly per physical server host installed in data centers", "D) Visualizations incur charges each time a user moves their mouse over a chart"], "answer": ["A", "B"], "exp": "QuickSight authors pay a monthly fee, while readers can utilize a cost-effective pay-per-session pricing model[cite: 8]."}, {"id": 100, "topic": "Amazon QuickSight", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the AWS exam to select Amazon QuickSight?", "options": ["A) Need for a serverless, scalable BI service to build interactive dashboards and share visual insights with pay-per-session reader pricing", "B) Requirement to establish private physical 100 Gbps network circuits between on-premises and AWS", "C) Need to host relational databases requiring complex stored procedures", "D) Requirement to convert audio speech into text transcripts"], "answer": "A", "exp": "QuickSight is AWS's fully managed, serverless BI platform for dashboards, visual analytics, and pay-per-session reporting[cite: 8]."}, {"id": 101, "topic": "Amazon Redshift", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate characteristic of Amazon Redshift?", "options": ["A) Fully managed, petabyte-scale cloud data warehouse service", "B) Columnar storage format optimized for high-performance analytics", "C) Massively Parallel Processing (MPP) architecture", "D) A document NoSQL key-value database designed for microsecond gaming leaderboards"], "answer": "D", "exp": "Amazon Redshift is an analytical relational data warehouse, not a NoSQL key-value database (which describes DynamoDB)[cite: 8]."}, {"id": 102, "topic": "Amazon Redshift", "subtopic": "Key Features", "type": "multi", "q": "Which TWO capabilities are key features of Amazon Redshift? (Select 2)", "options": ["A) Redshift Spectrum to query data directly in Amazon S3 without loading", "B) AQUA (Advanced Query Accelerator) for hardware-accelerated query performance", "C) Zero support for standard SQL or BI tools", "D) Compulsory migration of all databases to single-AZ on-premises servers"], "answer": ["A", "B"], "exp": "Redshift features Redshift Spectrum for lakehouse queries and AQUA hardware acceleration for massive query speedups[cite: 8]."}, {"id": 103, "topic": "Amazon Redshift", "subtopic": "Data Warehouse Architecture", "type": "single", "q": "In a provisioned Amazon Redshift cluster, which node receives client SQL queries, parses them, and coordinates parallel execution across compute nodes?", "options": ["A) Leader Node", "B) Compute Node", "C) Task Node", "D) Edge Location Node"], "answer": "A", "exp": "The Leader Node parses SQL queries, develops execution plans, and coordinates parallel execution across compute nodes[cite: 8]."}, {"id": 104, "topic": "Amazon Redshift", "subtopic": "Redshift Serverless", "type": "multi", "q": "Which TWO statements regarding Amazon Redshift Serverless are true? (Select 2)", "options": ["A) Automatically provisions and scales data warehouse compute capacity based on workload", "B) Billed based on Redshift Processing Units (RPUs) consumed per second", "C) Requires manual provisioning of leader nodes and slice configurations", "D) Disallows querying datasets stored in Amazon S3"], "answer": ["A", "B"], "exp": "Redshift Serverless automatically provisions capacity, adjusts to unpredictable workloads, and bills based on RPU-seconds[cite: 4, 8]."}, {"id": 105, "topic": "Amazon Redshift", "subtopic": "Data Loading", "type": "single", "q": "Which SQL command is specifically designed and recommended for loading large datasets in parallel into Amazon Redshift from Amazon S3?", "options": ["A) COPY", "B) INSERT INTO", "C) MERGE", "D) LOAD DATA INFILE"], "answer": "A", "exp": "The COPY command leverages Redshift's MPP architecture to load data from S3, DynamoDB, or EMR in parallel[cite: 8]."}, {"id": 106, "topic": "Amazon Redshift", "subtopic": "Redshift Spectrum", "type": "single", "q": "What is the primary operational advantage of Amazon Redshift Spectrum?", "options": ["A) Allows querying open-format data (Parquet, ORC, CSV) directly in S3 without loading it into Redshift cluster storage", "B) Provides hardware video transcoding for streaming movies", "C) Replaces AWS CloudTrail for recording administrative API calls", "D) Eliminates all network latency over inter-regional Direct Connect lines"], "answer": "A", "exp": "Redshift Spectrum enables running SQL queries directly on exabytes of data stored in Amazon S3 data lakes[cite: 8]."}, {"id": 107, "topic": "Amazon Redshift", "subtopic": "Performance Optimization", "type": "multi", "q": "Which TWO mechanisms optimize query performance and data placement in Amazon Redshift? (Select 2)", "options": ["A) Defining appropriate Distribution Styles (KEY, EVEN, ALL) across compute nodes", "B) Specifying Sort Keys to optimize range-restricted query scans", "C) Disabling data compression across all table columns", "D) Forcing all queries to run sequentially through a single thread"], "answer": ["A", "B"], "exp": "Sort keys organize data for fast scans, and distribution styles ensure balanced parallel data distribution across nodes[cite: 8]."}, {"id": 108, "topic": "Amazon Redshift", "subtopic": "Scalability and Elasticity", "type": "single", "q": "Which Amazon Redshift feature automatically adds transient cluster capacity within seconds to handle sudden bursts in concurrent query demand?", "options": ["A) Concurrency Scaling", "B) Elastic Network Adapter", "C) Cross-Zone Load Balancing", "D) Storage Gateway VTL Mode"], "answer": "A", "exp": "Concurrency Scaling provides virtually unlimited concurrent query processing by adding transient clusters automatically[cite: 8]."}, {"id": 109, "topic": "Amazon Redshift", "subtopic": "RA3 Instances", "type": "single", "q": "What is the key architectural benefit of Amazon Redshift RA3 instance types?", "options": ["A) Separates compute and storage, allowing compute capacity to scale independently from managed storage", "B) Requires storing all data exclusively on local ephemeral instance store disks", "C) Eliminates the need for Redshift leader nodes", "D) Prohibits automated backups to Amazon S3"], "answer": "A", "exp": "RA3 instances decouple compute and storage, using Redshift Managed Storage (RMS) backed by S3 for independent scaling[cite: 8]."}, {"id": 110, "topic": "Amazon Redshift", "subtopic": "Security", "type": "multi", "q": "Which TWO security capabilities are natively supported by Amazon Redshift? (Select 2)", "options": ["A) Encryption at rest using AWS Key Management Service (KMS) or Hardware Security Modules (HSM)", "B) Network isolation within an Amazon VPC and SSL encryption for data in transit", "C) Disabling all IAM access controls across the data warehouse", "D) Publishing all database login passwords to public CloudWatch dashboards"], "answer": ["A", "B"], "exp": "Redshift secures data via KMS/HSM encryption at rest, SSL/TLS in transit, VPC subnet isolation, and IAM authentication[cite: 8]."}, {"id": 111, "topic": "Amazon Redshift", "subtopic": "Monitoring and Management", "type": "single", "q": "Which monitoring feature provides detailed query execution metrics and tuning recommendations for Amazon Redshift?", "options": ["A) Amazon Redshift Performance Insights", "B) AWS Snowball Management Console", "C) AWS CodePipeline Visualizer", "D) AWS Glue DataBrew Profiler"], "answer": "A", "exp": "Performance Insights provides visualization of database load, query runtimes, and actionable tuning recommendations[cite: 4, 8]."}, {"id": 112, "topic": "Amazon Redshift", "subtopic": "Pricing", "type": "multi", "q": "Which TWO factors determine the cost of a provisioned Amazon Redshift data warehouse? (Select 2)", "options": ["A) The instance type and number of compute nodes provisioned in the cluster", "B) Additional backup storage consumed beyond the allocated cluster storage size", "C) A mandatory tax for every SQL WHERE clause executed", "D) Flat hardware rental fees for external on-premises fiber switches"], "answer": ["A", "B"], "exp": "Provisioned clusters bill for node hours based on type and count, with extra fees applying for snapshot storage beyond capacity[cite: 8]."}, {"id": 113, "topic": "Amazon Redshift", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary exam rule of thumb for loading massive datasets from S3 into Amazon Redshift?", "options": ["A) Execute single-row INSERT statements sequentially over a single connection", "B) Use the COPY command with multiple files matching the number of slices to achieve maximum parallel throughput", "C) Export the data as raw PDF files and upload them through the AWS Management Console", "D) Route files through AWS Transfer Family via unencrypted FTP"], "answer": "B", "exp": "The COPY command is optimized to load data in parallel across cluster slices from partitioned files in S3[cite: 8]."}, {"id": 114, "topic": "Amazon Athena", "subtopic": "Federated Queries", "type": "single", "q": "Which Athena capability allows querying data stored in relational, NoSQL, and custom data sources outside of Amazon S3?", "options": ["A) Athena Federated Query using Data Source Connectors powered by AWS Lambda", "B) Athena Auto-Copy Scripting Engine", "C) EMRFS Cross-Cluster Synchronization", "D) CloudFront Field-Level Encryption"], "answer": "A", "exp": "Athena Federated Query allows SQL queries across external data sources (e.g., DynamoDB, CloudWatch, relational DBs) using Lambda connectors."}, {"id": 115, "topic": "Amazon Athena", "subtopic": "Workgroups", "type": "multi", "q": "Which TWO administrative controls can be enforced using Amazon Athena Workgroups? (Select 2)", "options": ["A) Enforcing query cost limits by setting per-query or workgroup-level data scan thresholds", "B) Separating query execution history and designating specific S3 result output locations", "C) Modifying underlying EC2 Linux operating system kernel parameters", "D) Replicating data across physical SAN arrays in on-premises data centers"], "answer": ["A", "B"], "exp": "Athena Workgroups isolate users, teams, or applications, enabling cost controls, scan limits, and designated result locations."}, {"id": 116, "topic": "AWS Glue", "subtopic": "Glue Elastic Views", "type": "single", "q": "What is the primary capability of AWS Glue Elastic Views?", "options": ["A) Combines and replicates data across multiple target data stores using SQL, automatically keeping materialized views in sync", "B) Compresses video files for mobile streaming", "C) Manages IAM root credentials across member accounts", "D) Automatically terminates unhealthy EC2 worker nodes"], "answer": "A", "exp": "AWS Glue Elastic Views lets developers write SQL to combine and materialize data across multiple data stores with automated continuous synchronization."}, {"id": 117, "topic": "AWS Glue", "subtopic": "DynamicFrames", "type": "single", "q": "In AWS Glue ETL scripts, what is a DynamicFrame?", "options": ["A) An extension of Apache Spark DataFrames that handles messy, semi-structured data without requiring a rigid upfront schema", "B) A physical server rack deployed in local AWS Wavelength zones", "C) A user interface window for monitoring CloudWatch Alarms", "D) An encrypted container for transporting physical hard drives"], "answer": "A", "exp": "Glue DynamicFrames are distributed collections of data similar to Spark DataFrames but specifically designed to handle semi-structured, inconsistent data schemas."}, {"id": 118, "topic": "Amazon EMR", "subtopic": "EMR Serverless", "type": "multi", "q": "Which TWO advantages are provided by Amazon EMR Serverless? (Select 2)", "options": ["A) Automatically provisions, configures, and scales compute capacity for open-source frameworks like Spark and Hive", "B) Customers pay only for the vCPU, memory, and storage resources used during job execution", "C) Requires manual SSH configuration of primary master instances", "D) Disallows reading data directly from Amazon S3"], "answer": ["A", "B"], "exp": "EMR Serverless eliminates cluster provisioning, management, and over-provisioning costs by running Spark and Hive applications serverlessly."}, {"id": 119, "topic": "Amazon EMR", "subtopic": "HBase Integration", "type": "single", "q": "When running Apache HBase on Amazon EMR, where can the HBase root directory be durably stored to achieve high durability and decouple storage from compute?", "options": ["A) Amazon S3 using the EMRFS storage mode", "B) Ephemeral EC2 Instance Store volumes", "C) Virtual Tape Library backed by AWS Storage Gateway", "D) S3 Glacier Deep Archive offline vaults"], "answer": "A", "exp": "EMR supports running Apache HBase directly on Amazon S3 via EMRFS, providing durable storage with 11 9's of durability and lower storage costs[cite: 3]."}, {"id": 120, "topic": "Amazon Kinesis", "subtopic": "Partition Keys", "type": "single", "q": "What is the primary role of a Partition Key when writing records to Amazon Kinesis Data Streams?", "options": ["A) Determines which specific shard within the stream will receive the record by hashing the key", "B) Encrypts the payload with a customer-managed KMS key", "C) Automatically compresses the data record using gzip", "D) Triggers an immediate failover of the stream to another AWS region"], "answer": "A", "exp": "Kinesis uses the MD5 hash of the partition key to map incoming records to specific shards in the stream[cite: 8]."}, {"id": 121, "topic": "Amazon Kinesis", "subtopic": "Resharding", "type": "multi", "q": "Which TWO operations are used to dynamically scale shard capacity up or down in Amazon Kinesis Data Streams? (Select 2)", "options": ["A) Shard Splitting to increase stream capacity", "B) Shard Merging to decrease stream capacity and optimize costs", "C) Volume Striping across RAID 0 arrays", "D) Manual OS kernel reconfiguration"], "answer": ["A", "B"], "exp": "Resharding in Kinesis Data Streams involves splitting a single shard into two child shards (scale out) or merging two shards into one (scale in)[cite: 3, 8]."}, {"id": 122, "topic": "Amazon OpenSearch Service", "subtopic": "Index State Management (ISM)", "type": "single", "q": "What is the purpose of Index State Management (ISM) in Amazon OpenSearch Service?", "options": ["A) Automates index lifecycle operations such as rolling over, shrinking, and migrating older indices to UltraWarm storage", "B) Automatically provisions EC2 instances across foreign cloud providers", "C) Enforces biometric user sign-in for developers using the CLI", "D) Replaces AWS CloudTrail by intercepting hypervisor API calls"], "answer": "A", "exp": "ISM automates periodic administrative operations on OpenSearch indices, such as rollover, snapshotting, deletion, and tiering to UltraWarm based on age or size."}, {"id": 123, "topic": "Amazon OpenSearch Service", "subtopic": "Fine-Grained Access Control", "type": "single", "q": "How does Fine-Grained Access Control (FGAC) enhance security in Amazon OpenSearch Service?", "options": ["A) Provides document-level and field-level security, allowing fine-grained permissions within indices", "B) Mandates that all cluster queries originate from an unencrypted public IP address", "C) Automatically disables HTTPS encryption across all client endpoints", "D) Restricts database access strictly to AWS root accounts"], "answer": "A", "exp": "FGAC allows defining document-level and field-level security, role-based mapping, and index masking in OpenSearch[cite: 8]."}, {"id": 124, "topic": "Amazon Redshift", "subtopic": "Materialized Views", "type": "single", "q": "What is the primary benefit of using Materialized Views in Amazon Redshift?", "options": ["A) Stores precomputed results of complex queries, significantly accelerating repetitive analytical queries", "B) Automatically converts relational data into unencrypted CSV files in S3", "C) Increases the clock speed of underlying CPU cores", "D) Replaces dedicated master nodes with virtual appliances"], "answer": "A", "exp": "Materialized views store precomputed query results and can be refreshed incrementally, delivering ultra-fast query execution for predictable workloads[cite: 8]."}, {"id": 125, "topic": "Amazon Redshift", "subtopic": "Workload Management (WLM)", "type": "multi", "q": "Which TWO operational capabilities are provided by Workload Management (WLM) in Amazon Redshift? (Select 2)", "options": ["A) Defining separate query queues with dedicated memory and concurrency allocations", "B) Using query monitoring rules (QMR) to abort or re-route long-running or resource-intensive queries", "C) Automatically migrating on-premises Oracle databases to Aurora PostgreSQL", "D) Deploying multi-region EC2 web servers"], "answer": ["A", "B"], "exp": "WLM allows administrators to prioritize query execution across queues and enforce query monitoring rules to prevent runaway queries from degrading performance[cite: 8]."}, {"id": 126, "topic": "Amazon Redshift", "subtopic": "Data Sharing", "type": "single", "q": "What capability does Amazon Redshift Data Sharing enable?", "options": ["A) Secure, live sharing of data across Redshift clusters without copying or moving the underlying data", "B) Public file downloads over unencrypted BitTorrent protocols", "C) Syncing local workstation files to S3 Glacier vaults", "D) Bypassing IAM security authentication for all external IP addresses"], "answer": "A", "exp": "Redshift Data Sharing enables live, cross-cluster, and cross-account data access without the latency and cost of data movement[cite: 8]."}, {"id": 127, "topic": "AWS Lake Formation", "subtopic": "Federated Access & Cross-Account", "type": "single", "q": "How does AWS Lake Formation facilitate cross-account data sharing in an enterprise data mesh?", "options": ["A) Uses Lake Formation permissions and AWS RAM to share cataloged resources directly without S3 bucket policy changes", "B) Requires copying the entire dataset into the recipient's AWS account daily", "C) Relies exclusively on public S3 bucket policies", "D) Mandates manual database exports to physical USB drives"], "answer": "A", "exp": "Lake Formation integrates with AWS Resource Access Manager (RAM) to grant fine-grained permissions across accounts without duplicating S3 data or complex bucket policies."}], "quiz2": [{"id": 1, "section": "2. APPLICATION INTEGRATION", "topic": "Amazon AppFlow", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an accurate description of Amazon AppFlow as outlined in the handbook?", "options": ["A) Fully managed integration service automating data flows between SaaS apps and AWS services", "B) Requires custom application code to establish secure data transfers", "C) No code required to set up data flows", "D) Scales automatically without managing servers"], "answer": "B", "exp": "Amazon AppFlow requires no code to configure and run automated data flows between SaaS applications and AWS services[cite: 8]."}, {"id": 2, "topic": "Amazon AppFlow", "subtopic": "Key Features - SaaS & AWS Integrations", "type": "multi", "q": "Which TWO of the following destinations or applications are supported natively by Amazon AppFlow? (Select 2)", "options": ["A) Salesforce", "B) Amazon S3", "C) Physical magnetic tape drives", "D) AWS Snowmobile"], "answer": ["A", "B"], "exp": "AppFlow supports popular SaaS applications like Salesforce, ServiceNow, and Zendesk, connecting to AWS services like S3 and Redshift[cite: 8]."}, {"id": 3, "topic": "Amazon AppFlow", "subtopic": "Key Features - Flow Triggers", "type": "single", "q": "Which of the following is NOT a supported trigger type for initiating flows in Amazon AppFlow?", "options": ["A) On-demand execution", "B) Scheduled execution", "C) Event-triggered flows based on business events", "D) Manual physical server reboot trigger"], "answer": "D", "exp": "AppFlow supports on-demand, scheduled, and event-triggered data transfers[cite: 8]."}, {"id": 4, "topic": "Amazon AppFlow", "subtopic": "Key Features - Built-in Transformations", "type": "multi", "q": "Which TWO data transformation capabilities are natively provided during an AppFlow transfer? (Select 2)", "options": ["A) Field masking for sensitive data", "B) Value validation and field mapping", "C) Compiling Java code into microcode", "D) Assembling physical network routers"], "answer": ["A", "B"], "exp": "AppFlow includes built-in transformation capabilities such as masking, mapping, and validation[cite: 8]."}, {"id": 5, "topic": "Amazon AppFlow", "subtopic": "Security & PrivateLink", "type": "single", "q": "How does Amazon AppFlow ensure data does not traverse the public internet when connecting to compatible SaaS partners?", "options": ["A) AWS PrivateLink support", "B) Unencrypted public FTP tunnels", "C) Physical direct fiber runs to customer homes", "D) Disabling IAM authentication completely"], "answer": "A", "exp": "AppFlow leverages AWS PrivateLink to securely transfer data over the AWS private backbone without exposure to the public internet[cite: 8]."}, {"id": 6, "topic": "Amazon AppFlow", "subtopic": "Use Cases", "type": "multi", "q": "Which TWO scenarios represent common use cases for Amazon AppFlow? (Select 2)", "options": ["A) Syncing customer data from Salesforce directly to Amazon S3 for analytics", "B) Moving ServiceNow records into an AWS data lake", "C) Sub-millisecond distributed in-memory caching", "D) Running multi-player 3D game physics simulations"], "answer": ["A", "B"], "exp": "Common use cases include syncing Salesforce or ServiceNow records into Amazon S3 or Redshift for reporting and data lakes[cite: 8]."}, {"id": 7, "topic": "Amazon AppFlow", "subtopic": "Pricing & Cost Model", "type": "single", "q": "Which of the following is NOT a component of the Amazon AppFlow pricing model?", "options": ["A) Pay per flow run", "B) Charges based on the volume of data processed", "C) Upfront hardware licensing fees", "D) No upfront commitments or fees"], "answer": "C", "exp": "Amazon AppFlow has no upfront fees; billing is pay-as-you-go based on flow runs and data volume processed[cite: 8]."}, {"id": 8, "topic": "Amazon AppFlow", "subtopic": "Exam Tips", "type": "single", "q": "When should an architect select Amazon AppFlow on the exam?", "options": ["A) When an integration requires secure, serverless data movement between SaaS apps and AWS without building custom ETL or APIs", "B) When needing low-level socket programming for custom hardware", "C) When deploying multi-AZ relational databases", "D) When generating speech from text documents"], "answer": "A", "exp": "AppFlow is the exam choice for seamless, no-code SaaS-to-AWS data integration with built-in transformations and PrivateLink security[cite: 8]."}, {"id": 9, "topic": "AWS AppSync", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding AWS AppSync?", "options": ["A) Fully managed GraphQL API service", "B) Unifies data access, combinations, and updates from multiple sources", "C) Requires deploying and managing self-hosted EC2 GraphQL servers", "D) Securely serves data to web and mobile applications"], "answer": "C", "exp": "AWS AppSync is a fully managed service that eliminates the need to manage or host custom GraphQL servers[cite: 8]."}, {"id": 10, "topic": "AWS AppSync", "subtopic": "Connected Data Sources", "type": "multi", "q": "Which TWO data sources connect natively to AWS AppSync? (Select 2)", "options": ["A) Amazon DynamoDB", "B) AWS Lambda", "C) AWS Snowball Edge hardware", "D) Physical tape libraries"], "answer": ["A", "B"], "exp": "AppSync connects natively to Amazon DynamoDB, AWS Lambda, Amazon Aurora, OpenSearch, and HTTP APIs[cite: 8]."}, {"id": 11, "topic": "AWS AppSync", "subtopic": "Real-Time Data & Subscriptions", "type": "single", "q": "How does AWS AppSync deliver real-time data updates to connected clients?", "options": ["A) Via GraphQL Subscriptions powered by WebSockets", "B) By requiring continuous HTTP polling every 100 milliseconds", "C) Through physical serial cable synchronization", "D) By restarting the client application automatically"], "answer": "A", "exp": "AppSync delivers real-time updates through GraphQL subscriptions running over WebSockets[cite: 8]."}, {"id": 12, "topic": "AWS AppSync", "subtopic": "Offline Support & Data Synchronization", "type": "multi", "q": "Which TWO statements regarding AppSync's client data capabilities are accurate? (Select 2)", "options": ["A) Built-in offline support for mobile and web apps", "B) Conflict detection and resolution when clients reconnect", "C) Deletes all offline client data automatically after 5 seconds", "D) Prohibits local client data caching"], "answer": ["A", "B"], "exp": "AppSync provides client-side caching, offline data access, and automated conflict resolution upon reconnecting[cite: 8]."}, {"id": 13, "topic": "AWS AppSync", "subtopic": "Authentication & Access Control", "type": "single", "q": "Which of the following is NOT an authentication option supported by AWS AppSync?", "options": ["A) API Keys", "B) Amazon Cognito User Pools", "C) OpenID Connect (OIDC) and AWS IAM", "D) Unencrypted root password headers"], "answer": "D", "exp": "AppSync supports fine-grained authentication using API Keys, Cognito User Pools, IAM, and OIDC[cite: 8]."}, {"id": 14, "topic": "AWS AppSync", "subtopic": "Resolvers & Performance", "type": "multi", "q": "Which TWO architectural mechanisms are utilized by AWS AppSync? (Select 2)", "options": ["A) Resolvers to fetch and transform data from backend sources", "B) Built-in server-side response caching for performance", "C) Mandatory synchronous polling via SQS queues", "D) Single-threaded sequential execution of all requests"], "answer": ["A", "B"], "exp": "Resolvers map GraphQL operations to backend data sources, and built-in caching reduces load and improves response times[cite: 8]."}, {"id": 15, "topic": "AWS AppSync", "subtopic": "Use Cases & Benefits", "type": "single", "q": "Which application scenario is best suited for AWS AppSync?", "options": ["A) Mobile chat applications, collaborative workspaces, and dashboards needing real-time and offline data", "B) Batch processing of raw video files over hours", "C) High-volume network packet routing at OSI Layer 3", "D) Long-term cold data archiving"], "answer": "A", "exp": "AppSync is ideal for mobile and web applications requiring unified GraphQL access, real-time collaboration, and offline sync[cite: 8]."}, {"id": 16, "topic": "AWS AppSync", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary difference between AWS AppSync and Amazon API Gateway on the exam?", "options": ["A) AppSync is managed GraphQL with real-time subscriptions; API Gateway is primarily for REST and WebSocket APIs", "B) API Gateway is free; AppSync costs $10,000 per month", "C) AppSync cannot integrate with AWS Lambda", "D) API Gateway does not support caching"], "answer": "A", "exp": "The SAA exam tests AppSync as the managed GraphQL alternative to API Gateway, specialized for real-time subscriptions and unified multi-source data[cite: 8]."}, {"id": 17, "topic": "Amazon EventBridge", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding Amazon EventBridge?", "options": ["A) Serverless event bus service for building event-driven applications", "B) Ingests, filters, routes, and delivers events from AWS services, apps, and SaaS partners", "C) Requires provisioning and managing EC2 instances to route events", "D) Operates with near real-time event delivery"], "answer": "C", "exp": "Amazon EventBridge is fully serverless with no servers or infrastructure to provision or manage[cite: 8]."}, {"id": 18, "topic": "Amazon EventBridge", "subtopic": "Core Concepts - Event Buses", "type": "single", "q": "Which type of EventBridge event bus is specifically designated to receive events emitted by integrated third-party SaaS partners?", "options": ["A) Partner Event Bus", "B) Default Event Bus", "C) Custom Event Bus", "D) System Event Bus"], "answer": "A", "exp": "Partner Event Buses receive events directly from integrated SaaS partners like Zendesk, Datadog, or PagerDuty[cite: 8]."}, {"id": 19, "topic": "Amazon EventBridge", "subtopic": "Core Concepts - Rules & Patterns", "type": "multi", "q": "Which TWO statements regarding EventBridge Rules and Event Patterns are accurate? (Select 2)", "options": ["A) Rules use JSON event patterns to filter incoming events based on their content", "B) Rules can route matched events to multiple targets simultaneously", "C) Rules require compiling regex scripts into binary files", "D) Each rule can target only a single AWS Lambda function"], "answer": ["A", "B"], "exp": "EventBridge rules evaluate JSON event patterns and can route matching events to multiple targets, including Lambda, SNS, and SQS[cite: 8]."}, {"id": 20, "topic": "Amazon EventBridge", "subtopic": "Core Concepts - Targets", "type": "single", "q": "Which of the following is NOT an available target for Amazon EventBridge rules?", "options": ["A) AWS Lambda functions", "B) Amazon SQS queues and SNS topics", "C) AWS Step Functions state machines", "D) AWS Direct Connect physical cross-connects"], "answer": "D", "exp": "Direct Connect cross-connects are physical network connections and cannot serve as software event targets[cite: 8]."}, {"id": 21, "topic": "Amazon EventBridge", "subtopic": "Archive and Replay", "type": "multi", "q": "Which TWO benefits are provided by EventBridge Archive and Replay? (Select 2)", "options": ["A) Ability to re-send past events to test new application rules", "B) Recovery from application failures by reprocessing historical events", "C) Automatic conversion of all JSON events into relational SQL databases", "D) Eliminating the need for event encryption"], "answer": ["A", "B"], "exp": "EventBridge Archive and Replay stores events for compliance/debugging and replays them to test new logic or recover from errors[cite: 1, 8]."}, {"id": 22, "topic": "Amazon EventBridge", "subtopic": "Schema Registry", "type": "single", "q": "What is the primary function of the EventBridge Schema Registry?", "options": ["A) Automatically discovers, stores, and generates code bindings for event schemas", "B) Validates credit card payments in merchant terminals", "C) Manages IAM root access keys", "D) Enforces SSL certificates on EC2 instances"], "answer": "A", "exp": "The Schema Registry discovers and stores event structures, enabling developers to generate strongly typed code bindings[cite: 8]."}, {"id": 23, "topic": "Amazon EventBridge", "subtopic": "API Destinations", "type": "single", "q": "What capability does EventBridge API Destinations provide?", "options": ["A) Routes events directly to external HTTP endpoints outside AWS with auth support", "B) Connects VPC subnets over public internet tunnels", "C) Deploys Amazon Route 53 DNS records across regions", "D) Bypasses IAM role checking for internal AWS calls"], "answer": "A", "exp": "API Destinations allow EventBridge to send events to webhooks and HTTP endpoints outside AWS using basic auth, API keys, or OAuth[cite: 8]."}, {"id": 24, "topic": "Amazon EventBridge", "subtopic": "Cross-Account Delivery", "type": "multi", "q": "Which TWO statements describe EventBridge Cross-Account capabilities? (Select 2)", "options": ["A) Allows sending events from multiple AWS accounts to a central event bus", "B) Uses resource policies to govern cross-account access", "C) Requires configuring VPC peering between all participating accounts", "D) Transmits data exclusively over unencrypted public IP addresses"], "answer": ["A", "B"], "exp": "EventBridge supports cross-account delivery governed by resource policies without requiring complex networking like VPC peering[cite: 8]."}, {"id": 25, "topic": "Amazon EventBridge", "subtopic": "EventBridge vs Amazon SNS", "type": "single", "q": "When should an architect select Amazon EventBridge over Amazon SNS?", "options": ["A) When the workload requires advanced content-based filtering, SaaS integrations, and event schema discovery", "B) When simple, high-throughput push messaging to SMS or email is the sole requirement", "C) When building legacy on-premises JMS queues", "D) When streaming real-time video feeds"], "answer": "A", "exp": "EventBridge provides advanced JSON pattern filtering, event buses, SaaS ingestion, and schema registries compared to SNS's simple push pub/sub[cite: 8]."}, {"id": 26, "topic": "Amazon EventBridge", "subtopic": "Exam Tips", "type": "multi", "q": "Which TWO facts regarding EventBridge are high-yield for the SAA-C03 exam? (Select 2)", "options": ["A) Default event bus automatically receives events from AWS services", "B) Formerly known as CloudWatch Events, offering enhanced capabilities", "C) Billed on a flat rate of $500 per event bus per hour", "D) Only supports five total AWS services as targets"], "answer": ["A", "B"], "exp": "EventBridge is the evolution of CloudWatch Events, integrates with 200+ AWS services, and the default bus receives AWS service events[cite: 8]."}, {"id": 27, "topic": "Amazon MQ", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding Amazon MQ?", "options": ["A) Managed message broker service for open-source messaging software", "B) Replaces standard messaging protocols with proprietary AWS JSON protocols only", "C) Supports Apache ActiveMQ and RabbitMQ engines", "D) Simplifies migrating legacy messaging systems to AWS without rewriting code"], "answer": "B", "exp": "Amazon MQ specifically supports industry-standard messaging protocols (JMS, AMQP, STOMP, MQTT) to avoid code changes[cite: 8]."}, {"id": 28, "topic": "Amazon MQ", "subtopic": "Supported Engines & Protocols", "type": "multi", "q": "Which TWO message broker engines are fully managed by Amazon MQ? (Select 2)", "options": ["A) Apache ActiveMQ", "B) RabbitMQ", "C) Apache Cassandra", "D) MongoDB"], "answer": ["A", "B"], "exp": "Amazon MQ provides managed broker environments for Apache ActiveMQ and RabbitMQ[cite: 8]."}, {"id": 29, "topic": "Amazon MQ", "subtopic": "APIs and Standards", "type": "single", "q": "Which of the following is NOT an industry-standard protocol supported by Amazon MQ?", "options": ["A) AMQP", "B) JMS", "C) MQTT", "D) BGP Autonomous System Tagging"], "answer": "D", "exp": "BGP is a network routing protocol; Amazon MQ supports messaging APIs including JMS, NMS, AMQP, STOMP, MQTT, and WebSockets[cite: 8]."}, {"id": 30, "topic": "Amazon MQ", "subtopic": "High Availability & Durability", "type": "multi", "q": "Which TWO architectures ensure high availability in Amazon MQ deployments? (Select 2)", "options": ["A) Active/standby brokers across different Availability Zones with automatic failover", "B) Multi-node RabbitMQ clusters", "C) Single-instance ephemeral brokers without EBS persistence", "D) Deploying brokers into disconnected public subnets without VPC attachments"], "answer": ["A", "B"], "exp": "High availability is achieved through multi-AZ active/standby deployments or multi-node RabbitMQ clusters[cite: 8]."}, {"id": 31, "topic": "Amazon MQ", "subtopic": "Deployment Options", "type": "single", "q": "When is a single-instance broker in Amazon MQ recommended?", "options": ["A) Development, testing, or non-production low-cost scenarios", "B) High-availability mission-critical banking transactions", "C) Ultra-low-latency real-time bidding platforms", "D) Multi-region automated disaster recovery architectures"], "answer": "A", "exp": "Single-instance brokers are cost-effective but do not provide multi-AZ failover, making them suitable for dev/test environments[cite: 8]."}, {"id": 32, "topic": "Amazon MQ", "subtopic": "Security", "type": "multi", "q": "Which TWO security measures are natively supported by Amazon MQ? (Select 2)", "options": ["A) Encryption at rest using AWS KMS and in transit using TLS", "B) VPC deployment for network isolation and Security Group filtering", "C) Disabling user authentication for broker access", "D) Transmitting cleartext broker passwords over unencrypted HTTP"], "answer": ["A", "B"], "exp": "Amazon MQ supports KMS encryption at rest, TLS in transit, VPC isolation, and authentication via credentials/LDAP[cite: 8]."}, {"id": 33, "topic": "Amazon MQ", "subtopic": "Monitoring and Management", "type": "single", "q": "How can an operations team monitor queue depth and broker health in Amazon MQ?", "options": ["A) Through Amazon CloudWatch metrics and CloudWatch Logs integration", "B) By running manual shell scripts on the underlying managed hypervisor", "C) Via AWS Artifact audit reports", "D) Through Route 53 health check pings exclusively"], "answer": "A", "exp": "Amazon MQ integrates natively with CloudWatch for operational metrics, alarms, and broker logging[cite: 8]."}, {"id": 34, "topic": "Amazon MQ", "subtopic": "Use Cases", "type": "multi", "q": "Which TWO scenarios indicate choosing Amazon MQ over Amazon SQS? (Select 2)", "options": ["A) Migrating existing applications using JMS or AMQP protocols without changing messaging code", "B) Requiring support for topic/queue patterns in RabbitMQ or ActiveMQ", "C) Building a serverless event-driven architecture using AWS Lambda natively", "D) Requiring virtually unlimited message throughput without instance management"], "answer": ["A", "B"], "exp": "Amazon MQ is chosen for legacy migrations using standard messaging APIs (JMS, AMQP), whereas SQS is preferred for cloud-native apps[cite: 8]."}, {"id": 35, "topic": "Amazon MQ", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the AWS exam to choose Amazon MQ instead of SQS or SNS?", "options": ["A) Mention of existing on-premises messaging middleware using JMS, AMQP, ActiveMQ, or RabbitMQ that must be migrated with minimal code changes", "B) Fan-out notifications to thousands of mobile devices", "C) Decoupling serverless microservices via standard HTTP APIs", "D) In-memory query caching for relational databases"], "answer": "A", "exp": "Standard messaging protocol compatibility (JMS, AMQP, ActiveMQ, RabbitMQ) is the definitive exam signal for Amazon MQ[cite: 8]."}, {"id": 36, "topic": "Amazon SNS", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding Amazon Simple Notification Service (Amazon SNS)?", "options": ["A) Fully managed pub/sub messaging service", "B) Enables message fan-out to multiple subscribers asynchronously", "C) Requires clients to continuously poll a queue to retrieve messages", "D) Uses push-based delivery to subscriber endpoints"], "answer": "C", "exp": "Amazon SNS is a push-based pub/sub service; pull-based polling is characteristic of Amazon SQS[cite: 8]."}, {"id": 37, "topic": "Amazon SNS", "subtopic": "Core Concepts - Topics & Subscriptions", "type": "multi", "q": "Which TWO protocols or services can subscribe directly to an Amazon SNS topic? (Select 2)", "options": ["A) AWS Lambda", "B) Amazon SQS", "C) Amazon Redshift Spectrum clusters", "D) Physical tape libraries"], "answer": ["A", "B"], "exp": "SNS topics can push messages directly to Lambda functions, SQS queues, HTTP/HTTPS webhooks, Email, SMS, and mobile push[cite: 8]."}, {"id": 38, "topic": "Amazon SNS", "subtopic": "Message Filtering", "type": "single", "q": "How does Amazon SNS Message Filtering reduce consumer workload?", "options": ["A) Consumers define subscription filter policies based on message attributes so they receive only relevant messages", "B) It converts all JSON payloads into raw text", "C) It encrypts messages with random passwords", "D) It drops messages older than 5 seconds automatically"], "answer": "A", "exp": "SNS message filtering allows subscribers to set attribute-based policies, offloading filtering logic from consumer code[cite: 8]."}, {"id": 39, "topic": "Amazon SNS", "subtopic": "Dead-Letter Queues (DLQ)", "type": "single", "q": "What is the purpose of configuring a Dead-Letter Queue (DLQ) for an Amazon SNS subscription?", "options": ["A) To capture and isolate messages that could not be delivered to subscriber endpoints after retries fail", "B) To store marketing emails before transmission", "C) To archive CloudTrail audit logs", "D) To manage multi-AZ failovers for RDS instances"], "answer": "A", "exp": "SNS supports attaching an Amazon SQS DLQ to a subscription to store undeliverable messages for troubleshooting[cite: 1, 8]."}, {"id": 40, "topic": "Amazon SNS", "subtopic": "SNS vs SQS Comparison", "type": "multi", "q": "Which TWO statements correctly contrast Amazon SNS with Amazon SQS? (Select 2)", "options": ["A) SNS follows a push model (one-to-many), while SQS follows a pull model (one-to-one consumption)", "B) Pairing SNS with multiple SQS queues enables a fan-out architectural pattern", "C) SQS sends push notifications directly to SMS and mobile devices", "D) SNS persists messages in queues for up to 14 days by default"], "answer": ["A", "B"], "exp": "SNS is push-based and enables fan-out; SQS is pull-based where consumers poll and delete messages[cite: 8]."}, {"id": 41, "topic": "Amazon SNS", "subtopic": "Security & Encryption", "type": "single", "q": "How are messages secured at rest within Amazon SNS topics?", "options": ["A) Server-Side Encryption (SSE) using AWS KMS", "B) Storing messages on unencrypted local EBS volumes", "C) Compulsory client-side software hashing with MD5", "D) Bypassing IAM topic access policies"], "answer": "A", "exp": "SNS supports Server-Side Encryption (SSE) via AWS KMS customer-managed or AWS-managed keys to protect messages at rest[cite: 8]."}, {"id": 42, "topic": "Amazon SNS", "subtopic": "Mobile Push Notifications", "type": "multi", "q": "Which TWO mobile notification platforms are supported by Amazon SNS for direct push messaging? (Select 2)", "options": ["A) Apple Push Notification service (APNs)", "B) Firebase Cloud Messaging (FCM)", "C) On-premises dial-up modems", "D) Local Bluetooth beacons"], "answer": ["A", "B"], "exp": "Amazon SNS supports mobile push notifications to APNs, FCM, ADM, and Baidu Cloud Push[cite: 8]."}, {"id": 43, "topic": "Amazon SNS", "subtopic": "Access Control & Topic Policies", "type": "single", "q": "Which mechanism controls which AWS accounts and services are permitted to publish or subscribe to an Amazon SNS topic?", "options": ["A) SNS Topic Access Policies combined with IAM policies", "B) Network ACL rules on port 22", "C) Security Group egress filters", "D) Route 53 DNS aliases"], "answer": "A", "exp": "Topic access policies (resource-based) and IAM policies govern publishing and subscription rights, including cross-account access[cite: 8]."}, {"id": 44, "topic": "Amazon SNS", "subtopic": "Exam Tips", "type": "single", "q": "What is the common architecture pattern for fan-out messaging tested on the SAA exam?", "options": ["A) A publisher sends a message to an SNS topic, which fans out and delivers identical messages to multiple SQS queues for parallel processing", "B) A client polls an EC2 instance directly over unencrypted HTTP", "C) An S3 bucket replicates objects to on-premises tapes", "D) CloudFront invokes an RDS stored procedure directly"], "answer": "A", "exp": "The SNS + SQS Fan-Out pattern is standard for decoupling and processing events in parallel across multiple systems[cite: 8]."}, {"id": 45, "topic": "Amazon SQS", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding Amazon SQS?", "options": ["A) Fully managed message queuing service", "B) Decouples and scales microservices, distributed systems, and serverless apps", "C) Stores messages redundantly across multiple Availability Zones", "D) Requires provisioning and patching queuing server clusters"], "answer": "D", "exp": "Amazon SQS is fully managed and serverless; there are no servers or clusters to manage[cite: 8]."}, {"id": 46, "topic": "Amazon SQS", "subtopic": "Standard Queues", "type": "single", "q": "What is a primary characteristic of Amazon SQS Standard Queues?", "options": ["A) Nearly unlimited throughput with at-least-once delivery and best-effort ordering", "B) Strict first-in-first-out delivery with zero duplicates guaranteed", "C) Limited to exactly 300 transactions per second", "D) Requires manual sharding across availability zones"], "answer": "A", "exp": "Standard Queues offer nearly unlimited throughput and at-least-once delivery, where occasional duplicate messages can occur[cite: 8]."}, {"id": 47, "topic": "Amazon SQS", "subtopic": "FIFO Queues", "type": "multi", "q": "Which TWO statements regarding Amazon SQS FIFO Queues are accurate? (Select 2)", "options": ["A) Preserves strict message ordering (First-In-First-Out)", "B) Guarantees exactly-once processing using message deduplication", "C) Automatically delivers messages to external email inboxes", "D) Allows unlimited throughput without batching or quotas"], "answer": ["A", "B"], "exp": "FIFO queues guarantee strict message ordering and exactly-once processing via deduplication IDs[cite: 8]."}, {"id": 48, "topic": "Amazon SQS", "subtopic": "Visibility Timeout", "type": "single", "q": "What happens to a message during its Visibility Timeout in Amazon SQS?", "options": ["A) It remains invisible to other consumers while the current worker processes it", "B) It is permanently deleted from the queue", "C) It is automatically moved to a Dead-Letter Queue", "D) It is forwarded to an Amazon SNS topic"], "answer": "A", "exp": "The visibility timeout prevents multiple consumers from receiving and processing the same message simultaneously[cite: 1, 8]."}, {"id": 49, "topic": "Amazon SQS", "subtopic": "Visibility Timeout Failure Scenario", "type": "single", "q": "What occurs if a consumer fails to delete an SQS message before the visibility timeout expires?", "options": ["A) The message becomes visible again in the queue for another consumer to process", "B) The message is dropped and lost permanently", "C) The SQS queue is automatically paused for 24 hours", "D) The consumer's IAM credentials are revoked"], "answer": "A", "exp": "If the consumer does not delete the message within the timeout period, SQS assumes processing failed and makes it visible again[cite: 8]."}, {"id": 50, "topic": "Amazon SQS", "subtopic": "Dead-Letter Queues (DLQ)", "type": "multi", "q": "Which TWO statements regarding Amazon SQS Dead-Letter Queues (DLQ) are true? (Select 2)", "options": ["A) Isolates problematic messages after a maximum receive count is exceeded", "B) Prevents endless processing loops for corrupted or failing messages", "C) Automatically sends text messages to system administrators", "D) Replaces the primary queue when traffic spikes"], "answer": ["A", "B"], "exp": "DLQs isolate failing messages based on a redrive policy's maxReceiveCount, preventing endless retry loops[cite: 8]."}, {"id": 51, "topic": "Amazon SQS", "subtopic": "Delay Queues", "type": "single", "q": "What is the maximum configurable delay for new messages added to an SQS Delay Queue?", "options": ["A) 15 minutes", "B) 12 hours", "C) 24 hours", "D) 14 days"], "answer": "A", "exp": "SQS Delay Queues postpone delivery of incoming messages for a configurable period between 0 seconds and 15 minutes[cite: 8]."}, {"id": 52, "topic": "Amazon SQS", "subtopic": "Long Polling vs Short Polling", "type": "multi", "q": "Which TWO benefits are achieved by enabling SQS Long Polling? (Select 2)", "options": ["A) Reduces cost by decreasing the number of empty ReceiveMessage responses", "B) Waits up to 20 seconds for messages to arrive in the queue before responding", "C) Guarantees strict chronological ordering for standard queues", "D) Increases message payload sizes beyond 256 KB"], "answer": ["A", "B"], "exp": "Long polling (up to 20 seconds) waits for available messages, reducing empty responses and lowering API costs[cite: 1, 8]."}, {"id": 53, "topic": "Amazon SQS", "subtopic": "Message Retention Period", "type": "single", "q": "What is the default and maximum message retention period for an Amazon SQS queue?", "options": ["A) Default is 4 days; maximum is 14 days", "B) Default is 1 hour; maximum is 24 hours", "C) Default is 7 days; maximum is 30 days", "D) Default is 30 days; maximum is 1 year"], "answer": "A", "exp": "SQS keeps messages for a default of 4 days, configurable from 1 minute up to 14 days[cite: 8]."}, {"id": 54, "topic": "Amazon SQS", "subtopic": "Message Size & Extended Client", "type": "single", "q": "How can an application send message payloads larger than the standard 256 KB SQS limit?", "options": ["A) Use the Amazon SQS Extended Client Library to store payloads in Amazon S3", "B) Compress messages into a .zip file and email them", "C) Split messages into 100 small EC2 metadata tags", "D) Switch the SQS queue to an Elastic Load Balancer"], "answer": "A", "exp": "The Amazon SQS Extended Client Library uses Amazon S3 to store large payloads (up to 2 GB), storing only a reference pointer in SQS[cite: 8]."}, {"id": 55, "topic": "Amazon SQS", "subtopic": "Security and Access Control", "type": "multi", "q": "Which TWO security features are available for Amazon SQS? (Select 2)", "options": ["A) Server-Side Encryption (SSE) using AWS KMS keys", "B) SQS Queue Policies for cross-account access delegation", "C) Mandatory public unencrypted IP whitelisting", "D) Disabling all IAM authorization checks"], "answer": ["A", "B"], "exp": "SQS encrypts messages at rest using AWS KMS and manages permissions via IAM and SQS queue resource policies[cite: 8]."}, {"id": 56, "topic": "Amazon SQS", "subtopic": "Exam Tips", "type": "single", "q": "Which architectural pattern is best served by Amazon SQS on the exam?", "options": ["A) Decoupling application components and smoothing out traffic spikes through asynchronous buffering", "B) Low-latency sub-millisecond graph query traversal", "C) High-bandwidth real-time video stream encoding", "D) Managing physical data center HVAC controls"], "answer": "A", "exp": "SQS is the core service for buffering, smoothing traffic surges, and decoupling producers from consumers[cite: 8]."}, {"id": 57, "topic": "AWS Step Functions", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT true regarding AWS Step Functions?", "options": ["A) Serverless orchestration service that coordinates AWS services into visual workflows", "B) Represents workflows as state machines using the Amazon States Language (JSON)", "C) Requires deploying and patching a dedicated cluster of Linux servers", "D) Provides built-in error handling, retries, and conditional branching"], "answer": "C", "exp": "AWS Step Functions is fully serverless; it does not require running, managing, or patching server clusters[cite: 8]."}, {"id": 58, "topic": "AWS Step Functions", "subtopic": "Workflow Types", "type": "multi", "q": "Which TWO workflow types are supported by AWS Step Functions? (Select 2)", "options": ["A) Standard Workflows", "B) Express Workflows", "C) Ephemeral Hyper-Workflows", "D) Monolithic Batch Sequences"], "answer": ["A", "B"], "exp": "Step Functions supports Standard Workflows (long-running, durable) and Express Workflows (high-volume, short-duration)[cite: 8]."}, {"id": 59, "topic": "AWS Step Functions", "subtopic": "Standard Workflows", "type": "single", "q": "What is the maximum execution duration supported by AWS Step Functions Standard Workflows?", "options": ["A) 1 year", "B) 5 minutes", "C) 14 days", "D) 24 hours"], "answer": "A", "exp": "Standard Workflows can run for up to 1 year, feature exactly-once execution, and maintain full visual audit history for 90 days[cite: 8]."}, {"id": 60, "topic": "AWS Step Functions", "subtopic": "Express Workflows", "type": "single", "q": "What is the maximum execution duration and ideal use case for AWS Step Functions Express Workflows?", "options": ["A) Up to 5 minutes; ideal for high-volume, event-driven data ingestion and streaming transformations", "B) Up to 1 year; ideal for manual human approval workflows", "C) Up to 14 days; ideal for physical tape archival", "D) Up to 30 seconds; ideal for DNS resolution caching"], "answer": "A", "exp": "Express Workflows run for up to 5 minutes and are cost-optimized for high-throughput, short-lived workloads[cite: 8]."}, {"id": 61, "topic": "AWS Step Functions", "subtopic": "State Types - Core Logic", "type": "multi", "q": "Which TWO state types are used in AWS Step Functions to manage execution logic and tasks? (Select 2)", "options": ["A) Task State to execute units of work like a Lambda function", "B) Choice State to perform conditional branching based on input variables", "C) Format State to recompile C++ files", "D) Route State to configure BGP routers"], "answer": ["A", "B"], "exp": "State types include Task (executes work), Choice (branching logic), Parallel, Map, Wait, Pass, Succeed, and Fail[cite: 8]."}, {"id": 62, "topic": "AWS Step Functions", "subtopic": "State Types - Parallel & Map", "type": "single", "q": "Which state type in AWS Step Functions dynamically processes items of an input array in parallel?", "options": ["A) Map State", "B) Pass State", "C) Wait State", "D) Fail State"], "answer": "A", "exp": "The Map State iterates over elements in an input array, running tasks for each item concurrently or sequentially[cite: 8]."}, {"id": 63, "topic": "AWS Step Functions", "subtopic": "Error Handling - Retries & Catchers", "type": "multi", "q": "Which TWO error handling constructs are defined within an Amazon States Language state definition? (Select 2)", "options": ["A) Retry to automatically re-attempt tasks with backoff rates", "B) Catch to intercept errors and transition to fallback states", "C) Delete to purge the entire state machine upon error", "D) Invalidate to revoke caller IAM policies"], "answer": ["A", "B"], "exp": "Retry policies handle transient issues with exponential backoff, and Catch blocks route execution to error-handling states[cite: 1, 5, 8]."}, {"id": 64, "topic": "AWS Step Functions", "subtopic": "Data Manipulation with JSONPath", "type": "single", "q": "Which JSONPath parameter specifies where to insert the task output into the state machine's raw input payload?", "options": ["A) ResultPath", "B) InputPath", "C) OutputPath", "D) Parameters"], "answer": "A", "exp": "ResultPath specifies the JSON path location where the task execution result is inserted into the state's data payload[cite: 8]."}, {"id": 65, "topic": "AWS Step Functions", "subtopic": "Service Integrations", "type": "multi", "q": "Which TWO services integrate directly with AWS Step Functions without requiring custom API wrapper code? (Select 2)", "options": ["A) AWS Batch for container job submission", "B) Amazon SageMaker for machine learning model training", "C) Physical tape changer drives", "D) Local hypervisor BIOS firmware"], "answer": ["A", "B"], "exp": "Step Functions supports native integrations with 200+ AWS services, including Lambda, Batch, ECS, Glue, and SageMaker[cite: 8]."}, {"id": 66, "topic": "AWS Step Functions", "subtopic": "Security & VPC Endpoints", "type": "single", "q": "How can applications securely trigger Step Functions state machines from private VPC subnets without internet traversal?", "options": ["A) AWS PrivateLink Interface VPC Endpoints", "B) Internet Gateways with public IP addressing", "C) Unencrypted external HTTP proxies", "D) NAT Instances in public subnets"], "answer": "A", "exp": "Interface VPC Endpoints powered by AWS PrivateLink enable private connectivity to Step Functions from within a VPC[cite: 8]."}, {"id": 67, "topic": "AWS Step Functions", "subtopic": "Pricing", "type": "single", "q": "How are AWS Step Functions Standard Workflows billed?", "options": ["A) Per state transition", "B) Per hour of idle state machine existence", "C) Per physical CPU core running on host servers", "D) Per gigabyte of S3 storage provisioned"], "answer": "A", "exp": "Standard Workflows are billed strictly based on the number of state transitions executed[cite: 8]."}, {"id": 68, "topic": "AWS Step Functions", "subtopic": "Use Cases", "type": "multi", "q": "Which TWO scenarios are ideal use cases for AWS Step Functions? (Select 2)", "options": ["A) Coordinating multi-step serverless order processing workflows involving payments, inventory, and notifications", "B) Orchestrating complex machine learning training and batch ETL pipelines", "C) Providing millisecond disk block caching for EC2 instances", "D) Serving static HTML assets from edge caching servers"], "answer": ["A", "B"], "exp": "Step Functions excels at orchestrating complex multi-service serverless workflows, data processing, and human approval steps[cite: 8]."}, {"id": 69, "topic": "AWS Step Functions", "subtopic": "Best Practices", "type": "single", "q": "What is an architectural best practice when coordinating high-volume, short-duration tasks with Step Functions?", "options": ["A) Select Express Workflows to optimize cost and performance for high-frequency event-driven workloads", "B) Use Standard Workflows with 1-year timeouts for every small task", "C) Avoid setting retries on any external service integrations", "D) Embed cleartext IAM access credentials directly in state definitions"], "answer": "A", "exp": "Express Workflows provide higher throughput and lower execution costs for short-lived, high-volume event processing[cite: 8]."}, {"id": 70, "topic": "AWS Step Functions", "subtopic": "Exam Tips", "type": "single", "q": "What key phrase in an exam question points directly to choosing AWS Step Functions?", "options": ["A) Coordinate multiple AWS services into a resilient workflow using state machines, branching, and automated error handling", "B) Deploy low-latency content caching at global edge locations", "C) Run physical tape backups to Amazon S3 Glacier", "D) Scale compute capacity based on CPU utilization metrics"], "answer": "A", "exp": "State machine orchestration, visual workflows, retries, and multi-service coordination define AWS Step Functions on the exam[cite: 8]."}, {"id": 71, "topic": "Amazon AppFlow", "subtopic": "Security & Encryption", "type": "single", "q": "How does Amazon AppFlow protect sensitive SaaS records during transit and at rest?", "options": ["A) Enforces TLS in transit and uses AWS KMS encryption at rest", "B) Stores files in cleartext on public web servers", "C) Drops encryption headers to accelerate throughput", "D) Disables IAM policy evaluations"], "answer": "A", "exp": "AppFlow encrypts data in transit using TLS and protects data at rest using AWS KMS keys[cite: 8]."}, {"id": 72, "topic": "Amazon SQS", "subtopic": "FIFO Deduplication", "type": "single", "q": "How does an Amazon SQS FIFO queue ensure that duplicate messages sent within a 5-minute deduplication interval are not processed twice?", "options": ["A) By evaluating the Message Deduplication ID or using content-based SHA-256 deduplication", "B) By deleting the queue automatically if duplicates appear", "C) By re-routing duplicates to an unencrypted public bucket", "D) By pausing the producer application"], "answer": "A", "exp": "SQS FIFO queues use Message Deduplication IDs or content-based deduplication hashing to reject duplicate messages within a 5-minute window[cite: 8]."}], "quiz3": [{"id": 1, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Cost Management Overview", "subtopic": "What It Is", "type": "single", "q": "Which of the following is NOT an intended purpose of the AWS Cost Management suite of tools?", "options": ["A) Tracking, estimating, and forecasting cloud spending[cite: 8]", "B) Setting spending thresholds and automated alerts[cite: 8]", "C) Automatically rewriting application source code to eliminate expensive database queries", "D) Providing cost visibility, control, and optimization across accounts[cite: 8]"], "answer": "C", "exp": "AWS Cost Management tools monitor, forecast, alert, and optimize cloud expenses, but they do not modify or refactor application code[cite: 8]."}, {"id": 2, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Pricing Calculator", "subtopic": "Key Features & Use Cases", "type": "single", "q": "What is the primary function of the AWS Pricing Calculator?", "options": ["A) Estimating monthly AWS architecture costs before deploying resources[cite: 8]", "B) Generating downloadable official SOC audit compliance reports", "C) Scanning live EC2 instances for unpatched OS kernel vulnerabilities", "D) Auditing real-time network packet loss across Direct Connect links"], "answer": "A", "exp": "The AWS Pricing Calculator helps model and estimate monthly costs for AWS services prior to deployment and allows exporting shareable estimates[cite: 8]."}, {"id": 3, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Free Tier", "subtopic": "Free Tier Types", "type": "multi", "q": "Which TWO types of free usage options are provided under the AWS Free Tier? (Select 2)", "options": ["A) 12 Months Free tier for eligible services like EC2, S3, and RDS[cite: 8]", "B) Always Free tier for core services such as DynamoDB, Lambda, and IAM[cite: 8]", "C) Lifetime unlimited free compute for high-end GPU cluster instances", "D) Free unmetered inter-region data transfer across all global regions"], "answer": ["A", "B"], "exp": "The AWS Free Tier includes 12-Month Free offerings, Always Free services (e.g., IAM, limited DynamoDB, and Lambda), and short-term trials[cite: 8]."}, {"id": 4, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Billing Dashboard", "subtopic": "Management Capabilities", "type": "single", "q": "Which capability is NOT available from the AWS Billing and Cost Management Dashboard?", "options": ["A) Viewing and downloading invoices and usage reports[cite: 8]", "B) Managing payment methods and monitoring Free Tier usage[cite: 8]", "C) Accessing links to AWS Budgets, Cost Explorer, and Cost and Usage Reports[cite: 8]", "D) Compiling custom container images into Amazon ECR repositories"], "answer": "D", "exp": "The Billing and Cost Management Dashboard serves as the central billing hub; it does not build or compile container images[cite: 8]."}, {"id": 5, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Budgets", "subtopic": "Budget Types", "type": "single", "q": "Which AWS Budgets type is specifically designed to monitor how well your long-term commitment plans cover your active workloads?", "options": ["A) RI / Savings Plans Budgets[cite: 8]", "B) Cost Budgets[cite: 8]", "C) Usage Budgets[cite: 8]", "D) Network Bandwidth Quota Budgets"], "answer": "A", "exp": "AWS Budgets supports Cost Budgets, Usage Budgets, and RI/Savings Plans Budgets (which monitor coverage and utilization)[cite: 8]."}, {"id": 6, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Budgets", "subtopic": "Actions & Notifications", "type": "multi", "q": "Which TWO actions can AWS Budgets initiate when a cost or usage threshold is breached? (Select 2)", "options": ["A) Send notifications via Amazon SNS or AWS Chatbot[cite: 8]", "B) Execute automated target actions, such as applying IAM policies or stopping EC2 instances[cite: 8]", "C) Permanently wipe the associated AWS account data to prevent debt", "D) Automatically downgrade all production databases to single-AZ SQLite"], "answer": ["A", "B"], "exp": "AWS Budgets can trigger alerts via SNS or Chatbot and run automated budget actions, such as stopping instances or applying restrictive SCPs[cite: 8]."}, {"id": 7, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Cost Explorer", "subtopic": "Visualization & Forecasting", "type": "single", "q": "What is the primary analytical capability provided by AWS Cost Explorer?", "options": ["A) Interactively visualizing, filtering, and forecasting AWS spend and usage patterns over time[cite: 8]", "B) Editing DNS zone records on authoritative nameservers", "C) Decoupling microservices using asynchronous message queues", "D) Performing real-time DDoS mitigation on CloudFront distributions"], "answer": "A", "exp": "AWS Cost Explorer is an interactive tool used to analyze past and current costs, filter by dimensions/tags, and forecast future spend[cite: 8]."}, {"id": 8, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Cost and Usage Report (CUR)", "subtopic": "Data Granularity & Analytics", "type": "multi", "q": "Which TWO statements regarding the AWS Cost and Usage Report (CUR) are accurate? (Select 2)", "options": ["A) It delivers the most comprehensive and granular billing dataset to an Amazon S3 bucket in CSV format[cite: 8]", "B) The delivered reports can be queried using Amazon Athena and visualized in Amazon QuickSight[cite: 8]", "C) It replaces all Amazon CloudWatch operational log streams", "D) It can only record data at a high-level monthly aggregate"], "answer": ["A", "B"], "exp": "The CUR provides the most granular billing data (hourly or daily) delivered to S3, which can be directly analyzed with Athena and QuickSight[cite: 8]."}, {"id": 9, "section": "3. AWS COST MANAGEMENT", "topic": "Consolidated Billing", "subtopic": "Benefits & Volume Discounts", "type": "single", "q": "How does Consolidated Billing in AWS Organizations help enterprises reduce overall infrastructure spend?", "options": ["A) Aggregates usage across all member accounts to qualify for tier-based volume discounts on services like Amazon S3 and EC2[cite: 8]", "B) Converts all On-Demand EC2 instances to free Tier-1 serverless functions", "C) Erases all cross-region data transfer charges between unrelated accounts", "D) Merges multiple AWS accounts into a single root account login"], "answer": "A", "exp": "Consolidated billing pools resource usage across all accounts under the management account, enabling shared volume tier discounts[cite: 8]."}, {"id": 10, "section": "3. AWS COST MANAGEMENT", "topic": "Cost Allocation Tags", "subtopic": "Tag Types & Activation", "type": "multi", "q": "Which TWO statements are true regarding Cost Allocation Tags? (Select 2)", "options": ["A) User-defined cost allocation tags must be explicitly activated in the Billing Console to appear in Cost Explorer and CUR[cite: 8]", "B) Supports both AWS-generated tags (e.g., createdBy) and custom user-defined tags[cite: 8]", "C) Applying tags to an EC2 instance automatically gives it public internet access", "D) Activating a tag incurs an hourly service fee of $5 per tagged resource"], "answer": ["A", "B"], "exp": "Cost allocation tags include AWS-generated and user-defined tags, both of which must be activated in the Billing Console to track costs[cite: 8]."}, {"id": 11, "section": "3. AWS COST MANAGEMENT", "topic": "Savings Plans vs Reserved Instances", "subtopic": "Flexibility & Commitment", "type": "single", "q": "What makes Savings Plans more flexible than traditional standard Reserved Instances?", "options": ["A) Savings Plans commit to a consistent dollar spend per hour rather than specific instance configurations, applying across EC2, Fargate, and Lambda[cite: 8]", "B) Savings Plans allow completely canceling commitments at any time with a 100% refund", "C) Savings Plans require zero commitment and provide discounts on spot instance auctions", "D) Savings Plans apply exclusively to third-party software purchased on AWS Marketplace"], "answer": "A", "exp": "Savings Plans offer flexible commitment based on spend per hour ($/hour) applying automatically across instance families, OS, Fargate, and Lambda[cite: 8]."}, {"id": 12, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Trusted Advisor - Cost Optimization", "subtopic": "Checks & Recommendations", "type": "multi", "q": "Which TWO checks are evaluated under the Cost Optimization category of AWS Trusted Advisor? (Select 2)", "options": ["A) Idle or underutilized EC2 instances[cite: 8]", "B) Unassociated Elastic IP addresses incurring charges[cite: 8]", "C) Multi-factor authentication (MFA) on the root account", "D) Verification of TLS certificates on Application Load Balancers"], "answer": ["A", "B"], "exp": "Idle EC2 instances, unattached EBS volumes, unassociated Elastic IPs, and low-usage load balancers fall under Cost Optimization (MFA and TLS fall under Security)[cite: 8]."}, {"id": 13, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Compute Optimizer", "subtopic": "Machine Learning Recommendations", "type": "single", "q": "How does AWS Compute Optimizer formulate its resource right-sizing recommendations?", "options": ["A) Uses machine learning to analyze historical CloudWatch utilization metrics to recommend optimal EC2, EBS, and Lambda configurations[cite: 8]", "B) Enforces mandatory downscaling scripts on all EC2 instances every weekend", "C) Reads application source code repositories to locate unoptimized SQL statements", "D) Requires manual entry of anticipated network throughput by administrators"], "answer": "A", "exp": "Compute Optimizer leverages machine learning to evaluate historical resource metrics, recommending right-sized configurations to lower cost and boost performance[cite: 8]."}, {"id": 14, "section": "3. AWS COST MANAGEMENT", "topic": "AWS Cost Anomaly Detection", "subtopic": "Machine Learning Spikes & Alerts", "type": "single", "q": "What is the primary operational role of AWS Cost Anomaly Detection?", "options": ["A) Uses machine learning to continuously monitor spending patterns, identify unexpected cost spikes, and alert via email or SNS[cite: 8]", "B) Terminating instances immediately whenever their hourly CPU utilization drops below 5%", "C) Blocking public subnet traffic when inbound bandwidth exceeds baseline thresholds", "D) Re-pricing third-party Marketplace software based on competitive market rates"], "answer": "A", "exp": "AWS Cost Anomaly Detection applies machine learning to identify unusual spending spikes and sends automated alerts through email or SNS topics[cite: 8]."}], "quiz4": [{"id": 1, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Batch as described in the handbook?", "options": ["A) Fully managed batch computing service that plans, schedules, and executes containerized batch workloads[cite: 8]", "B) Dynamically provisions optimal compute resources such as EC2, Spot, and Fargate based on volume[cite: 8]", "C) Requires users to manually install, configure, and maintain open-source cluster job scheduler software[cite: 8]", "D) Users pay only for the underlying compute and storage resources consumed, with no extra service fee[cite: 8]"], "answer": "C", "exp": "AWS Batch is a fully managed service that eliminates the need to install or operate dedicated cluster schedulers or queue servers[cite: 8]."}, {"id": 2, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Key Features", "type": "multi", "q": "Which TWO capabilities are supported natively as core features of AWS Batch? (Select 2)", "options": ["A) Fine-grained job dependencies and priority execution order across job queues[cite: 8]", "B) Support for EC2 Spot Instances and Fargate for cost and scaling optimization[cite: 8]", "C) Dedicated real-time graph visualization of on-premises fiber switches", "D) Compulsory manual scaling for all submitted batch jobs"], "answer": ["A", "B"], "exp": "AWS Batch supports job prioritization, task dependencies, automatic dynamic scaling, and allows running jobs on EC2, Spot, or Fargate[cite: 8]."}, {"id": 3, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Core Components", "type": "single", "q": "Which component in AWS Batch functions as the blueprint template that specifies Docker images, vCPU, memory, IAM execution roles, and retry strategies?", "options": ["A) Job Definition[cite: 8]", "B) Job Queue[cite: 8]", "C) Compute Environment[cite: 8]", "D) Cluster Placement Group[cite: 8]"], "answer": "A", "exp": "A Job Definition is the template specifying parameters such as container image, vCPU, RAM allocations, volumes, IAM roles, and retry strategies[cite: 8]."}, {"id": 4, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Job Types", "type": "multi", "q": "Which TWO job types are supported when submitting workloads to AWS Batch? (Select 2)", "options": ["A) Array Jobs (running up to 10,000 copies of the same job with parameterized inputs)[cite: 8]", "B) Multi-Node Parallel Jobs (for tightly coupled distributed HPC or MPI applications)[cite: 8]", "C) Persistent Hardware Hypervisor Jobs", "D) Dynamic DNS Resolver Jobs"], "answer": ["A", "B"], "exp": "AWS Batch supports Single Jobs, Array Jobs (up to 10,000 identical tasks with index parameters), and Multi-Node Parallel Jobs for HPC/MPI workloads[cite: 8]."}, {"id": 5, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Job States & Lifecycle", "type": "single", "q": "Which of the following is NOT one of the standard lifecycle states of an AWS Batch job?", "options": ["A) SUBMITTED[cite: 8]", "B) RUNNABLE[cite: 8]", "C) SUSPENDED_IN_CACHE", "D) STARTING[cite: 8]", "E) SUCCEEDED[cite: 8]"], "answer": "C", "exp": "The documented AWS Batch job lifecycle states are SUBMITTED, PENDING, RUNNABLE, STARTING, RUNNING, SUCCEEDED, and FAILED[cite: 8]."}, {"id": 6, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Compute Environments", "type": "multi", "q": "Which TWO types of Compute Environments can be configured in AWS Batch? (Select 2)", "options": ["A) Managed Compute Environments (where AWS automatically provisions and scales EC2/Fargate resources)[cite: 8]", "B) Unmanaged Compute Environments (where customers maintain and configure their own customized ECS container instances)[cite: 8]", "C) Ephemeral S3 Bucket Environments", "D) Offline Snowcone Compute Clusters"], "answer": ["A", "B"], "exp": "AWS Batch supports Managed Compute Environments (AWS handles instance lifecycle and scaling) and Unmanaged Compute Environments (customer-managed)[cite: 8]."}, {"id": 7, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Allocation Strategies", "type": "single", "q": "Which allocation strategy in an AWS Batch Managed Compute Environment selects Spot instance types that are least likely to be interrupted while fulfilling required capacity?", "options": ["A) SPOT_CAPACITY_OPTIMIZED[cite: 8]", "B) BEST_FIT[cite: 8]", "C) BEST_FIT_PROGRESSIVE[cite: 8]", "D) HIGHEST_FREQUENCY_BURST"], "answer": "A", "exp": "The SPOT_CAPACITY_OPTIMIZED allocation strategy directs AWS Batch to launch Spot instances from the deepest pools that are least prone to interruption[cite: 8]."}, {"id": 8, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Security & Network Isolation", "type": "multi", "q": "Which TWO security and network best practices apply to AWS Batch workloads? (Select 2)", "options": ["A) Attaching IAM execution roles with least-privilege permissions directly to Job Definitions[cite: 8]", "B) Configuring Compute Environments inside private VPC subnets to isolate batch processing from the internet[cite: 8]", "C) Hardcoding IAM secret access keys into container environment variables", "D) Disabling AWS KMS encryption for sensitive parameters"], "answer": ["A", "B"], "exp": "Security best practices require private VPC subnet deployments and IAM job roles that enforce least-privilege access without embedding long-term keys[cite: 8]."}, {"id": 9, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Use Cases & Integrations", "type": "single", "q": "Which of the following is NOT a typical workload for AWS Batch?", "options": ["A) Large-scale financial risk calculations and portfolio simulations[cite: 8]", "B) Media transcoding and 3D visual effects batch rendering[cite: 8]", "C) Sub-millisecond synchronous real-time web socket gaming backends", "D) Nightly genomic sequencing and bio-informatics pipelines[cite: 8]"], "answer": "C", "exp": "AWS Batch is designed for asynchronous, asynchronous batch computation, ETL, rendering, and scientific simulations, not real-time sub-millisecond web sockets[cite: 8]."}, {"id": 10, "section": "4. COMPUTE", "topic": "AWS Batch", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the SAA-C03 exam to select AWS Batch over other compute options?", "options": ["A) The requirement to orchestrate thousands of containerized or script-based batch jobs dynamically across Spot or On-Demand instances without cluster management[cite: 8]", "B) The need to host stateful monolithic Windows applications requiring dedicated physical hardware", "C) Deploying a managed WordPress site with auto
