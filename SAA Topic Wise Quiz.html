TTP 500 'Internal Server Error'", "D) API Gateway cannot throttle individual API keys"], "answer": "A", "exp": "API Gateway uses a token bucket algorithm for throttling, returning HTTP 429 when client limits or burst capacities are exceeded[cite: 1, 8]."}, {"id": 21, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Device Farm?", "options": ["A) Fully managed application testing service for testing web and mobile apps on real physical devices in the AWS Cloud[cite: 8]", "B) Allows testing Android, iOS, and web applications across a large pool of real phones and tablets[cite: 8]", "C) Relies exclusively on software emulators without using actual physical smartphone hardware[cite: 8]", "D) Supports both automated test script execution and manual remote interactive testing[cite: 8]"], "answer": "C", "exp": "A core feature of AWS Device Farm is that it tests on real, physical devices in the AWS cloud, not software emulators[cite: 8]."}, {"id": 22, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "Testing Options & Frameworks", "type": "multi", "q": "Which TWO automated testing frameworks are supported natively by AWS Device Farm? (Select 2)", "options": ["A) Appium[cite: 8]", "B) Espresso (and XCTest)[cite: 8]", "C) Hadoop MapReduce", "D) Apache Spark SQL"], "answer": ["A", "B"], "exp": "Device Farm supports popular mobile testing frameworks including Appium, Espresso, Calabash, and XCTest[cite: 8]."}, {"id": 23, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "Remote Access (Manual Testing)", "type": "single", "q": "How does Remote Access work in AWS Device Farm?", "options": ["A) Allows developers to swipe, gesture, and interact with a real physical device in real time directly through a web browser session[cite: 8]", "B) Ships a physical test phone to the developer's office", "C) Grants SSH access to the underlying telecom cell tower", "D) Requires configuring an on-premises VPN appliance"], "answer": "A", "exp": "Remote Access allows manual interaction with real devices via the browser to reproduce bugs, test gestures, and verify UI behavior[cite: 8]."}, {"id": 24, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "Test Artifacts and Reports", "type": "multi", "q": "Which TWO types of diagnostic reporting artifacts are generated automatically by AWS Device Farm test runs? (Select 2)", "options": ["A) Screenshots and video recordings of test execution[cite: 8]", "B) Device logs, performance metrics (CPU/memory), and stack traces[cite: 8]", "C) Full memory core dumps of the AWS global network switches", "D) Customer bank account statements"], "answer": ["A", "B"], "exp": "Device Farm delivers comprehensive reports containing logs, screenshots, video captures, CPU/memory performance, and crash dumps[cite: 8]."}, {"id": 25, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "Network Simulation", "type": "single", "q": "What capability does the Network Simulation feature provide in AWS Device Farm?", "options": ["A) Simulates various real-world network conditions (e.g., 3G, poor Wi-Fi, high packet loss, jitter) to test application resilience[cite: 8]", "B) Creates physical cross-connects to AWS Direct Connect", "C) Automatically purchases additional internet bandwidth", "D) Encrypts VPC subnets with custom certificates"], "answer": "A", "exp": "Network simulation enables testing application behavior under diverse bandwidth, latency, and packet loss profiles[cite: 8]."}, {"id": 26, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "Security and Device Isolation", "type": "single", "q": "How does AWS Device Farm ensure security and privacy between different customer test runs on shared physical devices?", "options": ["A) Each device is wiped, uninstalled of all apps, and reset to a clean state between test runs, with strict isolation[cite: 8]", "B) Retains all user data and installed apps permanently for public browsing", "C) Shares local device storage across multiple AWS accounts simultaneously", "D) Uploads app code to an unencrypted public GitHub repository"], "answer": "A", "exp": "AWS Device Farm ensures security by isolating tests and performing an automated wipe and reset of physical devices between runs[cite: 8]."}, {"id": 27, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "CI/CD Integration & Pricing", "type": "multi", "q": "Which TWO statements regarding AWS Device Farm CI/CD integration and pricing are true? (Select 2)", "options": ["A) Can be triggered automatically from CI/CD pipelines using plugins (e.g., Jenkins) or the AWS CLI[cite: 8]", "B) Pay-as-you-go pricing billed per device minute[cite: 8]", "C) Requires a mandatory 3-year upfront commitment for all devices", "D) Free unmetered testing on dedicated private device pools"], "answer": ["A", "B"], "exp": "Device Farm integrates with CI/CD tools via plugins/APIs and bills on a pay-as-you-go per-device-minute model (or monthly unmetered subscription)[cite: 8]."}, {"id": 28, "section": "8. FRONT-END & MOBILE", "topic": "AWS Device Farm", "subtopic": "Exam Tips", "type": "single", "q": "What is the key differentiator for AWS Device Farm on the SAA-C03 exam?", "options": ["A) Testing mobile and web applications on real physical mobile devices in the cloud without managing on-premises device labs[cite: 8]", "B) Converting SQL database queries into NoSQL models", "C) Managing push notifications to Apple and Android devices", "D) Deploying serverless containers to AWS Fargate"], "answer": "A", "exp": "Device Farm is tested as the managed cloud service for running automated tests on real, physical mobile hardware[cite: 8]."}, {"id": 29, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "What It Is & Channels", "type": "single", "q": "Which of the following is NOT true regarding Amazon Pinpoint?", "options": ["A) Fully managed customer engagement service for multi-channel messaging and user behavior analytics[cite: 8]", "B) Supports communication channels including email, SMS, push notifications, voice, and in-app messaging[cite: 8]", "C) A continuous file synchronization utility for on-premises NAS file systems", "D) Allows defining audience segments and tracking customer journeys[cite: 8]"], "answer": "C", "exp": "Amazon Pinpoint is a multi-channel customer engagement and marketing service, not a storage file synchronization tool[cite: 8]."}, {"id": 30, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Audience Segmentation", "type": "multi", "q": "Which TWO methods are supported for creating audience segments in Amazon Pinpoint? (Select 2)", "options": ["A) Dynamic Segments based on user attributes, custom app events, and behaviors[cite: 8]", "B) Static Segments created by importing static endpoint lists from files stored in S3[cite: 8]", "C) Compulsory random allocation of all global AWS users", "D) Mandatory single-user segments only"], "answer": ["A", "B"], "exp": "Pinpoint supports Dynamic Segments (evaluated in real time based on behaviors/attributes) and Static Segments (imported lists)[cite: 8]."}, {"id": 31, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Campaigns vs Journeys", "type": "single", "q": "In Amazon Pinpoint, what is the key distinction between a Campaign and a Journey?", "options": ["A) A campaign sends a single message to a segment on schedule; a journey is a multi-step, event-driven engagement workflow guiding users based on their actions[cite: 8]", "B) A campaign is for SMS only; a journey is for email only", "C) Campaigns are managed by IAM; journeys are managed by Route 53", "D) Journeys can only send messages once per year"], "answer": "A", "exp": "Campaigns send scheduled messages to segments; Journeys build dynamic multi-step, conditional user lifecycle workflows[cite: 8]."}, {"id": 32, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Core Components - Endpoints", "type": "single", "q": "What is an Endpoint in Amazon Pinpoint?", "options": ["A) A destination representing a specific delivery target, such as a mobile device push token, phone number, or email address[cite: 8]", "B) A physical server host in a local VPC subnet", "C) An interface endpoint created by AWS PrivateLink", "D) A Route 53 DNS record"], "answer": "A", "exp": "In Pinpoint, an endpoint represents an addressable communication destination assigned to a user (e.g., device token, email, phone)[cite: 8]."}, {"id": 33, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Analytics and Tracking", "type": "multi", "q": "Which TWO metrics can Amazon Pinpoint track to measure customer engagement? (Select 2)", "options": ["A) Application session data, active users, and demographic trends[cite: 8]", "B) Message delivery rates, open rates, and conversion click-through events[cite: 8]", "C) Hardware hypervisor disk spindle rotation speed", "D) Direct Connect BGP routing table flapping"], "answer": ["A", "B"], "exp": "Pinpoint captures application usage analytics (sessions, active users) and message performance (deliveries, opens, clicks)[cite: 8]."}, {"id": 34, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Regulatory Compliance & Opt-Outs", "type": "single", "q": "Why is opt-out management a critical governance feature in Amazon Pinpoint?", "options": ["A) Automatically honors customer unsubscribes and communication preferences across SMS and email to maintain compliance with telecommunication regulations[cite: 8]", "B) Disables AWS billing alerts", "C) Deletes the entire Pinpoint project automatically", "D) Converts outgoing messages into encrypted hash files"], "answer": "A", "exp": "Pinpoint automatically manages recipient opt-out lists to ensure communications comply with regulations and user preferences[cite: 8]."}, {"id": 35, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Pinpoint vs Amazon SES", "type": "single", "q": "When comparing Amazon Pinpoint and Amazon Simple Email Service (Amazon SES), when is Amazon Pinpoint preferred?", "options": ["A) When an organization needs multi-channel campaigns, user segmentation, behavioral analytics, and lifecycle journeys beyond transactional email[cite: 8]", "B) When simple high-volume bulk SMTP email sending is the only requirement", "C) When deploying containerized web apps on ECS", "D) When configuring network firewalls on VPC subnets"], "answer": "A", "exp": "SES is a developer-focused transactional/bulk email engine; Pinpoint provides complete marketing, segmentation, and multi-channel journeys[cite: 8]."}, {"id": 36, "section": "8. FRONT-END & MOBILE", "topic": "Amazon Pinpoint", "subtopic": "Exam Tips", "type": "single", "q": "What is the key indicator on the SAA exam to select Amazon Pinpoint?", "options": ["A) Targeting user segments with personalized, multi-channel messages (push, SMS, email) and multi-step customer lifecycle journeys[cite: 8]", "B) Running distributed SQL queries against S3 log files", "C) Providing sub-millisecond in-memory caching for DynamoDB", "D) Creating automated CloudFormation templates"], "answer": "A", "exp": "Customer journeys, dynamic audience segmentation, and multi-channel marketing campaigns point directly to Amazon Pinpoint[cite: 8]."}, {"id": 37, "section": "8. FRONT-END & MOBILE", "topic": "Amazon API Gateway", "subtopic": "Mapping Templates", "type": "single", "q": "What is the purpose of API Gateway Request/Response Mapping Templates (using Velocity Template Language - VTL)?", "options": ["A) Transforms the client payload, parameters, and headers before passing them to the backend, and modifies backend responses before returning to clients[cite: 8]", "B) Recompiles Java code into binary images", "C) Automatically creates S3 lifecycle policies", "D) Rotates IAM passwords for developers"], "answer": "A", "exp": "Mapping templates use VTL to transform incoming request payloads and format outgoing responses, decoupling client and backend schemas[cite: 8]."}, {"id": 38, "section": "8. FRONT-END & MOBILE", "topic": "AWS Amplify", "subtopic": "GraphQL Transform", "type": "single", "q": "How does the Amplify GraphQL Transform library assist developers building APIs?", "options": ["A) Converts simple GraphQL Schema Definition Language (SDL) files with directives (@model, @auth) into complete AWS AppSync schemas, DynamoDB tables, and resolvers[cite: 5, 8]", "B) Automatically translates foreign languages into English using Amazon Translate", "C) Converts relational SQL databases into flat CSV text files", "D) Compiles HTML pages into mobile APK packages"], "answer": "A", "exp": "Amplify GraphQL Transform uses annotations (like `@model`) to auto-generate AppSync resolvers, schemas, and DynamoDB backend resources[cite: 5, 8]."}], "quiz9": [{"id": 1, "section": "9. MACHINE LEARNING", "topic": "Amazon Rekognition", "subtopic": "Capabilities & Use Cases", "type": "single", "q": "Which of the following is NOT an accurate capability of Amazon Rekognition as outlined in the handbook?", "options": ["A) Object, scene, and action labeling in images and videos[cite: 8]", "B) Facial detection, facial analysis, and celebrity recognition[cite: 8]", "C) Direct speech-to-text transcription of recorded audio streams", "D) Unsafe content detection and image moderation[cite: 8]"], "answer": "C", "exp": "Speech-to-text transcription is provided by Amazon Transcribe, whereas Amazon Rekognition is focused on image and video analysis[cite: 8]."}, {"id": 2, "section": "9. MACHINE LEARNING", "topic": "Amazon Transcribe", "subtopic": "Capabilities & Subtitles", "type": "single", "q": "What is the primary architectural purpose and common use case for Amazon Transcribe?", "options": ["A) Automatically converting spoken audio into text for use cases like video subtitling and meeting notes[cite: 8]", "B) Converting written text into natural-sounding speech across multiple voices[cite: 8]", "C) Translating documents between spoken languages in real-time[cite: 8]", "D) Extracting tabular data from scanned paper forms"], "answer": "A", "exp": "Amazon Transcribe uses automatic speech recognition (ASR) to convert speech to text, commonly used for subtitles and audio transcripts[cite: 8]."}, {"id": 3, "section": "9. MACHINE LEARNING", "topic": "Amazon Polly", "subtopic": "Text-to-Speech & Voices", "type": "single", "q": "Which capability distinguishes Amazon Polly from other AWS AI/ML services?", "options": ["A) Synthesizes lifelike speech from written text across multiple languages and voices[cite: 8]", "B) Analyzes customer sentiment from textual survey feedback[cite: 8]", "C) Automatically indexes documents for enterprise semantic search[cite: 8]", "D) Builds and trains custom convolutional neural networks[cite: 8]"], "answer": "A", "exp": "Amazon Polly is a Text-to-Speech (TTS) service that turns text into lifelike spoken audio with customizable voices and languages[cite: 8]."}, {"id": 4, "section": "9. MACHINE LEARNING", "topic": "Amazon Translate", "subtopic": "Language Translation", "type": "single", "q": "Which operational feature is supported by Amazon Translate for global application localization?", "options": ["A) Provides neural machine translation supporting both real-time streaming and batch document translation across many languages[cite: 8]", "B) Translates audio speech directly into video files", "C) Formats relational database tables into GraphQL schemas", "D) Automatically converts IPv4 packets into IPv6 format"], "answer": "A", "exp": "Amazon Translate provides neural machine translation for real-time and batch language translation workflows[cite: 8]."}, {"id": 5, "section": "9. MACHINE LEARNING", "topic": "Amazon Lex", "subtopic": "Conversational Interfaces & Chatbots", "type": "single", "q": "What is the core functionality provided by Amazon Lex?", "options": ["A) Building conversational interfaces, voice assistants, and chatbots using Natural Language Understanding (NLU) and speech recognition[cite: 8]", "B) Orchestrating containerized tasks across multiple Availability Zones", "C) Hosting static marketing web pages via S3 and CloudFront", "D) Running distributed SQL queries against exabyte-scale data lakes"], "answer": "A", "exp": "Amazon Lex provides automatic speech recognition (ASR) and natural language understanding (NLU) to build conversational chatbots[cite: 8]."}, {"id": 6, "section": "9. MACHINE LEARNING", "topic": "Amazon Connect", "subtopic": "Cloud Contact Center", "type": "single", "q": "Which of the following is NOT a feature of Amazon Connect?", "options": ["A) Cloud-based omnichannel contact center service[cite: 8]", "B) Support for inbound and outbound customer communication channels[cite: 8]", "C) Native integration with Amazon Lex for conversational IVR chatbots[cite: 3, 8]", "D) Requires provisioning and cabling physical PBX hardware telephony switches on-premises"], "answer": "D", "exp": "Amazon Connect is a fully cloud-based, self-service contact center service that eliminates physical on-premises telephony hardware[cite: 8]."}, {"id": 7, "section": "9. MACHINE LEARNING", "topic": "Amazon Comprehend", "subtopic": "Natural Language Processing (NLP)", "type": "single", "q": "Which analytical capabilities are natively provided by Amazon Comprehend?", "options": ["A) NLP service that inspects unstructured text to detect sentiment, entities, key phrases, and languages[cite: 8]", "B) Compiling low-level C++ code for embedded IoT devices", "C) Synthesizing lifelike speech audio files from plain text[cite: 8]", "D) Generating automated CloudFormation infrastructure templates"], "answer": "A", "exp": "Amazon Comprehend is a Natural Language Processing (NLP) service that extracts insights, entities, sentiment, and key phrases from text[cite: 8]."}, {"id": 8, "section": "9. MACHINE LEARNING", "topic": "Amazon SageMaker", "subtopic": "End-to-End ML Platform", "type": "multi", "q": "Which TWO operational stages of the machine learning lifecycle are fully managed by Amazon SageMaker? (Select 2)", "options": ["A) Building and preparing datasets with managed notebook instances and automated labeling[cite: 8]", "B) Training, tuning, and deploying models to scalable real-time inference endpoints[cite: 3, 8]", "C) Replacing AWS IAM roles with local workstation passwords", "D) Manually provisioning physical server racks in colocation facilities"], "answer": ["A", "B"], "exp": "SageMaker covers the entire ML workflow: data preparation/labeling, distributed training, hyperparameter tuning, and endpoint deployment[cite: 3, 8]."}, {"id": 9, "section": "9. MACHINE LEARNING", "topic": "Amazon Kendra", "subtopic": "Intelligent Enterprise Search", "type": "single", "q": "What makes Amazon Kendra different from traditional keyword-based search engines?", "options": ["A) Uses machine learning and natural language processing to deliver accurate, context-aware answers to natural language questions[cite: 8]", "B) Strictly limits searches to exact string-matched filenames", "C) Requires compiling all documentation into binary machine code", "D) Functions exclusively as an in-memory key-value cache"], "answer": "A", "exp": "Amazon Kendra is an intelligent enterprise search service powered by ML that enables users to search using natural language questions[cite: 8]."}, {"id": 10, "section": "9. MACHINE LEARNING", "topic": "Amazon Personalize", "subtopic": "Recommendations & Personalization", "type": "single", "q": "What is the primary use case for Amazon Personalize?", "options": ["A) Delivering real-time personalized product recommendations, customized search results, and targeted marketing using ML models[cite: 8]", "B) Converting PDF contracts into plain text strings[cite: 8]", "C) Managing IAM user credentials across multiple AWS accounts", "D) Filtering malicious DDoS attacks at Amazon CloudFront edge locations"], "answer": "A", "exp": "Amazon Personalize allows developers to build real-time personalization, customized re-ranking, and recommendation engines[cite: 8]."}, {"id": 11, "section": "9. MACHINE LEARNING", "topic": "Amazon Textract", "subtopic": "Document Analysis & OCR", "type": "single", "q": "Why is Amazon Textract superior to standard Optical Character Recognition (OCR) software when processing forms and tables?", "options": ["A) Automatically identifies and extracts text, handwriting, structured key-value pairs, and tabular data without manual configuration[cite: 8]", "B) Requires manual pixel-by-pixel bounding box coordinate coding for every document", "C) Translates scanned images into audio recordings using speech synthesis[cite: 8]", "D) Stores document files exclusively in volatile instance memory"], "answer": "A", "exp": "Amazon Textract goes beyond basic OCR by extracting structured data, key-value pairs, and table relationships directly from scanned documents[cite: 8]."}], "quiz10": [{"id": 1, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT an accurate statement regarding AWS CloudFormation as described in the handbook?", "options": ["A) An infrastructure-as-code (IaC) service that provisions and manages resources via declarative templates[cite: 8]", "B) Manages collections of related AWS resources as a single unit called a stack[cite: 8]", "C) Charges an upfront flat software licensing fee of $500 per template deployed[cite: 8]", "D) Supports declarative templates written in either JSON or YAML[cite: 8]"], "answer": "C", "exp": "AWS CloudFormation is free to use; you only pay for the underlying AWS resources provisioned by the stacks[cite: 8]."}, {"id": 2, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Change Sets & Drift Detection", "type": "multi", "q": "Which TWO capabilities are supported natively by AWS CloudFormation? (Select 2)", "options": ["A) Change Sets to preview proposed updates and replacements before executing stack modifications[cite: 8]", "B) Drift Detection to identify when real-world resources diverge from their template definitions[cite: 8]", "C) Automatic kernel patching of on-premises VMware hosts", "D) Hardware disk replacement in AWS edge locations"], "answer": ["A", "B"], "exp": "Change Sets let you preview stack updates before applying them, and Drift Detection identifies out-of-band resource modifications[cite: 8]."}, {"id": 3, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "StackSets", "type": "single", "q": "What is the primary function of AWS CloudFormation StackSets?", "options": ["A) Deploying, managing, and updating stacks across multiple AWS accounts and multiple AWS Regions with a single template[cite: 8]", "B) Converting CloudFormation YAML into HTML web documentation", "C) Storing database credentials in unencrypted S3 buckets", "D) Replacing Amazon Route 53 DNS servers during regional outages"], "answer": "A", "exp": "StackSets extend CloudFormation capabilities by allowing multi-account and multi-region stack provisioning from a centralized management account[cite: 8]."}, {"id": 4, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT true regarding AWS CloudTrail?", "options": ["A) Governance and operational risk auditing service recording API calls and account activity[cite: 8]", "B) Captures actions taken via the AWS Management Console, AWS SDKs, and the AWS CLI[cite: 8]", "C) Delivers log files to Amazon S3 buckets and Amazon CloudWatch Logs[cite: 8]", "D) An automated system that inspects network packets at OSI Layer 7 to block SQL injection attacks"], "answer": "D", "exp": "Inspecting network packets for SQL injection is handled by AWS WAF; CloudTrail is strictly an API auditing and governance tool[cite: 8]."}, {"id": 5, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "Event Types", "type": "multi", "q": "Which TWO statements regarding CloudTrail event types are accurate? (Select 2)", "options": ["A) Management Events (control plane operations) are recorded by default[cite: 8]", "B) Data Events (data plane operations like S3 GetObject or Lambda Invoke) must be explicitly enabled[cite: 8]", "C) CloudTrail Event History stores all data plane events for 10 years free of charge", "D) Insights Events only analyze unencrypted network traffic"], "answer": ["A", "B"], "exp": "Management Events are recorded by default, whereas high-volume Data Events (e.g., S3 object-level APIs) require explicit configuration[cite: 8]."}, {"id": 6, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "CloudTrail Insights", "type": "single", "q": "What is the primary capability provided by CloudTrail Insights?", "options": ["A) Analyzes write management events to detect unusual spikes in API call volume or error rates[cite: 8]", "B) Automatically downgrades idle EC2 instances to save money", "C) Scans container images in Amazon ECR for CVE vulnerabilities", "D) Encrypts S3 buckets using hardware security tokens"], "answer": "A", "exp": "CloudTrail Insights continuously analyzes write management events to identify anomalous operational patterns and API error spikes[cite: 8]."}, {"id": 7, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "Organization Trails", "type": "single", "q": "How does an Organization Trail created in the management account of AWS Organizations enhance governance?", "options": ["A) Automatically logs activity for all member accounts in the organization, preventing member accounts from modifying or disabling logging[cite: 8]", "B) Deletes audit logs after 24 hours to conserve storage", "C) Disables all IAM policies across member accounts", "D) Replaces CloudWatch Alarms with manual email notifications"], "answer": "A", "exp": "Organization trails enforce centralized, immutable audit logging across every account in an AWS Organization[cite: 8]."}, {"id": 8, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Metrics & Granularity", "type": "multi", "q": "Which TWO statements regarding Amazon CloudWatch metrics are accurate? (Select 2)", "options": ["A) Standard monitoring collects EC2 metrics at 5-minute intervals, while detailed monitoring captures at 1-minute intervals[cite: 8]", "B) Applications can publish custom metrics using the PutMetricData API[cite: 8]", "C) CloudWatch stores all metrics for a maximum of 24 hours only", "D) Metrics can only be monitored from the AWS CLI and lack dashboard graphing capabilities"], "answer": ["A", "B"], "exp": "CloudWatch distinguishes between standard (5 min) and detailed (1 min) monitoring and accepts custom application metrics via API[cite: 8]."}, {"id": 9, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "CloudWatch Logs Insights", "type": "single", "q": "What capability does CloudWatch Logs Insights provide?", "options": ["A) Interactive, purpose-built query language to search, aggregate, and visualize high-volume log data[cite: 8]", "B) Automated physical hard drive degaussing in AWS facilities", "C) Direct routing of external DNS queries", "D) Decoupling SQS queues using FIFO deduplication"], "answer": "A", "exp": "Logs Insights allows interactive querying and visualization of log group streams using a specialized syntax[cite: 8]."}, {"id": 10, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "CloudWatch Synthetics", "type": "single", "q": "What is the primary function of Amazon CloudWatch Synthetics?", "options": ["A) Uses configurable canaries (scripts) to simulate user interactions and proactively monitor endpoints and APIs for latency and availability[cite: 8]", "B) Converts relational databases into synthetic NoSQL tables", "C) Synthesizes text into spoken MP3 audio files", "D) Generates synthetic test data for machine learning model training"], "answer": "A", "exp": "CloudWatch Synthetics uses modular canaries to simulate user behavior 24/7, catching endpoint downtime before users notice[cite: 8]."}, {"id": 11, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "CloudWatch ServiceLens", "type": "single", "q": "How does CloudWatch ServiceLens provide end-to-end observability for distributed architectures?", "options": ["A) Correlates CloudWatch metrics, CloudWatch logs, and AWS X-Ray traces into a single visual service map[cite: 8]", "B) Disables all IAM authentication boundaries", "C) Replaces Amazon Route 53 DNS servers", "D) Automatically terminates non-compliant EC2 instances"], "answer": "A", "exp": "ServiceLens integrates metrics, logs, and X-Ray distributed traces to provide comprehensive service dependency mapping[cite: 8]."}, {"id": 12, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Command Line Interface (CLI)", "subtopic": "Core Syntax & Profiles", "type": "multi", "q": "Which TWO statements regarding the AWS CLI are true? (Select 2)", "options": ["A) Supports named profiles via `--profile` to manage multiple sets of credentials and accounts[cite: 8]", "B) Supports output formatting in JSON, text, or table format via `--output`[cite: 8]", "C) Bypasses all AWS IAM permission checks when executed from a Linux root terminal", "D) Can only interact with Amazon S3 and lacks support for other services"], "answer": ["A", "B"], "exp": "The AWS CLI supports profile management and customizable output formats (JSON, text, table) while remaining bound to IAM permissions[cite: 8]."}, {"id": 13, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CLI", "subtopic": "Filtering & JMESPath", "type": "single", "q": "Which CLI parameter uses client-side JMESPath syntax to filter and extract specific attributes from API responses?", "options": ["A) `--query`[cite: 8]", "B) `--filter-native`", "C) `--extract-fields`", "D) `--select-attributes`"], "answer": "A", "exp": "The `--query` flag in the AWS CLI uses JMESPath expressions to perform powerful client-side filtering and parsing of JSON outputs[cite: 8]."}, {"id": 14, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Config?", "options": ["A) Fully managed service to assess, audit, and evaluate resource configurations[cite: 8]", "B) Continuously records configuration changes and evaluates compliance against desired rules[cite: 8]", "C) Directly manages real-time network load balancing across private subnets", "D) Captures relationships between resources and maintains historical configuration data[cite: 8]"], "answer": "C", "exp": "Network traffic load balancing is handled by Elastic Load Balancing (ELB), not AWS Config[cite: 8]."}, {"id": 15, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Rules & Automated Remediation", "type": "multi", "q": "Which TWO statements regarding AWS Config Rules and Remediation are accurate? (Select 2)", "options": ["A) Supports AWS Managed Rules and Custom Rules (powered by AWS Lambda) to evaluate compliance[cite: 8]", "B) Can trigger automated remediation using AWS Systems Manager Automation documents[cite: 8]", "C) Automatically deletes non-compliant resources without confirmation", "D) Evaluates resources only once per calendar year"], "answer": ["A", "B"], "exp": "AWS Config uses managed or custom Lambda rules and automates non-compliant remediation via Systems Manager runbooks[cite: 8]."}, {"id": 16, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Aggregators", "type": "single", "q": "What is the primary function of an AWS Config Aggregator?", "options": ["A) Consolidates configuration and compliance data across multiple AWS accounts and Regions into a centralized view[cite: 8]", "B) Aggregates network bandwidth to prevent TCP packet drops", "C) Merges fragmented EBS block volumes together", "D) Compiles application source code in CI/CD pipelines"], "answer": "A", "exp": "Config Aggregators provide multi-account and multi-region governance visibility by collecting configuration data organization-wide[cite: 8]."}, {"id": 17, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "What It Is & Landing Zones", "type": "single", "q": "Which of the following is NOT a feature of AWS Control Tower as described in the handbook?", "options": ["A) Automates the setup of a secure, well-architected multi-account environment called a landing zone[cite: 8]", "B) Automatically sets up core accounts including Management, Audit, and Log Archive accounts[cite: 8]", "C) Requires customers to manually configure and patch dedicated Linux security servers on EC2", "D) Applies governance controls known as guardrails across accounts[cite: 8]"], "answer": "C", "exp": "AWS Control Tower is a fully managed service that leverages AWS Organizations and AWS Config without user EC2 servers[cite: 8]."}, {"id": 18, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Guardrails - Preventive vs Detective", "type": "multi", "q": "Which TWO statements accurately describe the guardrail types in AWS Control Tower? (Select 2)", "options": ["A) Preventive Guardrails use Service Control Policies (SCPs) to disallow actions that violate governance rules[cite: 8]", "B) Detective Guardrails use AWS Config rules to monitor compliance and alert on existing violations[cite: 8]", "C) Preventive Guardrails automatically shut down member AWS accounts", "D) Detective Guardrails rewrite application source code to resolve vulnerabilities"], "answer": ["A", "B"], "exp": "Control Tower guardrails are either preventive (implemented via SCPs to block non-compliant calls) or detective (via Config rules)[cite: 8]."}, {"id": 19, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Account Factory", "type": "single", "q": "Which underlying AWS service powers Account Factory within AWS Control Tower to automate new account provisioning?", "options": ["A) AWS Service Catalog[cite: 8]", "B) AWS Elastic Beanstalk[cite: 8]", "C) Amazon EMR", "D) AWS DataSync"], "answer": "A", "exp": "Account Factory is implemented using AWS Service Catalog to provide standardized, pre-approved account creation blueprints[cite: 8]."}, {"id": 20, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Management Console", "subtopic": "Core Capabilities", "type": "single", "q": "Which feature inside the AWS Management Console provides browser-based command-line terminal access pre-authenticated with your console credentials?", "options": ["A) AWS CloudShell[cite: 8]", "B) AWS Trusted Advisor Dashboard[cite: 8]", "C) AWS Artifact Portal[cite: 8]", "D) Amazon QuickSight Reader"], "answer": "A", "exp": "AWS CloudShell is accessible directly from the management console, providing a pre-authenticated terminal environment[cite: 8]."}, {"id": 21, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Health Dashboard", "subtopic": "Service vs Account Views", "type": "multi", "q": "Which TWO dashboard views are provided by the AWS Health service? (Select 2)", "options": ["A) Service Health Dashboard (public view of broad AWS service status across all regions)[cite: 8]", "B) Your Account Health Dashboard (personalized view showing events directly impacting your AWS resources)[cite: 8]", "C) Physical Datacenter Temperature Dashboard", "D) Local Workstation Memory Allocation Dashboard"], "answer": ["A", "B"], "exp": "AWS Health provides both the public general Service Health view and the authenticated, resource-specific Account Health view[cite: 8]."}, {"id": 22, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon License Manager", "subtopic": "What It Is & Rules", "type": "single", "q": "Which of the following is NOT true regarding AWS License Manager?", "options": ["A) Helps centrally manage, track, and control software licenses across AWS and on-premises environments[cite: 8]", "B) Supports Bring Your Own License (BYOL) compliance models based on vCPUs, cores, or sockets[cite: 8]", "C) Integrates with AWS Systems Manager Inventory to discover installed software[cite: 8]", "D) Automatically purchases license upgrades with customer credit cards without warning"], "answer": "D", "exp": "AWS License Manager enforces usage limits and tracks compliance; it does not automatically execute unauthorized license purchases[cite: 8]."}, {"id": 23, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon License Manager", "subtopic": "Enforcement at Launch", "type": "single", "q": "How can AWS License Manager prevent license violations when developers launch new EC2 instances?", "options": ["A) Enforces licensing rules at instance launch time, preventing the provisioning of resources that exceed defined limits[cite: 8]", "B) Deletes the AMI immediately upon selection", "C) Revokes the entire AWS account credentials", "D) Reboots the VPC router"], "answer": "A", "exp": "License Manager can enforce hard caps at launch time, stopping instances from booting if license capacity is exhausted[cite: 8]."}, {"id": 24, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon Managed Grafana", "subtopic": "What It Is & Workspaces", "type": "single", "q": "Which of the following is NOT true regarding Amazon Managed Grafana?", "options": ["A) Fully managed, scalable service for running open-source Grafana visualization workspaces[cite: 8]", "B) Integrates with data sources like CloudWatch, X-Ray, Timestream, Prometheus, and OpenSearch[cite: 8]", "C) Requires customers to install, patch, and maintain local Linux operating system daemons on EC2 hosts[cite: 8]", "D) Integrates natively with IAM Identity Center (AWS SSO) for user authentication[cite: 8]"], "answer": "C", "exp": "Amazon Managed Grafana is fully managed by AWS; software patching, scaling, and high availability are automated[cite: 8]."}, {"id": 25, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon Managed Grafana", "subtopic": "Alerting & Enterprise Plugins", "type": "multi", "q": "Which TWO capabilities are supported within Amazon Managed Grafana? (Select 2)", "options": ["A) Alerting integrations with channels such as Amazon SNS, Slack, and email[cite: 8]", "B) Optional access to Grafana Enterprise plugins (e.g., ServiceNow, Splunk, Datadog)[cite: 8]", "C) Deploying physical network firewalls into on-premises racks", "D) Managing physical tape backups for S3 Glacier"], "answer": ["A", "B"], "exp": "Managed Grafana supports robust alerting via SNS/Slack and provides access to Enterprise third-party plugins[cite: 8]."}, {"id": 26, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Managed Service for Prometheus (AMP)", "subtopic": "What It Is & Query Language", "type": "single", "q": "Which query language is natively supported by Amazon Managed Service for Prometheus (AMP) for metric retrieval and monitoring?", "options": ["A) PromQL[cite: 8]", "B) ANSI SQL[cite: 8]", "C) GraphQL[cite: 8]", "D) SPARQL[cite: 8]"], "answer": "A", "exp": "Amazon Managed Service for Prometheus is compatible with open-source Prometheus and uses PromQL for querying operational metrics[cite: 8]."}, {"id": 27, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Managed Service for Prometheus (AMP)", "subtopic": "Ingestion & Integrations", "type": "multi", "q": "Which TWO ingestion and connectivity options are supported by Amazon Managed Service for Prometheus? (Select 2)", "options": ["A) Remote write API support for pushing metrics from existing Prometheus collectors or OpenTelemetry[cite: 8]", "B) Private connectivity via AWS PrivateLink VPC Endpoints[cite: 8]", "C) Compulsory public unencrypted IP transmission across all networks", "D) Manual upload of CSV metrics once per week"], "answer": ["A", "B"], "exp": "AMP ingests metrics via the standard Prometheus remote-write protocol and supports private VPC connectivity via AWS PrivateLink[cite: 8]."}, {"id": 28, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "What It Is & Management Account", "type": "single", "q": "What is the primary role of the Management Account in AWS Organizations?", "options": ["A) Acts as the administrative authority, creates and organizes OUs, and pays the consolidated bill for all member accounts[cite: 8]", "B) Hosts all production application containers exclusively", "C) Provides anonymous public internet routing to all VPCs", "D) Stores client browser session cookies in local memory"], "answer": "A", "exp": "The management account maintains full administrative control over the organization hierarchy and consolidates billing across all accounts[cite: 8]."}, {"id": 29, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Service Control Policies (SCPs)", "type": "single", "q": "What is the fundamental behavior of a Service Control Policy (SCP) in AWS Organizations?", "options": ["A) Defines the maximum available permissions boundary for an account or OU, but does NOT grant permissions on its own[cite: 8]", "B) Explicitly grants permissions to IAM users regardless of their IAM policies", "C) Replaces all Security Groups attached to EC2 instances", "D) Automatically purchases Reserved Instances during high load"], "answer": "A", "exp": "SCPs set permission guardrails; an action is allowed only if permitted by BOTH the SCP boundary and the identity's IAM policy[cite: 8]."}, {"id": 30, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Policy Types", "type": "multi", "q": "Which TWO policy types can be managed and enforced centrally across accounts via AWS Organizations? (Select 2)", "options": ["A) Tag Policies (enforcing consistent tagging keys and allowed values across resources)[cite: 8]", "B) Backup Policies (defining automated AWS Backup plans across member accounts)[cite: 8]", "C) Windows Kernel Optimization Policies", "D) Physical Security Door Badge Access Policies"], "answer": ["A", "B"], "exp": "AWS Organizations supports SCPs, Tag Policies, Backup Policies, and AI Services Opt-Out Policies[cite: 8]."}, {"id": 31, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Consolidated Billing", "type": "single", "q": "What financial benefit does Consolidated Billing provide to an organization with multiple accounts?", "options": ["A) Pools usage across all accounts to qualify for tier-based volume discounts and shares Reserved Instance/Savings Plans benefits[cite: 8]", "B) Eliminates all charges for data transfer out to the internet", "C) Automatically provides a 50% discount on all Spot instances", "D) Cancels billing entirely for development environments"], "answer": "A", "exp": "Consolidated billing combines usage to unlock volume tiers (e.g., S3 storage pricing) and shares commitment discounts across member accounts[cite: 8]."}, {"id": 32, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Proton", "subtopic": "What It Is & Target Audience", "type": "single", "q": "Which of the following is NOT true regarding AWS Proton as described in the handbook?", "options": ["A) Managed delivery service for provisioning and deploying container and serverless applications[cite: 8]", "B) Allows platform teams to define standard templates (infrastructure + CI/CD pipelines) for developers to deploy from[cite: 8]", "C) Requires customers to purchase physical blade server hardware directly from AWS[cite: 8]", "D) Supports template versioning and automated CI/CD pipeline provisioning[cite: 8]"], "answer": "C", "exp": "AWS Proton is a cloud-based delivery and template management service, not a physical blade server hardware purchase[cite: 8]."}, {"id": 33, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Proton", "subtopic": "Environment vs Service Templates", "type": "multi", "q": "Which TWO template definitions form the architectural foundation of AWS Proton? (Select 2)", "options": ["A) Environment Templates (defining shared infrastructure like VPCs, ECS/EKS clusters, and load balancers)[cite: 8]", "B) Service Templates (defining microservice application code infrastructure and its deployment pipeline)[cite: 8]", "C) Hardware Motherboard Templates", "D) DNS Registrar Purchase Templates"], "answer": ["A", "B"], "exp": "Proton separates platform management into shared Environment Templates and developer-facing application Service Templates[cite: 8]."}, {"id": 34, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "What It Is & Core Concept", "type": "single", "q": "What is the primary function of AWS Service Catalog in an enterprise?", "options": ["A) Enables administrators to create, manage, and distribute a curated catalog of approved AWS infrastructure products for self-service developer deployment[cite: 8]", "B) Acts as an e-commerce shopping cart for purchasing office supplies", "C) Continuously audits physical server rack cooling in AWS facilities", "D) Replaces AWS CloudFormation templates with raw binary executables"], "answer": "A", "exp": "AWS Service Catalog enables organizations to govern and distribute standardized, pre-approved CloudFormation templates via portfolios[cite: 8]."}, {"id": 35, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "Portfolios & Constraints", "type": "multi", "q": "Which TWO governance constructs are managed within AWS Service Catalog? (Select 2)", "options": ["A) Portfolios (collections of approved products managed with specific access permissions)[cite: 8]", "B) Launch Constraints (specifying an IAM role under which products are provisioned without granting direct IAM permissions to the user)[cite: 8]", "C) Compulsory public S3 bucket configurations", "D) Dynamic routing table reconfiguration for BGP routers"], "answer": ["A", "B"], "exp": "Service Catalog organizes products into Portfolios and applies Launch Constraints to restrict deployment privileges securely[cite: 8]."}, {"id": 36, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "What It Is & Agent", "type": "single", "q": "Which software component must be installed and running on EC2 instances or on-premises servers to enable management via AWS Systems Manager?", "options": ["A) SSM Agent[cite: 8]", "B) CloudWatch Synthetics Canary", "C) AWS X-Ray Daemon", "D) Apache Spark Executor"], "answer": "A", "exp": "The SSM Agent connects EC2 instances or on-premises servers securely to the AWS Systems Manager control plane[cite: 8]."}, {"id": 37, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Session Manager & Run Command", "type": "multi", "q": "Which TWO capabilities are provided by AWS Systems Manager for server management? (Select 2)", "options": ["A) Session Manager (provides secure browser-based shell access without opening inbound ports or managing SSH keys)[cite: 8]", "B) Run Command (executes scripts across fleets of instances remotely without logging into servers)[cite: 8]", "C) Hardware hypervisor memory soldering", "D) Automatically granting root administrative passwords to all public web users"], "answer": ["A", "B"], "exp": "Session Manager enables secure, bastion-free SSH/PowerShell terminal access, while Run Command executes batch scripts across instances at scale[cite: 8]."}, {"id": 38, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Parameter Store & Patch Manager", "type": "multi", "q": "Which TWO management features are built into AWS Systems Manager? (Select 2)", "options": ["A) Parameter Store (secure hierarchical storage for configuration data and secrets encrypted via AWS KMS)[cite: 8]", "B) Patch Manager (automates OS patching across fleets according to defined patch baselines and maintenance windows)[cite: 8]", "C) Disabling all CloudTrail API auditing records", "D) Converting SQL databases into uncompressed video streams"], "answer": ["A", "B"], "exp": "Parameter Store manages secrets/configs with KMS encryption, and Patch Manager automates OS patch baselines and maintenance[cite: 8]."}, {"id": 39, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Trusted Advisor", "subtopic": "What It Is & Categories", "type": "single", "q": "Which of the following is NOT one of the five primary check categories evaluated by AWS Trusted Advisor?", "options": ["A) Cost Optimization[cite: 8]", "B) Security[cite: 8]", "C) Fault Tolerance and Performance[cite: 8]", "D) Front-End React Code Compiling"], "answer": "D", "exp": "The five Trusted Advisor categories are Cost Optimization, Performance, Security, Fault Tolerance, and Service Limits[cite: 8]."}, {"id": 40, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Trusted Advisor", "subtopic": "Support Plan Tiers", "type": "single", "q": "Which AWS Support Plans are required to access the full set of over 50 AWS Trusted Advisor checks, automated recommendations, and the Trusted Advisor API?", "options": ["A) Business and Enterprise Support Plans[cite: 8]", "B) Basic and Developer Support Plans[cite: 8]", "C) Free Tier only", "D) No support plan includes Trusted Advisor"], "answer": "A", "exp": "Basic and Developer support receive seven core checks; full access to all checks, notifications, and APIs requires Business or Enterprise support[cite: 8]."}, {"id": 41, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Well-Architected Tool", "subtopic": "What It Is & Six Pillars", "type": "single", "q": "Which of the following is NOT one of the six pillars of the AWS Well-Architected Framework evaluated by the Well-Architected Tool?", "options": ["A) Operational Excellence and Security[cite: 8]", "B) Reliability and Performance Efficiency[cite: 8]", "C) Cost Optimization and Sustainability[cite: 8]", "D) Unregulated Decentralization and Cryptographic Speculation"], "answer": "D", "exp": "The six pillars are Operational Excellence, Security, Reliability, Performance Efficiency, Cost Optimization, and Sustainability[cite: 8]."}, {"id": 42, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Well-Architected Tool", "subtopic": "Lenses & Improvement Plans", "type": "multi", "q": "Which TWO capabilities are supported by the AWS Well-Architected Tool? (Select 2)", "options": ["A) Applying specialized Lenses (e.g., Serverless, Machine Learning, SaaS) for industry-specific architectural guidance[cite: 8]", "B) Generating prioritized Improvement Plans based on identified high- and medium-risk issues[cite: 8]", "C) Direct physical execution of hypervisor hardware maintenance", "D) Eliminating all underlying infrastructure costs automatically"], "answer": ["A", "B"], "exp": "The Well-Architected Tool generates actionable improvement plans and supports standard and custom Lenses (e.g., Serverless, ML)[cite: 8]."}, {"id": 43, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "State Manager & Inventory", "type": "multi", "q": "Which TWO operational functions are managed using Systems Manager State Manager and Inventory? (Select 2)", "options": ["A) Collecting OS, application, and network metadata from managed instances via Inventory[cite: 8]", "B) Defining and enforcing desired configuration baselines (e.g., antivirus running, firewall rules) continuously via State Manager[cite: 8]", "C) Formatting S3 storage buckets into ext4 partitions", "D) Terminating Route 53 DNS private hosted zones"], "answer": ["A", "B"], "exp": "SSM Inventory gathers system software metadata, and State Manager enforces compliance by maintaining defined instance configurations[cite: 8]."}, {"id": 44, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Intrinsic Functions", "type": "single", "q": "Which CloudFormation intrinsic function retrieves the value of an output exported by another stack to implement cross-stack references?", "options": ["A) `Fn::ImportValue`[cite: 8]", "B) `Fn::GetAtt`[cite: 8]", "C) `Ref`[cite: 8]", "D) `Fn::Sub`"], "answer": "A", "exp": "`Fn::ImportValue` imports exported values from other CloudFormation stacks to share resources across modular stacks[cite: 8]."}, {"id": 45, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Contributor Insights", "type": "single", "q": "What is the primary diagnostic capability of CloudWatch Contributor Insights?", "options": ["A) Analyzes time-series log data to identify top contributors, heavy users, and root-cause error sources impacting performance[cite: 8]", "B) Calculates monthly salary costs for cloud engineers", "C) Synthesizes speech files from customer emails", "D) Manages SSL certificates across multiple VPC subnets"], "answer": "A", "exp": "Contributor Insights processes high-cardinality log datasets to identify top talkers, error patterns, and outliers in real time[cite: 8]."}, {"id": 46, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Backup Policies", "type": "single", "q": "How do Backup Policies in AWS Organizations streamline enterprise disaster recovery planning?", "options": ["A) Allows defining, managing, and enforcing centralized AWS Backup plans across all accounts and OUs in the organization[cite: 8]", "B) Automatically burns all S3 data to on-premises optical discs", "C) Mandates that all databases be hosted in single-AZ mode", "D) Deletes snapshots older than 24 hours"], "answer": "A", "exp": "Backup Policies let administrators define immutable backup schedules, retention rules, and lifecycle targets organization-wide[cite: 8]."}, {"id": 47, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Proton", "subtopic": "Template Versioning", "type": "single", "q": "How does AWS Proton handle backward compatibility and breaking architectural updates across templates?", "options": ["A) Uses major and minor template versioning; minor versions are backward-compatible, while major versions flag breaking changes[cite: 8]", "B) Automatically deletes all active service instances upon a template change", "C) Overwrites all production databases silently", "D) Bypasses version control entirely"], "answer": "A", "exp": "AWS Proton utilizes semantic major/minor versioning, allowing teams to test and roll out infrastructure updates predictably[cite: 8]."}, {"id": 48, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "OpsCenter", "type": "single", "q": "What is the primary role of OpsCenter within AWS Systems Manager?", "options": ["A) Provides a central operational dashboard to view, investigate, and remediate operational issues (OpsItems) across AWS resources[cite: 8]", "B) Recompiles Java code into binary images", "C) Sells refurbished IT equipment to employees", "D) Replaces AWS CloudFormation stacks"], "answer": "A", "exp": "OpsCenter consolidates operational issues (OpsItems) from CloudWatch, Config, and CloudTrail, enabling unified investigation and runbook execution[cite: 8]."}, {"id": 49, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Health Dashboard", "subtopic": "Proactive Alerting Integration", "type": "single", "q": "Which integration enables automated alerting or remediation workflows when an AWS infrastructure disruption impacts your account?", "options": ["A) Amazon EventBridge and Amazon SNS integrated with the AWS Health API[cite: 8]", "B) Unencrypted email logs sent via telnet", "C) CloudFront edge invalidations", "D) Manual status checks on public web forums"], "answer": "A", "exp": "Account-specific AWS Health events can be routed via EventBridge rules to SNS, Lambda, or Chatbot for automated alerting and remediation[cite: 8]."}, {"id": 50, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Trusted Advisor", "subtopic": "Service Limits Check", "type": "single", "q": "What risk does the Service Limits (Service Quotas) check in AWS Trusted Advisor protect against?", "options": ["A) Hitting resource limits (such as EC2 instance count or VPC limits) that could unexpectedly prevent new resources from launching during scaling or failover[cite: 8]", "B) Exceeding corporate travel expense budgets", "C) Accidental deletion of S3 bucket versioning", "D) Memory leaks in local IDE software"], "answer": "A", "exp": "Trusted Advisor tracks resource usage against regional service quotas, warning teams before capacity constraints impede scaling or disaster recovery[cite: 8]."}, {"id": 51, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "DeletionPolicy Attribute", "type": "single", "q": "Which CloudFormation resource attribute allows preserving critical stateful resources (such as an S3 bucket or RDS database) when their enclosing stack is deleted?", "options": ["A) `DeletionPolicy: Retain`", "B) `UpdateReplacePolicy: Overwrite`", "C) `StackTermination: Disallow`", "D) `ResourceLock: Permanent`"], "answer": "A", "exp": "The `DeletionPolicy: Retain` attribute directs CloudFormation to leave specific resources untouched when the parent stack is deleted."}, {"id": 52, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Configuration Items (CIs)", "type": "single", "q": "What does a Configuration Item (CI) in AWS Config represent?", "options": ["A) A JSON document capturing the exact configuration, metadata, and resource relationships of an AWS asset at a specific point in time[cite: 8]", "B) A physical spare hard drive in an AWS warehouse", "C) An invoice item on a monthly PDF bill", "D) A single row in a DynamoDB table"], "answer": "A", "exp": "Configuration Items (CIs) are point-in-time representations of an AWS resource's attributes, tags, relationships, and configuration state[cite: 8]."}, {"id": 53, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "CfCT (Customizations for Control Tower)", "type": "single", "q": "What capability does Customizations for Control Tower (CfCT) provide?", "options": ["A) Allows deploying custom CloudFormation templates and Service Control Policies across accounts and OUs in response to lifecycle events[cite: 8]", "B) Replaces all AWS managed guardrails with third-party software", "C) Manages physical delivery of Outpost racks", "D) Automatically converts Python code into Go"], "answer": "A", "exp": "CfCT provides an automated pipeline to deploy custom guardrails and CloudFormation templates across landing zone accounts automatically[cite: 8]."}, {"id": 54, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Composite Alarms", "type": "single", "q": "What is the primary benefit of creating CloudWatch Composite Alarms?", "options": ["A) Reduces alarm fatigue by combining multiple individual alarms using boolean AND/OR logic to trigger actions only when true complex failure states occur[cite: 8]", "B) Combines bills from different AWS regions", "C) Compresses log files into tarballs", "D) Deploys multi-region Lambda functions"], "answer": "A", "exp": "Composite Alarms evaluate rule expressions combining multiple metric alarms, preventing notification floods for redundant symptoms[cite: 8]."}, {"id": 55, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "AI Services Opt-Out Policies", "type": "single", "q": "What is the purpose of AI Services Opt-Out Policies in AWS Organizations?", "options": ["A) Centrally controls whether AWS AI services (e.g., Rekognition, Polly) can store and use customer content to train and improve AWS services[cite: 8]", "B) Disables all machine learning instances completely across the enterprise", "C) Automatically deletes SageMaker models after 30 days", "D) Replaces neural models with rule-based heuristics"], "answer": "A", "exp": "AI Opt-Out Policies enforce data privacy compliance by governing whether AWS can retain customer data for AI model improvement[cite: 8]."}, {"id": 56, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Patch Baselines", "type": "single", "q": "In Systems Manager Patch Manager, what does a Patch Baseline define?", "options": ["A) Rules for which patches are approved (e.g., auto-approving patches with Critical severity after 7 days) and lists of rejected patches[cite: 8]", "B) The minimum CPU clock speed required to run an EC2 instance", "C) The schedule for deleting expired S3 buckets", "D) The maximum network bandwidth allowance per instance"], "answer": "A", "exp": "Patch Baselines define classification and severity criteria for automated patch approval, operating system rules, and blacklists[cite: 8]."}, {"id": 57, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "AppRegistry", "type": "single", "q": "What operational visibility does AWS Service Catalog AppRegistry provide?", "options": ["A) Allows defining applications, associating provisioned stacks and resource groups, and tracking application metadata centrally[cite: 8]", "B) Distributes mobile applications to end users via app stores", "C) Compiles container images from source repositories", "D) Replaces IAM Identity Center for enterprise single sign-on"], "answer": "A", "exp": "AppRegistry allows organizations to track and manage application metadata and associate CloudFormation stacks across environments[cite: 8]."}, {"id": 58, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Well-Architected Tool", "subtopic": "Workload Architecture Reviews", "type": "single", "q": "How does an organization leverage the AWS Well-Architected Tool during the development lifecycle?", "options": ["A) By stepping through structured best-practice question sets to identify risks and track improvements before and after production deployment[cite: 8]", "B) By writing automated shell scripts to reboot unresponsive servers", "C) By converting monolithic applications into microservices automatically", "D) By monitoring real-time network latency on Direct Connect links"], "answer": "A", "exp": "The Well-Architected Tool guides teams through structured pillar questionnaires to expose architectural debt and verify best practice adherence[cite: 8]."}, {"id": 59, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "Log File Validation", "type": "single", "q": "How does AWS CloudTrail Log File Validation ensure that audit logs have not been altered, modified, or deleted after delivery to Amazon S3?", "options": ["A) Generates SHA-256 digital signatures and digest files containing cryptographic hashes of the delivered log files[cite: 8]", "B) Stores logs on write-once physical optical media in AWS facilities", "C) Mandates manual paper notarization by AWS security staff", "D) Locks the AWS management account into read-only mode"], "answer": "A", "exp": "CloudTrail log file integrity validation uses SHA-256 hashing and RSA digital signatures to verify that logs remain untampered in S3[cite: 8]."}, {"id": 60, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Conformance Packs", "type": "single", "q": "What is an AWS Config Conformance Pack?", "options": ["A) A collection of AWS Config rules and remediation actions packaged into a single template for easy multi-account compliance deployment[cite: 8]", "B) A compressed archive of EC2 instance store backups", "C) A physical kit containing hardware encryption tokens", "D) A bundled discount package for purchasing Reserved Instances"], "answer": "A", "exp": "Conformance Packs package collections of Config rules and remediations into a single YAML template to enforce standards (e.g., PCI-DSS, HIPAA)[cite: 8]."}, {"id": 61, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Anomaly Detection", "type": "single", "q": "How does Amazon CloudWatch Anomaly Detection improve alarm sensitivity for dynamic, cyclical workloads?", "options": ["A) Applies machine learning to historical metric data to create expected behavior bands and alarm on unusual deviations without static thresholds[cite: 8]", "B) Sets fixed alarms at 80% utilization permanently", "C) Disables all alarms during weekends", "D) Automatically reboots instances whenever metrics fluctuate"], "answer": "A", "exp": "Anomaly Detection continuously models seasonal and diurnal metric trends, creating dynamic expected threshold bands[cite: 8]."}, {"id": 62, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Change Manager", "type": "single", "q": "What operational governance capability does Systems Manager Change Manager provide?", "options": ["A) An enterprise change management framework to request, review, approve, and execute operational changes to infrastructure configurations[cite: 8]", "B) Automatically rewrites Git commit histories", "C) Modifies billing payment methods across member accounts", "D) Converts Python scripts into compiled C executables"], "answer": "A", "exp": "Change Manager provides controlled, auditable change request and approval workflows for operational tasks and maintenance[cite: 8]."}, {"id": 63, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Exam Tips", "type": "single", "q": "What is a critical distinction between IAM Policies and Service Control Policies (SCPs) tested on the exam?", "options": ["A) IAM policies grant permissions to principals; SCPs define the maximum permission guardrail for accounts/OUs and NEVER grant permissions[cite: 8]", "B) SCPs grant permissions to users; IAM policies only deny permissions", "C) SCPs apply to on-premises servers only; IAM policies apply to AWS", "D) There is no distinction; they are evaluated as identical resources"], "answer": "A", "exp": "SCPs act as filtering boundaries that restrict what an account can do, but access is only permitted if an IAM policy grants it within that boundary[cite: 8]."}, {"id": 64, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS License Manager", "subtopic": "Marketplace Integration", "type": "single", "q": "How does AWS License Manager simplify managing software purchased through AWS Marketplace?", "options": ["A) Automatically tracks, distributes, and manages software entitlements purchased via AWS Marketplace across accounts in an organization[cite: 8]", "B) Converts commercial software into open-source code", "C) Ships physical installation DVDs to customer offices", "D) Bypasses all license compliance audits"], "answer": "A", "exp": "License Manager integrates with AWS Marketplace to automate tracking and entitlement assignment for commercial software products[cite: 8]."}, {"id": 65, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Exam Tips", "type": "single", "q": "When should an architect recommend AWS CloudFormation on the SAA-C03 exam?", "options": ["A) When an organization requires repeatable, automated, version-controlled provisioning of entire infrastructure stacks across environments[cite: 8]", "B) When building a real-time conversational voice assistant", "C) When querying unindexed log files stored in S3", "D) When setting up physical SAN array hardware"], "answer": "A", "exp": "CloudFormation is the foundational exam answer for infrastructure-as-code, repeatable provisioning, and automated stack lifecycles[cite: 8]."}, {"id": 66, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Exam Tips", "type": "single", "q": "What is the key difference between AWS Organizations and AWS Control Tower tested on the exam?", "options": ["A) Organizations provides the underlying multi-account hierarchy and SCPs; Control Tower builds an automated, governed landing zone on top of Organizations[cite: 2, 8]", "B) Control Tower is an open-source tool; Organizations is a paid AWS service", "C) Organizations is only for billing; Control Tower is only for compute", "D) Control Tower cannot deploy Service Control Policies"], "answer": "A", "exp": "Control Tower wraps Organizations, Config, and Service Catalog to deliver pre-configured landing zones and automated guardrails at scale[cite: 2, 8]."}, {"id": 67, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Maintenance Windows", "type": "single", "q": "What capability do Systems Manager Maintenance Windows provide?", "options": ["A) Allows scheduling recurring time windows to execute disruptive administrative tasks (e.g., OS patching, updating drivers, running scripts) on targets[cite: 8]", "B) Automatically purchases replacement server fans during hardware failures", "C) Reboots client web browsers on a schedule", "D) Disables CloudWatch metrics during peak hours"], "answer": "A", "exp": "Maintenance Windows schedule defined operational tasks to run only during approved non-disruptive time periods[cite: 8]."}, {"id": 68, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "CloudWatch Logs Metric Filters", "type": "single", "q": "How can an engineering team generate custom CloudWatch metrics from application text logs in real time?", "options": ["A) Create a CloudWatch Metric Filter on the target log group to match patterns (e.g., HTTP 500 errors) and increment a metric count[cite: 8]", "B) Manually parse log files using Microsoft Excel on a desktop workstation", "C) Route log data through an AWS Storage Gateway volume", "D) Recompile the Linux kernel on the host instance"], "answer": "A", "exp": "Metric filters scan log streams for terms or patterns and publish numerical metric values to CloudWatch Metrics for graphing and alarming[cite: 8]."}, {"id": 69, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "Service Actions", "type": "single", "q": "What are Service Actions in AWS Service Catalog?", "options": ["A) Pre-defined administrative actions (powered by Systems Manager documents) that end users can execute on provisioned products without root credentials[cite: 8]", "B) Automated stock trades executed on financial markets", "C) Legal contracts generated between AWS and customers", "D) Physical tasks assigned to data center technicians"], "answer": "A", "exp": "Service Actions enable self-service operational tasks (e.g., restart, backup, request logs) on provisioned products within governed boundaries[cite: 8]."}, {"id": 70, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the exam to select AWS Systems Manager Session Manager?", "options": ["A) Secure shell/PowerShell access to EC2 instances without opening inbound security group ports, running bastion hosts, or managing SSH keys[cite: 8]", "B) Establishing 100 Gbps dedicated fiber connections to AWS", "C) Converting relational SQL schemas into NoSQL tables", "D) Running Spark distributed jobs across thousands of nodes"], "answer": "A", "exp": "Session Manager is the exam answer for secure, auditable, bastion-free terminal access to EC2 instances[cite: 8]."}, {"id": 71, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Stack Policies", "type": "single", "q": "What is the primary architectural purpose of a CloudFormation Stack Policy?", "options": ["A) Prevents accidental updates or deletion of critical stack resources during subsequent stack update operations[cite: 8]", "B) Restricts user access to the AWS billing console", "C) Sets encryption standards on physical network cables", "D) Balances traffic across Application Load Balancers"], "answer": "A", "exp": "Stack Policies define explicit allow/deny update actions on specific resources, protecting databases or core subnets from accidental replacement[cite: 8]."}, {"id": 72, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Exam Tips", "type": "single", "q": "What is the fundamental difference between AWS CloudTrail and AWS Config tested on the exam?", "options": ["A) CloudTrail answers 'WHO made the API call'; AWS Config answers 'WHAT is the resource configuration and compliance state over time'[cite: 5, 8]", "B) CloudTrail is for databases; AWS Config is for networking", "C) CloudTrail evaluates compliance; Config records user logins", "D) AWS Config is free; CloudTrail costs $10,000 per month"], "answer": "A", "exp": "CloudTrail records API activity (who/when/from where), while Config audits the resource configuration history and policy compliance[cite: 5, 8]."}, {"id": 73, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Cross-Account Dashboards", "type": "single", "q": "How does Amazon CloudWatch enable centralized operational visibility across an entire enterprise AWS Organization?", "options": ["A) Supports Cross-Account and Cross-Region Dashboards and alarms, consolidating telemetry into a central monitoring account[cite: 8]", "B) Mandates logging into each member account console individually", "C) Replaces all member VPCs with a single global subnet", "D) Transmits all metrics via physical courier shipments"], "answer": "A", "exp": "CloudWatch allows setting up cross-account and cross-region sharing, aggregating metrics and logs into a single centralized pane of glass[cite: 8]."}, {"id": 74, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Trusted Advisor", "subtopic": "Core Checks in Free Tier", "type": "single", "q": "Which of the following security checks is available to ALL AWS customers under the Basic support tier of AWS Trusted Advisor?", "options": ["A) MFA on Root Account and Security Groups - Specific Ports Unrestricted[cite: 8]", "B) High-performance IOPS disk latency tuning", "C) Multi-region DynamoDB cross-replica synchronization", "D) Full architecture review by AWS certified principal engineers"], "answer": "A", "exp": "Core checks available to all support tiers include Root Account MFA, unrestricted port security group checks, and public S3 bucket permissions[cite: 8]."}, {"id": 75, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Delegated Administrator", "type": "single", "q": "What security best practice does the Delegated Administrator feature in AWS Organizations support?", "options": ["A) Allows designating specific member accounts to manage security services (like GuardDuty, Security Hub, Config) without accessing the management account[cite: 2, 8]", "B) Grants public internet users administrator access to the root account", "C) Disables multi-factor authentication across executive accounts", "D) Deletes CloudTrail logs automatically after analysis"], "answer": "A", "exp": "Delegated Administrator lets security and network teams govern specific services across the organization while keeping the management account isolated[cite: 2, 8]."}, {"id": 76, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Custom Resources", "type": "single", "q": "Why would an engineer implement a Custom Resource in an AWS CloudFormation template?", "options": ["A) To invoke an AWS Lambda function that provisions resources not natively supported by CloudFormation or performs custom provisioning logic[cite: 8]", "B) To format physical bare-metal hard drives on-premises", "C) To purchase domain names from external registrars without APIs", "D) To bypass IAM permission evaluation"], "answer": "A", "exp": "Custom Resources invoke Lambda functions to execute arbitrary provisioning code, integrating third-party tools or unsupported AWS services[cite: 8]."}, {"id": 77, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Log Retention Policies", "type": "single", "q": "What occurs if an administrator does not configure an explicit retention period on a CloudWatch Log Group?", "options": ["A) Logs are retained indefinitely by default, potentially increasing long-term storage costs[cite: 8]", "B) Logs are purged automatically after 24 hours", "C) The log group is deleted after 7 days", "D) The AWS account is placed in suspended status"], "answer": "A", "exp": "By default, CloudWatch Log Groups retain data indefinitely; administrators should set retention limits or export to S3 to control costs[cite: 8]."}, {"id": 78, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Parameter Store Tiers", "type": "single", "q": "What is the primary difference between the Standard Tier and Advanced Tier in AWS Systems Manager Parameter Store?", "options": ["A) Standard tier is free and supports up to 10,000 parameters (4 KB max size); Advanced tier supports up to 100,000 parameters (8 KB max size) with parameter policies[cite: 8]", "B) Standard tier requires physical smart cards; Advanced tier uses email tokens", "C) Standard tier cannot be encrypted with KMS", "D) Advanced tier is only available in us-east-1"], "answer": "A", "exp": "Advanced Parameter Store allows larger payload sizes (8 KB), higher parameter counts (up to 100k), and parameter policies like expiration notifications[cite: 8]."}, {"id": 79, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Continuous vs Periodic Recording", "type": "single", "q": "How does AWS Config trigger compliance evaluations for its rules?", "options": ["A) Configuration-triggered (evaluated immediately when a resource changes) or Periodic-triggered (evaluated on a schedule like every 24 hours)[cite: 8]", "B) Evaluated only when a developer logs into the AWS console", "C) Evaluated strictly once per year during annual audits", "D) Triggered only by billing payment receipt generation"], "answer": "A", "exp": "Config rules can be triggered in near real-time upon resource configuration modifications or evaluated periodically at fixed intervals[cite: 8]."}, {"id": 80, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Management Console", "subtopic": "Tag Editor", "type": "single", "q": "What capability does the AWS Tag Editor provide within the Management Console?", "options": ["A) Allows searching for resources across multiple services and regions and performing bulk tagging operations to enforce standards[cite: 2]", "B) Automatically fixes syntax errors in application code", "C) Deletes unattached EBS volumes without confirmation", "D) Converts relational database tables into JSON documents"], "answer": "A", "exp": "The AWS Tag Editor gives administrators centralized visibility and bulk tagging abilities to standardize metadata across accounts and regions[cite: 2]."}, {"id": 81, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon Managed Service for Prometheus (AMP)", "subtopic": "AlertManager Integration", "type": "single", "q": "How does Amazon Managed Service for Prometheus (AMP) handle alert generation based on PromQL rules?", "options": ["A) Provides a managed Alertmanager component that evaluates alert rules and routes notifications to Amazon SNS[cite: 8]", "B) Sends physical letters via postal delivery", "C) Automatically shuts down client workstations", "D) Reboots the VPC router whenever a metric spikes"], "answer": "A", "exp": "AMP includes a fully managed Alertmanager that evaluates Prometheus alerting rules and routes alerts to Amazon SNS topics[cite: 8]."}, {"id": 82, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation",
