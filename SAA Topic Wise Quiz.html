 "subtopic": "Rollback Configuration", "type": "single", "q": "What happens by default if a CloudFormation stack creation fails midway through provisioning?", "options": ["A) Automatic rollback triggers, deleting all provisioned resources to restore the environment to its initial clean state[cite: 8]", "B) The stack pauses permanently and charges a penalty fee", "C) All existing S3 buckets in the account are deleted", "D) AWS Support engineers must manually complete the deployment"], "answer": "A", "exp": "CloudFormation stacks feature atomic provisioning; if any resource fails to create, the stack automatically rolls back and cleans up[cite: 8]."}, {"id": 83, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Documents (SSM Documents)", "type": "single", "q": "What is an SSM Document in AWS Systems Manager?", "options": ["A) A JSON or YAML file that defines the actions (command execution, patching, configuration, or automation) executed by Systems Manager[cite: 8]", "B) A signed PDF legal agreement with AWS", "C) A user manual stored on an EC2 instance", "D) An architectural blueprint rendered in 3D"], "answer": "A", "exp": "SSM Documents define the parameters, actions, and steps executed during Run Command, Automation, or State Manager workflows[cite: 8]."}, {"id": 84, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Well-Architected Tool", "subtopic": "Custom Lenses", "type": "single", "q": "Why would an enterprise create a Custom Lens within the AWS Well-Architected Tool?", "options": ["A) To add proprietary organizational standards, governance policies, and internal compliance questions to architectural reviews[cite: 8]", "B) To inspect hardware camera lenses on mobile devices", "C) To optimize visual display monitors for cloud engineers", "D) To bypass the AWS Well-Architected Framework entirely"], "answer": "A", "exp": "Custom Lenses allow organizations to extend the standard Well-Architected Framework with custom questions tailored to internal compliance[cite: 8]."}, {"id": 85, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "CloudTrail Lake", "type": "single", "q": "What capability does CloudTrail Lake provide for security audit investigations?", "options": ["A) A managed data lake that aggregates, immutably stores, and enables SQL queries across multi-account CloudTrail audit events[cite: 8]", "B) A cooling pond for physical server racks", "C) An in-memory cache for relational databases", "D) A tool that converts logs into audio files"], "answer": "A", "exp": "CloudTrail Lake allows querying immutable audit logs directly using standard SQL without exporting logs to S3 or managing Athena tables[cite: 8]."}, {"id": 86, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Cross-Service Correlated Tracing", "type": "single", "q": "Which tool provides visual dependency mapping across microservices and links directly into CloudWatch metrics and logs?", "options": ["A) AWS X-Ray[cite: 8]", "B) AWS Shield", "C) Amazon Route 53 Traffic Flow", "D) AWS DataSync"], "answer": "A", "exp": "AWS X-Ray generates visual service dependency graphs and integrates into CloudWatch ServiceLens for unified observability[cite: 8]."}, {"id": 87, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Organizational Units (OUs)", "type": "single", "q": "How can an administrator apply a Service Control Policy to multiple member accounts simultaneously in a scalable manner?", "options": ["A) Group the member accounts into an Organizational Unit (OU) and attach the SCP directly to the OU[cite: 8]", "B) Manually edit each user's IAM policy in all member accounts individually", "C) Delete all member accounts and recreate them in one VPC", "D) Attach the SCP to an Amazon Route 53 hosted zone"], "answer": "A", "exp": "Attaching an SCP to an Organizational Unit applies the permission boundary hierarchically to all child accounts in that OU[cite: 8]."}, {"id": 88, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Proton", "subtopic": "Components Feature", "type": "single", "q": "In AWS Proton, what is a Component?", "options": ["A) An infrastructure resource defined by developers using IaC that attaches to a service instance to fulfill supplemental needs not defined in the template[cite: 8]", "B) A physical computer chip inside an AWS server", "C) A software plugin for desktop web browsers", "D) An optical transceiver on a Direct Connect router"], "answer": "A", "exp": "Proton Components allow developers to attach customized infrastructure (like an extra S3 bucket or SQS queue) to a service instance[cite: 8]."}, {"id": 89, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Application Manager", "type": "single", "q": "What capability does AWS Systems Manager Application Manager provide to operations teams?", "options": ["A) A central operations hub to discover, view, and manage applications and their underlying resources across multiple services and environments[cite: 8]", "B) An app store for downloading commercial smartphone software", "C) A tool for compiling iOS mobile applications", "D) An automated code generation utility for React websites"], "answer": "A", "exp": "Application Manager aggregates operational data (metrics, logs, alarms, cost, compliance) organized by logical application units[cite: 8]."}, {"id": 90, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Embedded Metric Format (EMF)", "type": "single", "q": "What is the primary architectural benefit of using CloudWatch Embedded Metric Format (EMF)?", "options": ["A) Allows asynchronous ingestion of custom metrics directly from structured JSON log lines without impacting application latency or making synchronous API calls[cite: 5]", "B) Encrypts physical server hard drives with biometric keys", "C) Replaces all IAM policies with DNS records", "D) Automatically converts EC2 instances into Fargate containers"], "answer": "A", "exp": "EMF lets applications output structured JSON logs that CloudWatch automatically parses into real-time metrics asynchronously[cite: 5]."}, {"id": 91, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Security and Access Control", "type": "single", "q": "How does AWS Config ensure that recorded configuration history files and snapshots stored in Amazon S3 are protected against unauthorized access?", "options": ["A) Uses Amazon S3 bucket policies, IAM roles, and Server-Side Encryption (SSE-KMS)[cite: 8]", "B) Stores files in public buckets accessible by any anonymous IP", "C) Deletes log files every 10 minutes", "D) Disables CloudTrail logging across the account"], "answer": "A", "exp": "AWS Config delivery channels secure snapshots using restrictive S3 bucket policies, IAM role delegation, and KMS encryption[cite: 8]."}, {"id": 92, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Modules", "type": "single", "q": "What is an AWS CloudFormation Module?", "options": ["A) A packaged, reusable collection of one or more resource configurations that enforces best-practice architectures across multiple templates[cite: 8]", "B) A physical blade server in an AWS rack", "C) A software driver for on-premises tape libraries", "D) A billing discount voucher"], "answer": "A", "exp": "CloudFormation Modules package common multi-resource patterns into reusable components that simplify template authoring and enforce standards[cite: 8]."}, {"id": 93, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Patch Manager - Reboot Behavior", "type": "single", "q": "How does Systems Manager Patch Manager handle instance reboots after installing operating system patches?", "options": ["A) Configurable reboot options: 'RebootIfNeeded' (reboots only if the patch requires it) or 'NoReboot' (avoids interrupting active sessions)[cite: 8]", "B) Forces an immediate unrecoverable hardware reboot on all instances", "C) Terminates the EC2 instances permanently", "D) Relies on administrators to physically cycle server power buttons"], "answer": "A", "exp": "Patch Manager supports customizable reboot behaviors to prevent unwanted service interruptions on production instances[cite: 8]."}, {"id": 94, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Log Archive Account", "type": "single", "q": "What is the specific responsibility of the Log Archive Account created by AWS Control Tower?", "options": ["A) Serves as a centralized, immutable repository for all CloudTrail and AWS Config logs delivered from every enrolled account[cite: 8]", "B) Manages DNS nameservers for public domain names", "C) Houses the primary production transactional databases", "D) Processes credit card payments for AWS bills"], "answer": "A", "exp": "The Log Archive Account is dedicated to secure, long-term storage of audit logs and configuration histories, isolated from application accounts[cite: 8]."}, {"id": 95, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Tag Policies Enforcement", "type": "single", "q": "What happens when an administrator launches a new resource in an account governed by an AWS Organizations Tag Policy with enforcement enabled?", "options": ["A) Non-compliant resource creation requests that do not adhere to defined tag keys and allowed values are blocked[cite: 8]", "B) The entire AWS account is deleted immediately", "C) The resource is launched with cleartext passwords", "D) The user is charged a $100 fine on their monthly bill"], "answer": "A", "exp": "Enforced Tag Policies prevent users from creating resources unless they include compliant tag keys and validated case-sensitive values[cite: 8]."}, {"id": 96, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "Template Constraints", "type": "single", "q": "What is the function of a Template Constraint in AWS Service Catalog?", "options": ["A) Restricts the configuration parameters an end user can select (e.g., limiting EC2 instance types to t3.micro or restricting CIDR blocks) during launch[cite: 8]", "B) Disables all user sign-in capabilities", "C) Prevents CloudFormation from executing", "D) Forces all templates to be written in binary"], "answer": "A", "exp": "Template Constraints allow administrators to limit configuration options to a safe, compliant subset of parameters during self-service provisioning[cite: 8]."}, {"id": 97, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Subscription Filters", "type": "single", "q": "How can CloudWatch Logs be streamed in real time to services like Amazon Kinesis Data Firehose, AWS Lambda, or Amazon OpenSearch Service?", "options": ["A) By configuring a CloudWatch Logs Subscription Filter on the log group[cite: 8]", "B) By manually copying log files over SFTP", "C) By downloading log files and re-uploading them via web browser", "D) By attaching an Elastic IP to the log group"], "answer": "A", "exp": "Subscription filters continuously deliver log events matching filter patterns to destinations like Lambda, Kinesis streams, or OpenSearch[cite: 8]."}, {"id": 98, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "SSM Distributor", "type": "single", "q": "What capability does AWS Systems Manager Distributor provide?", "options": ["A) Packages, manages, and distributes software packages or third-party agents to managed instances across a fleet[cite: 8]", "B) Distributes incoming web traffic across multiple EC2 targets", "C) Splits database queries across multiple relational nodes", "D) Distributes physical mail across corporate office branches"], "answer": "A", "exp": "Distributor simplifies installing, updating, and versioning software packages and security agents across large fleets of instances[cite: 8]."}, {"id": 99, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Nested Stacks", "type": "single", "q": "Why are Nested Stacks used when authoring AWS CloudFormation architectures?", "options": ["A) To reuse common template components and overcome the 500-resource limit of a single template by linking stacks using `AWS::CloudFormation::Stack`[cite: 8]", "B) To execute low-level hypervisor memory debugging", "C) To avoid paying AWS resource charges", "D) To encrypt data at rest on S3"], "answer": "A", "exp": "Nested Stacks enable modular architecture patterns (e.g., standard networking stack, security stack) referenced from a root parent template[cite: 8]."}, {"id": 100, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Configuration Snapshots", "type": "single", "q": "Where are AWS Config point-in-time configuration snapshots and configuration histories delivered for long-term retention?", "options": ["A) Designated Amazon S3 buckets[cite: 8]", "B) Local desktop hard drives", "C) Ephemeral EC2 RAM caches", "D) Public internet chat rooms"], "answer": "A", "exp": "AWS Config writes configuration snapshots and historical change files in JSON format directly to a configured Amazon S3 delivery bucket[cite: 8]."}, {"id": 101, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Trusted Advisor", "subtopic": "Fault Tolerance Checks", "type": "multi", "q": "Which TWO checks are evaluated under the Fault Tolerance category in AWS Trusted Advisor? (Select 2)", "options": ["A) EC2 instances distributed across multiple Availability Zones with Auto Scaling[cite: 8]", "B) Amazon EBS snapshots age and presence[cite: 8]", "C) Inactive IAM access keys", "D) Low-traffic Elastic Load Balancers"], "answer": ["A", "B"], "exp": "Fault tolerance checks evaluate multi-AZ redundancy, EBS snapshot recency, and S3 bucket replication status[cite: 8]."}, {"id": 102, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Root OU", "type": "single", "q": "In an AWS Organizations hierarchy, what is the Root container?", "options": ["A) The top-level parent container that encloses all Organizational Units (OUs) and member accounts in the organization[cite: 8]", "B) The Linux root directory on an EC2 instance", "C) The root user password of a standalone account", "D) An authoritative DNS root zone file"], "answer": "A", "exp": "The Root is the parent container of the entire AWS Organization hierarchy, under which all OUs and accounts reside[cite: 8]."}, {"id": 103, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Automation Runbooks", "type": "single", "q": "How can an operations team safely automate instance AMI creation, disk snapshotting, or disaster recovery failover using Systems Manager?", "options": ["A) Define and execute pre-built or custom Systems Manager Automation Documents (runbooks)[cite: 8]", "B) Write shell commands manually on individual server consoles", "C) Reboot instances from the AWS Management Console", "D) Disable AWS Config rules"], "answer": "A", "exp": "SSM Automation runbooks define multi-step workflows to automate routine operations safely and predictably across environments[cite: 8]."}, {"id": 104, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Audit Account", "type": "single", "q": "What is the primary architectural purpose of the Audit Account in an AWS Control Tower landing zone?", "options": ["A) Provides restricted read-only administrative access across all accounts for security and compliance teams to review posture and audit events[cite: 8]", "B) Pays monthly infrastructure bills for all member accounts", "C) Transcodes high-definition video files", "D) Deploys public web applications to the internet"], "answer": "A", "exp": "The Audit Account provides security and compliance auditors cross-account read-only access to investigate findings and audit logs[cite: 8]."}, {"id": 105, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "Sharing Portfolios", "type": "single", "q": "How does an enterprise distribute a Service Catalog portfolio of approved products to multiple member AWS accounts?", "options": ["A) Share the portfolio directly with specific AWS account IDs or across the entire organization using AWS Organizations[cite: 8]", "B) Email CloudFormation templates to developers as zip attachments", "C) Host templates on an unencrypted public web server", "D) Copy template code onto physical USB drives"], "answer": "A", "exp": "Service Catalog supports cross-account sharing with specific accounts or organization-wide via AWS Organizations[cite: 8]."}, {"id": 106, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Alarms with EC2 Actions", "type": "single", "q": "Which automated action can a CloudWatch Alarm execute directly on an Amazon EC2 instance when a status check failure occurs?", "options": ["A) EC2 Auto Recovery to automatically migrate the instance to healthy hardware while preserving IP and metadata[cite: 5, 8]", "B) Format the root hard drive immediately", "C) Purchase a 3-year Reserved Instance automatically", "D) Reinstall the host operating system from scratch"], "answer": "A", "exp": "CloudWatch Alarms can trigger EC2 actions including Recover, Stop, Terminate, or Reboot when instance health checks fail[cite: 5, 8]."}, {"id": 107, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "CloudTrail Event History", "type": "single", "q": "What is the default retention period and cost for viewing Management Events in the CloudTrail Event History console without configuring an S3 trail?", "options": ["A) 90 days of management event history, provided free of charge[cite: 8]", "B) 24 hours of event history with a $10 fee per query", "C) 30 days of data plane events only", "D) Indefinite storage with free unlimited querying"], "answer": "A", "exp": "CloudTrail Event History retains management events for 90 days automatically at no cost for recent troubleshooting[cite: 8]."}, {"id": 108, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Resource Relationships", "type": "single", "q": "How does AWS Config help identify the blast radius when evaluating a proposed network change?", "options": ["A) Maps and visualizes resource relationships, identifying all EC2 instances, ENIs, and security groups associated with a VPC[cite: 8]", "B) Shuts down all connected network routes to test failures", "C) Runs synthetic user transactions through CloudFront", "D) Compresses routing tables into zip files"], "answer": "A", "exp": "AWS Config tracks relationships between resources, enabling teams to trace dependencies and assess potential blast radius[cite: 8]."}, {"id": 109, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Proton", "subtopic": "Template Sync", "type": "single", "q": "What capability does AWS Proton Template Sync provide to platform engineering teams?", "options": ["A) Automatically syncs template bundles stored in a Git repository (like GitHub or GitLab) to create new template versions in Proton[cite: 8]", "B) Synchronizes local desktop files to an S3 Glacier vault", "C) Syncs MySQL database rows across different AWS Regions", "D) Copies AMI images between accounts automatically"], "answer": "A", "exp": "Template Sync allows platform teams to manage Proton templates declaratively in Git, updating versions upon commit[cite: 8]."}, {"id": 110, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Hybrid Environments", "type": "single", "q": "How does AWS Systems Manager manage on-premises virtual machines or physical servers alongside AWS cloud instances?", "options": ["A) By creating an IAM Hybrid Activation and installing the SSM Agent on the on-premises servers[cite: 2, 8]", "B) By running physical fiber cables from the data center to an AWS Outpost", "C) By disabling local on-premises firewalls completely", "D) By running VMware vSphere inside an S3 bucket"], "answer": "A", "exp": "Hybrid Activations generate registration credentials allowing the SSM Agent on on-premises machines to authenticate to Systems Manager[cite: 2, 8]."}, {"id": 111, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "High-Resolution Metrics", "type": "single", "q": "What is the minimum storage granularity supported for CloudWatch High-Resolution Custom Metrics?", "options": ["A) 1-second intervals[cite: 8]", "B) 1-minute intervals[cite: 8]", "C) 5-minute intervals[cite: 8]", "D) 1-hour intervals"], "answer": "A", "exp": "High-resolution custom metrics support sub-minute collection down to 1-second intervals for critical real-time monitoring[cite: 8]."}, {"id": 112, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Conditions Section", "type": "single", "q": "What is the purpose of the Conditions section in an AWS CloudFormation template?", "options": ["A) Controls whether specific resources are created or whether resource properties are assigned based on parameter values[cite: 8]", "B) Sets environmental temperatures for physical data center racks", "C) Enforces employee employment contract terms", "D) Formats JSON files into SQL database schemas"], "answer": "A", "exp": "Conditions use intrinsic evaluation functions (e.g., `Fn::Equals`, `Fn::If`) to conditionally provision resources based on environment inputs[cite: 8]."}, {"id": 113, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "Inviting Existing Accounts", "type": "single", "q": "What step is required when an existing standalone AWS account is invited to join an AWS Organization?", "options": ["A) The invited account owner must explicitly accept the invitation sent from the management account[cite: 8]", "B) The invited account data is wiped and recreated from scratch", "C) The invited account must change its AWS Region to us-east-1", "D) AWS Support must approve the account merge via phone"], "answer": "A", "exp": "Joining an organization requires the standalone account owner to accept the invitation, after which consolidated billing and SCPs apply[cite: 8]."}, {"id": 114, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Trusted Advisor", "subtopic": "Programmatic Access", "type": "single", "q": "How can enterprise DevOps teams automate remediation based on Trusted Advisor findings?", "options": ["A) Use the AWS Trusted Advisor API (with Business or Enterprise Support) integrated with Lambda or EventBridge[cite: 8]", "B) Run manual screen-scraping scripts on the AWS Management Console", "C) Request daily text message notifications to engineer personal phones", "D) Download paper reports and scan them via OCR"], "answer": "A", "exp": "The Trusted Advisor API lets organizations poll checks programmatically to feed alerts or automated remediation pipelines[cite: 8]."}, {"id": 115, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Fleet Manager", "type": "single", "q": "What capability does Systems Manager Fleet Manager deliver to system administrators?", "options": ["A) A unified user interface to view OS health, inspect file systems, view event logs, and manage users across node fleets without remote desktop software[cite: 2, 8]", "B) Manages corporate car and truck vehicle leases", "C) Dispatches physical field engineers to replace bad memory sticks", "D) Replaces Amazon ECS for Docker orchestration"], "answer": "A", "exp": "Fleet Manager provides a GUI-based console to explore folder structures, process lists, and OS logs across Linux and Windows instances[cite: 2, 8]."}, {"id": 116, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Parameters Section", "type": "single", "q": "Why are Parameters used when authoring AWS CloudFormation templates?", "options": ["A) To pass dynamic custom values (e.g., instance types, key pairs, environment names) into the template at stack creation or update time[cite: 5, 8]", "B) To execute low-level hypervisor reboots", "C) To encrypt data at rest inside S3 buckets", "D) To bypass VPC subnet route tables"], "answer": "A", "exp": "Parameters allow a single declarative template to be reused across development, staging, and production environments with tailored settings[cite: 5, 8]."}, {"id": 117, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Log Groups and Streams", "type": "single", "q": "In Amazon CloudWatch Logs, what is the architectural difference between a Log Group and a Log Stream?", "options": ["A) A Log Group defines shared retention, access control, and metric filters; a Log Stream represents a sequence of log events from a specific source instance[cite: 8]", "B) A Log Group is for billing; a Log Stream is for network packets", "C) Log Groups are stored in S3; Log Streams are stored in local RAM", "D) There is no distinction between them in CloudWatch"], "answer": "A", "exp": "A Log Group is a collection of Log Streams that share the same access control and retention settings (e.g., an application cluster)[cite: 8]."}, {"id": 118, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Custom Rules", "type": "single", "q": "Which AWS service is used to write and execute the logic for AWS Config Custom Rules?", "options": ["A) AWS Lambda[cite: 8]", "B) Amazon EC2 dedicated instances", "C) Amazon RDS stored procedures", "D) AWS Snowcone"], "answer": "A", "exp": "AWS Config Custom Rules invoke AWS Lambda functions to evaluate resource configurations against custom organization logic[cite: 8]."}, {"id": 119, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Preventive Guardrail Implementation", "type": "single", "q": "How does AWS Control Tower enforce a preventive guardrail that prevents users from disabling AWS CloudTrail?", "options": ["A) Applies a Service Control Policy (SCP) at the Organizational Unit level that denies the `cloudtrail:StopLogging` action[cite: 8]", "B) Sends an email to the user asking them not to disable logging", "C) Automatically shuts down the user's laptop", "D) Reinstalls the CloudTrail agent every 10 seconds"], "answer": "A", "exp": "Preventive guardrails use SCPs attached to OUs or accounts to programmatically block disallowed API actions[cite: 8]."}, {"id": 120, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Patch Compliance Reporting", "type": "single", "q": "Where can an administrator view patch compliance summaries and identify non-compliant instances across the entire fleet?", "options": ["A) Systems Manager Patch Manager Compliance Dashboard[cite: 8]", "B) Route 53 DNS query log console", "C) AWS Artifact audit certificates", "D) Amazon S3 Glacier vault inventory"], "answer": "A", "exp": "Patch Manager maintains real-time compliance reporting showing which nodes have missing, failed, or outdated patches[cite: 8]."}, {"id": 121, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Outputs Section", "type": "single", "q": "What is the primary function of the Outputs section in an AWS CloudFormation template?", "options": ["A) Declares output values (such as an ALB DNS name or VPC ID) to display in the console or export for use by other stacks[cite: 8]", "B) Deletes temporary files created during provisioning", "C) Exports customer billing invoices to PDF format", "D) Encrypts root EBS volumes using KMS keys"], "answer": "A", "exp": "The Outputs section exposes resource properties for external reference and enables cross-stack exports using `Export: Name`[cite: 8]."}, {"id": 122, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Alarms - Missing Data Handling", "type": "single", "q": "Why is configuring 'Treat missing data as...' important when setting up a CloudWatch Alarm?", "options": ["A) Prevents false alarms or missed notifications when an instance stops sending metrics due to being turned off or network latency[cite: 8]", "B) Automatically creates synthetic test data", "C) Prevents CloudWatch from billing the user for that metric", "D) Reboots the instance whenever a data point is lost"], "answer": "A", "exp": "Configuring how missing data is treated (notBreaching, breaching, ignore, missing) ensures alarms only trigger under genuine failure conditions[cite: 8]."}, {"id": 123, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "FullAWSAccess Default SCP", "type": "single", "q": "What is the default Service Control Policy attached to the Root and all newly created OUs in AWS Organizations?", "options": ["A) `FullAWSAccess` (allows all actions across all services by default)[cite: 8]", "B) `DenyAllRoot` (blocks all actions until custom policies are applied)", "C) `ReadOnlyAccess` (allows reading metrics but no resource creation)", "D) `BillingOnly` (restricts accounts strictly to viewing invoices)"], "answer": "A", "exp": "The default SCP is `FullAWSAccess`, ensuring existing permissions are not broken until explicit deny or allow boundaries are attached[cite: 8]."}, {"id": 124, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Service Catalog", "subtopic": "Tag Update Constraints", "type": "single", "q": "What governance capability does a Tag Update Constraint enforce in AWS Service Catalog?", "options": ["A) Governs whether an end user is permitted to add, edit, or remove tags on provisioned products during updates[cite: 8]", "B) Automatically renames AWS accounts", "C) Changes instance hostnames every 24 hours", "D) Encrypts tag keys with customer-managed keys"], "answer": "A", "exp": "Tag Update Constraints prevent users from tampering with portfolio-inherited cost-allocation tags during lifecycle updates[cite: 8]."}, {"id": 125, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Run Command - Target Selection", "type": "single", "q": "How can an administrator target thousands of instances dynamically when executing an SSM Run Command?", "options": ["A) Specify target criteria based on resource tags, Resource Groups, or choose all managed instances[cite: 8]", "B) Manually type the IP address of every single server into a text box", "C) Target instances by calling their telephone numbers", "D) Send a broadcast ping across the public internet"], "answer": "A", "exp": "Run Command targets instances dynamically using tags (e.g., `Environment=Prod`), ensuring newly booted matching nodes are automatically included[cite: 8]."}, {"id": 126, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Well-Architected Tool", "subtopic": "Sharing Workload Reviews", "type": "single", "q": "How can an enterprise architecture center of excellence share a completed Well-Architected workload review across multiple accounts?", "options": ["A) Share the workload review directly with other accounts or the entire organization via AWS Organizations[cite: 8]", "B) Print out physical copies of the report and mail them", "C) Copy the review file onto an unencrypted FTP server", "D) Workload reviews cannot be shared outside a single account"], "answer": "A", "exp": "The Well-Architected Tool natively integrates with AWS Organizations to share reviews and improvement milestones across accounts[cite: 8]."}, {"id": 127, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudTrail", "subtopic": "Multi-Region Trails", "type": "single", "q": "Why is enabling a Multi-Region Trail a foundational security and reliability best practice in AWS CloudTrail?", "options": ["A) Ensures that unauthorized API calls made in uncommonly used or unexpected AWS Regions are recorded and detected[cite: 8]", "B) Decreases S3 storage costs by 50%", "C) Disables all public internet access to the AWS account", "D) Automatically converts log files into relational tables"], "answer": "A", "exp": "A multi-region trail captures API activity across all AWS regions, preventing attackers from operating undetected in dormant regions[cite: 8]."}, {"id": 128, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "Amazon CloudWatch", "subtopic": "Cross-Service Alarms", "type": "single", "q": "Which service integration allows CloudWatch Alarms to send real-time text alerts, push notifications, and trigger automated HTTP webhooks?", "options": ["A) Amazon Simple Notification Service (Amazon SNS)[cite: 8]", "B) AWS Direct Connect", "C) AWS Storage Gateway", "D) AWS Snowball Edge"], "answer": "A", "exp": "CloudWatch Alarms integrate directly with Amazon SNS topics to broadcast notifications to email, SMS, Chatbot, and webhooks[cite: 8]."}, {"id": 129, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Config", "subtopic": "Evaluation Modes", "type": "single", "q": "What capability does the AWS Config Proactive Evaluation mode provide to developers using CI/CD pipelines?", "options": ["A) Evaluates CloudFormation templates for compliance against Config rules BEFORE resources are provisioned to block non-compliant code[cite: 8]", "B) Evaluates developer typing speed during coding sessions", "C) Measures network latency over on-premises Wi-Fi", "D) Shuts down developer IDEs if an error occurs"], "answer": "A", "exp": "Proactive evaluation checks resource configurations before deployment, enabling 'shift-left' compliance testing in CI/CD pipelines[cite: 8]."}, {"id": 130, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Systems Manager (SSM)", "subtopic": "Session Manager - Logging", "type": "single", "q": "How can an organization audit and review commands typed by administrators during interactive Session Manager shell sessions?", "options": ["A) Configure Session Manager to stream session logs and keystrokes directly to Amazon S3 or Amazon CloudWatch Logs[cite: 8]", "B) Record physical video of the administrator's keyboard", "C) Session Manager does not support logging of interactive commands", "D) Store command histories in public DNS TXT records"], "answer": "A", "exp": "Session Manager can stream full session keystroke logs and command outputs to S3 or CloudWatch Logs for compliance and forensic auditing[cite: 8]."}, {"id": 131, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Control Tower", "subtopic": "Detective Guardrail Implementation", "type": "single", "q": "How does AWS Control Tower notify administrators when a detective guardrail is breached?", "options": ["A) Identifies the violation using an AWS Config rule, marks the resource as non-compliant, and sends alerts via SNS[cite: 8]", "B) Shuts down the entire AWS Region immediately", "C) Erases all data stored in the target resource", "D) Reboots the customer's on-premises router"], "answer": "A", "exp": "Detective guardrails use AWS Config rules to monitor state continuously, flagging non-compliant resources in dashboards and alerting via SNS[cite: 8]."}, {"id": 132, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS CloudFormation", "subtopic": "Mappings Section", "type": "single", "q": "What is the primary architectural purpose of the Mappings section in an AWS CloudFormation template?", "options": ["A) Matches keys to sets of named values, commonly used to map region-specific AMI IDs to the target AWS deployment region[cite: 8]", "B) Draws 2D architectural network diagrams in the console", "C) Connects local disk partitions to EBS volumes", "D) Translates English text into foreign languages"], "answer": "A", "exp": "The Mappings section acts as a lookup table (e.g., selecting the correct regional AMI ID based on `AWS::Region`)[cite: 8]."}, {"id": 133, "section": "10. MANAGEMENT & GOVERNANCE", "topic": "AWS Organizations", "subtopic": "SCP Inheritance", "type": "single", "q": "How does policy inheritance work across nested Organizational Units (OUs) in AWS Organizations?", "options": ["A) Policies applied to a parent OU are inherited by all child OUs and member accounts contained within that tree[cite: 8]", "B) Child OUs automatically override and negate all parent policies", "C) Member accounts never inherit policies from their enclosing OU", "D) Policies must be manually copied to every member account"], "answer": "A", "exp": "SCPs flow downward hierarchically; an action must be allowed at the root, at each parent OU, and at the account level to be permitted[cite: 8]."}], "quiz11": [{"id": 1, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Discovery Service", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT true regarding AWS Application Discovery Service as described in the handbook?", "options": ["A) Helps enterprises plan migration projects by identifying on-premises servers, applications, and dependencies[cite: 8]", "B) Collects detailed system configuration, performance metrics, and network communication data[cite: 8]", "C) Executes automated lift-and-shift live server cutover and block replication directly to EC2[cite: 8]", "D) Supports both agent-based and agentless data discovery mechanisms[cite: 8]"], "answer": "C", "exp": "AWS Application Discovery Service is strictly used during the assessment and discovery phase to gather planning data; live server replication and cutover are executed by AWS Application Migration Service (MGN)[cite: 8]."}, {"id": 2, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Discovery Service", "subtopic": "Discovery Methods", "type": "multi", "q": "Which TWO discovery methods are supported natively by AWS Application Discovery Service? (Select 2)", "options": ["A) Agent-Based Discovery (lightweight agent installed on individual OS hosts for deep process and dependency metrics)[cite: 8]", "B) Agentless Discovery (virtual appliance deployed via OVA inside VMware vCenter environments)[cite: 8]", "C) Public Web Scraping using search engine spiders", "D) Optical fiber inspection via local network hardware probes"], "answer": ["A", "B"], "exp": "Application Discovery Service offers an on-host agent for deep system profiling and an agentless collector appliance for VMware vCenter environments[cite: 8]."}, {"id": 3, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Discovery Service", "subtopic": "Data Collected & Migration Hub", "type": "single", "q": "Where is data collected by the AWS Application Discovery Service centrally aggregated, visualized, and grouped for migration planning?", "options": ["A) AWS Migration Hub[cite: 8]", "B) AWS Secrets Manager[cite: 8]", "C) Amazon Route 53 Traffic Flow[cite: 8]", "D) AWS Artifact Compliance Portal[cite: 8]"], "answer": "A", "exp": "All discovered server attributes, performance baselines, and network dependencies are exported to and visualized inside AWS Migration Hub[cite: 8]."}, {"id": 4, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Discovery Service", "subtopic": "Security and Pricing", "type": "multi", "q": "Which TWO statements regarding AWS Application Discovery Service security and cost are accurate? (Select 2)", "options": ["A) All communication between agents/collectors and AWS is encrypted using HTTPS/TLS[cite: 8]", "B) The service itself is free to use, with no software licensing fees for agents[cite: 8]", "C) Users must pay an upfront fee of $5,000 per scanned virtual machine", "D) Data is transmitted unencrypted over open UDP ports"], "answer": ["A", "B"], "exp": "Application Discovery Service communicates securely via TLS, and the service and discovery agents are provided free of charge by AWS[cite: 8]."}, {"id": 5, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Discovery Service", "subtopic": "Best Practices & Exam Tips", "type": "single", "q": "What is an architectural best practice when running AWS Application Discovery Service prior to migration?", "options": ["A) Run discovery for at least 2 to 4 weeks to capture seasonal workload patterns and true peak resource utilization[cite: 8]", "B) Run discovery for only 5 minutes to avoid network congestion", "C) Terminate all on-premises servers before initiating discovery", "D) Disable AWS IAM permissions on all discovery service roles"], "answer": "A", "exp": "Running discovery over a 2 to 4 week window captures realistic workload cycles, peaks, and resource usage patterns required for accurate TCO modeling[cite: 8]."}, {"id": 6, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Migration Service (MGN)", "subtopic": "What It Is & Migration Strategy", "type": "single", "q": "Which 7 Rs migration strategy is primarily automated by AWS Application Migration Service (MGN)?", "options": ["A) Rehost (Lift-and-Shift)[cite: 3, 8]", "B) Refactor / Re-architect", "C) Retire", "D) Repurchase (Drop-and-Shop)"], "answer": "A", "exp": "AWS Application Migration Service (MGN) is AWS's primary lift-and-shift (rehost) service for physical, virtual, or cloud servers[cite: 3, 8]."}, {"id": 7, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Migration Service (MGN)", "subtopic": "Replication Mechanism", "type": "single", "q": "How does AWS Application Migration Service (MGN) replicate source servers to AWS without disrupting business operations?", "options": ["A) Performs continuous, non-disruptive block-level replication into a staging area subnet in your AWS account[cite: 8]", "B) Reboots source servers every 30 minutes to capture disk images", "C) Takes daily scheduled file-level backups over public FTP", "D) Converts source code into serverless Lambda functions"], "answer": "A", "exp": "MGN uses an agent to perform continuous block-level storage replication to lightweight staging instances in an AWS staging subnet[cite: 8]."}, {"id": 8, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Migration Service (MGN)", "subtopic": "Test vs Cutover Instances", "type": "multi", "q": "Which TWO statements regarding testing and cutover in AWS MGN are correct? (Select 2)", "options": ["A) Allows launching non-disruptive Test Instances to validate applications on AWS prior to final cutover[cite: 8]", "B) Automatically generates EC2 Launch Templates for target test and cutover servers[cite: 8]", "C) Final cutover permanently disables the ability to roll back to the original source", "D) Cutover requires deleting all source databases on-premises before initiating launch"], "answer": ["A", "B"], "exp": "MGN automatically creates EC2 launch templates and allows launching test instances non-disruptively before conducting final cutover[cite: 8]."}, {"id": 9, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Migration Service (MGN)", "subtopic": "Comparison with AWS SMS", "type": "single", "q": "What is the key technical advantage of AWS Application Migration Service (MGN) over the legacy AWS Server Migration Service (SMS)?", "options": ["A) Continuous near-real-time block replication with minimal RPO/downtime instead of periodic snapshot-based replication[cite: 8]", "B) Runs without an internet connection or VPN tunnel", "C) Free unmetered compute instances in production forever", "D) Eliminates the need for an Amazon VPC"], "answer": "A", "exp": "MGN provides continuous block replication rather than periodic snapshots (used by SMS), significantly shortening cutover windows and lowering RPO[cite: 8]."}, {"id": 10, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Migration Service (MGN)", "subtopic": "Exam Tips", "type": "single", "q": "When is AWS Application Migration Service (MGN) the definitive answer on the SAA-C03 exam?", "options": ["A) When migrating physical, virtual (VMware/Hyper-V), or other cloud servers to EC2 with minimal downtime and minimal application refactoring[cite: 8]", "B) When converting an Oracle database schema to Amazon Aurora PostgreSQL", "C) When transferring petabytes of offline video archives using postal trucks", "D) When synchronizing S3 buckets across multiple AWS accounts"], "answer": "A", "exp": "MGN is the recommended default tool on AWS certification exams for lift-and-shift server migrations with continuous replication and minimal cutover time[cite: 8]."}, {"id": 11, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "What It Is & Migration Scope", "type": "single", "q": "Which of the following is NOT an accurate capability of AWS Database Migration Service (AWS DMS)?", "options": ["A) Supports homogeneous database migrations (e.g., Oracle to Oracle, PostgreSQL to PostgreSQL)[cite: 8]", "B) Supports heterogeneous database migrations (e.g., Oracle to Aurora PostgreSQL)[cite: 8]", "C) Automatically rewrites complex application business logic code and frontend interfaces[cite: 8]", "D) Supports ongoing replication with minimal downtime using Change Data Capture (CDC)[cite: 8]"], "answer": "C", "exp": "AWS DMS migrates data and schema structures (via SCT), but it does not rewrite application frontend code or client business logic[cite: 8]."}, {"id": 12, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "Supported Targets", "type": "multi", "q": "Which TWO of the following can serve as valid target endpoints in AWS Database Migration Service? (Select 2)", "options": ["A) Amazon Aurora and Amazon RDS[cite: 8]", "B) Amazon S3 and Amazon Redshift[cite: 8]", "C) Physical tape cartridges via VTL", "D) Direct Connect virtual interfaces"], "answer": ["A", "B"], "exp": "DMS supports a wide variety of targets including RDS, Aurora, Redshift, S3, DynamoDB, Kinesis, and OpenSearch[cite: 8]."}, {"id": 13, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "Change Data Capture (CDC)", "type": "single", "q": "What is the primary operational role of Change Data Capture (CDC) in AWS DMS?", "options": ["A) Captures ongoing transaction log changes (inserts, updates, deletes) to keep target databases continuously synchronized for near-zero downtime cutover[cite: 8]", "B) Compresses database tables into encrypted ZIP files", "C) Takes nightly cold backups of the source operating system", "D) Deletes obsolete records from the source database automatically"], "answer": "A", "exp": "CDC reads transaction logs on the source database to stream ongoing changes to the target, enabling minimal-downtime cutover[cite: 8]."}, {"id": 14, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "AWS Schema Conversion Tool (SCT)", "type": "single", "q": "When is the AWS Schema Conversion Tool (AWS SCT) required alongside AWS DMS?", "options": ["A) During heterogeneous migrations when the source and target database engines differ (e.g., Oracle to MySQL)[cite: 8]", "B) Only during homogeneous migrations between identical database engines", "C) When transferring media files to Amazon CloudFront", "D) When configuring Multi-AZ failover on Aurora"], "answer": "A", "exp": "AWS SCT is required for heterogeneous migrations to assess, convert, and rewrite database schemas, stored procedures, and views[cite: 8]."}, {"id": 15, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "High Availability & Multi-AZ", "type": "multi", "q": "Which TWO statements regarding AWS DMS replication instance high availability are accurate? (Select 2)", "options": ["A) A Multi-AZ replication instance deployment provides a standby replica in another AZ for automated failover[cite: 3, 8]", "B) If the primary DMS instance fails, ongoing replication tasks can resume automatically after failover[cite: 3, 8]", "C) Multi-AZ replication instances must be deployed across two separate AWS Regions", "D) Single-AZ replication instances provide zero-downtime hardware guarantees"], "answer": ["A", "B"], "exp": "Deploying a Multi-AZ DMS replication instance provides an automatic standby replica in another AZ to ensure high availability during migration[cite: 3, 8]."}, {"id": 16, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "Replication Tasks", "type": "single", "q": "Which AWS DMS task type migrates existing table records and then continues capturing incremental transactional changes indefinitely?", "options": ["A) Full load + CDC[cite: 8]", "B) Full load only[cite: 8]", "C) CDC only[cite: 8]", "D) Ephemeral Snapshot Load"], "answer": "A", "exp": "A 'Full load + CDC' task migrates existing data and transitions seamlessly to capture ongoing changes until cutover[cite: 8]."}, {"id": 17, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "Exam Tips", "type": "single", "q": "What pairing is tested on the SAA exam when migrating an on-premises Microsoft SQL Server database to Amazon Aurora MySQL?", "options": ["A) Use AWS SCT to convert the database schema and code, followed by AWS DMS to migrate data with CDC[cite: 8]", "B) Use AWS DataSync to copy SQL database data files directly to S3", "C) Use AWS Application Migration Service to convert database tables into containers", "D) Use S3 Glacier Vault Lock to migrate database logs"], "answer": "A", "exp": "Heterogeneous migrations require AWS SCT to convert schemas/code and AWS DMS to migrate data and replicate ongoing changes[cite: 8]."}, {"id": 18, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "What It Is & Performance", "type": "single", "q": "Which of the following is NOT true regarding AWS DataSync?", "options": ["A) Fully managed data transfer service accelerating data movement between on-premises and AWS[cite: 8]", "B) Transfers data up to 10x faster than open-source tools using a purpose-built network protocol[cite: 8]", "C) Requires customers to manually manage server clusters and write custom rsync shell scripts[cite: 8]", "D) Built-in data integrity verification and automatic file checksum validation[cite: 8]"], "answer": "C", "exp": "AWS DataSync is a fully managed service that removes the operational burden of writing custom transfer scripts or managing cluster infrastructure[cite: 8]."}, {"id": 19, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "Supported Storage Locations", "type": "multi", "q": "Which TWO storage systems can serve as valid source or destination locations for AWS DataSync? (Select 2)", "options": ["A) On-premises Network File System (NFS) and Server Message Block (SMB) file shares[cite: 8]", "B) Amazon S3, Amazon EFS, and Amazon FSx (for Windows File Server / Lustre)[cite: 8]", "C) Physical magnetic cassette tape recorders", "D) Route 53 DNS zone files"], "answer": ["A", "B"], "exp": "DataSync natively integrates with on-premises NFS/SMB shares and AWS cloud storage including S3, EFS, and FSx[cite: 8]."}, {"id": 20, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "DataSync Agent", "type": "single", "q": "How does AWS DataSync connect to on-premises storage systems to execute file transfers?", "options": ["A) By deploying a DataSync Agent virtual appliance (VMware, Hyper-V, or KVM) in the local network[cite: 8]", "B) By opening public HTTP ports on all local workstations", "C) By mailing encrypted flash drives to the local office", "D) By attaching an Elastic IP to the physical storage chassis"], "answer": "A", "exp": "On-premises transfers require deploying the AWS DataSync Agent virtual machine to connect to local NFS/SMB storage[cite: 8]."}, {"id": 21, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "Security and Verification", "type": "multi", "q": "Which TWO security and data integrity features are handled automatically by AWS DataSync? (Select 2)", "options": ["A) End-to-end data encryption in transit using TLS[cite: 8]", "B) Automatic data integrity verification using checksums during and after transfer[cite: 8]", "C) Uploading plain text files to public S3 buckets without authorization", "D) Disabling AWS IAM role validation"], "answer": ["A", "B"], "exp": "DataSync enforces TLS in-transit encryption and validates file contents using automatic checksum verification[cite: 8]."}, {"id": 22, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "Use Cases & Throttling", "type": "single", "q": "Which feature in AWS DataSync prevents active file migrations from overwhelming an enterprise's production internet connection during business hours?", "options": ["A) Configurable bandwidth limits and task scheduling[cite: 8]", "B) VPC Peering cross-connects", "C) Mandatory offline shipping mode", "D) AWS Shield Advanced rate limiting"], "answer": "A", "exp": "DataSync supports configurable bandwidth throttling and scheduling to run high-throughput jobs during off-peak hours[cite: 8]."}, {"id": 23, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "Exam Tips", "type": "single", "q": "What is the key indicator on the exam to choose AWS DataSync over AWS Snowball Edge?", "options": ["A) When fast, automated online data transfer over existing network links (Direct Connect/VPN/Internet) is required for regular synchronization[cite: 1, 8]", "B) When migrating 500 TB over an intermittent 10 Mbps connection with high network constraints[cite: 5]", "C) When running local EC2 compute at remote disconnected military sites[cite: 5]", "D) When physical device delivery is mandated by policy"], "answer": "A", "exp": "AWS DataSync is the online data transfer solution; Snowball Edge is the offline physical transport appliance used when network bandwidth is insufficient[cite: 1, 5, 8]."}, {"id": 24, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowmobile", "subtopic": "What It Is & Capacity", "type": "single", "q": "What is the maximum data capacity of a single AWS Snowmobile unit?", "options": ["A) Up to 100 Petabytes (PB)[cite: 8]", "B) Up to 80 Terabytes (TB)[cite: 8]", "C) Up to 1 Exabyte (EB)", "D) Up to 500 Gigabytes (GB)"], "answer": "A", "exp": "A single AWS Snowmobile shipping container truck can hold up to 100 PB of data, used for massive exabyte-scale migrations[cite: 8]."}, {"id": 25, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowmobile", "subtopic": "Physical Form & Logistics", "type": "multi", "q": "Which TWO physical security and delivery characteristics apply to AWS Snowmobile? (Select 2)", "options": ["A) A 45-foot ruggedized shipping container pulled by a semi-trailer truck[cite: 8]", "B) Equipped with 24/7 video surveillance, GPS tracking, and a dedicated security escort vehicle[cite: 8]", "C) Shipped via standard overnight postal express envelopes", "D) Plugged directly into local office desktop wall sockets"], "answer": ["A", "B"], "exp": "Snowmobile is a 45-foot ruggedized truck container escorted by dedicated security personnel and monitored via GPS and video[cite: 8]."}, {"id": 26, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowmobile", "subtopic": "Data Security & KMS", "type": "single", "q": "How is data secured on an AWS Snowmobile during physical transit?", "options": ["A) Data is encrypted with 256-bit keys managed by AWS KMS; keys are never stored on the truck[cite: 8]", "B) Files are stored unencrypted on public RAID arrays", "C) Data is visible on external digital signage on the side of the truck", "D) Passwords are handwritten on paper manifests"], "answer": "A", "exp": "Snowmobile enforces hardware-based 256-bit encryption with KMS keys that are never written to or present on the vehicle[cite: 8]."}, {"id": 27, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowmobile", "subtopic": "Use Cases & Transfer Speeds", "type": "multi", "q": "Which TWO statements regarding AWS Snowmobile deployment and transfer are accurate? (Select 2)", "options": ["A) Connected directly to the local network using high-speed links capable of up to 1 Tbps[cite: 8]", "B) Designed for massive data center decommissioning and exabyte-scale archive migrations[cite: 8]", "C) Typically ordered for small, weekly 50 GB file transfers", "D) Can be deployed inside standard office cubicles"], "answer": ["A", "B"], "exp": "Snowmobile connects via high-speed optical links up to 1 Tbps and is intended for massive migrations (tens to hundreds of petabytes)[cite: 8]."}, {"id": 28, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowmobile", "subtopic": "Exam Tips", "type": "single", "q": "When is AWS Snowmobile the only viable solution on the AWS certification exam?", "options": ["A) When migrating datasets exceeding 10 Petabytes (up to exabytes) where network transfer would take months or years[cite: 8]", "B) When moving a 50 TB MySQL database with active real-time updates", "C) When deploying containerized web apps on ECS", "D) When configuring DNS routing policies"], "answer": "A", "exp": "Whenever exam questions describe moving tens of petabytes or exabyte-scale data where bandwidth is inadequate, Snowmobile is the answer[cite: 8]."}, {"id": 29, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT an accurate statement regarding AWS Snowball Edge?", "options": ["A) Rugged, portable physical device designed for TB-scale offline data transfer and edge computing[cite: 8]", "B) Shipped directly to customer premises and returned to AWS for S3 ingestion[cite: 8]", "C) A virtual software appliance that requires permanent 100 Gbps public internet connectivity[cite: 8]", "D) Capable of running local EC2 instances and AWS Lambda functions[cite: 8]"], "answer": "C", "exp": "AWS Snowball Edge is a physical hardware appliance engineered specifically for disconnected or bandwidth-constrained environments[cite: 8]."}, {"id": 30, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "Device Variants", "type": "multi", "q": "Which TWO variants of AWS Snowball Edge are available based on workload needs? (Select 2)", "options": ["A) Snowball Edge Storage Optimized (80 TB usable storage for bulk data movement)[cite: 8]", "B) Snowball Edge Compute Optimized (42 TB usable storage with extra vCPUs and optional GPU)[cite: 8]", "C) Snowball Edge Paper Tape Edition", "D) Snowball Edge Optical Drive Edition"], "answer": ["A", "B"], "exp": "Snowball Edge is offered in Storage Optimized (80 TB for bulk transport) and Compute Optimized (42 TB with powerful vCPUs/GPUs) options[cite: 8]."}, {"id": 31, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "Edge Computing Capabilities", "type": "multi", "q": "Which TWO compute capabilities can be executed locally on an AWS Snowball Edge device in disconnected environments? (Select 2)", "options": ["A) Amazon EC2 instances[cite: 8]", "B) AWS Lambda functions[cite: 8]", "C) Amazon Redshift Spectrum clusters", "D) Amazon DynamoDB Global Tables"], "answer": ["A", "B"], "exp": "Snowball Edge supports running local EC2 instances and Lambda functions to process, filter, and transform data at the edge[cite: 8]."}, {"id": 32, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "Clustering & High Availability", "type": "single", "q": "What capability is enabled by clustering multiple AWS Snowball Edge devices together on-premises?", "options": ["A) Creates a local, fault-tolerant storage cluster with increased capacity and durability[cite: 8]", "B) Automatically pulls power from atmospheric static electricity", "C) Eliminates the need to return devices to AWS", "D) Replaces AWS CloudTrail across all cloud accounts"], "answer": "A", "exp": "Clustering multiple Snowball Edge devices provides a local HDFS/S3-compatible, fault-tolerant storage pool for edge workloads[cite: 8]."}, {"id": 33, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "Security & Sanitization", "type": "single", "q": "How does AWS protect data on Snowball Edge devices once the data has been successfully copied into Amazon S3?", "options": ["A) The device storage is sanitized and cryptographically wiped in accordance with NIST 800-88 standards[cite: 8]", "B) The physical device is permanently incinerated", "C) Data remains stored on the device for 10 years", "D) Files are emailed back to the customer"], "answer": "A", "exp": "After data is verified and uploaded to S3, AWS performs a secure cryptographic wipe of the Snowball Edge device according to NIST guidelines[cite: 8]."}, {"id": 34, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario indicates using Snowball Edge Storage Optimized on the exam?", "options": ["A) Migrating 50 TB to 500 TB of data to S3 from a location with limited or expensive internet connectivity[cite: 5, 8]", "B) Streaming real-time telemetry from connected vehicles", "C) Deploying a public REST API using API Gateway", "D) Hosting a multi-master PostgreSQL cluster"], "answer": "A", "exp": "Snowball Edge is the standard exam answer for multi-terabyte to petabyte offline migrations constrained by limited network links[cite: 5, 8]."}, {"id": 35, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "What It Is & Supported Protocols", "type": "single", "q": "Which of the following is NOT one of the standard file transfer protocols supported by AWS Transfer Family?", "options": ["A) SFTP (Secure File Transfer Protocol)[cite: 8]", "B) FTPS (FTP over SSL/TLS)[cite: 8]", "C) FTP (File Transfer Protocol)[cite: 8]", "D) Telnet Cleartext Protocol"], "answer": "D", "exp": "AWS Transfer Family natively supports SFTP, FTPS, and FTP protocols, providing managed access to AWS storage[cite: 8]."}, {"id": 36, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "Backend Storage Targets", "type": "multi", "q": "Which TWO AWS storage services serve directly as the backend storage targets for AWS Transfer Family? (Select 2)", "options": ["A) Amazon Simple Storage Service (Amazon S3)[cite: 8]", "B) Amazon Elastic File System (Amazon EFS)[cite: 8]", "C) Amazon DynamoDB Global Tables", "D) AWS Snowmobile storage arrays"], "answer": ["A", "B"], "exp": "Files uploaded via Transfer Family land natively and directly into Amazon S3 buckets or Amazon EFS file systems[cite: 8]."}, {"id": 37, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "User Authentication Options", "type": "single", "q": "Which of the following is NOT a supported user authentication method in AWS Transfer Family?", "options": ["A) Service-managed identities (stored directly within Transfer Family)[cite: 8]", "B) AWS Directory Service (integrating with Microsoft Active Directory)[cite: 8]", "C) Custom Identity Providers using Amazon API Gateway and AWS Lambda[cite: 8]", "D) Storing credentials in plain text inside public S3 object metadata"], "answer": "D", "exp": "Transfer Family supports service-managed users, Active Directory via Directory Service, and custom authentication via API Gateway/Lambda[cite: 8]."}, {"id": 38, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "Custom Domains & Certificates", "type": "multi", "q": "Which TWO features allow integrating AWS Transfer Family seamlessly into existing corporate client configurations? (Select 2)", "options": ["A) Custom domain names mapped using Amazon Route 53 DNS aliases[cite: 8]", "B) SSL/TLS certificates managed via AWS Certificate Manager (ACM) for FTPS[cite: 8]", "C) Forcing all clients to use hardcoded AWS IP addresses", "D) Disabling public DNS resolution globally"], "answer": ["A", "B"], "exp": "Transfer Family supports custom domain names (CNAMEs) and integrates with ACM to provide certificates for FTPS endpoints[cite: 8]."}, {"id": 39, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "Security and Network Endpoints", "type": "single", "q": "How can an organization ensure that an AWS Transfer Family SFTP server is accessible ONLY from internal VPC subnets or via private VPN/Direct Connect links?", "options": ["A) Deploy the server with a VPC endpoint type (internal) and attach VPC Security Groups[cite: 8]", "B) Make the endpoint public to 0.0.0.0/0", "C) Disconnect the AWS account from the internet", "D) Disable SFTP protocol encryption"], "answer": "A", "exp": "Transfer Family supports VPC-hosted internal endpoints powered by AWS PrivateLink, securing traffic with Security Groups[cite: 8]."}, {"id": 40, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "Transfer Family vs Storage Gateway", "type": "single", "q": "What is the primary difference between AWS Transfer Family and AWS Storage Gateway?", "options": ["A) Transfer Family provides protocol-based (SFTP/FTPS/FTP) access for clients directly into S3/EFS; Storage Gateway provides block, file (NFS/SMB), and tape storage mount points for on-prem servers[cite: 8]", "B) Transfer Family is for physical hard drive shipping; Storage Gateway is for DNS", "C) Storage Gateway does not support Amazon S3", "D) Transfer Family cannot scale automatically"], "answer": "A", "exp": "Transfer Family enables standard FTP/SFTP clients to read/write S3/EFS; Storage Gateway bridges on-prem infrastructure using NFS, SMB, and iSCSI[cite: 8]."}, {"id": 41, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "Exam Tips", "type": "single", "q": "What scenario points directly to choosing AWS Transfer Family on the SAA-C03 exam?", "options": ["A) Migrating or modernizing legacy SFTP/FTP workflows to Amazon S3 or EFS without disrupting existing partner authentication or scripts[cite: 8]", "B) Streaming real-time sensor records into Amazon OpenSearch Service", "C) Building multi-AZ relational databases", "D) Backing up physical tape cartridges to Glacier"], "answer": "A", "exp": "Exam scenarios involving partner B2B file transfers requiring SFTP/FTPS access to cloud storage without managing servers point to Transfer Family[cite: 8]."}, {"id": 42, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowcone", "subtopic": "What It Is & Edge Portability", "type": "single", "q": "Which of the following is true regarding AWS Snowcone as a member of the AWS Snow Family?", "options": ["A) The smallest, ultra-portable, ruggedized edge computing and data transfer device (under 5 lbs), ideal for space- or weight-constrained sites[cite: 5, 8]", "B) A 45-foot shipping container truck[cite: 8]", "C) A software-only license for EC2 instances", "D) A rack-mounted 42U server cabinet"], "answer": "A", "exp": "Snowcone is the smallest Snow Family device, designed for extreme portability in austere or disconnected environments with limited power[cite: 5, 8]."}, {"id": 43, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowcone", "subtopic": "Online vs Offline Transfer", "type": "multi", "q": "Which TWO transfer methods are supported by AWS Snowcone to move data to AWS? (Select 2)", "options": ["A) Offline shipping by locking the device and returning it via courier[cite: 5, 8]", "B) Online network transfer using the pre-installed AWS DataSync Agent[cite: 5, 8]", "C) Manual copying over unencrypted telnet connections", "D) Direct audio frequency modulation over phone lines"], "answer": ["A", "B"], "exp": "Snowcone uniquely supports both physical shipping and online automated data synchronization using its integrated DataSync agent[cite: 5, 8]."}, {"id": 44, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snow Family", "subtopic": "Capacity Selection Matrix", "type": "single", "q": "Which Snow Family device should be selected to transfer 500 Terabytes (TB) of historical data offline where network bandwidth is nonexistent?", "options": ["A) Multiple AWS Snowball Edge Storage Optimized devices[cite: 8]", "B) A single AWS Snowcone device", "C) AWS Snowmobile", "D) Amazon Kinesis Data Firehose"], "answer": "A", "exp": "Snowball Edge Storage Optimized (80 TB per device) is the standard choice for multi-terabyte to petabyte offline migrations[cite: 8]."}, {"id": 45, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Elastic Disaster Recovery (AWS DRS)", "subtopic": "What It Is & Block-Level Replication", "type": "single", "q": "How does AWS Elastic Disaster Recovery (AWS DRS) minimize Recovery Point Objectives (RPO) and Recovery Time Objectives (RTO)?", "options": ["A) Continuously replicates on-premises server volumes at the block level to low-cost EBS storage in AWS, launching recovery instances in minutes[cite: 3, 6]", "B) Takes cold database snapshots once every 30 days", "C) Migrates physical hard drives via delivery trucks weekly", "D) Converts relational tables into static HTML documentation"], "answer": "A", "exp": "AWS DRS maintains continuous block replication to staging EBS volumes, enabling sub-second RPO and rapid multi-AZ server launches[cite: 3, 6]."}, {"id": 46, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Elastic Disaster Recovery (AWS DRS)", "subtopic": "Failback Operations", "type": "single", "q": "What term describes the process of returning production workloads back to the primary on-premises data center after a disaster recovery event in AWS DRS?", "options": ["A) Failback[cite: 6]", "B) Failover[cite: 6]", "C) Re-hosting", "D) Cold Restore"], "answer": "A", "exp": "Failback is the reverse process of replicating modified data back to the primary site and resuming on-premises operations after a disaster[cite: 6]."}, {"id": 47, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Mainframe Modernization", "subtopic": "Core Capability & Migration", "type": "single", "q": "What capability does AWS Mainframe Modernization provide to enterprises migrating legacy mainframe workloads?", "options": ["A) Provides managed runtime environments and tools to refactor (e.g., to Java) or replatform (e.g., emulate) mainframe applications to AWS[cite: 3]", "B) Disassembles physical mainframe cabinets into scrap metal", "C) Emulates 5G cellular towers in local VPC subnets", "D) Stores COBOL files exclusively on magnetic cassette tapes"], "answer": "A", "exp": "AWS Mainframe Modernization supports modernizing mainframe systems via automated refactoring or replatforming runtimes[cite: 3]."}, {"id": 48, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Migration Hub", "subtopic": "Centralized Dashboard", "type": "single", "q": "What is the primary role of AWS Migration Hub?", "options": ["A) A central dashboard to track the progress of application discoveries, server migrations, and database migrations across multiple AWS tools[cite: 3, 8]", "B) A network router that aggregates Direct Connect lines", "C) A managed relational database engine replacing MySQL", "D) A hardware security module managing encryption keys"], "answer": "A", "exp": "AWS Migration Hub acts as the single pane of glass to track and visualize migration progress across AWS discovery, server, and database tools[cite: 3, 8]."}, {"id": 49, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Migration Evaluator", "subtopic": "TCO Analysis", "type": "single", "q": "What insight does AWS Migration Evaluator (formerly TSO Logic) deliver to organizations planning a migration?", "options": ["A) Generates a data-driven Total Cost of Ownership (TCO) business case and financial comparison of on-prem vs. AWS costs[cite: 3, 8]", "B) Recompiles legacy source code into Python", "C) Automates live database cutovers", "D) Generates SSL certificates"], "answer": "A", "exp": "Migration Evaluator analyzes discovered on-premises compute and storage utilization to build an optimized business case and TCO projection[cite: 3, 8]."}, {"id": 50, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "Homogeneous Migration Examples", "type": "single", "q": "Which scenario is classified as a Homogeneous Database Migration in AWS DMS?", "options": ["A) Migrating an on-premises Microsoft SQL Server database to Amazon RDS for SQL Server[cite: 8]", "B) Migrating an on-premises Oracle database to Amazon Aurora PostgreSQL[cite: 8]", "C) Migrating MongoDB documents to Amazon Redshift[cite: 8]", "D) Migrating Cassandra tables to Amazon DynamoDB[cite: 8]"], "answer": "A", "exp": "Homogeneous migrations involve identical source and target database engines, requiring no schema conversion tools like AWS SCT[cite: 8]."}, {"id": 51, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DataSync", "subtopic": "Task Scheduling", "type": "single", "q": "How can AWS DataSync tasks be configured to automate periodic incremental data synchronization without manual intervention?", "options": ["A) Using the built-in DataSync task scheduler with cron-based expressions[cite: 8]", "B) Sending an email to AWS Support daily", "C) Logging into the AWS Management Console to click start every morning", "D) Powering down the local storage server"], "answer": "A", "exp": "DataSync includes a native task scheduler supporting hourly, daily, or custom cron schedules to run automated incremental transfers[cite: 8]."}, {"id": 52, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Transfer Family", "subtopic": "AS2 Protocol Support", "type": "single", "q": "Which protocol supported by AWS Transfer Family is specifically used for secure, reliable Business-to-Business (B2B) electronic data interchange (EDI)?", "options": ["A) AS2 (Applicability Statement 2)", "B) Telnet", "C) TFTP", "D) SNMP"], "answer": "A", "exp": "AWS Transfer Family supports AS2, enabling compliant B2B electronic data exchange (EDI) pipelines directly into Amazon S3."}, {"id": 53, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Application Migration Service (MGN)", "subtopic": "Post-Launch Actions", "type": "single", "q": "What feature in AWS MGN allows automated installation of security software or disaster recovery agents on newly launched cutover EC2 instances?", "options": ["A) Post-launch actions (integrated with AWS Systems Manager)[cite: 8]", "B) Route 53 DNS failover routing", "C) Elastic Load Balancing cross-zone policies", "D) VPC peering configurations"], "answer": "A", "exp": "MGN supports automated post-launch actions via Systems Manager to install agents, apply patches, or execute scripts on cutover servers[cite: 8]."}, {"id": 54, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS Snowball Edge", "subtopic": "NFS Mount Interface", "type": "single", "q": "How can on-premises administrative workstations quickly copy files onto an AWS Snowball Edge device without custom coding?", "options": ["A) Mount the Snowball Edge device locally as an NFS file share or use the S3 adapter interface[cite: 8]", "B) Email files to the device's IP address", "C) Flash the files to a USB drive and plug it into an AWS router", "D) Upload files through the AWS Billing Dashboard"], "answer": "A", "exp": "Snowball Edge provides an integrated NFS interface and an S3-compatible endpoint allowing standard file copying or S3 CLI commands[cite: 8]."}, {"id": 55, "section": "12. MIGRATION AND TRANSFER", "topic": "AWS DMS", "subtopic": "Data Transformation Rules", "type": "single", "q": "Which feature of AWS DMS allows renaming columns, modifying data types, or adding prefixes to table names during active migration?", "options": ["A) Transformation Rules configured inside the DMS task JSON definition[cite: 8]", "B) Route 53 DNS records", "C) Security Group egress rules", "D) CloudWatch metric alarms"], "answer": "A", "exp": "DMS mapping and transformation rules allow column renaming, schema filtering, and data type casting on the fly during replication[cite: 8]."}], "quiz12": [{"id": 1, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Elastic Transcoder as described in the handbook?", "options": ["A) Fully managed media transcoding service in the cloud[cite: 8]", "B) Converts media files from source formats into versions playable on smartphones, tablets, and web browsers[cite: 8]", "C) Requires users to manually provision, patch, and manage physical media encoder hardware racks[cite: 8]", "D) Automatically scales compute capacity based on the volume of transcoding workloads[cite: 8]"], "answer": "C", "exp": "AWS Elastic Transcoder is a fully managed cloud service that handles all infrastructure provisioning, scaling, and operational management automatically[cite: 8]."}, {"id": 2, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Key Features & Formats", "type": "multi", "q": "Which TWO media codecs or output container formats are supported by AWS Elastic Transcoder? (Select 2)", "options": ["A) MP4 and H.264[cite: 8]", "B) AAC audio and WebM[cite: 8]", "C) Uncompressed legacy analog VHS tape signals", "D) Raw BIOS firmware binary files"], "answer": ["A", "B"], "exp": "Elastic Transcoder natively supports popular video and audio formats including MP4, H.264, AAC, WebM, and MPEG-2[cite: 8]."}, {"id": 3, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "How It Works & S3 Integration", "type": "single", "q": "Where does AWS Elastic Transcoder source its input media files and store its transcoded output files?", "options": ["A) Amazon S3 buckets[cite: 8]", "B) Local EC2 instance store volumes exclusively", "C) On-premises tape drives via iSCSI", "D) DynamoDB item attributes"], "answer": "A", "exp": "Elastic Transcoder reads source media from an input S3 bucket and outputs converted media files directly into a designated target S3 bucket[cite: 8]."}, {"id": 4, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Pipelines", "type": "single", "q": "What is a Pipeline in AWS Elastic Transcoder?", "options": ["A) A processing queue that manages transcoding workflows, connecting input buckets, output buckets, and notification configurations[cite: 8]", "B) A physical fiber optic cable run between AWS data centers", "C) A CI/CD deployment script managed by AWS CodePipeline", "D) A VPC peering link connecting two subnets"], "answer": "A", "exp": "Pipelines manage the transcoding queue, connecting input and output S3 buckets and specifying Amazon SNS notification settings[cite: 8]."}, {"id": 5, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Jobs & Outputs", "type": "multi", "q": "Which TWO capabilities are supported when defining a Job in AWS Elastic Transcoder? (Select 2)", "options": ["A) Creating multiple outputs (e.g., varying resolutions or bitrates) from a single input file[cite: 8]", "B) Generating thumbnail preview images and incorporating sidecar captions (e.g., WebVTT)[cite: 8]", "C) Executing custom SQL SELECT queries across video frames", "D) Automatically terminating inactive Amazon Aurora database instances"], "answer": ["A", "B"], "exp": "A single transcoding job can generate multiple output renditions (e.g., SD, HD, mobile) and create thumbnails and caption tracks[cite: 8]."}, {"id": 6, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Presets", "type": "single", "q": "What is the primary function of a Preset in AWS Elastic Transcoder?", "options": ["A) Defines reusable conversion settings such as codec, resolution, bitrate, and aspect ratio for target devices[cite: 8]", "B) Pre-warms EC2 instance clusters ahead of traffic surges", "C) Configures IAM permission boundaries across member accounts", "D) Automatically purchases Reserved Instances"], "answer": "A", "exp": "Presets provide standard templates (system-provided or custom) specifying codecs, bitrates, and resolutions for playback devices[cite:
