8]."}, {"id": 7, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Notifications & Automation", "type": "single", "q": "Which AWS service is used by Elastic Transcoder pipelines to send event updates (progress, completion, or failure) to trigger downstream processing?", "options": ["A) Amazon Simple Notification Service (Amazon SNS)[cite: 8]", "B) AWS Direct Connect", "C) AWS CloudTrail Lake", "D) AWS Storage Gateway"], "answer": "A", "exp": "Elastic Transcoder sends job progress and completion events to Amazon SNS topics, which can invoke Lambda for post-processing[cite: 8]."}, {"id": 8, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Security & Encryption", "type": "multi", "q": "Which TWO security controls protect media assets processed by AWS Elastic Transcoder? (Select 2)", "options": ["A) Encryption of media at rest using AWS KMS customer-managed or AWS-managed keys[cite: 8]", "B) IAM service roles granting least-privilege read and write access to S3 buckets[cite: 8]", "C) Compulsory public read permissions on all output files", "D) Storing IAM secret access keys inside video metadata tags"], "answer": ["A", "B"], "exp": "Elastic Transcoder enforces security via IAM service roles for S3 access and integrates with AWS KMS for encrypting media at rest[cite: 8]."}, {"id": 9, "section": "11. MEDIA SERVICES", "topic": "Amazon Elastic Transcoder", "subtopic": "Exam Tips", "type": "single", "q": "What is the key takeaway for AWS Elastic Transcoder on the SAA-C03 exam?", "options": ["A) Fully managed, cost-effective media transcoding from S3 to S3 using pipelines and presets for multi-device playback[cite: 8]", "B) Real-time streaming data ingestion for millions of IoT sensor records", "C) Deploying managed Docker containers on bare-metal hardware", "D) Establishing low-latency hybrid IPsec VPN tunnels"], "answer": "A", "exp": "Elastic Transcoder is tested as the managed, serverless utility for converting video and audio files in S3 for playback on various devices[cite: 8]."}], "quiz13": [{"id": 1, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "What It Is & Global Network", "type": "single", "q": "Which of the following is NOT an accurate characteristic of Amazon CloudFront?", "options": ["A) Global Content Delivery Network (CDN) that delivers static and dynamic content with low latency[cite: 8]", "B) Uses a worldwide network of edge locations to cache content close to end users[cite: 8]", "C) A physical router deployed inside a customer on-premises wiring closet[cite: 8]", "D) Delivers videos, applications, images, and APIs securely[cite: 8]"], "answer": "C", "exp": "Amazon CloudFront is a globally distributed cloud CDN service, not an on-premises physical router[cite: 8]."}, {"id": 2, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Edge Locations vs Regional Edge Caches", "type": "single", "q": "What is the primary role of Regional Edge Caches in Amazon CloudFront?", "options": ["A) Acts as an intermediate caching layer between origin servers and edge locations to cache larger or less-frequently requested objects[cite: 8]", "B) Permanently archives audit log files in deep tape storage", "C) Manages private Route 53 DNS zone files across regions", "D) Decrypts physical SAN array hardware volumes"], "answer": "A", "exp": "Regional Edge Caches sit between origin servers and edge points of presence (PoPs) to absorb cache misses and reduce origin load[cite: 8]."}, {"id": 3, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Origins", "type": "multi", "q": "Which TWO storage or compute endpoints can serve as valid origins for an Amazon CloudFront distribution? (Select 2)", "options": ["A) Amazon S3 buckets[cite: 8]", "B) Application Load Balancers (ALB) or EC2 instances[cite: 8]", "C) Amazon S3 Glacier Vaults directly via NFS", "D) Optical carrier transport frames"], "answer": ["A", "B"], "exp": "CloudFront supports Amazon S3 buckets, EC2 instances, Elastic Load Balancers, and custom HTTP/HTTPS web servers as origins[cite: 8]."}, {"id": 4, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Caching & TTL", "type": "single", "q": "Which HTTP response header sent from the origin server is primarily evaluated by CloudFront to determine how long an object remains cached?", "options": ["A) Cache-Control (or Expires)[cite: 8]", "B) X-Amz-Signature", "C) Content-Encoding", "D) Host"], "answer": "A", "exp": "CloudFront inspects Cache-Control and Expires headers from origin responses to govern object caching duration (TTL)[cite: 8]."}, {"id": 5, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Cache Invalidation", "type": "single", "q": "How can an administrator immediately remove stale files from CloudFront edge caches before their TTL expires?", "options": ["A) Create a CloudFront Invalidation specifying file paths or wildcard patterns[cite: 8]", "B) Delete the entire CloudFront distribution", "C) Reboot the origin EC2 instance", "D) Flush the VPC route table cache"], "answer": "A", "exp": "Cache invalidations force edge locations to purge cached files immediately, retrieving fresh copies on subsequent requests[cite: 8]."}, {"id": 6, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Origin Access Control (OAC)", "type": "single", "q": "What is the primary security benefit of configuring Origin Access Control (OAC) for Amazon S3 origins in CloudFront?", "options": ["A) Restricts S3 bucket access so users cannot bypass CloudFront to download files directly from S3[cite: 8]", "B) Enables anonymous public read access to all objects in the bucket", "C) Compresses image files into WebP format automatically", "D) Eliminates all data transfer out fees across the internet"], "answer": "A", "exp": "Origin Access Control (OAC) secures S3 buckets by authenticating requests from CloudFront via AWS SigV4, blocking direct public bucket downloads[cite: 8]."}, {"id": 7, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Signed URLs vs Signed Cookies", "type": "multi", "q": "Which TWO statements regarding CloudFront Signed URLs and Signed Cookies are accurate? (Select 2)", "options": ["A) Signed URLs are ideal for restricting access to individual files, such as a single video download[cite: 8]", "B) Signed Cookies are ideal for providing access to multiple restricted files or an entire subscriber section of a website[cite: 8]", "C) Signed URLs require configuring dedicated hardware VPN appliances", "D) Signed Cookies cannot be set with expiration dates"], "answer": ["A", "B"], "exp": "Signed URLs protect single discrete downloads, while Signed Cookies grant access to multiple files without altering URLs[cite: 8]."}, {"id": 8, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Field-Level Encryption", "type": "single", "q": "What capability does CloudFront Field-Level Encryption provide?", "options": ["A) Encrypts specific sensitive user-submitted form data (e.g., credit card numbers) at the edge using public keys before forwarding to the origin[cite: 8]", "B) Encrypts entire physical server motherboards in AWS edge facilities", "C) Encrypts S3 Glacier archive tape labels", "D) Replaces HTTPS certificates on load balancers"], "answer": "A", "exp": "Field-Level Encryption protects sensitive fields at edge locations so only specific private keys at the origin backend can decrypt them[cite: 8]."}, {"id": 9, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Geo Restriction", "type": "single", "q": "How does CloudFront Geo Restriction enforce geographic compliance?", "options": ["A) Allows or blocks access to content based on the viewer's geographic country location using an allowlist or blocklist[cite: 8]", "B) Physically shuts down edge locations during regional elections", "C) Reroutes traffic over satellite uplinks exclusively", "D) Translates web content into regional dialects automatically"], "answer": "A", "exp": "Geo Restriction allows whitelist or blacklist filtering of client requests based on the country where the request originates[cite: 8]."}, {"id": 10, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Edge Compute - Lambda@Edge vs CloudFront Functions", "type": "multi", "q": "Which TWO statements accurately contrast Lambda@Edge and CloudFront Functions? (Select 2)", "options": ["A) CloudFront Functions is lightweight, sub-millisecond, JavaScript-only, and optimized for high-scale simple request manipulations[cite: 8]", "B) Lambda@Edge supports Node.js and Python, network access, longer execution times, and complex integrations[cite: 8]", "C) CloudFront Functions can make external network API calls to third-party services", "D) Lambda@Edge can only execute in a single central AWS Region"], "answer": ["A", "B"], "exp": "CloudFront Functions executes lightweight header/URL rewrites with sub-millisecond latency; Lambda@Edge handles complex logic with external access[cite: 8]."}, {"id": 11, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Price Classes", "type": "single", "q": "Which CloudFront Price Class is the most cost-effective, limiting edge delivery exclusively to locations in North America, Europe, and Canada?", "options": ["A) Price Class 100[cite: 8]", "B) Price Class 200[cite: 8]", "C) Price Class All[cite: 8]", "D) Price Class Zero"], "answer": "A", "exp": "Price Class 100 includes only the lowest-cost edge locations (US, Canada, Europe) to minimize CDN delivery costs[cite: 8]."}, {"id": 12, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "Origin Groups & Failover", "type": "single", "q": "What is the primary role of CloudFront Origin Groups?", "options": ["A) Provides automated origin failover for high availability by routing traffic to a secondary origin when the primary returns HTTP 5xx errors[cite: 8]", "B) Merges multiple S3 buckets into a single physical partition", "C) Balances database queries across read replicas", "D) Encrypts EBS snapshots using multi-region keys"], "answer": "A", "exp": "Origin Groups define primary and secondary origins, automatically failing over to the backup origin if the primary encounters errors[cite: 8]."}, {"id": 13, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon CloudFront", "subtopic": "SSL/TLS & Custom Domains", "type": "single", "q": "In which AWS Region must an SSL/TLS certificate be provisioned in AWS Certificate Manager (ACM) to associate it with an Amazon CloudFront distribution?", "options": ["A) us-east-1 (N. Virginia)[cite: 8]", "B) The same region where the S3 origin bucket resides", "C) Any regional endpoint worldwide", "D) Certificate Manager does not support CloudFront"], "answer": "A", "exp": "To use a custom SSL/TLS certificate with a global CloudFront distribution, the certificate must be requested in the us-east-1 (N. Virginia) region[cite: 8]."}, {"id": 14, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Direct Connect as described in the handbook?", "options": ["A) Establishes a dedicated, private network connection from on-premises to AWS[cite: 8]", "B) Bypasses the public internet to deliver consistent performance and lower latency[cite: 8]", "C) Automatically encrypts all network traffic by default without configuration", "D) Provides port speeds ranging from 50 Mbps up to 100 Gbps[cite: 8]"], "answer": "C", "exp": "Direct Connect is a dedicated private connection, but traffic is unencrypted by default unless MACsec or an IPsec VPN is layered on top[cite: 7, 8]."}, {"id": 15, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Connection Types", "type": "multi", "q": "Which TWO connection types are supported by AWS Direct Connect? (Select 2)", "options": ["A) Dedicated Connections (physical Ethernet port allocated exclusively to a single customer at 1, 10, or 100 Gbps)[cite: 8]", "B) Hosted Connections (sub-1G to 10 Gbps capacity provisioned by an APN Direct Connect Partner)[cite: 8]", "C) Ephemeral Dial-Up Connections", "D) Satellite Laser Mesh Connections"], "answer": ["A", "B"], "exp": "Direct Connect supports Dedicated Connections (1/10/100 Gbps dedicated physical ports) and Hosted Connections (provisioned via AWS Partners)[cite: 8]."}, {"id": 16, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Virtual Interfaces (VIFs) - Private vs Public", "type": "single", "q": "Which Virtual Interface (VIF) type is used to connect an on-premises network directly to public AWS service endpoints (such as Amazon S3 or DynamoDB) using public IPs?", "options": ["A) Public VIF[cite: 8]", "B) Private VIF[cite: 8]", "C) Transit VIF[cite: 8]", "D) Local VIF[cite: 8]"], "answer": "A", "exp": "A Public VIF enables access to public AWS endpoints (S3, DynamoDB) without traversing the public internet, using public IP address ranges[cite: 8]."}, {"id": 17, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Transit VIF", "type": "single", "q": "Which Virtual Interface (VIF) is specifically required to connect a Direct Connect connection to an AWS Transit Gateway?", "options": ["A) Transit VIF[cite: 8]", "B) Public VIF[cite: 8]", "C) Private VIF[cite: 8]", "D) Elastic VIF"], "answer": "A", "exp": "A Transit VIF is specifically designed to connect Direct Connect to an AWS Transit Gateway for scalable multi-VPC hub-and-spoke routing[cite: 8]."}, {"id": 18, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Direct Connect Gateway", "type": "single", "q": "What is the primary architectural capability of an AWS Direct Connect Gateway?", "options": ["A) Allows connecting a single Direct Connect connection to multiple VPCs across different AWS Regions (globally)[cite: 8]", "B) Converts optical network frames into radio signals", "C) Automatically rotates IAM access keys", "D) Caches web images at global edge locations"], "answer": "A", "exp": "A Direct Connect Gateway links a Direct Connect connection with Virtual Private Gateways or Transit Gateways across any global AWS Region[cite: 8]."}, {"id": 19, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Link Aggregation Groups (LAG)", "type": "multi", "q": "Which TWO rules apply to Link Aggregation Groups (LAG) in AWS Direct Connect? (Select 2)", "options": ["A) Combines multiple dedicated connections of the same speed into a single logical managed interface[cite: 8]", "B) Supports up to 4 connections per LAG on dedicated endpoints[cite: 8]", "C) Allows mixing 1 Gbps and 100 Gbps links inside the same group", "D) Operates across multiple disparate colocation facilities simultaneously"], "answer": ["A", "B"], "exp": "LAG combines up to 4 dedicated connections of identical speed terminating at the same Direct Connect endpoint to increase aggregate bandwidth[cite: 8]."}, {"id": 20, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Resiliency & Redundancy Models", "type": "multi", "q": "Which TWO configurations achieve maximum resiliency and fault tolerance for hybrid connectivity? (Select 2)", "options": ["A) Deploying two Direct Connect connections terminating at separate Direct Connect locations[cite: 7]", "B) Using an IPsec Site-to-Site VPN as a backup to an active Direct Connect connection[cite: 7, 8]", "C) Deploying a single connection with no secondary path", "D) Relying on an unencrypted public internet connection without VPN"], "answer": ["A", "B"], "exp": "High resiliency requires redundant connections across diverse facilities, or deploying an IPsec VPN as an automated backup to Direct Connect[cite: 7, 8]."}, {"id": 21, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Security & MACsec", "type": "single", "q": "Which Layer 2 encryption standard is supported on dedicated 10 Gbps and 100 Gbps Direct Connect ports to encrypt data between customer routers and AWS?", "options": ["A) MACsec (IEEE 802.1AE)[cite: 8]", "B) WPA3 Enterprise", "C) SSL v3.0", "D) Telnet Auth"], "answer": "A", "exp": "MACsec provides point-to-point Layer 2 hardware encryption on supported dedicated 10G and 100G Direct Connect ports[cite: 8]."}, {"id": 22, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Direct Connect", "subtopic": "Exam Tips", "type": "single", "q": "When is AWS Direct Connect the definitive answer on the SAA-C03 exam?", "options": ["A) When an enterprise requires high bandwidth (1-100 Gbps), ultra-consistent network throughput, reduced data egress costs, and private connectivity bypassing the internet[cite: 8]", "B) When establishing a temporary connection for a 1-day proof of concept", "C) When streaming push notifications to mobile devices", "D) When hosting serverless single-page web applications"], "answer": "A", "exp": "Direct Connect is the exam choice for enterprise-grade, high-throughput, non-variable private connectivity bypassing the public internet[cite: 8]."}, {"id": 23, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "What It Is & Types", "type": "single", "q": "Which of the following is NOT one of the current major types of Elastic Load Balancers?", "options": ["A) Application Load Balancer (ALB)[cite: 8]", "B) Network Load Balancer (NLB)[cite: 8]", "C) Gateway Load Balancer (GWLB)[cite: 8]", "D) Optical Fiber Carrier Load Balancer"], "answer": "D", "exp": "ELB offers Application Load Balancers (Layer 7), Network Load Balancers (Layer 4), Gateway Load Balancers (Layer 3), and legacy CLBs[cite: 8]."}, {"id": 24, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Application Load Balancer (ALB) - Layer 7", "type": "multi", "q": "Which TWO routing and application capabilities are supported by the Application Load Balancer? (Select 2)", "options": ["A) Advanced request routing based on host headers, URL paths, HTTP methods, and query strings[cite: 8]", "B) Direct routing to AWS Lambda functions as targets[cite: 8]", "C) Ultra-low latency TCP/UDP pass-through at Layer 4", "D) Terminating physical telecom carrier lines"], "answer": ["A", "B"], "exp": "ALB operates at Layer 7, providing path/host routing, redirects, and supports EC2, ECS, IP addresses, and Lambda functions as targets[cite: 8]."}, {"id": 25, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Network Load Balancer (NLB) - Layer 4", "type": "single", "q": "What is the primary architectural feature of the Network Load Balancer (NLB)?", "options": ["A) Operates at Layer 4 (TCP/UDP/TLS), capable of handling millions of requests per second with ultra-low latency and static/Elastic IP support[cite: 8]", "B) Advanced HTTP header and cookie parsing", "C) In-memory query caching for DynamoDB", "D) Automatic conversion of video files into MP4"], "answer": "A", "exp": "NLB operates at Layer 4 for high-throughput, low-latency TCP/UDP traffic and provides a static IP per Availability Zone[cite: 8]."}, {"id": 26, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Gateway Load Balancer (GWLB) - Layer 3", "type": "single", "q": "What is the primary use case for an AWS Gateway Load Balancer (GWLB)?", "options": ["A) Deploying, scaling, and managing third-party virtual network security appliances (firewalls, IDS/IPS) transparently using the GENEVE protocol[cite: 8]", "B) Terminating HTTPS traffic for serverless React websites", "C) Caching static CSS files at edge locations", "D) Resolving private VPC DNS records"], "answer": "A", "exp": "GWLB operates at Layer 3/4 to transparently route network traffic to pools of third-party security appliances via GENEVE encapsulation[cite: 1, 8]."}, {"id": 27, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Cross-Zone Load Balancing", "type": "multi", "q": "Which TWO statements regarding Cross-Zone Load Balancing are accurate? (Select 2)", "options": ["A) Distributes traffic evenly across all registered targets in all enabled Availability Zones[cite: 8]", "B) Enabled by default on Application Load Balancers (ALBs)[cite: 8]", "C) Cannot be enabled on Network Load Balancers under any circumstances", "D) Prevents traffic from crossing subnet boundaries"], "answer": ["A", "B"], "exp": "Cross-zone load balancing distributes traffic evenly across instances regardless of AZ, and is enabled by default on ALBs[cite: 1, 8]."}, {"id": 28, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Sticky Sessions (Session Affinity)", "type": "single", "q": "What is the primary function of Sticky Sessions on an Application Load Balancer?", "options": ["A) Binds a user's session to a specific target instance using HTTP cookies so subsequent requests reach the same backend[cite: 8]", "B) Permanently locks EC2 instance configurations against deletion", "C) Caches database queries in memory", "D) Keeps SSL certificates active after expiration"], "answer": "A", "exp": "Sticky sessions use cookies to ensure that all requests from a client during a session are directed to the same target instance[cite: 4, 8]."}, {"id": 29, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "SSL/TLS Offloading", "type": "single", "q": "How does SSL/TLS Termination at the load balancer benefit backend application instances?", "options": ["A) Offloads CPU-intensive decryption and handshake processing from backend instances, simplifying certificate management[cite: 1, 8]", "B) Disables network encryption completely across all subnets", "C) Automatically purchases public domain names", "D) Encrypts local desktop hard drives"], "answer": "A", "exp": "SSL termination at the ALB/NLB offloads cryptographic overhead from backend instances, consolidating certificates in ACM[cite: 1, 8]."}, {"id": 30, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Security - Security Groups & WAF", "type": "multi", "q": "Which TWO security controls apply to Application Load Balancers? (Select 2)", "options": ["A) Associating Security Groups to filter inbound traffic by IP, port, and protocol[cite: 8]", "B) Attaching AWS WAF web ACLs to protect against Layer 7 application vulnerabilities[cite: 8]", "C) Disabling all IAM logging across the VPC", "D) Enforcing mandatory unencrypted HTTP transmission"], "answer": ["A", "B"], "exp": "ALBs support stateful Security Groups and direct integration with AWS WAF to inspect and protect web traffic[cite: 8]."}, {"id": 31, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Connection Draining (Deregistration Delay)", "type": "single", "q": "What capability does Deregistration Delay (Connection Draining) provide when an instance is removed or becomes unhealthy?", "options": ["A) Keeps existing in-flight connections open until requests finish processing (up to a timeout) while stopping new connections[cite: 1, 8]", "B) Instantly drops all active TCP connections without warning", "C) Reboots the instance immediately", "D) Migrates the instance to another AWS account"], "answer": "A", "exp": "Deregistration delay allows active, in-flight requests to complete gracefully before the target is deregistered or terminated[cite: 1, 8]."}, {"id": 32, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Elastic Load Balancing (ELB)", "subtopic": "Exam Tips", "type": "single", "q": "When is an Application Load Balancer (ALB) preferred over a Network Load Balancer (NLB) on the exam?", "options": ["A) When the workload requires path-based routing, host-based routing, HTTP/2, WebSocket, and integration with AWS WAF[cite: 8]", "B) When the architecture requires static Elastic IP addresses and millions of requests per second with ultra-low latency[cite: 8]", "C) When routing raw UDP gaming traffic", "D) When deploying virtual security firewalls at Layer 3[cite: 8]"], "answer": "A", "exp": "ALB is the exam choice for HTTP/HTTPS Layer 7 intelligent routing, URL redirects, and WAF integration[cite: 8]."}, {"id": 33, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT true regarding AWS Global Accelerator?", "options": ["A) Networking service that improves availability and performance for global users[cite: 8]", "B) Routes traffic over the AWS global private fiber backbone rather than the public internet[cite: 8]", "C) A Content Delivery Network that caches video and HTML files at edge servers[cite: 8]", "D) Provides two static anycast IP addresses as fixed entry points[cite: 8]"], "answer": "C", "exp": "AWS Global Accelerator does NOT cache content; it is a Layer 4 traffic optimization service, unlike CloudFront which caches content[cite: 8]."}, {"id": 34, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Static Anycast IP Addresses", "type": "single", "q": "What is the primary operational benefit of the two static anycast IP addresses provided by AWS Global Accelerator?", "options": ["A) They provide fixed entry points that simplify client DNS whitelisting and do not change during backend endpoint failovers[cite: 8]", "B) They eliminate all monthly AWS billing charges", "C) They allow servers to bypass VPC Security Groups", "D) They provide direct access to AWS data center physical hardware"], "answer": "A", "exp": "Global Accelerator provides two static anycast IPs that route through edge locations without requiring DNS record propagation during failovers[cite: 8]."}, {"id": 35, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Components", "type": "multi", "q": "Which TWO components are defined when configuring AWS Global Accelerator? (Select 2)", "options": ["A) Listeners (defining inbound ports and protocols like TCP or UDP)[cite: 8]", "B) Endpoint Groups (regional collections of endpoints with configurable traffic dials)[cite: 8]", "C) Cache Invalidation Paths", "D) Optical Fiber Splices"], "answer": ["A", "B"], "exp": "Global Accelerator components include Accelerators, Listeners, Endpoint Groups (regional), and Endpoints (ALB, NLB, EC2, EIP)[cite: 8]."}, {"id": 36, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Supported Endpoints", "type": "multi", "q": "Which TWO AWS resources can serve directly as endpoints inside a Global Accelerator endpoint group? (Select 2)", "options": ["A) Application Load Balancers (ALB)[cite: 8]", "B) Network Load Balancers (NLB) or EC2 instances[cite: 8]", "C) S3 Glacier Vaults", "D) CloudTrail Lake Data Stores"], "answer": ["A", "B"], "exp": "Endpoints can be Application Load Balancers, Network Load Balancers, EC2 instances, or Elastic IP addresses[cite: 8]."}, {"id": 37, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Traffic Dial & Weighting", "type": "single", "q": "What capability does the Traffic Dial feature provide in AWS Global Accelerator?", "options": ["A) Adjusts the percentage of traffic directed to a specific regional endpoint group for blue/green testing or gradual traffic shifting[cite: 8]", "B) Measures the audio sound level inside server rooms", "C) Regulates power consumption on host instances", "D) Adjusts the volume of CloudWatch alarms"], "answer": "A", "exp": "The Traffic Dial controls the proportion of traffic routed to a specific region (from 0% to 100%), ideal for testing and regional migrations[cite: 8]."}, {"id": 38, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Health Checks & Automatic Failover", "type": "single", "q": "How does AWS Global Accelerator handle an unexpected failure in a regional endpoint group?", "options": ["A) Detects unhealthy endpoints via continuous health checks and automatically reroutes traffic to healthy endpoints in other regions in seconds[cite: 8]", "B) Waits 24 hours for DNS TTL expiration before taking action", "C) Returns an unformatted HTTP 404 error to all clients", "D) Terminates the customer's AWS account"], "answer": "A", "exp": "Global Accelerator monitors endpoint health continuously, rerouting traffic across regions instantly without waiting for DNS cache timeouts[cite: 8]."}, {"id": 39, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Global Accelerator vs CloudFront", "type": "multi", "q": "Which TWO statements correctly contrast AWS Global Accelerator with Amazon CloudFront? (Select 2)", "options": ["A) Global Accelerator routes both TCP and UDP traffic at Layer 4; CloudFront is optimized for HTTP/HTTPS content delivery at Layer 7[cite: 8]", "B) CloudFront caches web content at edge locations; Global Accelerator does not cache data[cite: 8]", "C) Global Accelerator only supports static HTML web pages", "D) CloudFront provides two static anycast IP addresses for client whitelisting"], "answer": ["A", "B"], "exp": "CloudFront caches HTTP/HTTPS content; Global Accelerator optimizes Layer 4 network routing for non-HTTP or dynamic TCP/UDP traffic with static IPs[cite: 8]."}, {"id": 40, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Global Accelerator", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario is the standard indicator to choose AWS Global Accelerator on the exam?", "options": ["A) Non-HTTP/HTTPS workloads (like gaming or VoIP), requiring static anycast IP addresses for firewall whitelisting and instant multi-region failover[cite: 8]", "B) Caching static CSS, JavaScript, and video assets to reduce origin bandwidth costs[cite: 8]", "C) Running batch Spark analytics across terabytes of log files[cite: 8]", "D) Automating relational database schema conversions[cite: 8]"], "answer": "A", "exp": "Global Accelerator is tested when applications need static anycast IPs, TCP/UDP support, and fast regional failover without DNS caching delays[cite: 8]."}, {"id": 41, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "What It Is & Core Features", "type": "single", "q": "Which of the following is NOT true regarding Amazon Route 53 as described in the handbook?", "options": ["A) Highly available and scalable Domain Name System (DNS) web service[cite: 8]", "B) Supports domain name registration and management[cite: 8]", "C) Designed for a 100% availability SLA[cite: 8]", "D) A physical firewall hardware appliance that inspects application layer cookies"], "answer": "D", "exp": "Amazon Route 53 is a cloud DNS and domain registration service designed for 100% availability, not a hardware firewall appliance[cite: 8]."}, {"id": 42, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Routing Policies - Simple vs Weighted", "type": "multi", "q": "Which TWO statements regarding Route 53 Simple and Weighted routing policies are accurate? (Select 2)", "options": ["A) Simple routing provides basic DNS resolution, returning one or more values for a single record with no health checks[cite: 8]", "B) Weighted routing splits traffic across multiple resources in proportion to assigned weights, ideal for A/B testing[cite: 6, 8]", "C) Simple routing automatically fails over to backup regions upon endpoint outage[cite: 6]", "D) Weighted routing converts IPv4 addresses into IPv6 format"], "answer": ["A", "B"], "exp": "Simple routing is straightforward DNS resolution without health checks; Weighted routing distributes traffic proportionally based on assigned weights[cite: 6, 8]."}, {"id": 43, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Routing Policies - Latency-Based Routing", "type": "single", "q": "How does Route 53 Latency-Based Routing optimize application performance for global users?", "options": ["A) Directs user requests to the AWS Region that provides the lowest network latency for that specific user[cite: 8]", "B) Compresses network packets to 10% of their original size", "C) Caches database queries inside the DNS resolver", "D) Automatically terminates high-latency EC2 instances"], "answer": "A", "exp": "Latency-based routing uses global network latency measurements to route users to the lowest-latency AWS Region[cite: 6, 8]."}, {"id": 44, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Routing Policies - Failover Routing", "type": "single", "q": "Which routing policy is designed specifically for active-passive disaster recovery, automatically routing traffic to a secondary standby endpoint when the primary fails health checks?", "options": ["A) Failover Routing Policy[cite: 6, 8]", "B) Simple Routing Policy[cite: 6, 8]", "C) Multivalue Answer Routing Policy[cite: 8]", "D) Geolocation Routing Policy[cite: 6, 8]"], "answer": "A", "exp": "Failover routing configures active-passive architectures, routing traffic to a secondary standby endpoint when primary health checks fail[cite: 6, 8]."}, {"id": 45, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Geolocation vs Geoproximity Routing", "type": "multi", "q": "Which TWO statements describe the distinction between Geolocation and Geoproximity routing in Route 53? (Select 2)", "options": ["A) Geolocation routing routes traffic based on the geographic location (continent, country, state) of the user[cite: 6, 8]", "B) Geoproximity routing routes traffic based on physical distance to resources and allows shifting traffic using routing biases[cite: 8]", "C) Geolocation routing requires deploying GPS hardware receivers on client devices", "D) Geoproximity routing is only supported for on-premises tape libraries"], "answer": ["A", "B"], "exp": "Geolocation routes by geographic boundaries (e.g., country); Geoproximity routes based on physical distance and bias values using Route 53 Traffic Flow[cite: 6, 8]."}, {"id": 46, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Multivalue Answer Routing", "type": "single", "q": "What is the primary benefit of Route 53 Multivalue Answer Routing over Simple Routing with multiple IP addresses?", "options": ["A) Checks the health of each endpoint and returns up to eight healthy records randomly, providing basic DNS-level load balancing and availability[cite: 8]", "B) Formats SQL queries into JSON documents", "C) Guarantees sub-second in-memory caching", "D) Automatically creates IAM user roles"], "answer": "A", "exp": "Multivalue Answer routing performs health checks on resources, returning multiple healthy IP records to improve availability[cite: 8]."}, {"id": 47, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Alias Records", "type": "multi", "q": "Which TWO statements regarding Route 53 Alias Records are true? (Select 2)", "options": ["A) Route 53 specific record type that maps a domain name directly to AWS resources (ALB, CloudFront, S3 static sites) without incurring DNS query charges[cite: 8]", "B) Can be created for the apex (naked/root) domain (e.g., example.com), whereas standard CNAME records cannot[cite: 8]", "C) Only supports mapping to on-premises physical file servers", "D) Incurs double the standard DNS query fee"], "answer": ["A", "B"], "exp": "Alias records can point to the zone apex, automatically recognize IP changes of AWS resources, and queries to AWS endpoints are free[cite: 8]."}, {"id": 48, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Health Checks & CloudWatch Integration", "type": "single", "q": "What types of health checks can Amazon Route 53 execute to determine resource health?", "options": ["A) Endpoint checks (HTTP, HTTPS, TCP), calculated health checks, and checks that monitor CloudWatch alarms[cite: 8]", "B) Physical memory chip diagnostics only", "C) Inspection of local user desktop operating system registries", "D) Audio decibel monitoring in data centers"], "answer": "A", "exp": "Route 53 monitors endpoint connectivity (HTTP/HTTPS/TCP), aggregates other health checks, and monitors CloudWatch alarm states[cite: 8]."}, {"id": 49, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Private Hosted Zones", "type": "single", "q": "What is an Amazon Route 53 Private Hosted Zone?", "options": ["A) A container that holds DNS records for domain names resolvable ONLY within one or more associated Amazon VPCs[cite: 7, 8]", "B) A public website accessible to any internet user", "C) A physical security cage inside an AWS facility", "D) A repository for storing unencrypted passwords"], "answer": "A", "exp": "Private hosted zones manage internal domain name resolution within private VPC networks without exposing records to the internet[cite: 7, 8]."}, {"id": 50, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "DNSSEC Support", "type": "single", "q": "What security protection does DNSSEC (Domain Name System Security Extensions) provide in Route 53?", "options": ["A) Provides cryptographic signing of DNS data to authenticate responses and protect against DNS spoofing or man-in-the-middle attacks[cite: 8]", "B) Encrypts EC2 root hard drives with KMS", "C) Shuts down web servers during DDoS attacks", "D) Bypasses IAM role checking"], "answer": "A", "exp": "DNSSEC signs DNS records cryptographically to ensure resolvers receive authentic, untampered DNS responses[cite: 8]."}, {"id": 51, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon Route 53", "subtopic": "Exam Tips", "type": "single", "q": "What should an architect use to point a naked/root domain (example.com) to an Application Load Balancer on the AWS exam?", "options": ["A) Route 53 Alias record[cite: 8]", "B) Standard CNAME record", "C) PTR record", "D) TXT record"], "answer": "A", "exp": "DNS standards prohibit CNAME records at the zone apex; Route 53 Alias records resolve this by mapping apex domains directly to AWS resources[cite: 8]."}, {"id": 52, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "What It Is & Central Hub", "type": "single", "q": "Which of the following is NOT true regarding AWS Transit Gateway as described in the handbook?", "options": ["A) Central network transit hub that connects multiple VPCs and on-premises networks together[cite: 8]", "B) Simplifies network topology by replacing complex many-to-many VPC peering meshes with a hub-and-spoke architecture[cite: 7, 8]", "C) Requires customers to manually cable optical cross-connects between AWS regions", "D) Supports transitive routing between attached networks[cite: 8]"], "answer": "C", "exp": "AWS Transit Gateway is a fully managed cloud networking service that eliminates physical cabling and full-mesh peering complexity[cite: 7, 8]."}, {"id": 53, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "Attachments", "type": "multi", "q": "Which TWO types of network connections can be attached directly to an AWS Transit Gateway? (Select 2)", "options": ["A) Amazon VPC Attachments[cite: 8]", "B) AWS Site-to-Site VPN and Direct Connect Gateway Attachments[cite: 8]", "C) Physical tape drive attachments via SCSI cables", "D) Client laptop Bluetooth attachments"], "answer": ["A", "B"], "exp": "Transit Gateway supports attachments for Amazon VPCs, Site-to-Site VPNs, Direct Connect Gateways, and inter-region Transit Gateway peerings[cite: 8]."}, {"id": 54, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "Routing & Segmentation", "type": "single", "q": "How does an architect enforce network segmentation (such as isolating Dev and Prod environments) using AWS Transit Gateway?", "options": ["A) Create multiple Transit Gateway Route Tables and associate specific VPC attachments with dedicated route tables[cite: 8]", "B) Delete all subnets in the VPC", "C) Route traffic over public unencrypted IP addresses", "D) Disable AWS CloudTrail logging"], "answer": "A", "exp": "Multiple Transit Gateway route tables allow isolating VPCs into security domains (e.g., isolating Dev from Prod) by controlling route propagation[cite: 8]."}, {"id": 55, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "Inter-Region Peering", "type": "single", "q": "How does AWS Transit Gateway Inter-Region Peering transmit traffic between Transit Gateways in different AWS Regions?", "options": ["A) Privately and securely over the global AWS network backbone without traversing the public internet[cite: 8]", "B) Across unencrypted commercial public internet transit lines", "C) By mailing physical encrypted hard drives", "D) Through satellite uplinks only"], "answer": "A", "exp": "Transit Gateway inter-region peering routes traffic over the private, dedicated AWS global fiber network, with built-in encryption[cite: 8]."}, {"id": 56, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "Multicast Support", "type": "single", "q": "What specialized networking feature is supported by AWS Transit Gateway for workloads like financial trading and media broadcasting?", "options": ["A) Native IP Multicast routing[cite: 8]", "B) Analog audio broadcasting", "C) Dial-up modem emulation", "D) Token Ring framing"], "answer": "A", "exp": "Transit Gateway natively supports IP multicast, distributing a single data stream simultaneously to multiple subscribed instances in a VPC[cite: 8]."}, {"id": 57, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "AWS RAM Integration", "type": "single", "q": "Which service enables sharing an AWS Transit Gateway hosted in a central networking account with other AWS accounts across an organization?", "options": ["A) AWS Resource Access Manager (AWS RAM)[cite: 8]", "B) AWS Secrets Manager", "C) AWS CloudFormation Registry", "D) AWS Storage Gateway"], "answer": "A", "exp": "AWS Resource Access Manager (RAM) allows sharing a Transit Gateway across accounts in an AWS Organization, enabling centralized networking[cite: 8]."}, {"id": 58, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "AWS Transit Gateway", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the SAA-C03 exam to choose AWS Transit Gateway instead of VPC Peering?", "options": ["A) Connecting tens to hundreds of VPCs and on-premises networks in a hub-and-spoke topology requiring transitive routing and centralized egress[cite: 7, 8]", "B) Connecting exactly two VPCs in the same region with minimal cost and low complexity[cite: 7]", "C) Migrating database schemas from Oracle to PostgreSQL[cite: 8]", "D) Caching dynamic HTML pages at global edge locations[cite: 8]"], "answer": "A", "exp": "Transit Gateway is the exam choice for complex, large-scale multi-VPC networks requiring transitive routing and simplified management[cite: 7, 8]."}, {"id": 59, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "What It Is & CIDR Blocks", "type": "single", "q": "Which of the following is NOT true regarding an Amazon Virtual Private Cloud (VPC)?", "options": ["A) Logically isolated virtual network defined by the customer in the AWS Cloud[cite: 8]", "B) Customer controls IP address ranges (IPv4 and IPv6 CIDR blocks), subnets, route tables, and gateways[cite: 8]", "C) A single VPC automatically spans across multiple AWS Regions worldwide", "D) Subnets inside a VPC are tied to specific individual Availability Zones[cite: 7, 8]"], "answer": "C", "exp": "An Amazon VPC is tied to a specific single AWS Region; it cannot directly span multiple AWS Regions[cite: 8]."}, {"id": 60, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "Subnets - Public vs Private", "type": "single", "q": "What technically defines a 'Public Subnet' in an Amazon VPC?", "options": ["A) Its subnet route table includes a default route (0.0.0.0/0) pointing to an Internet Gateway (IGW)[cite: 7, 8]", "B) Its instances do not have private IP addresses", "C) It bypasses all Security Groups and Network ACLs", "D) It is physically hosted in a public library"], "answer": "A", "exp": "A subnet is considered public if its route table explicitly routes internet-bound traffic (0.0.0.0/0) to an attached Internet Gateway[cite: 7, 8]."}, {"id": 61, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "Internet Gateway (IGW)", "type": "single", "q": "What is the scalability and redundancy model of an Amazon VPC Internet Gateway (IGW)?", "options": ["A) Horizontally scaled, redundant, and highly available VPC component that imposes no bandwidth bottlenecks[cite: 7, 8]", "B) A single EC2 t2.micro instance that requires manual scaling", "C) An on-premises physical appliance", "D) A legacy router that must be rebooted weekly"], "answer": "A", "exp": "An Internet Gateway is a managed, horizontally scaled software component providing redundant internet ingress/egress without bandwidth limits[cite: 7, 8]."}, {"id": 62, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "NAT Gateway vs NAT Instance", "type": "multi", "q": "Which TWO statements accurately contrast AWS NAT Gateways with legacy customer-managed NAT Instances? (Select 2)", "options": ["A) NAT Gateway is fully managed, highly available within its AZ, and automatically scales bandwidth up to 100 Gbps[cite: 7, 8]", "B) NAT Instances are individual EC2 instances requiring manual OS patching, software updates, and custom failover scripts[cite: 7, 8]", "C) NAT Instances automatically scale bandwidth without administration", "D) NAT Gateways must be deployed inside private subnets"], "answer": ["A", "B"], "exp": "NAT Gateways are managed, scalable, and highly available within an AZ, whereas NAT instances require manual maintenance on EC2[cite: 7, 8]."}, {"id": 63, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "Egress-Only Internet Gateway", "type": "single", "q": "What is the primary function of an Egress-Only Internet Gateway in an Amazon VPC?", "options": ["A) Enables outbound IPv6 traffic from private subnets to the internet while preventing internet hosts from initiating inbound IPv6 connections[cite: 7]", "B) Provides NAT for IPv4 traffic", "C) Resolves external DNS queries for internal servers", "D) Encrypts EBS snapshots using KMS"], "answer": "A", "exp": "Egress-Only Internet Gateways provide stateful outbound IPv6 traffic while blocking unsolicited inbound connections from the internet[cite: 7]."}, {"id": 64, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "VPC Endpoints - Gateway vs Interface", "type": "multi", "q": "Which TWO statements regarding Amazon VPC Endpoints are accurate? (Select 2)", "options": ["A) Gateway Endpoints are free targets in route tables supporting Amazon S3 and Amazon DynamoDB[cite: 8]", "B) Interface Endpoints (powered by PrivateLink) use Elastic Network Interfaces (ENIs) with private IPs to access AWS services privately[cite: 6, 8]", "C) Interface Endpoints require an attached Internet Gateway to function", "D) Gateway Endpoints can be deployed for all 200+ AWS services"], "answer": ["A", "B"], "exp": "Gateway Endpoints support S3 and DynamoDB via route tables; Interface Endpoints use PrivateLink ENIs for private API access[cite: 6, 8]."}, {"id": 65, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "VPC Peering", "type": "single", "q": "What is a fundamental routing constraint of Amazon VPC Peering?", "options": ["A) Does NOT support transitive routing (if VPC A is peered with B, and B with C, VPC A cannot route to C through B)[cite: 8]", "B) Cannot route traffic across different AWS Regions", "C) Traffic between peered VPCs traverses the public internet", "D) Peered VPCs must have identical overlapping CIDR blocks"], "answer": "A", "exp": "VPC Peering does not support edge-to-edge or transitive routing; direct 1-to-1 peering connections are required[cite: 7, 8]."}, {"id": 66, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "Security Groups vs Network ACLs (NACLs)", "type": "multi", "q": "Which TWO statements correctly contrast Security Groups and Network ACLs (NACLs)? (Select 2)", "options": ["A) Security Groups operate at the instance/ENI level and are stateful (return traffic is automatically allowed)[cite: 7, 8]", "B) Network ACLs operate at the subnet level and are stateless (inbound and outbound rules must be explicitly defined)[cite: 7, 8]", "C) Security Groups support explicit DENY rules", "D) Network ACLs are evaluated after Security Groups on inbound traffic"], "answer": ["A", "B"], "exp": "Security Groups are stateful firewalls at the ENI level (allow rules only); NACLs are stateless subnet firewalls supporting allow and deny rules[cite: 7, 8]."}, {"id": 67, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "VPC Flow Logs", "type": "single", "q": "Where can Amazon VPC Flow Logs be delivered for network traffic monitoring, security forensics, and compliance?", "options": ["A) Amazon CloudWatch Logs, Amazon S3, or Amazon Kinesis Data Firehose[cite: 1, 8]", "B) Amazon RDS PostgreSQL tables directly", "C) AWS Artifact certificates", "D) Public internet forums"], "answer": "A", "exp": "VPC Flow Logs capture IP traffic metadata and can be published to CloudWatch Logs, S3 buckets, or Kinesis Data Firehose[cite: 1, 8]."}, {"id": 68, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "Site-to-Site VPN", "type": "multi", "q": "Which TWO components make up the endpoints of an AWS Site-to-Site VPN connection? (Select 2)", "options": ["A) Virtual Private Gateway (VGW) or Transit Gateway on the AWS side[cite: 8]", "B) Customer Gateway (CGW) representing the physical or software appliance on the customer side[cite: 8]", "C) Internet Gateway on the customer premises", "D) Direct Connect Cross-Connect in the AWS Region"], "answer": ["A", "B"], "exp": "An AWS Site-to-Site VPN links a Virtual Private Gateway (or Transit Gateway) on AWS to a Customer Gateway device on-premises[cite: 8]."}, {"id": 69, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "VPC Sharing", "type": "single", "q": "What capability does VPC Sharing (via AWS Organizations and RAM) provide?", "options": ["A) Allows multiple AWS accounts in an organization to create application resources (EC2, RDS) into centrally managed shared subnets[cite: 8]", "B) Merges billing invoices into an unencrypted CSV file", "C) Shares root user passwords across accounts", "D) Replaces route tables with manual switch commands"], "answer": "A", "exp": "VPC Sharing allows participants in an AWS Organization to launch compute resources into shared subnets owned by a central network account[cite: 8]."}, {"id": 70, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "IPAM (IP Address Manager)", "type": "single", "q": "What is the primary function of Amazon VPC IP Address Manager (IPAM)?", "options": ["A) Centrally plans, tracks, and monitors IP address assignments across multiple AWS accounts and VPCs to prevent CIDR overlap[cite: 7]", "B) Compresses outbound TCP packets", "C) Generates free SSL certificates", "D) Deploys container images to ECR"], "answer": "A", "exp": "VPC IPAM automates IP address management, prevents CIDR overlaps across accounts, and simplifies subnet allocation[cite: 7]."}, {"id": 71, "section": "13. NETWORKING & CONTENT DELIVERY", "topic": "Amazon VPC", "subtopic": "Exam Tips", "type": "single", "q": "What is the golden architecture rule for highly available NAT Gateway deployment across Availability Zones on the exam?", "options": ["A) Deploy one NAT Gateway in each Availability Zone's public subnet, configuring private subnets to route through the local AZ's gateway[cite: 7]", "B) Deploy a single NAT Gateway in AZ-a and route all private subnets across all AZs to it", "C) Deploy NAT Gateways inside private subnets without an Internet Gateway", "D) Replace NAT Gateways with public IP addresses on all database instances"], "answer": "A", "exp": "To prevent an AZ failure from severing outbound internet connectivity for the entire VPC, deploy one NAT Gateway per AZ in a public subnet[cite: 7]."}], "quiz14": [{"id": 1, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Artifact", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT an accurate statement regarding AWS Artifact?", "options": ["A) Self-service audit and compliance portal providing on-demand access to AWS security documents[cite: 8]", "B) Provides access to compliance reports such as SOC 1, SOC 2, ISO, and PCI DSS certifications[cite: 8]", "C) A real-time intrusion prevention firewall that blocks unauthorized network packets[cite: 8]", "D) Enables reviewing and accepting legal agreements like the HIPAA BAA and GDPR DPA[cite: 8]"], "answer": "C", "exp": "AWS Artifact is a compliance documentation and legal agreements portal, not a network intrusion prevention firewall[cite: 8]."}, {"id": 2, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Artifact", "subtopic": "Reports vs Agreements", "type": "multi", "q": "Which TWO types of content are managed directly within AWS Artifact? (Select 2)", "options": ["A) Artifact Reports (downloadable third-party audit reports and certifications)[cite: 8]", "B) Artifact Agreements (review and accept BAA or DPA agreements for your organization)[cite: 8]", "C) Automated real-time kernel vulnerability patches", "D) Dynamic routing table configurations for VPC subnets"], "answer": ["A", "B"], "exp": "AWS Artifact provides two core categories: Artifact Reports (compliance certifications like SOC and ISO) and Artifact Agreements (such as HIPAA BAA)[cite: 8]."}, {"id": 3, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Artifact", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario is the standard indicator to select AWS Artifact on the SAA-C03 exam?", "options": ["A) A company needs on-demand access to AWS compliance reports (e.g., SOC, ISO, PCI DSS) or needs to sign a Business Associate Addendum (BAA) for HIPAA compliance[cite: 2, 8]", "B) An organization wants to detect malicious cryptocurrency mining on EC2 instances[cite: 8]", "C) A developer needs to inspect HTTP headers to mitigate cross-site scripting (XSS)[cite: 8]", "D) An enterprise needs to synchronize Active Directory users with IAM[cite: 8]"], "answer": "A", "exp": "AWS Artifact is tested as the self-service portal to download AWS audit reports and sign compliance agreements without opening an AWS Support case[cite: 2, 8]."}, {"id": 4, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Audit Manager", "subtopic": "What It Is & Evidence Collection", "type": "single", "q": "What is the primary function of AWS Audit Manager as described in the handbook?", "options": ["A) Continuously audits AWS usage to simplify risk assessments and automate compliance evidence collection[cite: 8]", "B) Compresses EBS snapshots and moves them to tape storage", "C) Manages domain name registrations in Amazon Route 53[cite: 8]", "D) Deploys multi-AZ container clusters on AWS Fargate[cite: 8]"], "answer": "A", "exp": "AWS Audit Manager automates evidence collection, mapping AWS configurations and API activities against regulatory frameworks[cite: 8]."}, {"id": 5, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Audit Manager", "subtopic": "Frameworks and Assessments", "type": "multi", "q": "Which TWO compliance frameworks are supported via pre-built templates in AWS Audit Manager? (Select 2)", "options": ["A) CIS AWS Foundations Benchmark[cite: 8]", "B) Payment Card Industry Data Security Standard (PCI DSS)[cite: 8]", "C) IEEE 802.11ac Wi-Fi Router Standards", "D) RFC 1918 Private IP Routing Benchmarks"], "answer": ["A", "B"], "exp": "Audit Manager includes pre-built frameworks for PCI DSS, CIS AWS Foundations Benchmark, HIPAA, GDPR, and SOC 2[cite: 8]."}, {"id": 6, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Certificate Manager (ACM)", "subtopic": "What It Is & Managed Certs", "type": "single", "q": "Which of the following is NOT true regarding public SSL/TLS certificates issued by AWS Certificate Manager (ACM)?", "options": ["A) Public certificates provisioned through ACM are free of charge[cite: 8]", "B) Supports automatic renewal and deployment for integrated AWS services[cite: 8]", "C) Customers can download and export the private key of public certificates to install on on-premises servers[cite: 8]", "D) Integrates natively with Elastic Load Balancing, Amazon CloudFront, and Amazon API Gateway[cite: 8]"], "answer": "C", "exp": "AWS Certificate Manager does not allow exporting or downloading private keys for public certificates; they must be deployed to supported AWS services[cite: 8]."}, {"id": 7, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Certificate Manager (ACM)", "subtopic": "Validation Methods", "type": "multi", "q": "Which TWO domain validation methods are supported when requesting a certificate in AWS Certificate Manager? (Select 2)", "options": ["A) DNS Validation (adding a CNAME record in your DNS zone - recommended)[cite: 8]", "B) Email Validation (sending confirmation emails to the registered domain contacts)[cite: 8]", "C) SMS Text Code Validation", "D) Postal Mail Notarization"], "answer": ["A", "B"], "exp": "ACM supports DNS validation (via CNAME records, preferred for automated renewals) and Email validation[cite: 8]."}, {"id": 8, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Certificate Manager (ACM)", "subtopic": "Private Certificate Authority (ACM PCA)", "type": "single", "q": "When is AWS Private Certificate Authority (ACM PCA) required instead of standard ACM public certificates?", "options": ["A) When an enterprise needs to issue, manage, and export private TLS certificates for internal applications, microservices, or VPN connections[cite: 2, 8]", "B) When public certificates on an Application Load Balancer expire", "C) When hosting static assets on Amazon S3", "D) When configuring DNSSEC on Amazon Route 53[cite: 8]"], "answer": "A", "exp": "ACM PCA is a paid, private CA service used to issue internal certificates for private networks and allows exporting private keys[cite: 2, 8]."}, {"id": 9, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Certificate Manager (ACM)", "subtopic": "CloudFront Regional Requirement", "type": "single", "q": "In which AWS Region must an ACM certificate be requested if it is to be associated with an Amazon CloudFront distribution?", "options": ["A) us-east-1 (N. Virginia)[cite: 8]", "B) The region where the S3 origin bucket is deployed", "C) us-west-2 (Oregon)", "D) Any region, as long as it has multiple Availability Zones"], "answer": "A", "exp": "Certificates for global Amazon CloudFront distributions must always be requested or imported into the us-east-1 (N. Virginia) region[cite: 8]."}, {"id": 10, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS CloudHSM", "subtopic": "What It Is & Compliance", "type": "single", "q": "What is the primary architectural differentiator of AWS CloudHSM compared to AWS Key Management Service (AWS KMS)?", "options": ["A) CloudHSM provides dedicated, single-tenant, FIPS 140-2 Level 3 validated hardware appliances inside your VPC under complete customer control[cite: 2, 8]", "B) CloudHSM is a multi-tenant serverless software key manager managed entirely by AWS[cite: 8]", "C) CloudHSM does not support automated cluster backups[cite: 8]", "D) CloudHSM is free of charge for all AWS accounts"], "answer": "A", "exp": "CloudHSM provides dedicated, single-tenant FIPS 140-2 Level 3 hardware inside the customer's VPC where the customer has exclusive control of the cryptographic keys[cite: 2, 8]."}, {"id": 11, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS CloudHSM", "subtopic": "Cryptographic APIs & HA", "type": "multi", "q": "Which TWO statements regarding AWS CloudHSM architecture are accurate? (Select 2)", "options": ["A) Supports standard cryptographic interfaces including PKCS#11, Java JCE, and Microsoft CNG[cite: 8]", "B) Supports deploying dedicated HSM clusters across multiple Availability Zones with automatic synchronization[cite: 2, 8]", "C) AWS employees can view and recover lost customer keys upon request[cite: 8]", "D) CloudHSM instances are provisioned in public subnets with public IP addresses"], "answer": ["A", "B"], "exp": "CloudHSM uses standard APIs (PKCS#11, JCE, CNG), supports multi-AZ clusters for HA, and AWS has no visibility into customer key material[cite: 2, 8]."}, {"id": 12, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "What It Is & Customer Master Keys (CMKs)", "type": "single", "q": "Which of the following is NOT true regarding AWS Key Management Service (AWS KMS)?", "options": ["A) Managed service to create, control, and manage encryption keys across AWS services[cite: 8]", "B) Supports AWS-managed keys and customer-managed keys (CMKs)[cite: 8]", "C) Exposes the raw plaintext private key material of CMKs over public HTTP endpoints", "D) Integrates natively with AWS CloudTrail for comprehensive key usage auditing[cite: 8]"], "answer": "C", "exp": "AWS KMS never exports or exposes the plaintext key material of Customer Master Keys (KMS keys) outside of its hardware security modules[cite: 8]."}, {"id": 13, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Envelope Encryption", "type": "single", "q": "How does Envelope Encryption work in AWS KMS to protect large datasets efficiently?", "options": ["A) Plaintext data is encrypted using a local Data Key, and the Data Key is encrypted under a KMS Key (CMK)[cite: 8]", "B) All raw data is streamed over the internet directly into the KMS HSM hardware for encryption", "C) Data is compressed into a zip file protected by a user password", "D) Keys are printed onto physical barcode stickers"], "answer": "A", "exp": "Envelope encryption encrypts data with a unique plaintext data key, then encrypts that data key under a root KMS key, storing only the encrypted data key alongside the ciphertext[cite: 8]."}, {"id": 14, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Key Types & Policies", "type": "multi", "q": "Which TWO statements regarding AWS KMS key management are accurate? (Select 2)", "options": ["A) Customer-managed keys allow user-configured key rotation, key policies, and IAM delegation[cite: 8]", "B) Multi-Region Keys allow replicating primary keys across regions to decrypt data without cross-region API calls[cite: 8]", "C) AWS-managed keys can be deleted immediately on demand by customers", "D) Key policies are optional; IAM policies alone completely govern all KMS keys"], "answer": ["A", "B"], "exp": "Customer-managed keys provide granular access/rotation controls, Multi-Region keys simplify multi-region decryption, and every KMS key must have a Key Policy[cite: 8]."}, {"id": 15, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Automatic Key Rotation", "type": "single", "q": "How does automatic key rotation function for customer-managed KMS keys in AWS KMS?", "options": ["A) KMS automatically rotates the backing key material once every year (365 days) while retaining older backing keys to decrypt historical data[cite: 8]", "B) Automatically rotates every hour and invalidates all previously encrypted data", "C) Requires customers to generate new key aliases manually", "D) Deletes all data keys associated with the key"], "answer": "A", "exp": "When enabled, KMS rotates the backing key material annually; it retains previous backing material indefinitely so existing ciphertext decrypts transparently[cite: 8]."}, {"id": 16, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Cognito", "subtopic": "User Pools vs Identity Pools", "type": "single", "q": "In Amazon Cognito, what is the distinct function of User Pools compared to Identity Pools?", "options": ["A) User Pools are user directories for sign-up, sign-in, and JWT token issuance; Identity Pools provide temporary AWS credentials to access AWS resources[cite: 8]", "B) User Pools provide temporary AWS credentials; Identity Pools handle password resets", "C) User Pools are for databases; Identity Pools are for virtual machines", "D) There is no functional difference between them"], "answer": "A", "exp": "Cognito User Pools manage authentication (user directory, MFA, tokens), while Identity Pools (Federated Identities) authorize access to AWS resources via STS credentials[cite: 8]."}, {"id": 17, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Cognito", "subtopic": "Federation & Social Sign-In", "type": "multi", "q": "Which TWO external identity federation mechanisms are supported by Amazon Cognito User Pools? (Select 2)", "options": ["A) Social Identity Providers (Google, Facebook, Apple, Amazon)[cite: 8]", "B) Enterprise SAML 2.0 and OpenID Connect (OIDC) identity providers[cite: 8]", "C) Cleartext CSV user password uploads over FTP", "D) Direct dial-up modem authentication"], "answer": ["A", "B"], "exp": "Cognito User Pools support federated sign-in with social identity providers (Google, Facebook, Apple) and enterprise SAML 2.0 / OIDC providers[cite: 8]."}, {"id": 18, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Cognito", "subtopic": "Security - MFA & Adaptive Auth", "type": "single", "q": "Which security capability in Amazon Cognito detects compromised credentials and applies risk-based adaptive authentication to challenge suspicious sign-in attempts?", "options": ["A) Advanced Security Features[cite: 8]", "B) Basic VPC Security Groups", "C) Route 53 Resolver DNS Firewall", "D) S3 Object Lock Governance Mode[cite: 6]"], "answer": "A", "exp": "Cognito Advanced Security Features (ASF) provide adaptive authentication, automated threat response, and compromised credential checking[cite: 8]."}, {"id": 19, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Detective", "subtopic": "What It Is & Behavior Graph", "type": "single", "q": "Which of the following is NOT true regarding Amazon Detective as described in the handbook?", "options": ["A) Fully managed security service that simplifies investigating security issues and suspicious activities[cite: 8]", "B) Automatically ingests and correlates data from CloudTrail, VPC Flow Logs, and GuardDuty[cite: 8]", "C) An active firewall service that automatically terminates compromised EC2 instances", "D) Builds interactive visual behavior graphs that retain context for up to 12 months[cite: 8]"], "answer": "C", "exp": "Amazon Detective is a security investigation and visualization tool; it does not terminate instances or perform inline firewall packet blocking[cite: 8]."}, {"id": 20, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Detective", "subtopic": "Data Sources & Analysis", "type": "multi", "q": "Which TWO data sources are automatically collected and linked by Amazon Detective to investigate security anomalies? (Select 2)", "options": ["A) Amazon GuardDuty findings[cite: 8]", "B) Amazon VPC Flow Logs and AWS CloudTrail logs[cite: 8]", "C) Local desktop mouse movement logs", "D) Physical facility access badge swipes"], "answer": ["A", "B"], "exp": "Detective ingests VPC Flow Logs, CloudTrail management and data events, GuardDuty findings, and EKS audit logs without requiring agent installations[cite: 8]."}, {"id": 21, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "Directory Types", "type": "single", "q": "Which AWS Directory Service option provides an actual, fully managed Microsoft Active Directory running on Windows Server in the AWS Cloud with support for trust relationships?", "options": ["A) AWS Managed Microsoft AD[cite: 8]", "B) AD Connector[cite: 8]", "C) Simple AD[cite: 8]", "D) Amazon Cognito User Pools[cite: 8]"], "answer": "A", "exp": "AWS Managed Microsoft AD runs genuine Microsoft Active Directory in the cloud, supporting Group Policy, Kerberos, and forest trusts with on-prem AD[cite: 8]."}, {"id": 22, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "AD Connector", "type": "single", "q": "What is the primary architectural purpose of an AWS Directory Service AD Connector?", "options": ["A) Acts as a lightweight proxy that redirects directory requests to an existing on-premises Active Directory without caching or storing credentials in AWS[cite: 8]", "B) Replicates on-premises user passwords into an unencrypted DynamoDB table", "C) Converts SAML 2.0 assertions into raw SQL statements", "D) Compresses file system backups before writing to S3"], "answer": "A", "exp": "AD Connector is a proxy service that redirects authentication requests directly to your existing on-premises Active Directory without hosting AD in AWS[cite: 8]."}, {"id": 23, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "Simple AD", "type": "single", "q": "What is Simple AD in AWS Directory Service?", "options": ["A) A standalone, low-cost managed directory powered by Samba 4 Active Directory Compatible Server, ideal for small workloads without complex AD features[cite: 8]", "B) A physical smartcard reader hardware device", "C) A single-sign-on tool for public social media websites", "D) A feature that deletes inactive IAM users automatically"], "answer": "A", "exp": "Simple AD is a standalone, inexpensive Samba 4-based directory supporting basic user management and Kerberos SSO, but it does not support AD trust relationships[cite: 8]."}, {"id": 24, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "Exam Tips", "type": "single", "q": "When should an architect choose AD Connector over AWS Managed Microsoft AD on the exam?", "options": ["A) When an organization wants to authenticate cloud applications (like Amazon WorkSpaces) against their existing on-premises Active Directory without syncing or hosting AD in the cloud[cite: 8]", "B) When the company needs to establish a two-way forest trust with multiple domains[cite: 8]", "C) When there is no network connection between on-premises and AWS", "D) When building a serverless GraphQL backend"], "answer": "A", "exp": "AD Connector is the exam answer when you need to leverage existing on-premises AD credentials seamlessly without deploying domain controllers in AWS[cite: 8]."}, {"id": 25, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Firewall Manager", "subtopic": "What It Is & Prerequisites", "type": "single", "q": "Which of the following is a mandatory prerequisite to deploying and managing security policies with AWS Firewall Manager?", "options": ["A) Accounts must be part of an organization in AWS Organizations with all features enabled, and an administrator account must be designated[cite: 8]", "B) All EC2 instances must have public Elastic IP addresses", "C) The organization must purchase an Enterprise Support Plan", "D) All S3 buckets must be made publicly accessible"], "answer": "A", "exp": "Firewall Manager requires AWS Organizations with all features enabled and designated delegated administrator settings to enforce cross-account policies[cite: 8]."}, {"id": 26, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Firewall Manager", "subtopic": "Supported Services", "type": "multi", "q": "Which TWO AWS security services can be centrally configured and deployed across accounts using AWS Firewall Manager? (Select 2)", "options": ["A) AWS WAF (Web ACLs)[cite: 8]", "B) AWS Network Firewall and AWS Shield Advanced[cite: 8]", "C) Amazon Polly audio engines", "D) Amazon EMR cluster nodes"], "answer": ["A", "B"], "exp": "Firewall Manager centrally manages AWS WAF, AWS Shield Advanced, AWS Network Firewall, VPC Security Groups, and Route 53 Resolver DNS Firewall[cite: 8]."}, {"id": 27, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Firewall Manager", "subtopic": "Automated Remediation", "type": "single", "q": "What happens when a developer launches a new Application Load Balancer in a member account governed by an AWS Firewall Manager WAF policy?", "options": ["A) Firewall Manager automatically applies the organization's standard Web ACL to the newly provisioned ALB to ensure continuous compliance[cite: 8]", "B) The new ALB is immediately terminated", "C) An administrator must manually approve the ALB via email", "D) The developer's IAM permissions are revoked"], "answer": "A", "exp": "Firewall Manager automatically discovers new matching resources across accounts and attaches the mandatory security policies without manual intervention[cite: 8]."}, {"id": 28, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "What It Is & Architecture", "type": "single", "q": "Which of the following is NOT true regarding Amazon GuardDuty?", "options": ["A) Fully managed threat detection service that continuously monitors AWS accounts and workloads[cite: 8]", "B) Uses machine learning, anomaly detection, and integrated threat intelligence feeds[cite: 8]", "C) Requires installing custom monitoring software agents on every EC2 instance[cite: 8]", "D) Generates actionable findings prioritized by Low, Medium, and High severity[cite: 8]"], "answer": "C", "exp": "Amazon GuardDuty is completely agentless; it analyzes AWS foundation logs without impacting compute performance or requiring software agents[cite: 8]."}, {"id": 29, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "Data Sources Analyzed", "type": "multi", "q": "Which TWO telemetry data sources are analyzed automatically by Amazon GuardDuty? (Select 2)", "options": ["A) AWS CloudTrail management events and S3 data events[cite: 8]", "B) Amazon VPC Flow Logs and DNS query logs[cite: 8]", "C) Local desktop keyboard stroke logs", "D) Hard drive audio vibration frequencies"], "answer": ["A", "B"], "exp": "GuardDuty natively analyzes CloudTrail logs, VPC Flow Logs, DNS query logs, and Kubernetes audit logs[cite: 8]."}, {"id": 30, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "Automated Response with EventBridge", "type": "single", "q": "How can an enterprise automatically isolate a compromised EC2 instance running cryptocurrency malware detected by GuardDuty?", "options": ["A) Route GuardDuty findings through Amazon EventBridge to trigger an AWS Lambda function that modifies the instance's Security Group[cite: 8]", "B) Wait for an AWS support engineer to manually log in to the server", "C) Email the instance IP address to users", "D) Reboot the entire AWS Region"], "answer": "A", "exp": "GuardDuty findings emit to EventBridge, which can trigger automated Lambda functions or Systems Manager runbooks to isolate compromised hosts[cite: 8]."}, {"id": 31, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "What It Is & Global Nature", "type": "single", "q": "Which of the following is true regarding the operational scope of AWS Identity and Access Management (IAM)?", "options": ["A) IAM is a global service that manages authentication and authorization across all AWS Regions under a single account[cite: 8]", "B) IAM must be configured independently in each individual Availability Zone", "C) IAM policies only apply to EC2 instances and cannot govern S3 buckets", "D) Users are billed an hourly license fee for each active IAM group"], "answer": "A", "exp": "AWS IAM is a global service; users, groups, roles, and policies are defined once and apply across all global AWS Regions[cite: 8]."}, {"id": 32, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "IAM Users vs Roles", "type": "single", "q": "What is the primary difference between an IAM User and an IAM Role?", "options": ["A) An IAM User has permanent long-term credentials (passwords, access keys); an IAM Role provides temporary credentials via AWS STS[cite: 8]", "B) IAM Users can only access S3; IAM Roles can only access EC2", "C) IAM Roles are only used for on-premises systems", "D) There is no security difference between users and roles"], "answer": "A", "exp": "IAM Users represent long-term identities with static credentials; IAM Roles grant short-lived temporary security tokens generated by STS[cite: 8]."}, {"id": 33, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Policy Structure - JSON Elements", "type": "multi", "q": "Which TWO JSON elements are mandatory when defining an AWS IAM permission statement? (Select 2)", "options": ["A) Effect (specifying either 'Allow' or 'Deny')[cite: 8]", "B) Action (specifying the targeted API operations)[cite: 8]", "C) DNSZone (specifying domain nameservers)", "D) EncryptAlgorithm (specifying hardware cipher strength)"], "answer": ["A", "B"], "exp": "A basic IAM policy statement requires an Effect (Allow/Deny), Action (e.g., s3:GetObject), and Resource (ARN), with optional Conditions[cite: 8]."}, {"id": 34, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Permissions Boundaries", "type": "single", "q": "What is the primary function of an IAM Permissions Boundary?", "options": ["A) An advanced feature that sets the maximum permissions an identity-based policy can grant, preventing privilege escalation during role delegation[cite: 8]", "B) A physical perimeter fence around an AWS data center", "C) A subnet-level firewall that filters inbound TCP packets", "D) A rule that deletes old access keys automatically"], "answer": "A", "exp": "Permissions boundaries define the maximum permissions that an IAM entity can have, allowing developers to create roles without exceeding defined caps[cite: 8]."}, {"id": 35, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Identity-Based vs Resource-Based Policies", "type": "multi", "q": "Which TWO statements accurately contrast Identity-Based Policies and Resource-Based Policies? (Select 2)", "options": ["A) Identity-based policies are attached to IAM users, groups, or roles[cite: 8]", "B) Resource-based policies are attached directly to resources (e.g., S3 bucket policy, SQS queue policy) and can grant cross-account access directly[cite: 8]", "C) Resource-based policies cannot allow actions unless the principal assumes an IAM role", "D) Identi
