ty-based policies cannot specify explicit DENY statements"], "answer": ["A", "B"], "exp": "Identity-based policies attach to users/roles; resource-based policies attach to resources and allow direct cross-account access without role assumption[cite: 8]."}, {"id": 36, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "IAM Access Analyzer", "type": "single", "q": "What is the primary security function of IAM Access Analyzer?", "options": ["A) Analyzes resource-based policies using mathematical logic to identify resources that are accessible from outside your trusted AWS account or organization[cite: 8]", "B) Automatically rewrites application source code", "C) Measures network ping latency between EC2 instances", "D) Deletes inactive IAM users without notification"], "answer": "A", "exp": "IAM Access Analyzer reviews policies on S3, KMS, IAM roles, and SQS to alert administrators to unintended external or public access[cite: 8]."}, {"id": 37, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Best Practices - Root Account", "type": "single", "q": "According to the AWS Well-Architected Framework, what is the best practice regarding the AWS root user account?", "options": ["A) Lock away the root credentials, enable hardware/virtual MFA, and use IAM roles/users for daily administrative tasks[cite: 8]", "B) Share root credentials across all software engineers to eliminate permission issues", "C) Hardcode the root access key in application configuration files", "D) Delete the root account immediately after account creation"], "answer": "A", "exp": "Best practices dictate locking down the root user, enabling MFA, and using least-privilege IAM roles or IAM Identity Center for administrative duties[cite: 8]."}, {"id": 38, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Credential Report & Access Advisor", "type": "multi", "q": "Which TWO auditing tools are built directly into AWS IAM? (Select 2)", "options": ["A) IAM Credential Report (downloadable CSV listing all users and the status of their passwords, access keys, and MFA)[cite: 8]", "B) IAM Access Advisor (shows service last accessed timestamps to identify and remove unused permissions)[cite: 8]", "C) IAM Network Sniffer (inspects local TCP socket traffic)", "D) IAM Hard Drive Diagnostic Utility"], "answer": ["A", "B"], "exp": "Credential Reports list account security status (MFA, key age), while Access Advisor shows service last-accessed data to enforce least privilege[cite: 8]."}, {"id": 39, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "What It Is & Workload Scanning", "type": "single", "q": "Which of the following is NOT true regarding Amazon Inspector as described in the handbook?", "options": ["A) Automated vulnerability management service that scans AWS workloads for software vulnerabilities and unintended network exposure[cite: 8]", "B) Continuously scans EC2 instances, container images in Amazon ECR, and AWS Lambda functions[cite: 8]", "C) A real-time DDoS mitigation shield that absorbs Layer 3 flood attacks", "D) Generates risk-prioritized findings with CVSS scores and remediation guidance[cite: 8]"], "answer": "C", "exp": "Amazon Inspector is a vulnerability and package management scanner; DDoS mitigation is provided by AWS Shield[cite: 8]."}, {"id": 40, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "Scanning Targets", "type": "multi", "q": "Which TWO targets are automatically and continuously scanned for CVE vulnerabilities by Amazon Inspector? (Select 2)", "options": ["A) Container images stored in Amazon Elastic Container Registry (ECR)[cite: 8]", "B) AWS Lambda function code and application package dependencies[cite: 8]", "C) S3 Glacier tape magnetic media", "D) Optical fiber transceivers on Direct Connect links"], "answer": ["A", "B"], "exp": "Amazon Inspector continuously scans EC2 operating systems, container images in ECR, and Lambda function packages for known vulnerabilities[cite: 8]."}, {"id": 41, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "Network Reachability Analysis", "type": "single", "q": "How does Amazon Inspector evaluate whether an Amazon EC2 instance is vulnerable to unintended network exposure?", "options": ["A) Evaluates VPC route tables, security groups, IGWs, and network configurations to determine if ports are reachable from the public internet[cite: 8]", "B) Sends port flood denial-of-service packets to crash the server", "C) Requires developers to open all ports to 0.0.0.0/0", "D) Reboots the instance during active network tests"], "answer": "A", "exp": "Inspector uses automated reasoning to analyze network reachability paths (Security Groups, NACLs, IGWs) to flag unintended external exposure[cite: 8]."}, {"id": 42, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Macie", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT true regarding Amazon Macie as described in the handbook?", "options": ["A) Fully managed data security and privacy service using machine learning to discover, classify, and protect sensitive data[cite: 8]", "B) Evaluates S3 buckets for open public access or unencrypted storage[cite: 8]", "C) Automatically compiles Java applications into Docker images", "D) Identifies Personally Identifiable Information (PII) such as credit card numbers, names, and passport details[cite: 8]"], "answer": "C", "exp": "Amazon Macie is an S3 data classification and PII discovery security service; it does not build or compile application containers[cite: 8]."}, {"id": 43, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Macie", "subtopic": "Data Classification & Identifiers", "type": "multi", "q": "Which TWO mechanisms are used by Amazon Macie to discover sensitive data in Amazon S3? (Select 2)", "options": ["A) Managed Data Identifiers (built-in patterns for detecting standard PII like national IDs, financial data, credentials)[cite: 8]", "B) Custom Data Identifiers (user-defined regular expressions to detect proprietary organizational sensitive data)[cite: 8]", "C) Manual inspection by human AWS engineers reading customer files", "D) Converting all text documents into uncompressed audio files"], "answer": ["A", "B"], "exp": "Macie detects sensitive data using built-in Managed Data Identifiers and user-configured Custom Data Identifiers (regex)[cite: 8]."}, {"id": 44, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Macie", "subtopic": "Exam Tips", "type": "single", "q": "What is the key differentiator for Amazon Macie on the SAA-C03 exam?", "options": ["A) Specifically identifying, classifying, and protecting sensitive data (PII) stored in Amazon S3 buckets using machine learning[cite: 8]", "B) Analyzing VPC Flow Logs for network port scans", "C) Scanning EC2 operating systems for unpatched kernel software vulnerabilities", "D) Restricting database access using Active Directory credentials"], "answer": "A", "exp": "Amazon Macie is the definitive exam answer for discovering PII and sensitive data inside Amazon S3[cite: 8]."}, {"id": 45, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Network Firewall", "subtopic": "What It Is & Architecture", "type": "single", "q": "Which of the following is NOT true regarding AWS Network Firewall?", "options": ["A) Fully managed, stateful and stateless network traffic filtering service for Amazon VPC[cite: 8]", "B) Scales automatically with network traffic without managing firewall server clusters[cite: 8]", "C) Operates exclusively on mobile smartphone cellular towers outside of AWS VPCs", "D) Supports Suricata-compatible open-source rules for deep packet inspection (DPI)[cite: 8]"], "answer": "C", "exp": "AWS Network Firewall is deployed directly inside Amazon VPC subnets to inspect VPC ingress and egress traffic[cite: 8]."}, {"id": 46, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Network Firewall", "subtopic": "Rule Groups - Stateless vs Stateful", "type": "multi", "q": "Which TWO inspection capabilities are provided by AWS Network Firewall rule groups? (Select 2)", "options": ["A) Stateless Rules (matches criteria based strictly on 5-tuple IP/port headers without tracking connection state)[cite: 8]", "B) Stateful Rules (inspects traffic with context, supporting domain name filtering, Suricata rules, and intrusion prevention)[cite: 8]", "C) Hardware biometric verification rules", "D) SQL query syntax auto-correction rules"], "answer": ["A", "B"], "exp": "Network Firewall processes traffic through fast stateless 5-tuple inspection before evaluating advanced stateful inspection rules[cite: 8]."}, {"id": 47, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Network Firewall", "subtopic": "Transit Gateway Centralized Inspection", "type": "single", "q": "How can an enterprise centrally inspect all East-West (VPC-to-VPC) and North-South (internet egress) traffic across multiple accounts?", "options": ["A) Deploy AWS Network Firewall endpoints into a dedicated central Inspection VPC attached to an AWS Transit Gateway[cite: 8]", "B) Install software firewalls manually on every developer workstation", "C) Disconnect the AWS Organization from the AWS backbone", "D) Route all traffic through unencrypted public S3 buckets"], "answer": "A", "exp": "Transit Gateway routing can direct all inter-VPC and egress traffic through an Inspection VPC hosting AWS Network Firewall endpoints[cite: 8]."}, {"id": 48, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS RAM (Resource Access Manager)", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "What is the primary architectural purpose of AWS Resource Access Manager (AWS RAM)?", "options": ["A) Allows securely sharing supported AWS resources across AWS accounts or within an organization to avoid resource duplication[cite: 8]", "B) Increases the physical RAM memory of EC2 instances dynamically", "C) Caches relational database queries in memory", "D) Compiles container images into executable files"], "answer": "A", "exp": "AWS RAM enables multi-account resource sharing (e.g., subnets, Transit Gateways, license configs), reducing duplication and operational costs[cite: 8]."}, {"id": 49, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS RAM (Resource Access Manager)", "subtopic": "Supported Resource Types", "type": "multi", "q": "Which TWO resource types can be shared across accounts using AWS RAM? (Select 2)", "options": ["A) Amazon VPC Subnets (enabling multiple accounts to launch resources into shared networking)[cite: 8]", "B) AWS Transit Gateways and Route 53 Resolver Rules[cite: 8]", "C) IAM Root User passwords", "D) S3 Glacier physical tape drives"], "answer": ["A", "B"], "exp": "AWS RAM supports sharing VPC subnets, Transit Gateways, Route 53 Resolver Rules, License Manager configs, and Network Firewall policies[cite: 8]."}, {"id": 50, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS RAM (Resource Access Manager)", "subtopic": "Sharing Behavior - Inside vs Outside Organization", "type": "single", "q": "How does resource sharing behave when sharing via AWS RAM with accounts WITHIN your AWS Organization compared to OUTSIDE your organization?", "options": ["A) Sharing within an organization is automatic with no invitation required; sharing outside the organization requires the recipient to accept an invitation[cite: 8]", "B) Sharing within an organization requires manual paper notarization", "C) Sharing outside an organization is completely prohibited", "D) External sharing deletes the resource from the owner account"], "answer": "A", "exp": "When sharing inside an organization with sharing enabled, access is immediate; external account sharing requires invitation acceptance[cite: 8]."}, {"id": 51, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Secrets Manager", "subtopic": "What It Is & Automatic Rotation", "type": "single", "q": "Which capability is a defining feature of AWS Secrets Manager compared to Systems Manager Parameter Store?", "options": ["A) Built-in automatic rotation of database credentials using AWS Lambda functions without service interruption[cite: 8]", "B) Unencrypted public storage of API keys", "C) Direct physical shredding of expired hardware tokens", "D) Conversion of JSON secrets into audio speech files"], "answer": "A", "exp": "AWS Secrets Manager provides native automated credential rotation (with pre-built Lambda templates for RDS, Redshift, and Aurora)[cite: 8]."}, {"id": 52, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Secrets Manager", "subtopic": "Cross-Region Replication", "type": "single", "q": "What disaster recovery benefit does Secrets Manager Cross-Region Replication provide?", "options": ["A) Automatically replicates secrets to secondary regions, creating hot standbys with synchronized versions for multi-region failover[cite: 2, 8]", "B) Copies secrets to on-premises fax machines", "C) Eliminates the need for KMS encryption keys", "D) Deletes secrets during regional outages"], "answer": "A", "exp": "Secrets Manager can replicate secrets to secondary regions, ensuring read/write replica databases have synchronized credentials for DR[cite: 2, 8]."}, {"id": 53, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Hub", "subtopic": "What It Is & Posture Management", "type": "single", "q": "Which of the following is NOT true regarding AWS Security Hub?", "options": ["A) Cloud security posture management service that aggregates, organizes, and prioritizes security alerts and findings[cite: 8]", "B) Automatically evaluates accounts against security standards like CIS AWS Foundations and AWS Foundational Security Best Practices[cite: 8]", "C) A hardware firewall device physically plugged into customer internet connections", "D) Integrates findings from GuardDuty, Inspector, Macie, and IAM Access Analyzer into a standard format (ASFF)[cite: 8]"], "answer": "C", "exp": "AWS Security Hub is a cloud security posture management and compliance aggregation service, not a physical hardware firewall[cite: 8]."}, {"id": 54, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Hub", "subtopic": "ASFF & Automated Remediation", "type": "multi", "q": "Which TWO capabilities are supported by AWS Security Hub? (Select 2)", "options": ["A) Standardizes security findings into the AWS Security Finding Format (ASFF)[cite: 8]", "B) Triggers automated response and remediation workflows via integration with Amazon EventBridge[cite: 8]", "C) Automatically formats all S3 buckets into NTFS partitions", "D) Disables CloudWatch alarms across the enterprise"], "answer": ["A", "B"], "exp": "Security Hub standardizes all alerts into ASFF JSON format and sends custom findings to EventBridge to drive automated remediation[cite: 8]."}, {"id": 55, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Shield", "subtopic": "Shield Standard vs Shield Advanced", "type": "single", "q": "What protection does AWS Shield Standard provide to all AWS customers at no additional cost?", "options": ["A) Automatic, continuous protection against common network and transport layer (Layer 3 and 4) DDoS attacks (like SYN/UDP floods)[cite: 2, 8]", "B) 24/7 dedicated access to the AWS Shield Response Team (SRT)", "C) Financial cost protection against scaling charges caused by DDoS spikes", "D) Specialized Layer 7 application DDoS protection without WAF"], "answer": "A", "exp": "AWS Shield Standard is included automatically at no cost, defending all customers against common Layer 3 and Layer 4 infrastructure DDoS attacks[cite: 2, 8]."}, {"id": 56, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Shield", "subtopic": "Shield Advanced Features", "type": "multi", "q": "Which TWO benefits are provided exclusively with AWS Shield Advanced? (Select 2)", "options": ["A) Access to the 24/7 AWS Shield Response Team (SRT) for customized mitigation during active attacks[cite: 8]", "B) Financial 'DDoS cost protection' to refund scaling charges resulting from traffic spikes on protected resources[cite: 8]", "C) Free deployment of physical hardware servers to customer premises", "D) Automatic elimination of all internet data transfer fees permanently"], "answer": ["A", "B"], "exp": "Shield Advanced adds 24/7 SRT support, advanced Layer 7 detection, bundled AWS WAF licenses, and financial cost-spike protection[cite: 8]."}, {"id": 57, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "What It Is & Layer 7 Filtering", "type": "single", "q": "Which OSI layer does AWS WAF (Web Application Firewall) operate on to monitor and filter HTTP/HTTPS traffic?", "options": ["A) Layer 7 (Application Layer)[cite: 8]", "B) Layer 4 (Transport Layer)", "C) Layer 3 (Network Layer)", "D) Layer 2 (Data Link Layer)"], "answer": "A", "exp": "AWS WAF is a Layer 7 application firewall that inspects HTTP/HTTPS headers, URIs, query strings, and payloads to block web exploits[cite: 8]."}, {"id": 58, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Supported Attachment Points", "type": "multi", "q": "Which TWO AWS resources can have an AWS WAF Web ACL attached directly to them? (Select 2)", "options": ["A) Amazon CloudFront distributions[cite: 8]", "B) Application Load Balancers (ALB) and Amazon API Gateway REST APIs[cite: 8]", "C) Network Load Balancers (NLB) operating in pure TCP mode[cite: 7, 8]", "D) Amazon S3 Glacier Deep Archive vaults"], "answer": ["A", "B"], "exp": "AWS WAF attaches to CloudFront, Application Load Balancers, API Gateway, AppSync, and Cognito User Pools (not raw TCP NLBs)[cite: 8]."}, {"id": 59, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Rule Types & Managed Rules", "type": "single", "q": "What is the primary advantage of deploying AWS Managed Rules for AWS WAF?", "options": ["A) Pre-configured rule sets curated and maintained by AWS and AWS Marketplace sellers to protect against OWASP Top 10 exploits without manual rule authoring[cite: 8]", "B) Automatically updates the DNS records in Amazon Route 53", "C) Converts web traffic into audio files using Amazon Polly", "D) Disables customer authentication to accelerate webpage rendering"], "answer": "A", "exp": "AWS Managed Rules are maintained by AWS security experts, providing out-of-the-box protection against vulnerabilities like SQL injection and XSS[cite: 8]."}, {"id": 60, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Rate-Based Rules", "type": "single", "q": "How can an organization mitigate HTTP flood attacks and brute-force web login attempts using AWS WAF?", "options": ["A) Configure a Rate-Based Rule that temporarily blocks IP addresses when requests exceed a defined threshold within a 5-minute sliding window[cite: 8]", "B) Delete the web server's root EBS volume", "C) Turn off the internet gateway every 5 minutes", "D) Re-route web traffic through an S3 Glacier vault"], "answer": "A", "exp": "Rate-based rules track request volume per client IP over 5-minute evaluation periods, automatically blocking or CAPTCHA-challenging IPs that exceed the cap[cite: 8]."}, {"id": 61, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Lake", "subtopic": "What It Is & Open Cybersecurity Schema Framework (OCSF)", "type": "single", "q": "What is the core capability of AWS Security Lake as described in the handbook?", "options": ["A) Automatically centralizes, normalizes, and manages security telemetry from AWS and third-party sources into an S3 data lake using the OCSF standard[cite: 2]", "B) A cooling reservoir for physical servers in AWS regions", "C) An in-memory cache for relational SQL queries", "D) A tool for compiling mobile applications"], "answer": "A", "exp": "AWS Security Lake automatically aggregates and normalizes security logs from multiple accounts and partners into S3 using the Open Cybersecurity Schema Framework (OCSF)[cite: 2]."}, {"id": 62, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Verified Permissions", "subtopic": "What It Is & Cedar Language", "type": "single", "q": "Which capability is provided by AWS Verified Permissions for custom application developers?", "options": ["A) Fine-grained authorization service and policy management using the Cedar policy language to manage and evaluate user permissions within custom apps[cite: 2]", "B) Managing physical security guard schedules at AWS offices", "C) Encrypting local desktop RAM chips with AES-256", "D) Bypassing IAM role boundaries across AWS services"], "answer": "A", "exp": "AWS Verified Permissions centralizes authorization policies using the open-source Cedar language, enabling fine-grained role/attribute-based access control inside custom applications[cite: 2]."}, {"id": 63, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM Identity Center (formerly AWS SSO)", "subtopic": "What It Is & Centralized Access", "type": "single", "q": "What is the primary role of AWS IAM Identity Center in a multi-account AWS environment?", "options": ["A) Centralizes single sign-on (SSO) access management across all AWS accounts and business cloud applications (e.g., Salesforce, Microsoft 365)[cite: 2, 8]", "B) Replaces AWS CloudTrail for recording API calls", "C) Deploys physical routers into on-premises data centers", "D) Compresses database tables inside Amazon Aurora"], "answer": "A", "exp": "IAM Identity Center provides a central portal for single sign-on authentication across multiple AWS accounts in an organization and integrated SAML SaaS apps[cite: 2, 8]."}, {"id": 64, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Policy Evaluation Logic - Explicit Deny", "type": "single", "q": "In AWS IAM policy evaluation, what is the effect if an incoming API request matches both an explicit ALLOW statement and an explicit DENY statement?", "options": ["A) The request is DENIED, because an explicit deny always overrides any allow[cite: 8]", "B) The request is ALLOWED, because allows always take precedence", "C) The request is paused for 24 hours while an admin approves it", "D) The user's account is suspended automatically"], "answer": "A", "exp": "In AWS IAM, an explicit deny always overrides any allow, regardless of where the policy is evaluated (identity, resource, or SCP)[cite: 8]."}, {"id": 65, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Key Grants", "type": "single", "q": "What capability does an AWS KMS Key Grant provide?", "options": ["A) A programmatic mechanism to delegate temporary, scope-restricted permissions to use a KMS key without modifying key policies or IAM policies[cite: 8]", "B) Financial funding provided by AWS to research startups", "C) Permanent public sharing of cryptographic keys", "D) Converting symmetric keys into asymmetric keys"], "answer": "A", "exp": "KMS Grants allow temporary, fine-grained permission delegation to AWS services or principals to use a key without altering core key policy documents[cite: 8]."}, {"id": 66, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Cognito", "subtopic": "Hosted UI", "type": "single", "q": "What is the primary benefit of the Amazon Cognito Hosted UI?", "options": ["A) Provides a customizable, turnkey web interface for user sign-up, sign-in, MFA, and password recovery that works out-of-the-box[cite: 8]", "B) Renders video files into HTML5 formats", "C) Manages EC2 instances through an SSH shell terminal", "D) Configures VPC peering links visually"], "answer": "A", "exp": "The Hosted UI is a pre-built, OAuth 2.0-compliant authentication webpage provided by Cognito to handle sign-up, sign-in, and MFA workflows[cite: 8]."}, {"id": 67, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Custom Rules - Geo Match & IP Sets", "type": "multi", "q": "Which TWO matching criteria can be configured inside custom AWS WAF rules? (Select 2)", "options": ["A) IP Sets (matching client requests against specific CIDR blocks or single IP addresses)[cite: 8]", "B) Geo Match conditions (inspecting the country of origin derived from client IP addresses)[cite: 8]", "C) Hardware hypervisor clock speed", "D) Audio frequency amplitude from the client device microphone"], "answer": ["A", "B"], "exp": "WAF rules can inspect client IPs via IP Sets, evaluate geographic origin via Geo Match, and inspect headers, query strings, and body payloads[cite: 8]."}, {"id": 68, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "Malware Protection", "type": "single", "q": "How does GuardDuty Malware Protection scan EC2 instances when suspicious behavior is detected?", "options": ["A) Automatically creates a snapshot of the EBS volume, attaches it to an isolated service scanner, and inspects for trojans and malware without agents[cite: 8]", "B) Reboots the instance into safe mode for 24 hours", "C) Installs an intrusive software agent that consumes 50% of instance CPU", "D) Deletes all files on the instance immediately"], "answer": "A", "exp": "GuardDuty Malware Protection performs agentless scanning by generating an EBS snapshot and scanning the replicated block volume in an isolated AWS container[cite: 8]."}, {"id": 69, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Network Firewall", "subtopic": "Domain List Filtering", "type": "single", "q": "How does AWS Network Firewall stateful domain list filtering prevent data exfiltration?", "options": ["A) Inspects outbound HTTP/HTTPS traffic (via SNI and Host headers) to allow or block traffic matching an approved or denied list of domain names[cite: 8]", "B) Shuts down the VPC route table whenever an external website is visited", "C) Encrypts outgoing internet requests with cleartext keys", "D) Replaces domain names with random IP addresses"], "answer": "A", "exp": "Stateful domain list rules inspect TLS Server Name Indication (SNI) and HTTP Host headers to permit or block outbound traffic to specific domains[cite: 8]."}, {"id": 70, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Secrets Manager", "subtopic": "Resource-Based Policies", "type": "single", "q": "Why would an administrator attach a Resource-Based Policy to a secret in AWS Secrets Manager?", "options": ["A) To grant cross-account permissions so applications in another AWS account can retrieve the secret without assuming an IAM role[cite: 8]", "B) To broadcast the secret publicly on the internet", "C) To format the secret payload as an XML spreadsheet", "D) To disable KMS encryption"], "answer": "A", "exp": "Secrets Manager supports resource policies attached to secrets, allowing explicit cross-account access delegation to external IAM roles or accounts[cite: 8]."}, {"id": 71, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Service-Linked Roles", "type": "single", "q": "What is a Service-Linked Role in AWS IAM?", "options": ["A) A predefined role that an AWS service assumes to call other AWS services on your behalf, with all permissions predefined by AWS[cite: 5, 8]", "B) A role that can be assumed by any anonymous public internet user", "C) A user role that cannot be monitored by CloudTrail", "D) A hardware security token given to employees"], "answer": "A", "exp": "Service-linked roles are linked directly to AWS services (e.g., Auto Scaling, ECS) with immutable, pre-configured permissions to manage necessary resources[cite: 5, 8]."}, {"id": 72, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Shield", "subtopic": "DDoS Response Team (SRT)", "type": "single", "q": "What operational authority can customers grant to the AWS Shield Response Team (SRT) under AWS Shield Advanced?", "options": ["A) Proactive engagement and permission to write custom AWS WAF rules directly to mitigate zero-day Layer 7 DDoS attacks during an incident[cite: 8]", "B) Authority to delete the customer's AWS root account", "C) Access to review private customer financial database tables", "D) Permission to purchase additional physical server racks"], "answer": "A", "exp": "Customers can authorize the 24/7 SRT to write and apply custom WAF mitigations directly to their resources during active volumetric or complex attacks[cite: 8]."}, {"id": 73, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Asymmetric Keys", "type": "multi", "q": "Which TWO cryptographic use cases are supported by Asymmetric KMS Keys in AWS KMS? (Select 2)", "options": ["A) Public/Private key encryption and decryption (RSA or ECC)[cite: 8]", "B) Digital signature generation and cryptographic verification[cite: 8]", "C) Direct physical shredding of magnetic tapes", "D) Automated SQL query optimization"], "answer": ["A", "B"], "exp": "Asymmetric KMS keys consist of a public key (exportable for encryption/verification) and private key (retained in HSMs for decryption/signing)[cite: 8]."}, {"id": 74, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Certificate Manager (ACM)", "subtopic": "Wildcard Certificates", "type": "single", "q": "What domain scope is protected when requesting a wildcard certificate (`*.example.com`) in AWS Certificate Manager?", "options": ["A) Protects all subdomains at that specific level (e.g., api.example.com, www.example.com), but does NOT protect the apex domain (example.com) unless explicitly added[cite: 8]", "B) Protects every domain in the entire world", "C) Protects all subdomains across multiple levels (e.g., a.b.c.example.com)", "D) Wildcard certificates are strictly prohibited in ACM"], "answer": "A", "exp": "A wildcard certificate for `*.example.com` covers first-level subdomains; to secure the apex `example.com`, it must be explicitly listed as a Subject Alternative Name (SAN)[cite: 8]."}, {"id": 75, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "Suppression Rules", "type": "single", "q": "What capability do Suppression Rules provide in Amazon Inspector?", "options": ["A) Allows filtering and suppressing specific low-risk or accepted vulnerability findings from reports and Security Hub aggregation[cite: 8]", "B) Disables all network encryption across the VPC", "C) Suppresses application error logs from being recorded", "D) Automatically terminates instances that generate findings"], "answer": "A", "exp": "Suppression rules let security teams filter out accepted risks or false positives, keeping dashboards focused on actionable threats[cite: 8]."}, {"id": 76, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Cognito", "subtopic": "Lambda Triggers", "type": "single", "q": "How can an engineering team inject custom authentication challenges or user migration logic into Amazon Cognito User Pools?", "options": ["A) Configure Cognito Lambda Triggers (e.g., Pre-Sign-up, Custom Message, Post-Authentication, Pre-Token-Generation)[cite: 8]", "B) Recompile the Cognito service code in C++", "C) Deploy an AWS Transit Gateway attachment", "D) Edit the Route 53 DNS zone file"], "answer": "A", "exp": "Cognito Lambda Triggers execute serverless functions at specific lifecycle phases to customize registration, messaging, and token creation[cite: 8]."}, {"id": 77, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Hub", "subtopic": "Cross-Region Aggregation", "type": "single", "q": "How does AWS Security Hub provide a global security posture overview for multi-region enterprises?", "options": ["A) Designates an aggregation region where findings from all linked regions and accounts are consolidated and managed in a single dashboard[cite: 8]", "B) Disables security evaluations in all regions except us-east-1", "C) Replicates all EC2 instances to an on-premises datacenter", "D) Requires logging into each region's console individually"], "answer": "A", "exp": "Security Hub supports Cross-Region Finding Aggregation, copying findings into a designated aggregation region for unified visibility[cite: 8]."}, {"id": 78, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "ABAC vs RBAC", "type": "single", "q": "What is Attribute-Based Access Control (ABAC) in AWS IAM?", "options": ["A) An authorization strategy that defines permissions based on tags attached to users and AWS resources (e.g., matching user tag `Department=HR` to resource tag `Department=HR`)[cite: 8]", "B) Assigning individual permissions to users by hardcoding their email addresses", "C) Restricting access strictly based on the user's physical office desk location", "D) Enforcing biometric fingerprint scans for all AWS API calls"], "answer": "A", "exp": "ABAC scales permissions management by evaluating tags on IAM principals and target resources in policy condition blocks[cite: 8]."}, {"id": 79, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Macie", "subtopic": "Automated S3 Discovery", "type": "single", "q": "What is the primary benefit of Automated Sensitive Data Discovery in Amazon Macie?", "options": ["A) Continuously evaluates an organization's entire S3 inventory and samples data across buckets to build an interactive sensitive data heat map without manual jobs[cite: 8]", "B) Automatically deletes non-compliant files from S3 buckets", "C) Encrypts on-premises databases using custom algorithms", "D) Replaces S3 bucket policies with Network ACLs"], "answer": "A", "exp": "Automated sensitive data discovery continuously samples S3 data across an entire AWS organization to highlight sensitive data hotspots with minimal cost[cite: 8]."}, {"id": 80, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Bot Control", "type": "single", "q": "What threat does the AWS WAF Bot Control managed rule group defend web applications against?", "options": ["A) Identifies and blocks malicious, automated bot traffic (e.g., web scrapers, credential stuffing bots, search spiders) while permitting verified bots[cite: 8]", "B) Automatically rewrites broken HTML links", "C) Compiles mobile application source code", "D) Restricts database connections from Lambda"], "answer": "A", "exp": "WAF Bot Control monitors and mitigates automated bot activity, isolating scrapers and credential-stuffing tools while allowlisting good bots[cite: 8]."}, {"id": 81, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Imported Key Material (BYOK)", "type": "single", "q": "Why would an organization choose to Import their Own Key Material (BYOK) into an AWS KMS key?", "options": ["A) To satisfy strict regulatory or compliance mandates requiring key material to be generated on-premises and imported with an expiration date[cite: 8]", "B) To eliminate all KMS pricing and API fees", "C) To bypass AWS CloudTrail logging", "D) To allow plaintext keys to be shared publicly"], "answer": "A", "exp": "Importing key material into KMS allows organizations to retain external custody of key generation to meet specific compliance mandates[cite: 8]."}, {"id": 82, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "Amazon WorkSpaces Integration", "type": "single", "q": "How does AWS Directory Service enable seamless login for users connecting to cloud-hosted Amazon WorkSpaces virtual desktops?", "options": ["A) WorkSpaces joins the AWS Managed Microsoft AD domain or connects via AD Connector to authenticate users using their standard enterprise Active Directory credentials[cite: 8]", "B) Users must enter their AWS root account access key to log into their desktop", "C) WorkSpaces desktops can only authenticate via social media Google logins", "D) Disables password checking completely"], "answer": "A", "exp": "Directory Service allows Amazon WorkSpaces to join enterprise domains, enabling users to log in using their familiar corporate credentials[cite: 8]."}, {"id": 83, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "MFA Delete on S3", "type": "single", "q": "What security requirement is enforced when MFA Delete is enabled on a versioned Amazon S3 bucket?", "options": ["A) The root user or authorized IAM principal must provide a dynamic time-based MFA code to permanently delete an object version or modify bucket versioning[cite: 6, 8]", "B) Every read request must supply an MFA token", "C) The bucket can never have objects deleted under any circumstances", "D) Objects are automatically deleted after 24 hours"], "answer": "A", "exp": "MFA Delete requires multi-factor authentication codes for permanently deleting versioned objects or changing bucket versioning states, stopping rogue deletes[cite: 6, 8]."}, {"id": 84, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Network Firewall", "subtopic": "Logging Destinations", "type": "multi", "q": "Which TWO logging services can receive alert and flow logs emitted by AWS Network Firewall? (Select 2)", "options": ["A) Amazon CloudWatch Logs[cite: 8]", "B) Amazon Simple Storage Service (Amazon S3)[cite: 8]", "C) Amazon Route 53 DNS Registrar", "D) AWS Systems Manager Parameter Store"], "answer": ["A", "B"], "exp": "Network Firewall supports delivering alert and flow logs directly to CloudWatch Logs, Amazon S3, or Kinesis Data Firehose[cite: 8]."}, {"id": 85, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Certificate Manager (ACM)", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the exam to choose AWS Certificate Manager?", "options": ["A) Provisioning, automating renewals, and deploying free SSL/TLS certificates directly to CloudFront, Application Load Balancers, or API Gateway[cite: 8]", "B) Encrypting relational database tables using customer master keys", "C) Scanning source code repositories for CVE vulnerabilities", "D) Creating custom IAM permissions boundaries"], "answer": "A", "exp": "ACM is tested as the managed service for free, auto-renewed public SSL/TLS certificates on integrated AWS endpoints[cite: 8]."}, {"id": 86, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Shield", "subtopic": "Exam Tips", "type": "single", "q": "When does an architectural scenario mandate upgrading to AWS Shield Advanced instead of relying on AWS Shield Standard?", "options": ["A) When an organization requires specialized 24/7 access to the Shield Response Team (SRT), financial reimbursement for DDoS scaling spikes, and real-time attack metrics[cite: 8]", "B) When basic Layer 3 SYN flood protection is the only requirement", "C) When deploying an internal web server inside an isolated private subnet", "D) When configuring S3 lifecycle expiration rules"], "answer": "A", "exp": "Shield Advanced is required for 24/7 dedicated human SRT support, cost protection against scaling spikes during attacks, and advanced Layer 7 defense[cite: 8]."}, {"id": 87, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Verified Permissions", "subtopic": "Exam Tips", "type": "single", "q": "What is the key takeaway for AWS Verified Permissions on the AWS exam?", "options": ["A) Centralized, fine-grained application authorization engine that decouples business logic from access control policies using Cedar[cite: 2]", "B) A tool that automates database schema conversions", "C) A portal for downloading compliance audit certificates", "D) An edge compute framework running at CloudFront points of presence"], "answer": "A", "exp": "Verified Permissions decouples authorization logic from application code, managing fine-grained rules in Cedar for web and mobile apps[cite: 2]."}, {"id": 88, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Hub", "subtopic": "Exam Tips", "type": "single", "q": "Which scenario is the standard indicator to select AWS Security Hub on the exam?", "options": ["A) Centralizing, aggregating, and prioritizing security findings across multiple AWS accounts and multiple security services (GuardDuty, Inspector, Macie) in a single dashboard[cite: 8]", "B) Connecting an on-premises network to AWS over private fiber", "C) Ingesting high-throughput real-time video feeds", "D) Running serverless SQL queries on data in S3"], "answer": "A", "exp": "Security Hub is tested as the single pane of glass to consolidate and prioritize security findings across services and accounts[cite: 8]."}, {"id": 89, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Secrets Manager", "subtopic": "Exam Tips", "type": "single", "q": "What key feature immediately differentiates AWS Secrets Manager from Systems Manager Parameter Store on the SAA-C03 exam?", "options": ["A) Native automatic rotation of database credentials (RDS, Aurora, Redshift) using Lambda functions without downtime[cite: 8]", "B) Parameter Store cannot store encrypted values", "C) Secrets Manager is free of charge", "D) Parameter Store can only be accessed from EC2 instances"], "answer": "A", "exp": "Secrets Manager provides automated, out-of-the-box credential rotation for databases, while Parameter Store requires custom implementation[cite: 8]."}, {"id": 90, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Exam Tips", "type": "single", "q": "Which attack types are specifically mitigated by AWS WAF on the certification exam?", "options": ["A) Layer 7 web application exploits such as SQL Injection (SQLi), Cross-Site Scripting (XSS), and HTTP floods[cite: 8]", "B) Layer 3 and Layer 4 UDP amplification floods", "C) Physical hardware server tampering", "D) Direct Connect optical fiber signal degradation"], "answer": "A", "exp": "AWS WAF is the exam solution for Layer 7 web attacks (SQLi, XSS, rate limiting) on CloudFront, ALBs, and API Gateway[cite: 8]."}, {"id": 91, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Cross-Account Roles & External ID", "type": "single", "q": "Why is an External ID required when configuring a cross-account IAM role for a third-party SaaS vendor to access your AWS resources?", "options": ["A) Mitigates the 'confused deputy' problem by ensuring the third party only assumes the role on behalf of the intended customer[cite: 8]", "B) Encrypts the network connection using IPsec", "C) Disables IAM billing for that role", "D) Forces the vendor to use root credentials"], "answer": "A", "exp": "An External ID is a unique secret shared between customer and vendor in role trust policies to prevent the confused deputy security vulnerability[cite: 8]."}, {"id": 92, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS CloudHSM", "subtopic": "Exam Tips", "type": "single", "q": "What regulatory phrase in an exam question points directly to AWS CloudHSM instead of AWS KMS?", "options": ["A) Requirement for dedicated, single-tenant hardware validated to FIPS 140-2 Level 3 with exclusive customer control of cryptographic key material[cite: 2, 8]", "B) Seamless automatic encryption of S3 buckets using AWS-managed keys", "C) Generating temporary session tokens for web applications", "D) Inspecting HTTP headers on load balancers"], "answer": "A", "exp": "FIPS 140-2 Level 3, single-tenant dedicated hardware, and exclusive customer key control point directly to AWS CloudHSM[cite: 2, 8]."}, {"id": 93, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "Suppression Rules & S3 Protection", "type": "multi", "q": "Which TWO advanced protection features can be enabled within Amazon GuardDuty? (Select 2)", "options": ["A) GuardDuty S3 Protection (monitors S3 data plane API calls for anomalous access patterns)[cite: 8]", "B) GuardDuty EKS Protection (analyzes Kubernetes audit logs for suspicious pod activity)[cite: 8]", "C) GuardDuty Physical Facility Camera Feed Scanner", "D) GuardDuty Source Code Syntax Validator"], "answer": ["A", "B"], "exp": "GuardDuty offers add-on protection packages for Amazon S3, Amazon EKS audit logs, RDS login activity, and Lambda executions[cite: 8]."}, {"id": 94, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Custom Key Stores", "type": "single", "q": "What is an AWS KMS Custom Key Store?", "options": ["A) Associates an AWS KMS instance with a dedicated AWS CloudHSM cluster, allowing KMS to generate and store keys inside customer-controlled HSMs[cite: 8]", "B) Stores cryptographic keys in a public GitHub repository", "C) Sells encryption keys on AWS Marketplace", "D) Stores keys in local browser local-storage"], "answer": "A", "exp": "A Custom Key Store links KMS directly to a dedicated CloudHSM cluster, combining KMS API simplicity with CloudHSM compliance control[cite: 8]."}, {"id": 95, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary difference between Amazon GuardDuty and Amazon Inspector tested on the exam?", "options": ["A) Inspector evaluates workloads for software vulnerabilities (CVEs) and unintended network exposure; GuardDuty detects active threats and malicious behavior[cite: 8]", "B) Inspector blocks DDoS attacks; GuardDuty scans S3 buckets for PII", "C) Inspector is for databases; GuardDuty is for DNS", "D) GuardDuty costs $10,000 per month; Inspector is always free"], "answer": "A", "exp": "Inspector identifies vulnerabilities and exposure (patching/security posture); GuardDuty monitors active threats and anomalous activity (intrusion detection)[cite: 8]."}, {"id": 96, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS RAM (Resource Access Manager)", "subtopic": "Managed Permissions", "type": "single", "q": "What capability do Managed Permissions provide when sharing resources via AWS RAM?", "options": ["A) Defines the exact allowable actions that principals in recipient accounts can perform on the shared resource[cite: 8]", "B) Automatically grants root credentials to all shared users", "C) Bypasses all IAM evaluation boundaries", "D) Replaces VPC security groups with route tables"], "answer": "A", "exp": "Managed permissions in RAM govern the fine-grained actions external accounts can execute on shared resources (e.g., read-only vs. read/write)[cite: 8]."}, {"id": 97, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Custom Response Headers", "type": "single", "q": "What capability does AWS WAF provide when an allowed request is forwarded to an origin backend?", "options": ["A) Can insert custom request headers (e.g., passing validated client geo-location or risk scores) for backend application consumption[cite: 8]", "B) Strips all HTTP headers from the request", "C) Recompiles backend PHP code", "D) Terminates the user's TCP connection immediately"], "answer": "A", "exp": "AWS WAF can insert custom headers into inspected requests before forwarding them to origins, passing security metadata downstream[cite: 8]."}, {"id": 98, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Detective", "subtopic": "Exam Tips", "type": "single", "q": "What is the key indicator on the AWS exam to choose Amazon Detective?", "options": ["A) Conducting root-cause security investigations and forensic graph analysis following a GuardDuty finding or security incident[cite: 8]", "B) Setting up continuous antivirus scanning for email inboxes", "C) Blocking malicious IP traffic at the VPC router", "D) Encrypting files at rest inside Amazon S3"], "answer": "A", "exp": "Detective is tested as the root-cause analysis and visual investigation tool that links telemetry data to investigate security findings[cite: 8]."}, {"id": 99, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Instance Profiles", "type": "single", "q": "How is an IAM Role assigned to an Amazon EC2 instance to deliver temporary credentials via the Instance Metadata Service (IMDS)?", "options": ["A) Attached via an EC2 Instance Profile[cite: 8]", "B) Handled by typing credentials into the OS terminal", "C) Stored in an unencrypted file on the desktop", "D) Attached via a Route 53 DNS record"], "answer": "A", "exp": "An Instance Profile is an IAM container that passes an IAM role to an EC2 instance, enabling IMDS credential delivery[cite: 8]."}, {"id": 100, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Key Deletion Safety", "type": "single", "q": "What safety mechanism does AWS KMS enforce to prevent accidental immediate deletion of a KMS Key and permanent data loss?", "options": ["A) Enforces a mandatory waiting period of 7 to 30 days before a scheduled key deletion is executed[cite: 8]", "B) Deletes keys immediately with zero recovery options", "C) Requires approval from five different AWS account owners", "D) Prompts the user via SMS message every hour"], "answer": "A", "exp": "KMS enforces a configurable waiting period (7 to 30 days) for key deletion, ensuring accidental deletes can be canceled before permanent destruction[cite: 8]."}, {"id": 101, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "Multi-AZ High Availability", "type": "single", "q": "How does AWS Managed Microsoft AD ensure high availability against the loss of a single data center?", "options": ["A) Automatically deploys redundant domain controllers across multiple Availability Zones in the VPC with automated monitoring and recovery[cite: 8]", "B) Uses a single domain controller with manual tape recovery", "C) Replicates user passwords to public internet servers", "D) Disables domain joining across private subnets"], "answer": "A", "exp": "AWS Managed Microsoft AD deploys across at least two Availability Zones with redundant domain controllers managed by AWS[cite: 8]."}, {"id": 102, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Firewall Manager", "subtopic": "Exam Tips", "type": "single", "q": "What is the primary indicator on the exam to select AWS Firewall Manager?", "options": ["A) Centrally configuring, managing, and enforcing security group rules and WAF policies across multiple accounts in AWS Organizations[cite: 2, 8]", "B) Inspecting packets on an individual EC2 instance in a single standalone account", "C) Deploying serverless containers to AWS Fargate", "D) Archiving log files to S3 Glacier"], "answer": "A", "exp": "Firewall Manager is tested when an organization needs central, automated security policy enforcement across a multi-account organization[cite: 2, 8]."}, {"id": 103, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Cognito", "subtopic": "Token Types", "type": "multi", "q": "Which TWO JSON Web Tokens (JWT) are returned by Amazon Cognito User Pools upon successful user authentication? (Select 2)", "options": ["A) ID Token (contains identity claims about user profile attributes)[cite: 8]", "B) Access Token (contains scopes used to authorize calls to backend APIs)[cite: 8]", "C) Hardware Serial Token", "D) Optical Fiber Handshake Token"], "answer": ["A", "B"], "exp": "Cognito User Pools authenticate users and return three tokens: ID Token (identity/claims), Access Token (scopes), and Refresh Token[cite: 8]."}, {"id": 104, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Session Policies", "type": "single", "q": "What is an IAM Session Policy?", "options": ["A) An advanced policy passed programmatically when assuming a role or federating a user, filtering the role's permissions for that specific session[cite: 8]", "B) A policy that terminates browser tabs after 5 minutes", "C) A rule that sets desktop screen resolution", "D) A contract signed with an external ISP"], "answer": "A", "exp": "Session policies are passed during `AssumeRole` calls to further narrow permissions for that specific temporary session without modifying the role[cite: 8]."}, {"id": 105, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Network Firewall", "subtopic": "Exam Tips", "type": "single", "q": "When is AWS Network Firewall preferred over Security Groups and Network ACLs on the exam?", "options": ["A) When an architecture requires deep packet inspection (DPI), stateful URL/domain list filtering, and intrusion prevention (IPS) using Suricata rules[cite: 8]", "B) When basic port and IP filtering on an instance is sufficient", "C) When filtering web traffic based on HTTP cookies at the application layer[cite: 8]", "D) When configuring DNS resolution for private VPCs[cite: 8]"], "answer": "A", "exp": "Network Firewall is the exam choice for advanced Layer 3-7 VPC-level inspection, domain whitelisting, and Suricata IPS rulesets[cite: 8]."}, {"id": 106, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Macie", "subtopic": "Multi-Account Organizations Integration", "type": "single", "q": "How does Amazon Macie operate across large enterprise multi-account environments?", "options": ["A) Integrates with AWS Organizations, allowing a delegated administrator account to manage sensitive data discovery and view findings across all member accounts[cite: 8]", "B) Requires logging into each AWS account separately to run discovery jobs", "C) Duplicates all S3 data into a single master account bucket", "D) Deletes member accounts that contain sensitive data"], "answer": "A", "exp": "Macie natively integrates with AWS Organizations, enabling a central security account to audit and govern S3 data across all accounts[cite: 8]."}, {"id": 107, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Shield", "subtopic": "Protected Resources", "type": "multi", "q": "Which TWO AWS resources can be protected with customized detection and mitigation under AWS Shield Advanced? (Select 2)", "options": ["A) Amazon Route 53 hosted zones[cite: 8]", "B) AWS Global Accelerator and Elastic Load Balancers (ALB/NLB)[cite: 8]", "C) On-premises tape libraries via iSCSI", "D) Client laptop local hard drives"], "answer": ["A", "B"], "exp": "Shield Advanced protects Route 53, CloudFront, Global Accelerator, Elastic Load Balancers, and Elastic IP addresses[cite: 8]."}, {"id": 108, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "KMS Key Policies", "type": "single", "q": "Why is a Key Policy mandatory on every AWS KMS key?", "options": ["A) Key policies are the primary mechanism to control access to KMS keys; without permissions defined in the key policy, no one (including root) can access the key[cite: 8]", "B) Key policies set billing limits on credit cards", "C) Key policies configure VPC route tables", "D) Key policies convert symmetric keys into asymmetric keys"], "answer": "A", "exp": "Every KMS key must have a key policy; IAM policies cannot grant access to a KMS key unless the key policy explicitly delegates permission[cite: 8]."}, {"id": 109, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "SSM Integration for EC2", "type": "single", "q": "How does the modernized Amazon Inspector scan Amazon EC2 instances for software vulnerabilities without managing separate custom agents?", "options": ["A) Uses the AWS Systems Manager (SSM) Agent to automatically inventory installed packages and evaluate them against vulnerability feeds[cite: 8]", "B) Reboots the instance into a recovery partition", "C) Sends port-knocking packets over UDP", "D) Relies on manual SSH login by administrators"], "answer": "A", "exp": "Amazon Inspector integrates with the AWS Systems Manager (SSM) agent to collect software inventory and perform automated CVE scans[cite: 8]."}, {"id": 110, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "IP Reputation Lists", "type": "single", "q": "What protection is provided by the Amazon IP Reputation list managed rule group in AWS WAF?", "options": ["A) Blocks requests originating from IP addresses identified by Amazon threat intelligence as participating in botnets, scanners, or malicious activity[cite: 8]", "B) Blocks all traffic originating outside the United States", "C) Automatically assigns static IP addresses to web servers", "D) Eliminates all network latency over Direct Connect"], "answer": "A", "exp": "The Amazon IP Reputation list rule group blocks traffic from known malicious IP addresses, scanners, and bot relays based on AWS threat intelligence[cite: 8]."}, {"id": 111, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Password Policies", "type": "multi", "q": "Which TWO settings can be enforced across IAM users using an Account Password Policy? (Select 2)", "options": ["A) Minimum password length and character complexity requirements[cite: 8]", "B) Password expiration intervals and prevention of password reuse[cite: 8]", "C) Mandatory biometric iris scanning upon login", "D) Restricting passwords strictly to numeric digits"], "answer": ["A", "B"], "exp": "Account Password Policies define complexity, length, expiration periods, and reuse history for IAM user passwords[cite: 8]."}, {"id": 112, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "Threat Intelligence Integration", "type": "single", "q": "Can organizations incorporate proprietary threat intelligence into Amazon GuardDuty?", "options": ["A) Yes, by uploading custom trusted IP lists and threat lists (known malicious IPs) directly into GuardDuty[cite: 8]", "B) No, GuardDuty strictly disallows custom IP lists", "C) Only by modifying the underlying Linux kernel", "D) Only by opening a support ticket with AWS"], "answer": "A", "exp": "GuardDuty allows administrators to upload custom trusted IP lists (whitelists) and custom threat lists (blacklists) to tailor detection[cite: 8]."}, {"id": 113, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Hub", "subtopic": "Automated Security Standards", "type": "single", "q": "Which automated security evaluation framework is enabled by default in AWS Security Hub to evaluate accounts against AWS security best practices?", "options": ["A) AWS Foundational Security Best Practices (FSBP)[cite: 8]", "B) Apache Spark Coding Standard", "C) IEEE 802.3 Ethernet Compliance", "D) ISO 9001 Manufacturing Process"], "answer": "A", "exp": "The AWS Foundational Security Best Practices (FSBP) standard is curated by AWS security experts to continuously evaluate resources against baseline controls[cite: 8]."}, {"id": 114, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Secrets Manager", "subtopic": "Secret Encryption at Rest", "type": "single", "q": "How does AWS Secrets Manager ensure secrets are protected when stored on disk?", "options": ["A) Automatically encrypts secret values using AWS Key Management Service (KMS) customer-managed or AWS-managed keys[cite: 8]", "B) Stores secrets in plain text on unencrypted EBS volumes", "C) Converts secrets into public DNS records", "D) Compresses secrets into unencrypted tarballs"], "answer": "A", "exp": "Secrets Manager encrypts all secret payloads at rest using AWS KMS keys, ensuring sensitive credentials cannot be read from raw storage[cite: 8]."}, {"id": 115, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Verified Permissions", "subtopic": "Policy Store", "type": "single", "q": "What is a Policy Store in AWS Verified Permissions?", "options": ["A) A container that holds Cedar policies and schema definitions for an application to process runtime authorization decisions[cite: 2]", "B) An e-commerce website selling insurance policies", "C) A physical safe in an AWS facility", "D) A backup repository for EC2 AMIs"], "answer": "A", "exp": "A Policy Store encloses the Cedar schema, action definitions, and authorization rules evaluated by Verified Permissions during authorization API calls[cite: 2]."}, {"id": 116, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Cross-Account Trust Relationships", "type": "single", "q": "Which JSON component of an IAM Role defines which external principals or AWS services are trusted to assume the role?", "options": ["A) Trust Policy (Trust Relationship)[cite: 8]", "B) Permissions Boundary[cite: 8]", "C) Service Control Policy[cite: 8]", "D) Session Policy[cite: 8]"], "answer": "A", "exp": "The Trust Policy defines the `Principal` entity authorized to execute the `sts:AssumeRole` action to acquire temporary credentials[cite: 8]."}, {"id": 117, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "ViaService Condition Key", "type": "single", "q": "What security protection does the `kms:ViaService` policy condition key provide in AWS KMS?", "options": ["A) Restricts use of the KMS key so that requests are only permitted when made through a specific AWS service (e.g., S3 or EBS) on the caller's behalf[cite: 8]", "B) Bypasses all key usage quotas", "C) Disables TLS encryption for faster performance", "D) Allows anonymous public internet users to decrypt data"], "answer": "A", "exp": "The `kms:ViaService` condition key ensures a KMS key can only be used when an API request originates through a designated AWS service (e.g., `s3.us-east-1.amazonaws.com`)[cite: 8]."}, {"id": 118, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Directory Service", "subtopic": "Trust Relationships", "type": "single", "q": "Which Directory Service option supports configuring one-way or two-way forest trusts with existing on-premises Microsoft Active Directory?", "options": ["A) AWS Managed Microsoft AD (Enterprise Edition)[cite: 8]", "B) Simple AD[cite: 8]", "C) AD Connector[cite: 8]", "D) Cognito Identity Pools[cite: 8]"], "answer": "A", "exp": "AWS Managed Microsoft AD supports genuine Active Directory forest trusts, allowing resource sharing and authentication across hybrid AD environments[cite: 8]."}, {"id": 119, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon Inspector", "subtopic": "Lambda Code Scanning", "type": "single", "q": "What does Amazon Inspector evaluate when scanning AWS Lambda functions?", "options": ["A) Scans application dependencies and custom code packages for known vulnerabilities, software flaws, and exposed credentials[cite: 8]", "B) Evaluates the physical memory speed of Lambda execution environments", "C) Measures the sound volume of server cooling fans", "D) Automatically optimizes Python loop syntax"], "answer": "A", "exp": "Amazon Inspector scans Lambda functions for vulnerable application dependencies (libraries) and inspects custom code for known flaws[cite: 8]."}, {"id": 120, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS WAF", "subtopic": "Logging Destinations", "type": "multi", "q": "Which TWO services can receive full traffic inspection logs emitted by an AWS WAF Web ACL? (Select 2)", "options": ["A) Amazon CloudWatch Logs[cite: 8]", "B) Amazon S3 buckets or Amazon Kinesis Data Firehose[cite: 8]", "C) AWS Artifact compliance vaults", "D) Route 53 Resolver query pools"], "answer": ["A", "B"], "exp": "WAF logs (including matched rules, client headers, and actions) can be streamed to CloudWatch Logs, Amazon S3, or Kinesis Data Firehose[cite: 8]."}, {"id": 121, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS IAM", "subtopic": "Inline Policies vs Managed Policies", "type": "single", "q": "Why does AWS recommend using Customer Managed Policies instead of Inline Policies?", "options": ["A) Customer managed policies can be reused across multiple principals, versioned, rolled back, and centrally managed independently of identities[cite: 8]", "B) Inline policies are free, while customer managed policies cost $10 per month", "C) Inline policies bypass least privilege checks", "D) Customer managed policies only work on EC2 instances"], "answer": "A", "exp": "Customer Managed Policies support reusability, change tracking with versioning, and separation of duties, whereas inline policies are embedded directly in an entity[cite: 8]."}, {"id": 122, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "Amazon GuardDuty", "subtopic": "Finding Export", "type": "single", "q": "How can an enterprise automatically archive all Amazon GuardDuty security findings across accounts for long-term retention and third-party SIEM analysis?", "options": ["A) Configure GuardDuty to export findings automatically to an encrypted Amazon S3 bucket with KMS encryption[cite: 8]", "B) Print findings out on paper and file them physically", "C) Write findings to an unencrypted public text file", "D) Route findings through an on-premises fax machine"], "answer": "A", "exp": "GuardDuty supports automated export of all findings to an encrypted S3 bucket for compliance, long-term storage, and SIEM ingestion[cite: 8]."}, {"id": 123, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Key Management Service (AWS KMS)", "subtopic": "Origin of Key Material", "type": "multi", "q": "Which TWO key material origin options can be chosen when creating an AWS KMS key? (Select 2)", "options": ["A) KMS (AWS generates and protects the key material inside AWS KMS HSMs - default)[cite: 8]", "B) EXTERNAL (import your own key material generated on-premises - BYOK)[cite: 8]", "C) UNENCRYPTED (plaintext keys stored in VPC route tables)", "D) PUBLIC_INTERNET (keys fetched from public DNS servers)"], "answer": ["A", "B"], "exp": "KMS keys can have key material generated by KMS, imported externally (BYOK), or backed by a CloudHSM Custom Key Store[cite: 8]."}, {"id": 124, "section": "14. SECURITY, IDENTITY & COMPLIANCE", "topic": "AWS Security Hub", "subtopic": "Security Score", "type": "single", "q": "What does the overall Security Score in AWS Security Hub represent?", "options": ["A) A percentage score indicating how well your AWS resources comply with enabled security standard controls across accounts[cite: 8]", "B) The network throughput speed of on-premises VPN links", "C) The financial discount percentage applied to Reserved Instances", "D) The physical temperature of AWS server motherboards"], "answer": "A", "exp": "Security Hub calculates an aggregated compliance percentage score based on passed vs. failed checks across enabled security standards[cite: 8]."}], "quiz15": [{"id": 1, "section": "15. SERVERLESS", "topic": "AWS Fargate", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding AWS Fargate?", "options": ["A) Serverless compute engine for containers that works with Amazon ECS and Amazon EKS[cite: 8]", "B) Eliminates the need to provision, configure, or scale clusters of virtual machines[cite: 8]", "C) Requires administrators to manually patch and update the underlying Linux operating system kernel on EC2 worker nodes[cite: 8]", "D) Pay-per-use pricing model based on vCPU and memory resources used per second during task execution[cite: 8]"], "answer": "C", "exp": "AWS Fargate is serverless; AWS manages all underlying virtual machine provisioning, scaling, and OS patching, freeing customers from infrastructure maintenance[cite: 8]."}, {"id": 2, "section": "15. SERVERLESS", "topic": "AWS Fargate", "subtopic": "Key Features & Limitations", "type": "multi", "q": "Which TWO architectural constraints or features apply to AWS Fargate? (Select 2)", "options": ["A) Tasks run in their own isolated kernel environment with dedicated network interfaces (awsvpc networking mode)[cite: 5, 8]", "B) Does not currently support GPU-accelerated workloads natively (requiring ECS on EC2 for GPU tasks)[cite: 5, 8]", "C) Requires customers to manage persistent EC2 auto scaling groups manually", "D) Mandates that all tasks be deployed into unmanaged public IP pools without VPCs"], "answer": ["A", "B"], "exp": "Fargate provides task isolation via awsvpc networking but has specific limitations, such as lacking native support for GPU acceleration instances[cite: 5, 8]."}, {"id": 3, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT an accurate characteristic of AWS Lambda?", "options": ["A) Serverless, event-driven compute service that lets you run code without provisioning or managing servers[cite: 5, 8]", "B) Automatically scales your application from zero to thousands of concurrent executions based on request volume[cite: 5, 8]", "C) Requires configuring persistent 24/7 dedicated EC2 host instances to maintain continuous standby readiness[cite: 5, 8]", "D) Pay-per-use pricing model billed based on the number of requests and execution duration rounded to the nearest millisecond[cite: 5, 8]"], "answer": "C", "exp": "AWS Lambda is entirely serverless; functions scale down to zero when idle and scale up instantly upon events, requiring no dedicated 24/7 EC2 instances[cite: 5, 8]."}, {"id": 4, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "Execution Role vs Permission Model", "type": "multi", "q": "Which TWO permission components govern security in AWS Lambda? (Select 2)", "options": ["A) Execution Role (grants the function permissions to access downstream AWS services like DynamoDB or S3)[cite: 5, 8]", "B) Resource-Based Policies (grants event sources permission to invoke the Lambda function)[cite: 5, 8]", "C) Root Account Access Keys hardcoded directly inside function ZIP packages", "D) Physical Door Access Badges for data center entry"], "answer": ["A", "B"], "exp": "Lambda uses an Execution Role for what the code can do, and Resource-Based Policies to control which event sources (e.g., S3, API Gateway) can invoke the function[cite: 5, 8]."}, {"id": 5, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "Cold Starts & Provisioned Concurrency", "type": "single", "q": "How does Provisioned Concurrency eliminate cold starts for critical AWS Lambda functions?", "options": ["A) Pre-initializes a specified number of execution environments so functions are ready to respond immediately with single-digit millisecond latency[cite: 5, 8]", "B) Automatically deletes log files to speed up execution", "C) Forces the function to run continuously on physical bare-metal servers", "D) Doubles the maximum memory allocation limit to 100 GB"], "answer": "A", "exp": "Provisioned Concurrency initializes execution environments ahead of time, ensuring zero cold start latency for critical requests[cite: 5, 8]."}, {"id": 6, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "Asynchronous Invocations & DLQ", "type": "multi", "q": "Which TWO features are supported during Asynchronous Invocations of AWS Lambda? (Select 2)", "options": ["A) Automatic retries (retries failed function invocations twice with exponential backoff)[cite: 5, 8]", "B) Dead-Letter Queues (DLQ) or Destination configurations to route events that fail all retries to SQS or SNS[cite: 5, 8]", "C) Forcing synchronous blocking calls on web clients for 24 hours", "D) Permanent suspension of the IAM execution role upon first error"], "answer": ["A", "B"], "exp": "Asynchronous lambda invocations retry automatically twice upon failure and support routing permanently failed events to a DLQ or destination[cite: 5, 8]."}, {"id": 7, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "Environment Variables & KMS Encryption", "type": "single", "q": "How are environment variables encrypted by default in AWS Lambda?", "options": ["A) Ciphered and encrypted at rest using an AWS KMS key managed by AWS or a customer-managed key[cite: 5, 8]", "B) Stored in plain text clear-code inside public S3 buckets", "C) Encrypted using client-side password hashing on the user's laptop", "D) Encryption is not supported for Lambda environment variables"], "answer": "A", "exp": "Lambda environment variables are encrypted at rest by default using KMS encryption keys managed by AWS or specified by the customer[cite: 5, 8]."}, {"id": 8, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "Monitoring Metrics - Throttles & Duration", "type": "multi", "q": "Which TWO CloudWatch metrics are critical for monitoring AWS Lambda performance and availability? (Select 2)", "options": ["A) Throttles (tracks the number of invocation requests rejected due to concurrent execution limits being reached)[cite: 5, 8]", "B) Duration (measures the execution run-time elapsed per invocation)[cite: 5, 8]", "C) Physical server fan RPM speed", "D) S3 Glacier tape archival retrieval count"], "answer": ["A", "B"], "exp": "Lambda exports operational metrics including Invocations, Errors, Throttles, and Duration to CloudWatch[cite: 5, 8]."}, {"id": 9, "section": "15. SERVERLESS", "topic": "AWS Lambda", "subtopic": "Exam Tips", "type": "single", "q": "What is the key indicator on the SAA exam to select AWS Lambda?", "options": ["A) Running serverless event-driven code in response to triggers (S3 uploads, DynamoDB streams, API Gateway) with automatic scaling and zero server administration[cite: 5, 8]", "B) Hosting stateful Windows Active Directory domain controllers", "C) Managing physical SAN storage arrays across data centers", "D) Providing long-term cold file archival storage"], "answer": "A", "exp": "Lambda is tested as the core serverless event-driven compute engine that scales automatically without managing virtual servers[cite: 5, 8]."}], "quiz16": [{"id": 1, "section": "16. STORAGE", "topic": "AWS Backup", "subtopic": "What It Is & Core Purpose", "type": "single", "q": "Which of the following is NOT true regarding AWS Backup as described in the handbook?", "options": ["A) Fully managed, policy-based backup service that centralizes and automates data protection across AWS services[cite: 8]", "B) Supports scheduling and automating backups for EBS, RDS, DynamoDB, EFS, S3, and more[cite: 8]", "C) A bare-metal hypervisor migration tool used to convert physical server blades into VMs[cite: 8]", "D) Supports cross-region and cross-account backup copies for disaster recovery[cite: 6, 8]"], "answer": "C", "exp": "AWS Backup is a centralized backup and compliance management service, not a hypervisor blade migration tool[cite: 8]."}, {"id": 2, "section": "16. STORAGE", "topic": "AWS Backup", "subtopic": "Backup Vaults & Vault Lock", "type": "multi", "q": "Which TWO statements regarding AWS Backup Vaults and Vault Lock are accurate? (Select 2)", "options": ["A) Backup Vaults organize and encrypt backups using AWS KMS customer-managed keys[cite: 6, 8]", "B) Backup Vault Lock enforces WORM (Write Once, Read Many) compliance controls to prevent deletion or alteration of backups during a retention period[cite: 6, 8]", "C) Vault Lock allows administrators to delete backups immediately on demand without restriction[cite: 6]", "D) Backup Vaults must be stored on unencrypted local instance store disks[cite: 6]"], "answer": ["A", "B"], "exp": "Backup Vaults secure backups via KMS, and Backup Vault Lock enforces strict WORM compliance where retention policies cannot be altered or bypassed[cite: 6, 8]."}, {"id": 3, "section": "16. STORAGE", "topic": "AWS Backup", "subtopic": "Legal Hold", "type": "single", "q": "What is the primary function of the Legal Hold feature in AWS Backup?", "options": ["A) Ensures specific recovery points cannot be deleted or modified until the legal hold is explicitly removed, satisfying litigation holds[cite: 6, 8]", "B) Automatically freezes network routing to EC2 instances during audits", "C) Encrypts S3 buckets with external physical smart cards", "D) Prevents users from launching new RDS database instances"], "answer": "A", "exp": "AWS Backup supports placing a legal hold on particular recovery points to prevent deletion or alteration for regulatory or legal compliance[cite: 6, 8]."}, {"id": 4, "section": "16. STORAGE", "topic": "Amazon EBS", "subtopic": "What It Is & Volume Types", "type": "single", "q": "Which of the following is NOT a standard volume type offered by Amazon Elastic Block Store (Amazon EBS)?", "options": ["A) General Purpose SSD (gp3)[cite: 8]", "B) Provisioned IOPS SSD (io1/io2)[cite: 8]", "C) Throughput Optimized HDD (st1) and Cold HDD (sc1)[cite: 8]", "D) In-memory volatile Redis caching volume"], "answer": "D", "exp": "EBS provides block storage volumes (gp2/gp3, io1/io2, st1, sc1), whereas Redis caching is managed in memory via Amazon ElastiCache[cite: 8]."}, {"id": 5, "section": "16. STORAGE", "topic": "Amazon EBS", "subtopic": "Snapshots & Fast Snapshot Restore", "type": "multi", "q": "Which TWO capabilities are supported by Amazon EBS Snapshots? (Select 2)", "options": ["A) Incremental backups stored securely in Amazon S3, capturing only blocks changed since the last snapshot[cite: 6, 8]", "B) Fast Snapshot Restore (FSR) to instantly provision volumes fully initialized at peak performance[cite: 5, 6]", "C) Synchronous multi-region replication of unattached volume blocks over UDP broadcasts", "D) Automatic file deletion after 24 hours of inactivity"], "answer": ["A", "B"], "exp": "EBS snapshots are incremental backups stored in S3, and Fast Snapshot Restore (FSR) eliminates the latency of lazy loading on restored volumes[cite: 5, 6, 8]."}, {"id": 6, "section": "16. STORAGE", "topic": "Amazon EBS", "subtopic": "Encryption", "type": "single", "q": "How can an administrator enable encryption on an existing unencrypted Amazon EBS volume?", "options": ["A) Take a snapshot of the unencrypted volume, copy the snapshot with encryption enabled using KMS, and create a new encrypted volume from that copy[cite: 6, 8]", "B) Toggle the 'Encrypt' property directly on the running live volume without stopping the instance", "C) Attach a Network ACL to the EBS disk controller", "D) Format the volume using NTFS file system compression"], "answer": "A", "exp": "EBS volumes cannot be encrypted in place; you must snapshot the volume, copy the snapshot specifying a KMS key, and restore an encrypted volume[cite: 6, 8]."}, {"id": 7, "section": "16. STORAGE", "topic": "Amazon EFS", "subtopic": "What It Is & Core Concept", "type": "single", "q": "Which of the following is NOT true regarding Amazon Elastic File System (Amazon EFS)?", "options": ["A) Fully managed file storage service providing scalable, shared POSIX-compliant file systems for EC2 and container workloads[cite: 6, 8]", "B) Automatically replicates data across multiple Availability Zones within a region for high availability[cite: 6, 8]", "C) Uses block-level storage protocols exclusively, restricting file sharing between instances[cite: 6, 8]", "D) Supports the Network File System (NFSv4) protocol for concurrent shared access[cite: 6, 8]"], "answer": "C", "exp": "Amazon EFS provides file-level shared storage via NFS, whereas block-level storage is provided by Amazon EBS[cite: 6, 8]."}, {"id": 8, "section": "16. STORAGE", "topic": "Amazon EFS", "subtopic": "Storage Classes - Infrequent Access (IA)", "type": "multi", "q": "Which TWO statements regarding Amazon EFS Infrequent Access (EFS IA) are accurate? (Select 2)", "options": ["A) Provides a lower-cost storage class for files that are accessed less frequently[cite: 6, 8]", "B) Integrates with EFS Lifecycle Management to automatically transition files to IA based on access patterns[cite: 6, 8]", "C) Makes infrequently accessed files completely unreadable and permanently archived like S3 Glacier[cite: 6]", "D) Requires configuring separate standalone file systems for hot
