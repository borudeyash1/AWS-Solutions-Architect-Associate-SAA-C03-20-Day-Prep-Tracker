<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Solutions Architect Associate (SAA-C03) - Reliability Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-sub-bg: #f1f5f9;
            --card-hover-bg: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #cbd5e1;
            --accent-orange: #ff9900;
            --accent-orange-hover: #e68a00;
            --accent-orange-light: rgba(255, 153, 0, 0.12);
            --accent-orange-glow: rgba(255, 153, 0, 0.25);
            
            --correct-bg: #d1fae5;
            --correct-text: #065f46;
            --correct-border: #34d399;
            
            --incorrect-bg: #ffe4e6;
            --incorrect-text: #9f1239;
            --incorrect-border: #fb7185;
            
            --sticky-bg: rgba(255, 255, 255, 0.92);
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        [data-theme="light"] {
            /* Dark Theme - Pure Black & Black Components & White Text & Orange Accents */
            --bg-color: #000000;
            --card-bg: #09090b;
            --card-sub-bg: #121215;
            --card-hover-bg: #1c1c21;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --border-color: #27272a;
            --accent-orange: #ff9900;
            --accent-orange-hover: #ffaa22;
            --accent-orange-light: rgba(255, 153, 0, 0.18);
            --accent-orange-glow: rgba(255, 153, 0, 0.4);
            
            --correct-bg: rgba(16, 185, 129, 0.15);
            --correct-text: #34d399;
            --correct-border: rgba(52, 211, 153, 0.4);
            
            --incorrect-bg: rgba(244, 63, 94, 0.15);
            --incorrect-text: #fb7185;
            --incorrect-border: rgba(251, 113, 133, 0.4);
            
            --sticky-bg: rgba(0, 0, 0, 0.92);
            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Sticky Top Header */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--sticky-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }

        .header-content {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .badge-orange {
            background: var(--accent-orange);
            color: #000;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-pill strong {
            color: var(--accent-orange);
        }

        .btn-theme {
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-theme:hover {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--card-sub-bg);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff9900 0%, #ff5500 100%);
            transition: width 0.3s ease;
        }

        /* Toolbar & Controls */
        .toolbar-container {
            max-width: 960px;
            margin: 16px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            flex: 1 1 240px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 14px 10px 36px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 0 2px var(--accent-orange-light);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-orange);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: var(--accent-orange-light);
            border-color: var(--accent-orange);
            color: var(--accent-orange);
            font-weight: 600;
        }

        /* Main Container */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .quiz-intro {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .quiz-intro h2 {
            margin: 0 0 8px;
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        .quiz-intro p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Question Cards */
        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-card);
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .question-card:hover {
            border-color: rgba(255, 153, 0, 0.4);
        }

        .question-card.hidden {
            display: none !important;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
            line-height: 1.55;
            flex: 1;
            margin-bottom: 15px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            display: none;
            white-space: nowrap;
        }

        .question-card[data-status="correct"] .status-badge.correct {
            display: inline-block;
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .question-card[data-status="incorrect"] .status-badge.incorrect {
            display: inline-block;
            background: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }

        /* Options */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            margin: 0;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            background: var(--card-sub-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.45;
            user-select: none;
        }

        .option-label:hover {
            background: var(--card-hover-bg);
            border-color: var(--accent-orange);
        }

        .option-label input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            min-width: 18px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            margin-top: 2px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-label input[type="radio"]:checked {
            border-color: var(--accent-orange);
            background-color: var(--accent-orange);
            box-shadow: 0 0 0 3px var(--accent-orange-light);
        }

        .option-label input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #000;
        }

        /* Highlight classes */
        .option-label.selected-opt {
            border-color: var(--accent-orange);
            background: var(--accent-orange-light);
        }

        .option-label.opt-correct {
            border-color: var(--correct-border) !important;
            background: var(--correct-bg) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-label.opt-incorrect {
            border-color: var(--incorrect-border) !important;
            background: var(--incorrect-bg) !important;
            color: var(--incorrect-text) !important;
        }

        /* Buttons */
        .btn, .submit-btn {
            background: linear-gradient(135deg, #ff9900 0%, #e67e00 100%);
            color: #000000;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        @media (min-width: 640px) {
            .btn, .submit-btn { width: auto; }
        }

        .btn:hover, .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--accent-orange-glow);
            filter: brightness(1.08);
        }

        .btn:active, .submit-btn:active {
            transform: translateY(0);
        }

        /* Explanations & Feedback Box */
        .explanation, .feedback-box {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.92rem;
            line-height: 1.55;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct, .correct-ans {
            background: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .incorrect, .incorrect-ans {
            background: var(--incorrect-bg);
            color: var(--incorrect-text);
            border: 1px solid var(--incorrect-border);
        }
    
        /* Subtle Card Watermark */
        .card-watermark {
            margin-top: 14px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color, #1f2937);
            font-size: 0.73rem;
            color: var(--text-muted, #94a3b8);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            opacity: 0.6;
            transition: opacity 0.2s ease;
            word-break: break-all;
        }

        .card-watermark:hover {
            opacity: 1;
        }

        .card-watermark a {
            color: var(--text-secondary, #94a3b8);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .card-watermark a:hover {
            color: var(--aws-orange, #ff9900);
            text-decoration: underline;
        }

    
        /* AWS Exam Mode Styles */
        .mode-toggle-group {
            display: flex;
            background: var(--card-sub-bg, #1f2937);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border-color, #374151);
        }

        .mode-btn {
            background: transparent;
            color: var(--text-secondary, #9ca3af);
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--aws-orange, #ff9900);
            color: #000000;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(255, 153, 0, 0.3);
        }

        .exam-timer-pill {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: monospace;
        }

        .exam-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        @media (min-width: 900px) {
            .exam-layout {
                grid-template-columns: 1fr 320px;
            }
        }

        .exam-card {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #cbd5e1);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .exam-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color, #cbd5e1);
        }

        .flag-btn {
            background: var(--card-sub-bg, #f1f5f9);
            color: var(--text-primary, #0f172a);
            border: 1px solid var(--border-color, #cbd5e1);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .flag-btn.flagged {
            background: rgba(245, 158, 11, 0.2);
            color: #b45309;
            border-color: #f59e0b;
        }

        .exam-nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color, #cbd5e1);
            flex-wrap: wrap;
        }

        .btn-nav {
            background: var(--card-sub-bg, #f1f5f9);
            color: var(--text-primary, #0f172a);
            border: 1px solid var(--border-color, #cbd5e1);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-orange-light, rgba(255, 153, 0, 0.12));
            border-color: var(--accent-orange, #ff9900);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-finish-exam {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-finish-exam:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
        }

        .exam-palette-panel {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #cbd5e1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            align-self: start;
        }

        .palette-header {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-primary, #0f172a);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .palette-btn {
            background: var(--card-sub-bg, #f1f5f9);
            color: var(--text-primary, #0f172a);
            border: 1px solid var(--border-color, #cbd5e1);
            height: 38px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .palette-btn:hover {
            border-color: var(--accent-orange, #ff9900);
        }

        .palette-btn.active {
            border: 2px solid var(--accent-orange, #ff9900) !important;
            box-shadow: 0 0 8px rgba(255,153,0,0.4);
        }

        .palette-btn.answered {
            background: rgba(59, 130, 246, 0.2);
            color: #1d4ed8;
            border-color: #93c5fd;
        }

        .palette-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -5px;
            right: -3px;
            font-size: 10px;
        }

        .palette-legend {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary, #475569);
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color, #cbd5e1);
        }

        .results-container {
            background: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #cbd5e1);
            border-radius: 12px;
            padding: 32px;
            margin-top: 10px;
        }

        .results-score-box {
            text-align: center;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 28px;
        }

        .results-score-box.pass {
            background: rgba(16, 185, 129, 0.12);
            border: 2px solid #10b981;
            color: #047857;
        }

        .results-score-box.fail {
            background: rgba(239, 68, 68, 0.12);
            border: 2px solid #ef4444;
            color: #b91c1c;
        }

        .score-big {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .score-status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .results-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn-export-json {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-export-json:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
    
    
        .navbar-logo-badge {
            height: 38px;
            width: auto;
            object-fit: contain;
            vertical-align: middle;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15));
            transition: transform 0.2s ease;
        }

        .navbar-logo-badge:hover {
            transform: scale(1.06);
        }
    
    
    /* ======================== QUESTION NAVIGATOR PANEL ======================== */
    #practice-nav-btn {
        position: fixed;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        z-index: 9000;
        background: linear-gradient(135deg, #ff9900, #e07b00);
        color: #fff;
        border: none;
        border-radius: 10px 0 0 10px;
        padding: 12px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        letter-spacing: 1.5px;
        box-shadow: -3px 0 18px rgba(255,153,0,0.45);
        transition: background 0.2s, box-shadow 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    #practice-nav-btn:hover { background: linear-gradient(135deg, #ffaa22, #ff9900); box-shadow: -4px 0 24px rgba(255,153,0,0.6); }
    #practice-nav-panel {
        position: fixed;
        right: -340px;
        top: 0;
        height: 100vh;
        width: 320px;
        background: var(--card-bg, #111827);
        border-left: 2px solid #ff9900;

    function setFilter(filterType, btn) {

        if (btn) btn.classList.add('active');
        filterQuestions();

    function filterQuestions() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const cards = document.querySelectorAll('.question-card');

        cards.forEach(card => {
            const qTitle = card.querySelector('.question-title')?.textContent || '';
            const status = card.getAttribute('data-status') || 'unanswered';

            let matchesFilter = false;
            if (currentFilter === 'all') matchesFilter = true;
            else if (currentFilter === 'unanswered' && status === 'unanswered') matchesFilter = true;
            else if (currentFilter === 'correct' && status === 'correct') matchesFilter = true;
            else if (currentFilter === 'incorrect' && status === 'incorrect') matchesFilter = true;

            let matchesSearch = true;
            if (query) {
                if (query.startsWith('#')) {
                    const num = query.substring(1).trim();
                    matchesSearch = qTitle.startsWith(num + '.') || qTitle.includes(' ' + num + '.');
                } else {
                    matchesSearch = qTitle.toLowerCase().includes(query) || card.textContent.toLowerCase().includes(query);
                }
            }

            if (matchesFilter && matchesSearch) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function updateStats() {
        const total = quizData.length;
        const correctCount = document.querySelectorAll('.question-card[data-status="correct"]').length;
        const answeredCount = document.querySelectorAll('.question-card[data-status="correct"], .question-card[data-status="incorrect"]').length;

        const scoreEl = document.getElementById('score-val');
        if (scoreEl) scoreEl.textContent = correctCount;

        const progressBar = document.getElementById('quiz-progress-bar');
        if (progressBar) {
            const pct = Math.round((answeredCount / total) * 100);
            progressBar.style.width = pct + '%';
        }

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        let html = '';

        quizData.forEach((q, index) => {
            const isMulti = q.type === 'multi' || (Array.isArray(q.correct) ? q.correct.length > 1 : (typeof q.correct === 'string' && q.correct.includes(',')));
            const reqCount = Array.isArray(q.correct) ? q.correct.length : (typeof q.correct === 'string' && q.correct.includes(',') ? q.correct.split(',').length : (isMulti ? 2 : 1));
            const inputType = isMulti ? 'checkbox' : 'radio';

            html += `
                <div class="question-card" id="card-${q.id}" data-id="${q.id}" data-type="${isMulti ? 'multi' : 'single'}" data-req="${reqCount}" data-status="unanswered">
                    <div class="question-header">
                        <div class="question-title">
                            ${index + 1}. ${q.question}
                            ${isMulti ? `<span style="color: var(--accent-orange); font-weight: 700; margin-left: 8px;">(Select ${reqCount} options)</span>` : ''}
                        </div>
                        <span class="status-badge correct">✓ Correct</span>
                        <span class="status-badge incorrect">✕ Incorrect</span>
                    </div>
                    <ul class="options-list">
            `;

            q.options.forEach((opt) => {
                const optLetter = opt.charAt(0);
                html += `
                    <li class="option-item">
                        <label class="option-label" onclick="selectOption(this)">
                            <input type="${inputType}" name="question-${q.id}" value="${optLetter}">
                            <span>${opt}</span>
                        </label>
                    </li>
                `;
            });

            const correctArg = JSON.stringify(q.correct).replace(/"/g, '&quot;');
            html += `
                    </ul>
                    <button class="submit-btn" onclick="checkAnswer(${q.id}, ${correctArg}, \`${q.explanation.replace(/`/g, '\`')}\`)">Submit Answer</button>
                    <div id="feedback-${q.id}" class="explanation"></div>
                    <div class="card-watermark">
    🔗 <a href="https://github.com/borudeyash1/AWS-Solutions-Architect-Associate-SAA-C03-30-Day-Prep-Tracker" target="_blank" rel="noopener noreferrer">github.com/borudeyash1/AWS-Solutions-Architect-Associate-SAA-C03-30-Day-Prep-Tracker</a>
</div>
                </div>
            `;
        });

        container.innerHTML = html;
        updateStats();
    }

    function selectOption(labelElement) {
        const card = labelElement.closest('.question-card');
        if (!card) return;
        const isMulti = card.getAttribute('data-type') === 'multi';
        const reqCount = parseInt(card.getAttribute('data-req') || '1');

        if (!isMulti) {
            card.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected-opt'));
            labelElement.classList.add('selected-opt');
        } else {
            const chk = labelElement.querySelector('input[type="checkbox"]');
            const checkedCount = card.querySelectorAll('input[type="checkbox"]:checked').length;
            if (checkedCount > reqCount) {
                if (chk) chk.checked = false;
                labelElement.classList.remove('selected-opt');
                alert(`You can only select ${reqCount} options for this question.`);
                return;
            }
            if (chk && chk.checked) {
                labelElement.classList.add('selected-opt');
            } else {
                labelElement.classList.remove('selected-opt');
            }
        }
    }

    function checkAnswer(questionId, correctAnswer, explanationText) {
        const card = document.getElementById(`card-${questionId}`);
        const inputs = card.querySelectorAll(`input[name="question-${questionId}"]:checked`);
        const feedbackBox = document.getElementById(`feedback-${questionId}`);
        const labels = card.querySelectorAll('.option-label');

        const isMulti = card.getAttribute('data-type') === 'multi';
        const reqCount = parseInt(card.getAttribute('data-req') || '1');

        if (inputs.length === 0) {
            alert('Please select an option before submitting!');
            return;
        }

        if (isMulti && inputs.length !== reqCount) {
            alert(`Please select exactly ${reqCount} options before submitting!`);
            return;
        }

        const selectedVals = Array.from(inputs).map(i => i.value);
        let correctArray = Array.isArray(correctAnswer) ? correctAnswer : (typeof correctAnswer === 'string' && correctAnswer.includes(',') ? correctAnswer.split(',').map(s => s.trim()) : [String(correctAnswer)]);

        let isCorrect = false;
        if (!isMulti) {
            isCorrect = (selectedVals[0] === correctArray[0]);
        } else {
            isCorrect = (selectedVals.length === correctArray.length) && selectedVals.every(val => correctArray.includes(val));
        }

        feedbackBox.style.display = 'block';

        labels.forEach(label => {
            label.classList.remove('opt-correct', 'opt-incorrect');
            const input = label.querySelector('input');
            const val = input ? input.value : '';

            if (correctArray.includes(val)) {
                label.classList.add('opt-correct');
            }
            if (selectedVals.includes(val) && !correctArray.includes(val)) {
                label.classList.add('opt-incorrect');
            }
        });

        if (isCorrect) {
            feedbackBox.className = 'explanation correct-ans';
            feedbackBox.innerHTML = `<strong>Correct!</strong> ${explanationText}`;
            card.setAttribute('data-status', 'correct');
        } else {
            feedbackBox.className = 'explanation incorrect-ans';
            const correctStr = correctArray.join(', ');
            feedbackBox.innerHTML = `<strong>Incorrect.</strong> The correct answer is <strong>${correctStr}</strong>. ${explanationText}`;
            card.setAttribute('data-status', 'incorrect');
        }

        updateStats();
    }

        examData = JSON.parse(JSON.stringify(quizData));
        currentExamIndex = 0;
        userAnswers = {};
        markedForReview = {};
        examTimeRemaining = examData.length * 120;

        startExamTimer();
        renderExamLayout();
    }

    function startExamTimer() {
        stopExamTimer();
        updateTimerDisplay();
        examTimerInterval = setInterval(() => {
            examTimeRemaining--;
            if (examTimeRemaining <= 0) {
                stopExamTimer();
                alert('⏱️ Time is up! Submitting your exam now.');
                finishExamAndShowResults();
            } else {
                updateTimerDisplay();
            }
        }, 1000);
    }

    function stopExamTimer() {
        if (examTimerInterval) {
            clearInterval(examTimerInterval);
            examTimerInterval = null;
        }
    }

    function updateTimerDisplay() {
        const timerVal = document.getElementById('exam-timer-val');
        if (!timerVal) return;
        const mins = Math.floor(examTimeRemaining / 60);
        const secs = examTimeRemaining % 60;
        timerVal.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function renderExamLayout() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = `
            <div class="exam-layout">
                <div class="exam-main-panel" id="exam-card-container"></div>
                <div class="exam-sidebar-panel" id="exam-palette-container"></div>
            </div>
        `;
        renderExamCard(currentExamIndex);
        renderQuestionPalette();
    }

    function renderExamCard(index) {
        const cardContainer = document.getElementById('exam-card-container');
        if (!cardContainer || !examData[index]) return;

        const q = examData[index];
        const isMulti = q.type === 'multi' || (Array.isArray(q.correct) ? q.correct.length > 1 : (typeof q.correct === 'string' && q.correct.includes(',')));
        const reqCount = Array.isArray(q.correct) ? q.correct.length : (typeof q.correct === 'string' && q.correct.includes(',') ? q.correct.split(',').length : (isMulti ? 2 : 1));

        const isFlagged = !!markedForReview[q.id];
        const selected = userAnswers[q.id] || [];

        let optionsHTML = '';
        if (q.options && Array.isArray(q.options)) {
            q.options.forEach(opt => {
                const optLetter = opt.charAt(0);
                const inputType = isMulti ? 'checkbox' : 'radio';
                const isChecked = selected.includes(optLetter);
                optionsHTML += `
                    <li class="option-item">
                        <label class="option-label ${isChecked ? 'selected-opt' : ''}" onclick="handleExamOptionClick(this, ${q.id}, '${optLetter}', ${isMulti}, ${reqCount})">
                            <input type="${inputType}" name="exam_q_${q.id}" value="${optLetter}" ${isChecked ? 'checked' : ''}>
                            <span>${opt}</span>
                        </label>
                    </li>
                `;
            });
        }

        cardContainer.innerHTML = `
            <div class="exam-card">
                <div class="exam-card-top">
                    <div class="badge-group" style="display: flex; gap: 8px; align-items: center;">
                        <span style="background: var(--border-color, #cbd5e1); font-weight: 700; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem;">Question ${index + 1} of ${examData.length}</span>
                        <span style="background: rgba(245, 158, 11, 0.15); color: #b45309; font-weight: 600; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem;">${isMulti ? 'Multi-Select' : 'Single Choice'}</span>
                    </div>
                    <button class="flag-btn ${isFlagged ? 'flagged' : ''}" onclick="toggleFlagQuestion(${q.id})">
                        ${isFlagged ? '🚩 Marked for Review' : '🏳️ Mark for Review'}
                    </button>
                </div>

                <div class="question-title" style="margin-bottom: 16px; font-size: 1.05rem; font-weight: 600;">
                    ${q.question}
                    ${isMulti ? `<span style="color: var(--accent-orange, #ff9900); font-weight: 700; margin-left: 8px;">(Select ${reqCount} options)</span>` : ''}
                </div>

                <ul class="options-list" style="list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px;">
                    ${optionsHTML}
                </ul>

                <div class="exam-nav-bar">
                    <button class="btn-nav" onclick="navExamQuestion(-1)" ${index === 0 ? 'disabled' : ''}>
                        ◄ Previous
                    </button>
                    <button class="btn-finish-exam" onclick="confirmFinishExam()">
                        🏁 Submit & Finish Exam
                    </button>
                    <button class="btn-nav" onclick="navExamQuestion(1)" ${index === examData.length - 1 ? 'disabled' : ''}>
                        Next ►
                    </button>
                </div>
            </div>
        `;
    }

    function handleExamOptionClick(labelEl, qId, letter, isMulti, reqCount) {
        const input = labelEl.querySelector('input');
        if (!input) return;

        if (!isMulti) {
            userAnswers[qId] = [letter];
            const card = labelEl.closest('.exam-card');
            if (card) {
                card.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected-opt'));
                labelEl.classList.add('selected-opt');
            }
        } else {
            let current = userAnswers[qId] ? userAnswers[qId].slice() : [];
            const idx = current.indexOf(letter);
            if (input.checked) {
                if (idx === -1) current.push(letter);
            } else {
                if (idx !== -1) current.splice(idx, 1);
            }

            if (current.length > reqCount) {
                input.checked = false;
                alert(`You can only select ${reqCount} options for this question.`);
                return;
            }

            userAnswers[qId] = current;
            if (input.checked) {
                labelEl.classList.add('selected-opt');
            } else {
                labelEl.classList.remove('selected-opt');
            }
        }

        renderQuestionPalette();
    }

    function toggleFlagQuestion(qId) {
        markedForReview[qId] = !markedForReview[qId];
        renderExamCard(currentExamIndex);
        renderQuestionPalette();
    }

    function navExamQuestion(delta) {
        const newIndex = currentExamIndex + delta;
        if (newIndex >= 0 && newIndex < examData.length) {
            currentExamIndex = newIndex;
            renderExamCard(currentExamIndex);
            renderQuestionPalette();
        }
    }

    function jumpToExamQuestion(index) {
        if (index >= 0 && index < examData.length) {
            currentExamIndex = index;
            renderExamCard(currentExamIndex);
            renderQuestionPalette();
        }
    }

    function renderQuestionPalette() {
        const paletteContainer = document.getElementById('exam-palette-container');
        if (!paletteContainer) return;

        let answeredCount = 0;
        let flaggedCount = 0;

        let buttonsHTML = '';
        examData.forEach((q, idx) => {
            const isAns = userAnswers[q.id] && userAnswers[q.id].length > 0;
            const isFlag = !!markedForReview[q.id];
            const isCurr = idx === currentExamIndex;

            if (isAns) answeredCount++;
            if (isFlag) flaggedCount++;

            let btnClasses = ['palette-btn'];
            if (isCurr) btnClasses.push('active');
            if (isAns) btnClasses.push('answered');
            if (isFlag) btnClasses.push('flagged');

            buttonsHTML += `
                <button class="${btnClasses.join(' ')}" onclick="jumpToExamQuestion(${idx})" title="Question ${idx + 1}">
                    ${idx + 1}
                </button>
            `;
        });

        paletteContainer.innerHTML = `
            <div class="exam-palette-panel">
                <div class="palette-header">
                    <span>Question Palette</span>
                    <span style="font-size: 0.8rem; opacity: 0.8;">${answeredCount}/${examData.length} Done</span>
                </div>
                <div class="palette-grid">
                    ${buttonsHTML}
                </div>
                <div class="palette-legend">
                    <span><strong style="color: #60a5fa;">●</strong> Answered</span>
                    <span><strong style="color: #fbbf24;">🚩</strong> Flagged</span>
                    <span><strong>◯</strong> Unanswered</span>
                </div>
            </div>
        `;
    }

    function confirmFinishExam() {
        const unanswered = examData.length - Object.keys(userAnswers).filter(k => userAnswers[k] && userAnswers[k].length > 0).length;
        let msg = 'Are you sure you want to finish and submit your exam?';
        if (unanswered > 0) {
            msg = `⚠️ You have ${unanswered} unanswered question(s). Are you sure you want to finish and submit your exam now?`;
        }
        if (confirm(msg)) {
            finishExamAndShowResults();
        }
    }

    function finishExamAndShowResults() {
        stopExamTimer();

        // Exit Fullscreen if active
        if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen().catch(err => {});
        }

        // Unlock Header Controls after Exam completion
        const btnPractice = document.getElementById('btn-mode-practice');
        const btnExam = document.getElementById('btn-mode-exam');
        if (btnPractice) { btnPractice.disabled = false; btnPractice.style.opacity = '1'; btnPractice.style.cursor = 'pointer'; }
        if (btnExam) { btnExam.disabled = false; btnExam.style.opacity = '1'; btnExam.style.cursor = 'pointer'; }

        let correctCount = 0;
        let incorrectQuestions = [];

        examData.forEach((q, idx) => {
            const userAns = userAnswers[q.id] || [];
            let correctArray = Array.isArray(q.correct) ? q.correct : (typeof q.correct === 'string' && q.correct.includes(',') ? q.correct.split(',').map(s => s.trim()) : [String(q.correct)]);

            const isCorrect = (userAns.length === correctArray.length) && userAns.every(val => correctArray.includes(val));

            if (isCorrect) {
                correctCount++;
            } else {
                incorrectQuestions.push({
                    number: idx + 1,
                    id: q.id,
                    question: q.question,
                    options: q.options,
                    userAnswer: userAns.length > 0 ? userAns.join(', ') : 'None (Unanswered)',
                    correctAnswer: correctArray.join(', '),
                    explanation: q.explanation || ''
                });
            }
        });

        const totalQs = examData.length;
        const scorePct = Math.round((correctCount / totalQs) * 100);
        const awsScaledScore = Math.round(100 + (scorePct / 100) * 900);
        const isPass = awsScaledScore >= 720;

        const timeSpentSecs = (examData.length * 120) - examTimeRemaining;
        const spentMins = Math.floor(timeSpentSecs / 60);
        const spentSecs = timeSpentSecs % 60;
        const formattedTimeSpent = `${spentMins}m ${spentSecs}s`;

        const resultRecord = {
            timestamp: new Date().toISOString(),
            examTitle: 'AWS SAA-C03 Reliability Practice Exam',
            totalQuestions: totalQs,
            correctCount: correctCount,
            scorePercentage: scorePct,
            awsScaledScore: awsScaledScore,
            status: isPass ? 'PASS' : 'FAIL',
            timeSpent: formattedTimeSpent,
            incorrectQuestions: incorrectQuestions
        };

        lastExamResult = resultRecord;

        try {
            const existing = JSON.parse(localStorage.getItem('aws_saa_exam_history') || '[]');
            existing.unshift(resultRecord);
            localStorage.setItem('aws_saa_exam_history', JSON.stringify(existing));
        } catch (e) {}

        renderResultsDashboard(resultRecord);
    }

    function renderResultsDashboard(result) {
        const container = document.getElementById('quiz-container');

        let auditHTML = '';
        if (result.incorrectQuestions.length === 0) {
            auditHTML = '<div style="text-align: center; color: #10b981; font-weight: 700; padding: 20px;">🎉 Flawless Score! You answered every question correctly.</div>';
        } else {
            result.incorrectQuestions.forEach(item => {
                auditHTML += `
                    <div class="question-card" style="margin-bottom: 16px; border-left: 4px solid #ef4444;">
                        <div style="font-weight: 700; margin-bottom: 8px; color: var(--text-primary, #0f172a);">
                            #${item.number}. ${item.question}
                        </div>
                        <div style="display: flex; gap: 16px; font-size: 0.88rem; margin-bottom: 8px;">
                            <span style="color: #ef4444;">❌ <strong>Your Answer:</strong> ${item.userAnswer}</span>
                            <span style="color: #10b981;">✓ <strong>Correct Answer:</strong> ${item.correctAnswer}</span>
                        </div>
                        <div class="explanation incorrect-ans" style="display: block; margin-top: 8px;">
                            <strong>Explanation:</strong> ${item.explanation}
                        </div>
                    </div>
                `;
            });
        }

        container.innerHTML = `
            <div class="results-container">
                <div class="results-score-box ${result.status.toLowerCase()}">
                    <div class="score-status-badge">${result.status === 'PASS' ? '🎉 CONGRATULATIONS - PASSED' : '⚠️ FAIL - NEEDS IMPROVEMENT'}</div>
                    <div class="score-big">${result.awsScaledScore} / 1000</div>
                    <div style="font-weight: 600; font-size: 1.1rem;">
                        Score: ${result.correctCount} / ${result.totalQuestions} (${result.scorePercentage}%) | Time Spent: ${result.timeSpent}
                    </div>
                    <div style="font-size: 0.85rem; opacity: 0.8; margin-top: 4px;">(Passing Threshold: 720 / 1000)</div>
                </div>

                <div class="results-actions">
                    <button class="btn-export-json" onclick="downloadExamResultsJSON()">
                        📥 Save Results JSON (exam_results.json)
                    </button>
                    <button class="btn-nav" onclick="initExamMode()">
                        🔄 Retake AWS Exam
                    </button>
                    <button class="btn-nav" onclick="switchQuizMode('practice')">
                        📖 Return to Practice Mode
                    </button>
                </div>

                <div style="margin-top: 32px;">
                    <h3 style="color: var(--text-primary, #0f172a); margin-bottom: 16px;">🔍 Incorrect & Unanswered Questions Analysis (${result.incorrectQuestions.length})</h3>
                    ${auditHTML}
                </div>
            </div>
        `;
    }

    function downloadExamResultsJSON() {
        if (!lastExamResult) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lastExamResult, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "exam_results.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        alert('Saved exam results to exam_results.json!');
    }
    

    // ======================== PRACTICE MODE QUESTION NAVIGATOR ========================
    var practiceNavOpen = false;
    function togglePracticeNav() { practiceNavOpen ? closePracticeNav() : openPracticeNav(); }
    function openPracticeNav() {
        practiceNavOpen = true;
        var panel = document.getElementById('practice-nav-panel');
        if (panel) panel.classList.add('open');
        refreshPracticeNav();
    }
    function closePracticeNav() {
        practiceNavOpen = false;
        var panel = document.getElementById('practice-nav-panel');
        if (panel) panel.classList.remove('open');
    }
    function refreshPracticeNav() {
        if (!practiceNavOpen) return;
        var grid = document.getElementById('practice-nav-grid');
        var statsEl = document.getElementById('practice-nav-stats');
        if (!grid) return;
        grid.innerHTML = '';
        var data = typeof activeQuizData !== 'undefined' && activeQuizData ? activeQuizData : (typeof quizData !== 'undefined' ? quizData : []);
        if (!data || data.length === 0) return;
        var correctCount = 0, incorrectCount = 0;
        data.forEach(function(q) {
            var card = document.getElementById('card-' + q.id);
            var status = card ? (card.getAttribute('data-status') || 'unanswered') : 'unanswered';
            if (status === 'correct') correctCount++;
            else if (status === 'incorrect') incorrectCount++;
            var btn = document.createElement('button');
            btn.className = 'nav-q-btn status-' + status;
            btn.title = 'Q#' + q.id + ' — ' + (q.q || q.question || '').substring(0, 60) + '...';
            btn.textContent = q.id;
            btn.onclick = function() {
                var target = document.getElementById('card-' + q.id);
                if (target) {
                    closePracticeNav();
                    setTimeout(function() {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        target.style.outline = '2px solid #ff9900';
                        target.style.outlineOffset = '4px';
                        setTimeout(function() { target.style.outline = ''; target.style.outlineOffset = ''; }, 2000);
                    }, 300);
                }
            };
            grid.appendChild(btn);
        });
        var total = data.length;
        var answered = correctCount + incorrectCount;
        if (statsEl) statsEl.innerHTML = '<strong>' + answered + '/' + total + '</strong> answered &nbsp;|&nbsp; [OK] ' + correctCount + ' correct &nbsp;|&nbsp; ❌ ' + incorrectCount + ' incorrect';
    }
    document.addEventListener('click', function(e) {
        var panel = document.getElementById('practice-nav-panel');
        var btn = document.getElementById('practice-nav-btn');
        if (practiceNavOpen && panel && btn && !panel.contains(e.target) && !btn.contains(e.target)) closePracticeNav();
    });

    // ======================== ORDER BUTTONS ========================
    var currentOrder = 'first';
    function setOrder(orderType, btn) {
        currentOrder = orderType;
        document.querySelectorAll('.order-btn').forEach(function(b) { b.classList.remove('active'); });
        if (btn) btn.classList.add('active');
        var data = typeof activeQuizData !== 'undefined' && activeQuizData ? activeQuizData : (typeof quizData !== 'undefined' ? quizData : null);
        if (!data || data.length === 0) return;
        var ordered = data.slice();
        if (orderType === 'first') ordered.sort(function(a,b){ return (parseInt(a.id)||0)-(parseInt(b.id)||0); });
        else if (orderType === 'last') ordered.sort(function(a,b){ return (parseInt(b.id)||0)-(parseInt(a.id)||0); });
        else ordered.sort(function(){ return 0.5-Math.random(); });
        if (typeof activeQuizData !== 'undefined') activeQuizData = ordered;
        if (typeof renderQuizGroupedBySection === 'function') renderQuizGroupedBySection(ordered);
        else if (typeof renderQuiz === 'function') renderQuiz(ordered);
        if (typeof refreshPracticeNav === 'function') setTimeout(refreshPracticeNav, 200);
    }

    </script>
</body>
